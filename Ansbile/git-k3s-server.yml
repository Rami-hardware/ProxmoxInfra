---
- name: Configure K3s server and deploy apps
  hosts: git-k3s-server
  become: true
  roles:
    - common
    # Docker daemon — used by the CI runner for image builds.
    - docker_setup
    # Weekly cleanup after the hand-installed GitHub Actions runner.
    - ci_runner
    - dns
    - k3s_server
    - k3s_apps
