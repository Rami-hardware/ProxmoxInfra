apiVersion: apps/v1
kind: Deployment
metadata:
  name: osrm
  labels:
    app: osrm
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: osrm
  template:
    metadata:
      labels:
        app: osrm
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.targetNode }}
      initContainers:
        # The osrm-backend image ships no curl/wget, so fetch the extract in a
        # small helper image first. Skipped when the graph is already built.
        - name: fetch
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              set -eu
              MARKER=/data/.osrm-ready
              STAMP="${PBF_URL}|${PROFILE}|${ALGORITHM}"
              if [ -f "$MARKER" ] && [ "$(cat "$MARKER")" = "$STAMP" ]; then
                echo "Graph already built — no download needed."
                exit 0
              fi
{{- if .Values.clipToRegion }}
              curl -fL --retry 5 --retry-delay 10 -C - -o /data/gcc.osm.pbf "${PBF_URL}"
{{- else }}
              curl -fL --retry 5 --retry-delay 10 -C - -o /data/region.osm.pbf "${PBF_URL}"
{{- end }}
          env:
            - name: PBF_URL
              value: "{{ .Values.pbfUrl }}"
            - name: PROFILE
              value: "{{ .Values.profile }}"
            - name: ALGORITHM
              value: "{{ .Values.algorithm }}"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
{{- if .Values.clipToRegion }}
        # Geofabrik publishes no standalone Saudi file, so clip GCC States down
        # to the Saudi boundary before building the routing graph.
        - name: clip
          image: {{ .Values.osmiumImage }}
          command:
            - sh
            - -c
            - |
              set -eu
              [ -f /data/.osrm-ready ] && exit 0
              [ -s /data/gcc.osm.pbf ] || exit 0
              osmium extract -p /poly/region.poly /data/gcc.osm.pbf \
                -o /data/region.osm.pbf --overwrite
              rm -f /data/gcc.osm.pbf
              ls -la /data/region.osm.pbf
          volumeMounts:
            - name: data
              mountPath: /data
            - name: poly
              mountPath: /poly
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              # osmium extract with a 1810-point polygon needs real memory;
              # 2Gi OOM-killed on the GCC extract.
              memory: "5Gi"
              cpu: "2"
{{- end }}
        # OSRM needs a 3-stage preprocess (extract → partition → customize)
        # before it can serve. Guarded by a marker holding the source URL and
        # profile, so it runs once and re-runs only if either changes.
        - name: prepare
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              MARKER=/data/.osrm-ready
              STAMP="${PBF_URL}|${PROFILE}|${ALGORITHM}"

              if [ -f "${MARKER}" ] && [ "$(cat "${MARKER}")" = "${STAMP}" ]; then
                echo "OSRM graph already built for ${STAMP} — skipping."
                exit 0
              fi

              echo "Building routing graph for ${PROFILE} (${ALGORITHM})..."
              rm -f /data/region.osrm* "${MARKER}"

              osrm-extract -p "/opt/${PROFILE}.lua" /data/region.osm.pbf
              osrm-partition /data/region.osrm
              osrm-customize /data/region.osrm

              # Only reached on success (set -e), so the marker never lies.
              echo -n "${STAMP}" > "${MARKER}"
              rm -f /data/region.osm.pbf
              echo "OSRM graph ready."
          env:
            - name: PBF_URL
              value: "{{ .Values.pbfUrl }}"
            - name: PROFILE
              value: "{{ .Values.profile }}"
            - name: ALGORITHM
              value: "{{ .Values.algorithm }}"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: {{ .Values.importResources.requests.memory }}
              cpu: {{ .Values.importResources.requests.cpu }}
            limits:
              memory: {{ .Values.importResources.limits.memory }}
              cpu: {{ .Values.importResources.limits.cpu }}
      containers:
        - name: osrm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - osrm-routed
            - --algorithm
            - "{{ .Values.algorithm }}"
            - /data/region.osrm
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              # Any valid coordinate pair; 200 means the graph is loaded.
              path: /route/v1/driving/39.19,21.54;39.20,21.55
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory }}
              cpu: {{ .Values.resources.requests.cpu }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
              cpu: {{ .Values.resources.limits.cpu }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: osrm-data
{{- if .Values.clipToRegion }}
        - name: poly
          configMap:
            name: osrm-region-poly
{{- end }}
