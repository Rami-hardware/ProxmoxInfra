apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: osrm-data
  labels:
    app: osrm
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
