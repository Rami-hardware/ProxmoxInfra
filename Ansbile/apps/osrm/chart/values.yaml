image:
  repository: ghcr.io/project-osrm/osrm-backend
  tag: latest
  pullPolicy: IfNotPresent

replicas: 1

port: 5000
nodePort: 30332

targetNode: media-server

# Same extract as the tile server and Nominatim.
pbfUrl: "https://download.geofabrik.de/asia/gcc-states-latest.osm.pbf"

# Routing profile: car | bicycle | foot
profile: car

# MLD is faster to preprocess than CH and supports live traffic updates.
algorithm: mld

persistence:
  storageClass: local-path
  data:
    size: 20Gi

# Small requests: media-server is nearly fully reserved by the media stack.
resources:
  requests:
    memory: "512Mi"
    cpu: "200m"
  limits:
    memory: "4Gi"
    cpu: "2"

# osrm-extract holds the whole graph in memory; 3Gi OOM-killed on the GCC
# extract right at the end of extraction. 6Gi fits inside media-server's
# free headroom while still leaving room for the media stack.
importResources:
  requests:
    memory: "512Mi"
    cpu: "200m"
  limits:
    memory: "6Gi"
    cpu: "3"

# Clip the GCC extract down to Saudi Arabia only (OSM relation 307584).
# Geofabrik publishes no standalone Saudi file, so we download GCC States
# and cut it with osmium before importing.
clipToRegion: true
# The tile-server image already ships osmium, and is already
# pulled on this node — no extra third-party image needed.
osmiumImage: "overv/openstreetmap-tile-server:latest"
