apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: saudi-address-data
  annotations:
    # Rebuilding costs a 174MB download and a few minutes of indexing.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
