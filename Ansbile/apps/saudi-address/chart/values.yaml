# Plain python image: the service is stdlib-only (http.server + sqlite3).
image:
  repository: python
  tag: "3.12-slim"
  pullPolicy: IfNotPresent

replicas: 1

port: 8080
nodePort: 30334

targetNode: media-server

# OpenAddresses Saudi countrywide extract (~174MB zip, 7.6M rows, of which
# ~1.5M carry real street names).
addrSrc: "https://data.openaddresses.io/cache/uploads/ingalls/10e26c/ksa_FeatureToPoint_RESTACKED.zip"

persistence:
  storageClass: local-path
  size: 5Gi

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "1"

buildResources:
  requests:
    memory: "256Mi"
    cpu: "200m"
  limits:
    memory: "2Gi"
    cpu: "2"
