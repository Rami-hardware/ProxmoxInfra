apiVersion: apps/v1
kind: Deployment
metadata:
  name: nominatim
  labels:
    app: nominatim
spec:
  replicas: {{ .Values.replicas }}
  # PVC is ReadWriteOnce — never two pods on one volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nominatim
  template:
    metadata:
      labels:
        app: nominatim
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.targetNode }}
{{- if .Values.clipToRegion }}
      initContainers:
        # Geofabrik has no standalone Saudi extract, so download GCC States and
        # clip it to the Saudi boundary before Nominatim sees it. Skipped once
        # the clipped file exists, so a restart does not redo the work.
        - name: clip
          image: {{ .Values.osmiumImage }}
          command:
            - sh
            - -c
            - |
              set -eu
              SRC=/nominatim/gcc.osm.pbf
              DST=/nominatim/data.osm.pbf
              if [ -s "$DST" ] && [ -f /nominatim/.clipped ]; then
                echo "Saudi extract already prepared — skipping."
                exit 0
              fi
              echo "Downloading GCC extract..."
              curl -fL --retry 5 --retry-delay 10 -C - -o "$SRC" "$PBF_URL"
              echo "Clipping to Saudi Arabia..."
              osmium extract -p /poly/region.poly "$SRC" -o "$DST" --overwrite
              rm -f "$SRC"
              touch /nominatim/.clipped
              ls -la "$DST"
          env:
            - name: PBF_URL
              value: "{{ .Values.pbfUrl }}"
          volumeMounts:
            - name: work
              mountPath: /nominatim
            - name: poly
              mountPath: /poly
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "2"
{{- end }}
      containers:
        - name: nominatim
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The image imports on first start and reuses the volume afterwards.
          env:
{{- if .Values.clipToRegion }}
            # Already downloaded and clipped by the init container.
            - name: PBF_PATH
              value: "/nominatim/data.osm.pbf"
{{- else }}
            - name: PBF_URL
              value: "{{ .Values.pbfUrl }}"
{{- end }}
            - name: IMPORT_STYLE
              value: "{{ .Values.importStyle }}"
            - name: THREADS
              value: "{{ .Values.importThreads }}"
            - name: NOMINATIM_PASSWORD
              value: "nominatim"
            # No flatnode file: it is indexed by OSM node ID, not by extract
            # size, so even a 241MB regional extract allocated 68GB and filled
            # the node disk. It only pays off for planet-scale imports.
            - name: NOMINATIM_OSM2PGSQL_CACHE
              value: "{{ .Values.osm2pgsqlCacheMb }}"
          ports:
            - containerPort: 8080
          # Import runs for hours on first start; the probes must not kill it.
          startupProbe:
            httpGet:
              path: /status
              port: 8080
            periodSeconds: 30
            failureThreshold: 480
          readinessProbe:
            httpGet:
              path: /status
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/16/main
            # /nominatim holds the downloaded .pbf and the flatnode file —
            # together ~50GB. Without its own volume that lands on the node's
            # root filesystem and gets the pod evicted for ephemeral-storage.
            - name: work
              mountPath: /nominatim
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory }}
              cpu: {{ .Values.resources.requests.cpu }}
            limits:
              memory: {{ .Values.importResources.limits.memory }}
              cpu: {{ .Values.importResources.limits.cpu }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nominatim-data
        - name: work
          persistentVolumeClaim:
            claimName: nominatim-work
{{- if .Values.clipToRegion }}
        - name: poly
          configMap:
            name: nominatim-region-poly
{{- end }}
