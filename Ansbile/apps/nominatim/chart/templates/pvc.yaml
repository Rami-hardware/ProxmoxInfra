apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nominatim-data
  labels:
    app: nominatim
  annotations:
    # A re-import costs hours — never drop this with the release.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nominatim-work
  labels:
    app: nominatim
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.work.size }}
