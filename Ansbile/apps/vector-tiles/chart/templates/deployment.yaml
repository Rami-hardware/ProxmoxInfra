apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-tiles
  labels:
    app: vector-tiles
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vector-tiles
  template:
    metadata:
      labels:
        app: vector-tiles
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.targetNode }}
      initContainers:
{{- if .Values.clipToRegion }}
        # Download GCC States and clip to Saudi, as the other map services do.
        - name: fetch
          image: {{ .Values.osmiumImage }}
          command:
            - sh
            - -c
            - |
              set -eu
              [ -s /data/region.osm.pbf ] && { echo "extract present"; exit 0; }
              curl -fL --retry 5 --retry-delay 10 -C - -o /data/gcc.osm.pbf "$PBF_URL"
              osmium extract -p /poly/region.poly /data/gcc.osm.pbf \
                -o /data/region.osm.pbf --overwrite
              rm -f /data/gcc.osm.pbf
              ls -la /data/region.osm.pbf
          env:
            - name: PBF_URL
              value: "{{ .Values.pbfUrl }}"
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: poly, mountPath: /poly}
          resources:
            requests: {memory: "256Mi", cpu: "200m"}
            limits:   {memory: "5Gi",   cpu: "2"}
{{- end }}
        # Font glyphs live on the PVC, not in a ConfigMap: 448KB of binary
        # blows past the 256KB cap on kubectl's last-applied annotation.
        - name: glyphs
          image: {{ .Values.osmiumImage }}
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /data/glyphs
              [ -s /data/glyphs/0-255.pbf ] && { echo "glyphs present"; exit 0; }
              for r in 0-255 256-511 1536-1791 1792-2047 8192-8447 65024-65279; do
                curl -fsSL -o "/data/glyphs/$r.pbf"                   "https://demotiles.maplibre.org/font/Noto%20Sans%20Regular/$r.pbf"
              done
              ls -la /data/glyphs
          volumeMounts:
            - {name: data, mountPath: /data}
          resources:
            requests: {memory: "64Mi", cpu: "50m"}
            limits:   {memory: "256Mi", cpu: "500m"}
        # Build the PMTiles archive. Planetiler caches ~1.4GB of global base
        # data under /data/sources, so later rebuilds skip that download.
        - name: build
          image: {{ .Values.builderImage }}
          args:
            # --download fetches the base data planetiler needs (lake
            # centerlines, water polygons, Natural Earth). Without it the run
            # aborts immediately; the files are cached on the PVC afterwards.
            - "--download"
            - "--osm-path=/data/region.osm.pbf"
            - "--output=/data/tiles.pmtiles"
            - "--tmpdir=/data/tmp"
            - "--download-dir=/data/sources"
            - "--force"
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx{{ .Values.javaHeap }}"
          volumeMounts:
            - {name: data, mountPath: /data}
          resources:
            requests:
              memory: {{ .Values.buildResources.requests.memory }}
              cpu: {{ .Values.buildResources.requests.cpu }}
            limits:
              memory: {{ .Values.buildResources.limits.memory }}
              cpu: {{ .Values.buildResources.limits.cpu }}
      containers:
        - name: nginx
          image: {{ .Values.serverImage }}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /tiles.pmtiles, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            - {name: data, mountPath: /data, readOnly: true}
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory }}
              cpu: {{ .Values.resources.requests.cpu }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
              cpu: {{ .Values.resources.limits.cpu }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vector-tiles-data
        - name: conf
          configMap:
            name: vector-tiles-nginx
{{- if .Values.clipToRegion }}
        - name: poly
          configMap:
            name: vector-tiles-poly
{{- end }}
