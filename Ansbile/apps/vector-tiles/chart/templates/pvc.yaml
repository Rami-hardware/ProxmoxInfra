apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vector-tiles-data
  annotations:
    # Rebuilding means re-downloading ~1.4GB of base data and a long tile run.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
