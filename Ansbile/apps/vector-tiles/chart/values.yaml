# Planetiler builds the tile archive; nginx serves the finished file.
builderImage: ghcr.io/onthegomap/planetiler:latest
serverImage: nginx:alpine

replicas: 1

port: 8080
nodePort: 30335

targetNode: media-server

# Same extract as the tile server, Nominatim and OSRM.
pbfUrl: "https://download.geofabrik.de/asia/gcc-states-latest.osm.pbf"

# Clip to Saudi Arabia (OSM relation 307584) before building tiles.
clipToRegion: true
osmiumImage: "overv/openstreetmap-tile-server:latest"

# Planetiler heap. It defaults to mmap storage, so this stays modest even
# for a country-sized extract.
javaHeap: "3g"

persistence:
  storageClass: local-path
  # ~1.4GB of cached global base data (Natural Earth + water polygons)
  # plus the extract and the finished archive.
  size: 30Gi

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "500m"

buildResources:
  requests:
    memory: "512Mi"
    cpu: "500m"
  limits:
    memory: "5Gi"
    cpu: "3"
