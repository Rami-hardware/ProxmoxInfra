image:
  repository: overv/openstreetmap-tile-server
  tag: latest
  pullPolicy: IfNotPresent

replicas: 1

port: 80
nodePort: 30330

# Pinned to media-server: it is the only node with room for the import.
# gateway-server has ~2.9Gi RAM / ~3G free disk — the import OOM-killed there.
targetNode: media-server

# One-time import of an OSM extract. The import runs before the server starts
# and is skipped on re-sync once the database volume is populated.
# Full-planet is not viable here — use a regional/country extract.
# Geofabrik has no standalone Saudi Arabia file; Saudi ships inside the
# GCC States region (Saudi, UAE, Oman, Qatar, Kuwait, Bahrain) — ~241 MB.
pbfUrl: "https://download.geofabrik.de/asia/gcc-states-latest.osm.pbf"

env:
  threads: 4
  osm2pgsqlCacheMb: 1536
  autovacuum: "on"
  allowCors: "enabled"

# shared memory for PostgreSQL during import/render
shmSizeMb: 1024

persistence:
  storageClass: local-path
  database:
    size: 50Gi
  tiles:
    size: 10Gi

resources:
  requests:
    memory: "1Gi"
    cpu: "500m"
  limits:
    memory: "3Gi"
    cpu: "2"

# The index-building phase is the memory peak; 8Gi OOM-killed (exit 137) on a
# 3Gi node. media-server has ~12Gi, so cap below that and shrink osm2pgsql's
# own cache to keep the total under the limit.
importResources:
  requests:
    memory: "2Gi"
    cpu: "1"
  limits:
    memory: "7Gi"
    cpu: "4"
