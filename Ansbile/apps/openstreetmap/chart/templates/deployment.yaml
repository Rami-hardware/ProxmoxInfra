apiVersion: apps/v1
kind: Deployment
metadata:
  name: openstreetmap
  labels:
    app: openstreetmap
spec:
  replicas: {{ .Values.replicas }}
  # PVCs are ReadWriteOnce — never run two pods against the same volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openstreetmap
  template:
    metadata:
      labels:
        app: openstreetmap
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.targetNode }}
      initContainers:
        # Runs the image's `import` mode once, then writes a completion marker.
        # Guarding on the marker (not PG_VERSION) means an import that dies
        # midway — OOM, node reboot, cancelled sync — is retried instead of
        # leaving a half-populated database that looks "done" forever.
        - name: import
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              MARKER=/data/database/.import-complete
              PBF=/data/database/region.osm.pbf

              if [ -f "${MARKER}" ] && [ "$(cat "${MARKER}")" = "${PBF_URL}" ]; then
                echo "Import already complete for ${PBF_URL} — skipping."
                exit 0
              fi

              # Adopt a database imported before this marker existed (or by an
              # older chart): if it is populated and no marker is present, trust
              # it and stamp it rather than burning hours on a re-import.
              # Match PG_VERSION at any depth: the image has moved the cluster
              # between /data/database and /data/database/postgres across tags.
              if [ ! -f "${MARKER}" ] && \
                 [ -n "$(find /data/database -maxdepth 3 -name PG_VERSION -print -quit 2>/dev/null)" ]; then
                echo "Existing database found with no marker — adopting it for ${PBF_URL}."
                echo -n "${PBF_URL}" > "${MARKER}"
                exit 0
              fi

              # A marker for a *different* extract means the URL changed:
              # wipe the old database so the new region imports cleanly.
              if [ -f "${MARKER}" ]; then
                echo "Extract changed to ${PBF_URL} — clearing previous import."
                rm -rf /data/database/postgres "${MARKER}"
              fi

              # Resume a partial download rather than restarting from zero.
              echo "Downloading extract: ${PBF_URL}"
              curl -fL --retry 5 --retry-delay 10 -C - -o "${PBF}.raw" "${PBF_URL}"
{{- if .Values.clipToRegion }}
              # Clip GCC States down to the Saudi boundary.
              osmium extract -p /poly/region.poly "${PBF}.raw" -o "${PBF}" --overwrite \
                || mv "${PBF}.raw" "${PBF}"
              rm -f "${PBF}.raw"
{{- else }}
              mv "${PBF}.raw" "${PBF}"
{{- end }}
              ln -sf "${PBF}" /data/region.osm.pbf

              echo "Starting import (this can take a long time)..."
              /run.sh import

              # Only reached when /run.sh exits 0 (set -e), so the marker can
              # never claim success for a failed import.
              echo -n "${PBF_URL}" > "${MARKER}"
              rm -f "${PBF}"
              echo "Import complete."
          env:
            - name: PBF_URL
              value: "{{ .Values.pbfUrl }}"
            - name: THREADS
              value: "{{ .Values.env.threads }}"
            - name: OSM2PGSQL_EXTRA_ARGS
              value: "-C {{ .Values.env.osm2pgsqlCacheMb }}"
          volumeMounts:
            - name: database
              mountPath: /data/database
            - name: tiles
              mountPath: /data/tiles
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              memory: {{ .Values.importResources.requests.memory }}
              cpu: {{ .Values.importResources.requests.cpu }}
            limits:
              memory: {{ .Values.importResources.limits.memory }}
              cpu: {{ .Values.importResources.limits.cpu }}
      containers:
        - name: openstreetmap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run"]
          ports:
            - containerPort: 80
          env:
            - name: THREADS
              value: "{{ .Values.env.threads }}"
            - name: OSM2PGSQL_EXTRA_ARGS
              value: "-C {{ .Values.env.osm2pgsqlCacheMb }}"
            - name: AUTOVACUUM
              value: "{{ .Values.env.autovacuum }}"
            - name: ALLOW_CORS
              value: "{{ .Values.env.allowCors }}"
          volumeMounts:
            - name: database
              mountPath: /data/database
            - name: tiles
              mountPath: /data/tiles
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            httpGet:
              path: /tile/0/0/0.png
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory }}
              cpu: {{ .Values.resources.requests.cpu }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
              cpu: {{ .Values.resources.limits.cpu }}
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: openstreetmap-database
        - name: tiles
          persistentVolumeClaim:
            claimName: openstreetmap-tiles
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.shmSizeMb }}Mi
