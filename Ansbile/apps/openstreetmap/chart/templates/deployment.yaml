apiVersion: apps/v1
kind: Deployment
metadata:
  name: openstreetmap
  labels:
    app: openstreetmap
spec:
  replicas: {{ .Values.replicas }}
  # PVCs are ReadWriteOnce — never run two pods against the same volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openstreetmap
  template:
    metadata:
      labels:
        app: openstreetmap
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.targetNode }}
      initContainers:
        # Downloads the extract and runs the image's `import` mode, but only
        # when the database volume is still empty. On every later restart or
        # ArgoCD re-sync this exits immediately, so the (multi-hour) import
        # happens exactly once.
        - name: import
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              if [ -f /data/database/PG_VERSION ]; then
                echo "OSM database already imported — skipping import."
                exit 0
              fi
              echo "Downloading extract: ${PBF_URL}"
              # Download onto the database PVC, not the container layer.
              curl -fsSL --retry 3 -o /data/database/region.osm.pbf "${PBF_URL}"
              ln -sf /data/database/region.osm.pbf /data/region.osm.pbf
              echo "Starting import (this can take hours)..."
              /run.sh import
              rm -f /data/database/region.osm.pbf
          env:
            - name: PBF_URL
              value: "{{ .Values.pbfUrl }}"
            - name: THREADS
              value: "{{ .Values.env.threads }}"
            - name: OSM2PGSQL_EXTRA_ARGS
              value: "-C {{ .Values.env.osm2pgsqlCacheMb }}"
          volumeMounts:
            - name: database
              mountPath: /data/database
            - name: tiles
              mountPath: /data/tiles
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              memory: {{ .Values.importResources.requests.memory }}
              cpu: {{ .Values.importResources.requests.cpu }}
            limits:
              memory: {{ .Values.importResources.limits.memory }}
              cpu: {{ .Values.importResources.limits.cpu }}
      containers:
        - name: openstreetmap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run"]
          ports:
            - containerPort: 80
          env:
            - name: THREADS
              value: "{{ .Values.env.threads }}"
            - name: OSM2PGSQL_EXTRA_ARGS
              value: "-C {{ .Values.env.osm2pgsqlCacheMb }}"
            - name: AUTOVACUUM
              value: "{{ .Values.env.autovacuum }}"
            - name: ALLOW_CORS
              value: "{{ .Values.env.allowCors }}"
          volumeMounts:
            - name: database
              mountPath: /data/database
            - name: tiles
              mountPath: /data/tiles
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            httpGet:
              path: /tile/0/0/0.png
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory }}
              cpu: {{ .Values.resources.requests.cpu }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
              cpu: {{ .Values.resources.limits.cpu }}
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: openstreetmap-database
        - name: tiles
          persistentVolumeClaim:
            claimName: openstreetmap-tiles
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.shmSizeMb }}Mi
