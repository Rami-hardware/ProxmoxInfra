{{- if .Values.ui.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: openstreetmap-ui
  labels:
    app: openstreetmap-ui
data:
  index.html: |
{{ .Files.Get "files/index.html" | indent 4 }}
  leaflet.css: |
{{ .Files.Get "files/leaflet.css" | indent 4 }}
  nginx.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      index index.html;

      location /vendor/ {
        alias /usr/share/nginx/html/vendor/;
      }

      # Everything is proxied same-origin, so the page works over whatever
      # host/port it was opened on — no hardcoded ports, no extra DNS names,
      # and no CORS.
      location /tile/ {
        proxy_pass http://openstreetmap:{{ .Values.port }}/tile/;
        proxy_set_header Host $host;
      }

      location /geocode/ {
        proxy_pass http://nominatim:{{ .Values.ui.nominatimServicePort }}/;
        proxy_set_header Host $host;
      }

      location /route/ {
        proxy_pass http://osrm:{{ .Values.ui.osrmServicePort }}/route/;
        proxy_set_header Host $host;
      }

      # Saudi National Address fallback: OSM has no names for most Saudi
      # residential streets, so searches that Nominatim cannot answer are
      # retried against the OpenAddresses index.
      location /addr/ {
        proxy_pass http://saudi-address:{{ .Values.ui.addressServicePort }}/;
        proxy_set_header Host $host;
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openstreetmap-ui-js
  labels:
    app: openstreetmap-ui
binaryData:
  leaflet.js: {{ .Files.Get "files/leaflet.js" | b64enc }}
  # Leaflet builds marker URLs relative to its own CSS, so these must be
  # served alongside it or every pin 404s and renders as a broken image.
  marker-icon.png: {{ .Files.Get "files/images/marker-icon.png" | b64enc }}
  marker-icon-2x.png: {{ .Files.Get "files/images/marker-icon-2x.png" | b64enc }}
  marker-shadow.png: {{ .Files.Get "files/images/marker-shadow.png" | b64enc }}
  layers.png: {{ .Files.Get "files/images/layers.png" | b64enc }}
  layers-2x.png: {{ .Files.Get "files/images/layers-2x.png" | b64enc }}
{{- end }}
