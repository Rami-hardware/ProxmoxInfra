{{- if .Values.ui.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: openstreetmap-ui
  labels:
    app: openstreetmap-ui
data:
  index.html: |
{{ .Files.Get "files/index.html" | indent 4 }}
  style-dark.json: |
{{ .Files.Get "files/style-dark.json" | indent 4 }}
  nginx.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      index index.html;

      # Pre-compressed vendor bundles.
      gzip_static on;
      location /vendor/ {
        alias /usr/share/nginx/html/vendor/;
        add_header Cache-Control "public, max-age=604800";
      }

      # Vector tiles and font glyphs come from the vector-tiles service.
      location /tiles/ {
        proxy_pass http://vector-tiles:{{ .Values.ui.tilesServicePort }}/;
        proxy_set_header Host $host;
      }
      location /glyphs/ {
        proxy_pass http://vector-tiles:{{ .Values.ui.tilesServicePort }}/glyphs/;
        proxy_set_header Host $host;
      }

      # Everything is proxied same-origin, so the page works over whatever
      # host/port it was opened on — no hardcoded ports, no extra DNS names,
      # and no CORS.
      location /tile/ {
        proxy_pass http://openstreetmap:{{ .Values.port }}/tile/;
        proxy_set_header Host $host;
      }

      location /geocode/ {
        proxy_pass http://nominatim:{{ .Values.ui.nominatimServicePort }}/;
        proxy_set_header Host $host;
      }

      location /route/ {
        proxy_pass http://osrm:{{ .Values.ui.osrmServicePort }}/route/;
        proxy_set_header Host $host;
      }

      # Saudi National Address fallback: OSM has no names for most Saudi
      # residential streets, so searches that Nominatim cannot answer are
      # retried against the OpenAddresses index.
      location /addr/ {
        proxy_pass http://saudi-address:{{ .Values.ui.addressServicePort }}/;
        proxy_set_header Host $host;
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openstreetmap-ui-js
  labels:
    app: openstreetmap-ui
binaryData:
  # Shipped gzipped: raw they exceed the 1MB ConfigMap limit. nginx serves
  # them with gzip_static.
  maplibre-gl.js.gz: {{ .Files.Get "files/maplibre-gl.js.gz" | b64enc }}
  maplibre-gl.css.gz: {{ .Files.Get "files/maplibre-gl.css.gz" | b64enc }}
  mapbox-gl-rtl-text.js.gz: {{ .Files.Get "files/mapbox-gl-rtl-text.js.gz" | b64enc }}
  pmtiles.js.gz: {{ .Files.Get "files/pmtiles.js.gz" | b64enc }}
{{- end }}
