{{- if .Values.clipToRegion }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-region-poly
data:
  # Saudi Arabia boundary (OSM relation 307584), used to clip the GCC
  # extract down to Saudi only. Vendored so imports do not depend on an
  # external polygon service being reachable.
  region.poly: |
{{ .Files.Get "files/region.poly" | indent 4 }}
{{- end }}
