<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Homelab Maps</title>
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<style>

  :root { --bg:#fff; --fg:#111; --panel:#f7f7f8; --border:#d8d8dc; --accent:#2b6cb0;
          --sheet:#1c1f26; --sheet2:#262a33; --chip:#2a2e37; --txt:#e9eaee; --dim:#9aa0ad; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overflow:hidden;
               font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
               background:#11131a; color:var(--txt); }
  #map { position:absolute; inset:0; background:#11131a; }

  /* Permanent night map, like the reference. */
  /* MapLibre marker elements are plain divs we style ourselves. */
  .pin { width:22px; height:32px; cursor:pointer;
         background:#3b82f6; border:2px solid #fff; border-radius:50% 50% 50% 0;
         transform:rotate(-45deg); box-shadow:0 3px 8px rgba(0,0,0,.55); }
  .poiwrap, .lblwrap, .mewrap { cursor:pointer; }
  .maplibregl-popup-content { background:var(--sheet); color:var(--txt);
                              border-radius:12px; padding:12px 14px;
                              box-shadow:0 8px 30px rgba(0,0,0,.5); font-size:13px; }
  .maplibregl-popup-tip { border-top-color:var(--sheet) !important;
                          border-bottom-color:var(--sheet) !important; }
  .maplibregl-popup-close-button { color:var(--dim); font-size:17px; }
  /* MapLibre renders the dark style directly — no CSS filter needed. */
  .maplibregl-ctrl-attrib { font-size:10px; opacity:.5; }

  /* ── Category chips ─────────────────────────────────────────────────── */
  #chips { position:absolute; top:0; left:0; right:0; z-index:900;
           display:flex; gap:9px; padding:12px 12px 6px;
           overflow-x:auto; scrollbar-width:none; }
  #chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; display:flex; align-items:center; gap:7px;
          background:var(--sheet); color:var(--txt); border:0;
          border-radius:999px; padding:9px 15px; font-size:13.5px; font-weight:600;
          box-shadow:0 3px 12px rgba(0,0,0,.45); cursor:pointer; white-space:nowrap; }
  .chip:hover { background:var(--sheet2); }
  .chip.on { background:#1a73e8; color:#fff; }

  /* ── Right-side floating controls ───────────────────────────────────── */
  #tools { position:absolute; right:12px; top:50%; transform:translateY(-50%);
           z-index:900; display:flex; flex-direction:column; gap:10px; }
  .tool { width:46px; height:46px; border-radius:14px; border:0; cursor:pointer;
          background:var(--sheet); color:var(--txt); font-size:17px; font-weight:700;
          box-shadow:0 3px 12px rgba(0,0,0,.45);
          display:flex; align-items:center; justify-content:center; }
  .tool:hover { background:var(--sheet2); }
  .tool.blue { color:#4c8dff; }

  /* ── Bottom sheet ───────────────────────────────────────────────────── */
  #sheet { position:absolute; left:0; right:0; bottom:0; z-index:950;
           background:var(--sheet); border-radius:20px 20px 0 0;
           box-shadow:0 -6px 30px rgba(0,0,0,.5);
           transition:transform .25s ease; max-height:72%;
           display:flex; flex-direction:column; }
  #sheet.down { transform:translateY(calc(100% - 132px)); }
  #grip { padding:9px 0 4px; display:flex; justify-content:center; cursor:grab; flex:none; }
  #grip i { width:38px; height:4px; border-radius:3px; background:#4a505d; display:block; }
  #searchbar { display:flex; align-items:center; gap:10px; margin:2px 14px 12px;
               background:var(--sheet2); border-radius:999px; padding:11px 15px; flex:none; }
  #searchbar input { flex:1; background:none; border:0; outline:0;
                     color:var(--txt); font-size:15px; }
  #searchbar input::placeholder { color:var(--dim); }
  #searchbar .ic { color:var(--dim); font-size:15px; }
  #quick { display:flex; gap:9px; padding:0 14px 12px; overflow-x:auto;
           scrollbar-width:none; flex:none; }
  #quick::-webkit-scrollbar { display:none; }
  .q { flex:none; display:flex; align-items:center; gap:7px; background:var(--sheet2);
       border:0; border-radius:999px; padding:9px 14px; color:var(--txt);
       font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .q:hover { filter:brightness(1.15); }
  #sheetbody { overflow-y:auto; padding-bottom:14px; }
  .sect { padding:4px 16px 10px; font-size:15px; font-weight:700; }

  /* ── Result rows ────────────────────────────────────────────────────── */
  .hit { padding:11px 16px; cursor:pointer; display:flex; gap:12px;
         align-items:flex-start; border-bottom:1px solid #2b303a; }
  .hit:hover { background:var(--sheet2); }
  .hit .ico { width:38px; height:38px; border-radius:50%; flex:none;
              background:var(--sheet2); display:flex; align-items:center;
              justify-content:center; font-size:17px; }
  .hit-main { font-weight:600; }
  .hit-sub { color:var(--dim); font-size:12.5px; line-height:1.35; margin-top:2px;
             overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hit-meta { font-size:11.5px; color:var(--dim); margin-top:4px; }
  .lnk { color:#4c8dff; cursor:pointer; font-weight:600; }
  .muted { color:var(--dim); padding:12px 16px; font-size:13px; }

  /* ── Map POI pins ───────────────────────────────────────────────────── */
  .poi { display:flex; align-items:center; gap:5px; white-space:nowrap; }
  .poi b { width:26px; height:26px; border-radius:50%; display:flex; flex:none;
           align-items:center; justify-content:center; font-size:13px;
           box-shadow:0 2px 6px rgba(0,0,0,.6); }
  .poi span { font-size:11px; font-weight:700; color:#fff; max-width:118px;
              overflow:hidden; text-overflow:ellipsis;
              text-shadow:0 1px 3px #000, 0 0 6px #000; }
  .me { width:16px; height:16px; border-radius:50%; background:#1a73e8;
        border:3px solid #fff; box-shadow:0 0 0 4px rgba(26,115,232,.35); }

  /* ── Navigation overlay (Waze/Google style) ───────────────────────────── */
  #nav { display:none; position:absolute; inset:0; z-index:1200; pointer-events:none;
         font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  /* While navigating the browse UI must get out of the way entirely. */
  body.navigating #sheet, body.navigating #chips { display:none; }
  body.navigating #tools { top:auto; bottom:110px; transform:none; }

  #nav .top { pointer-events:auto; margin:10px 10px 0; border-radius:18px;
              overflow:hidden; background:#11151d; color:#fff;
              box-shadow:0 8px 30px rgba(0,0,0,.55); }
  #lanes { display:flex; padding:12px 10px 8px; justify-content:center; gap:2px; }
  #lanes .ln { flex:1; max-width:64px; text-align:center; font-size:26px;
               line-height:1; color:#4b5261; }
  #lanes .ln.on { color:#fff; }
  #banner { display:flex; gap:16px; align-items:center; padding:4px 18px 16px; }
  #banner .arrow { font-size:40px; line-height:1; color:#fff; flex:none; }
  #banner .txt { flex:1; min-width:0; }
  #banner .road { font-size:21px; font-weight:700; white-space:nowrap;
                  overflow:hidden; text-overflow:ellipsis; letter-spacing:-.2px; }
  #banner .to { font-size:17px; opacity:.7; margin-top:3px; font-weight:500; }
  /* Thin progress bar along the bottom of the banner card. */
  #prog { height:4px; background:#232936; }
  #prog i { display:block; height:100%; width:0; background:#3b82f6;
            transition:width .3s linear; }

  /* Street label pinned to the road ahead, like the reference. */
  .roadlabel { background:#1a73e8; color:#fff; font-size:12.5px; font-weight:700;
               padding:6px 10px; border-radius:9px; white-space:nowrap;
               box-shadow:0 3px 10px rgba(0,0,0,.5); max-width:170px;
               overflow:hidden; text-overflow:ellipsis; }

  #speed { position:absolute; left:14px; bottom:104px; pointer-events:auto;
           display:flex; flex-direction:column; align-items:center; gap:7px; }
  .limit { width:58px; height:58px; border-radius:50%; background:#fff; color:#111;
           border:6px solid #e11d48; display:flex; align-items:center;
           justify-content:center; font-weight:800; font-size:20px;
           box-shadow:0 5px 16px rgba(0,0,0,.5); }
  .cur { background:#11151d; color:#fff; border-radius:11px; padding:5px 10px;
         font-size:12.5px; font-weight:800; box-shadow:0 4px 14px rgba(0,0,0,.45);
         text-align:center; line-height:1.2; }
  .cur small { display:block; font-size:9.5px; font-weight:600; opacity:.65; }
  .cur.over { background:#e11d48; }

  #eta { position:absolute; left:50%; transform:translateX(-50%); bottom:18px;
         pointer-events:auto; display:flex; align-items:center; gap:16px;
         background:#11151d; color:#fff; border-radius:20px; padding:11px 12px 11px 20px;
         box-shadow:0 8px 30px rgba(0,0,0,.55); white-space:nowrap; }
  #eta .big { color:#22c55e; font-weight:700; font-size:18px; }
  #eta .sub { font-size:13.5px; opacity:.75; margin-top:1px; }
  #eta .x { background:#e11d48; border:0; color:#fff; width:38px; height:38px;
            border-radius:50%; font-size:17px; cursor:pointer; margin:0; flex:none; }

  /* Heading-up: rotate the map panes under a fixed, upward-pointing puck,
     the way Google and Waze orient the view. Leaflet cannot rotate tiles
     natively, so the transform is applied to the container instead and the
     puck stays visually vertical. */
  /* A rotated rectangle leaves empty corners, so oversize the element and
     clip at the body. 1.5x covers rotation at any angle. */
  /* Counter-rotate labels so text is never upside down. */

  /* Position puck: a single green chevron with a soft halo, like the
     reference app. Nothing else marks the driver while navigating. */
  .puck { width:0; height:0; }
  .puck i { position:relative; display:block; width:34px; height:34px;
            margin:-17px 0 0 -17px; transform-origin:50% 50%; }
  .puck i::before { content:''; position:absolute; inset:0; border-radius:50%;
                    background:rgba(34,197,94,.22); }
  .puck i::after { content:''; position:absolute; left:50%; top:50%;
                   width:0; height:0; margin:-13px 0 0 -10px;
                   border-left:10px solid transparent;
                   border-right:10px solid transparent;
                   border-bottom:26px solid #22c55e;
                   filter:drop-shadow(0 2px 5px rgba(0,0,0,.7)); }
  #drive { display:none; padding:10px 16px; border-bottom:1px solid var(--border); }
  #drive .row { display:flex; gap:8px; }
  #drive button { margin-top:0; }
  #now { display:none; padding:12px 16px; background:var(--accent); color:#fff; }
  #now .man { font-size:15px; font-weight:600; }
  #now .dist { font-size:12px; opacity:.9; margin-top:2px; }
  .step { padding:9px 16px; border-bottom:1px solid var(--border); font-size:13px; display:flex; gap:10px; }
  .step.done { opacity:.4; }
  .step.cur { background:var(--bg); font-weight:600; }
  .step .d { opacity:.6; font-size:12px; white-space:nowrap; }
  .car { font-size:26px; line-height:1; text-align:center;
         filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  @media (max-width:760px){ #app{flex-direction:column} #side{width:auto;height:46%} }
</style>
</head>
<body>
<div id="map">
</div>

<div id="nav">
  <div class="top">
    <div id="lanes"></div>
    <div id="banner">
      <div class="arrow" id="nav-arrow">↑</div>
      <div class="txt">
        <div class="road" id="nav-road"></div>
        <div class="to"  id="nav-to"></div>
      </div>
      <div id="prog"><i id="prog-i"></i></div>
    </div>
  </div>
  <div id="speed">
    <div class="limit" id="nav-limit">—</div>
    <div class="cur" id="nav-speed">0<small>km/h</small></div>
  </div>
  <div id="eta">
    <div>
      <div class="big" id="eta-time"></div>
      <div class="sub" id="eta-rest"></div>
    </div>
    <button class="x" id="nav-x" title="End navigation">✕</button>
  </div>
</div>

<div id="chips">
  <button class="chip" data-cat="restaurant">🍽️ Restaurants</button>
  <button class="chip" data-cat="cafe">☕ Coffee</button>
  <button class="chip" data-cat="fuel">⛽ Fuel</button>
  <button class="chip" data-cat="pharmacy">💊 Pharmacy</button>
  <button class="chip" data-cat="hospital">🏥 Hospitals</button>
  <button class="chip" data-cat="supermarket">🛒 Groceries</button>
  <button class="chip" data-cat="mall">🛍️ Malls</button>
  <button class="chip" data-cat="mosque">🕌 Mosques</button>
  <button class="chip" data-cat="atm">🏧 ATMs</button>
  <button class="chip" data-cat="park">🌳 Parks</button>
</div>

<div id="tools">
  <button class="tool" id="t-layers" title="Toggle night mode">◈</button>
  <button class="tool" id="t-zin"    title="Zoom in">＋</button>
  <button class="tool" id="t-zout"   title="Zoom out">－</button>
  <button class="tool blue" id="t-me" title="Recentre">➤</button>
</div>

<div id="sheet">
  <div id="grip"><i></i></div>
  <div id="searchbar">
    <span class="ic">🔍</span>
    <input id="q" placeholder="Search here" autocomplete="off">
    <span class="ic" id="clearq" style="cursor:pointer">✕</span>
  </div>
  <div id="quick">
    <button class="q" id="qh">🏠 Home</button>
    <button class="q" id="qw">💼 Work</button>
    <button class="q" id="qs">🔖 Saved</button>
    <button class="q" id="qr">🧭 Route</button>
  </div>
  <div id="sheetbody">
    <div class="sect" id="sect">Explore nearby</div>
    <div id="out"></div>
  </div>
</div>

<script src="/vendor/pmtiles.js"></script>
<script src="/vendor/maplibre-gl.js"></script>
<script>
// ── Map ─────────────────────────────────────────────────────────────────────
// MapLibre GL renders vector tiles, so the map can rotate and tilt while
// labels stay upright — the reason for moving off raster tiles.
const NOMINATIM = '/geocode';
const OSRM      = '';

// Arabic needs shaping; without this plugin letters render disconnected.
maplibregl.setRTLTextPlugin('/vendor/mapbox-gl-rtl-text.js', null, true);

const protocol = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', protocol.tile);

const map = new maplibregl.Map({
  container: 'map',
  style: '/style-dark.json',
  center: [39.19, 21.54],          // Jeddah, [lng,lat]
  zoom: 14,
  pitch: 0,
  bearing: 0,
  attributionControl: {compact: true}
});
map.on('error', e => console.warn('map:', e && e.error && e.error.message));

const out   = document.getElementById('out');
const sheet = document.getElementById('sheet');
const sect  = document.getElementById('sect');

// Leaflet handed back layer objects; MapLibre markers are plain objects we
// track ourselves.
let marker = null, pts = [], pins = [], routeAdded = false;

function sheetDown(){ sheet.classList.add('down'); }
function sheetUp(){ sheet.classList.remove('down'); }
document.getElementById('grip').onclick = () =>
  sheet.classList.contains('down') ? sheetUp() : sheetDown();

function esc(s){ return String(s).replace(/[&<>"']/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function getJSON(url){
  const r = await fetch(url);
  if(r.status === 502 || r.status === 503)
    throw new Error('service is still starting up — try again in a few minutes');
  if(!r.ok) throw new Error(`server returned ${r.status}`);
  return r.json();
}

// ── Geometry helpers (metres) ───────────────────────────────────────────────
function dist(a, b){                      // a,b = [lng,lat]
  const R = 6371000, t = Math.PI/180;
  const dLat = (b[1]-a[1])*t, dLon = (b[0]-a[0])*t;
  const la1 = a[1]*t, la2 = b[1]*t;
  const h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function bearing(a, b){
  const t = Math.PI/180;
  const y = Math.sin((b[0]-a[0])*t)*Math.cos(b[1]*t);
  const x = Math.cos(a[1]*t)*Math.sin(b[1]*t) -
            Math.sin(a[1]*t)*Math.cos(b[1]*t)*Math.cos((b[0]-a[0])*t);
  return (Math.atan2(y,x)/t + 360) % 360;
}
function fmtDist(m){ return m >= 1000 ? (m/1000).toFixed(1)+' km' : Math.round(m)+' m'; }

// ── Markers ─────────────────────────────────────────────────────────────────
function makeMarker(lngLat, html, cls){
  const el = document.createElement('div');
  el.className = cls || 'pin';
  el.innerHTML = html || '';
  return new maplibregl.Marker({element: el, anchor: cls === 'puck' ? 'center' : 'bottom'})
           .setLngLat(lngLat).addTo(map);
}
function popup(lngLat, html){
  return new maplibregl.Popup({closeButton:true, offset:26})
           .setLngLat(lngLat).setHTML(html).addTo(map);
}

// ── Route line ──────────────────────────────────────────────────────────────
// Leaflet added a GeoJSON layer; MapLibre wants a source plus layers, added
// once and updated in place.
function drawRoute(geojson){
  const data = {type:'Feature', geometry: geojson};
  if(!routeAdded){
    map.addSource('route', {type:'geojson', data});
    map.addLayer({id:'route-casing', type:'line', source:'route',
      layout:{'line-cap':'round','line-join':'round'},
      paint:{'line-color':'#0b3f8f','line-width':11,'line-opacity':.9}});
    map.addLayer({id:'route-line', type:'line', source:'route',
      layout:{'line-cap':'round','line-join':'round'},
      paint:{'line-color':'#3b82f6','line-width':7}});
    routeAdded = true;
  } else {
    map.getSource('route').setData(data);
    map.setLayoutProperty('route-casing','visibility','visible');
    map.setLayoutProperty('route-line','visibility','visible');
  }
}
function hideRoute(){
  if(routeAdded){
    map.setLayoutProperty('route-casing','visibility','none');
    map.setLayoutProperty('route-line','visibility','none');
  }
}
function fitTo(coords){
  const b = coords.reduce((acc,c) => acc.extend(c),
                          new maplibregl.LngLatBounds(coords[0], coords[0]));
  map.fitBounds(b, {padding:{top:90,bottom:220,left:60,right:60}, duration:600});
}

// ── Result helpers ──────────────────────────────────────────────────────────
function splitName(h){
  const parts = h.display_name.split(',');
  const primary = (h.name && h.name.trim()) ? h.name.trim() : parts[0].trim();
  return [primary, parts.slice(1).join(',').trim()];
}

const KIND = {
  hospital:'🏥', clinic:'🏥', doctors:'🏥', pharmacy:'💊',
  school:'🏫', university:'🎓', college:'🎓',
  restaurant:'🍽️', cafe:'☕', fast_food:'🍔',
  supermarket:'🛒', mall:'🛍️', bank:'🏦', atm:'🏧',
  fuel:'⛽', hotel:'🏨', mosque:'🕌', place_of_worship:'🕌',
  parking:'🅿️', police:'👮', fire_station:'🚒', park:'🌳',
  city:'🏙️', town:'🏙️', village:'🏘️', suburb:'🏘️', neighbourhood:'🏘️',
  postcode:'📮', residential:'🛣️', secondary:'🛣️', primary:'🛣️',
  trunk:'🛣️', tertiary:'🛣️', motorway:'🛣️', house:'🏠'
};
const CAT_COLOR = {
  restaurant:'#ef6c3b', cafe:'#ef6c3b', fuel:'#3b82f6', pharmacy:'#16a34a',
  hospital:'#16a34a', supermarket:'#f59e0b', mall:'#a855f7', mosque:'#14b8a6',
  atm:'#6366f1', park:'#22c55e'
};

let poiPins = [], activePopup = null;
function clearPois(){ poiPins.forEach(p => p.remove()); poiPins = []; }

// Remove every transient layer so pins cannot accumulate across actions.
function clearMap(){
  stopDrive();
  clearPois();
  if(marker){ marker.remove(); marker = null; }
  if(activePopup){ activePopup.remove(); activePopup = null; }
  pins.forEach(p => p.remove()); pins = [];
  pts = [];
  hideRoute();
  path = []; steps = []; rtInfo = null;
}

function focusHit(h){
  const ll = [+h.lon, +h.lat];
  const [primary, rest] = splitName(h);
  map.easeTo({center: ll, zoom: 17, duration: 600});
  if(marker) marker.remove();
  if(activePopup) activePopup.remove();
  marker = makeMarker(ll, '', 'pin');
  activePopup = popup(ll, `<b>${esc(primary)}</b><br>${esc(rest)}`);
  sheetDown();
}

function renderHits(hits, cat){
  out.innerHTML = '';
  hits.forEach(h => {
    const [primary, rest] = splitName(h);
    const icon = KIND[h.type] || KIND[cat] || KIND[h.class] || '📍';
    const km = dist([map.getCenter().lng, map.getCenter().lat],
                    [+h.lon, +h.lat]) / 1000;
    const d = document.createElement('div');
    d.className = 'hit';
    d.innerHTML =
      `<div class="ico">${icon}</div>` +
      `<div style="min-width:0;flex:1">` +
        `<div class="hit-main">${esc(primary)}</div>` +
        `<div class="hit-sub">${esc(rest)}</div>` +
        `<div class="hit-meta">${km < 1 ? Math.round(km*1000)+' m' : km.toFixed(1)+' km'} away` +
        ` &middot; <span class="lnk" data-act="route">Directions</span></div>` +
      `</div>`;
    d.onclick = ev => {
      if(ev.target.dataset.act === 'route'){ routeTo(h); return; }
      focusHit(h);
    };
    out.appendChild(d);
  });
}

// ── Search ──────────────────────────────────────────────────────────────────
async function search(){
  const q = document.getElementById('q').value.trim();
  if(!q) return;
  clearMap();
  sect.textContent = 'Searching…';
  out.innerHTML = '<div class="muted">Searching…</div>';
  try{
    const b = map.getBounds();
    const vb = [b.getWest(), b.getNorth(), b.getEast(), b.getSouth()].join(',');
    let hits = await getJSON(`${NOMINATIM}/search?q=${encodeURIComponent(q)}`
      + `&format=json&addressdetails=1&namedetails=1&limit=15`
      + `&viewbox=${vb}&bounded=0`);

    // OSM leaves most Saudi residential streets unnamed, so fall back to the
    // Saudi National Address index for anything Nominatim cannot answer.
    let viaAddr = false;
    if(!hits.length){
      try{
        const alt = await getJSON(`/addr/search?q=${encodeURIComponent(q)}&limit=10`);
        if(alt.length){ hits = alt; viaAddr = true; }
      }catch(e){ /* best effort */ }
    }
    if(!hits.length){
      sect.textContent = 'No results';
      out.innerHTML = '<div class="muted">Nothing found. Try Arabic — most '
                    + 'Saudi places are tagged in Arabic (e.g. مستشفى).</div>';
      return;
    }
    sect.textContent = viaAddr ? hits.length + ' address matches'
                               : hits.length + ' results';
    renderHits(hits);
  }catch(e){
    sect.textContent = 'Search failed';
    out.innerHTML = `<div class="muted">${esc(e.message)}</div>`;
  }
}

async function browse(cat, btn){
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  if(btn) btn.classList.add('on');
  clearMap();
  sect.textContent = 'Loading…';
  sheetUp();
  out.innerHTML = '<div class="muted">Searching nearby…</div>';
  const b = map.getBounds();
  const vb = [b.getWest(), b.getNorth(), b.getEast(), b.getSouth()].join(',');
  try{
    const hits = await getJSON(`${NOMINATIM}/search?q=${encodeURIComponent(cat)}`
      + `&format=json&addressdetails=1&limit=25&viewbox=${vb}&bounded=1`);
    if(!hits.length){
      sect.textContent = 'Nothing found nearby';
      out.innerHTML = '<div class="muted">No ' + esc(cat) + ' mapped here. '
                    + 'Try zooming out, or search in Arabic.</div>';
      return;
    }
    sect.textContent = hits.length + ' ' + cat + ' nearby';
    renderHits(hits, cat);
    hits.forEach(h => {
      const [primary] = splitName(h);
      const c = CAT_COLOR[cat] || '#7c8496';
      const g = KIND[cat] || '📍';
      const m = makeMarker([+h.lon, +h.lat],
        `<div class="poi"><b style="background:${c}">${g}</b>` +
        `<span>${esc(primary)}</span></div>`, 'poiwrap');
      m.getElement().onclick = () => focusHit(h);
      poiPins.push(m);
    });
  }catch(e){
    sect.textContent = 'Explore nearby';
    out.innerHTML = `<div class="muted">${esc(e.message)}</div>`;
  }
}

async function reverse(lngLat){
  try{
    const ac = new AbortController();
    const t = setTimeout(() => ac.abort(), 4000);
    const r = await fetch(`${NOMINATIM}/reverse?lat=${lngLat[1]}&lon=${lngLat[0]}&format=json`,
                          {signal: ac.signal});
    clearTimeout(t);
    if(!r.ok) throw new Error('geocoder unavailable');
    const j = await r.json();
    return j.display_name || `${lngLat[1].toFixed(5)}, ${lngLat[0].toFixed(5)}`;
  }catch(e){ return `${lngLat[1].toFixed(5)}, ${lngLat[0].toFixed(5)}`; }
}

// ── Navigation state ────────────────────────────────────────────────────────
let car = null, drive = null, path = [], steps = [], rtInfo = null, speeds = [];
let roadLabel = null, watchId = null, liveMode = false;
let mePin = null, headingUp = true;

const MAN = {
  'depart':'Start', 'arrive':'Arrive', 'turn':'Turn', 'new name':'Continue',
  'merge':'Merge', 'on ramp':'Take the ramp', 'off ramp':'Take the exit',
  'fork':'Keep', 'end of road':'At the end of the road', 'continue':'Continue',
  'roundabout':'Enter the roundabout', 'rotary':'Enter the rotary',
  'exit roundabout':'Exit the roundabout', 'exit rotary':'Exit the rotary'
};
const ARROW = {
  'left':'↰', 'slight left':'↖', 'sharp left':'↰',
  'right':'↱', 'slight right':'↗', 'sharp right':'↱',
  'straight':'↑', 'uturn':'↩'
};
function arrowFor(st){
  const m = st.maneuver;
  if(m.type === 'arrive') return '⚑';
  if(m.type === 'depart') return '↑';
  if(m.type.indexOf('roundabout') === 0 || m.type.indexOf('rotary') === 0) return '↻';
  return ARROW[m.modifier] || '↑';
}
function manText(st){
  const m = st.maneuver;
  if(m.type === 'arrive') return 'Arrive at destination';
  if(m.type === 'depart') return 'Head ' + (m.modifier || 'off');
  return (MAN[m.type] || 'Continue') + (m.modifier ? ' ' + m.modifier : '');
}

function renderLanes(st){
  const el = document.getElementById('lanes');
  const ins = (st.intersections && st.intersections[0]) || null;
  if(!ins || !ins.bearings || ins.bearings.length < 2){ el.innerHTML = ''; return; }
  const outB = ins.bearings[ins.out !== undefined ? ins.out : 0];
  const inB  = ins.bearings[ins.in  !== undefined ? ins.in  : 0];
  el.innerHTML = ins.bearings.map(b => {
    const rel = ((b - inB + 540) % 360) - 180;
    const g = Math.abs(rel) < 25 ? '↑' : rel > 0 ? '↱' : '↰';
    return `<div class="ln${b === outB ? ' on' : ''}">${g}</div>`;
  }).join('');
}

function renderSteps(activeIdx){
  out.innerHTML = '';
  steps.forEach((st,i) => {
    const d = document.createElement('div');
    d.className = 'hit';
    d.style.opacity = i < activeIdx ? '.45' : '1';
    if(i === activeIdx) d.style.background = 'var(--sheet2)';
    d.innerHTML = `<div class="ico">${arrowFor(st)}</div>` +
      `<div style="min-width:0;flex:1"><div class="hit-main">${esc(manText(st))}</div>` +
      `<div class="hit-sub">${esc(st.name || '')}</div></div>` +
      `<div class="hit-meta">${fmtDist(st.distance)}</div>`;
    out.appendChild(d);
  });
}

function setMe(lngLat){
  if(mePin) mePin.remove();
  mePin = makeMarker(lngLat, '<div class="me"></div>', 'mewrap');
}

function hideStartMarkers(){
  if(pins.length) pins[0].remove();
  if(mePin){ mePin.remove(); mePin = null; }
}

function stopDrive(){
  if(drive){ clearInterval(drive); drive = null; }
  if(watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
  liveMode = false;
  if(car){ car.remove(); car = null; }
  if(roadLabel){ roadLabel.remove(); roadLabel = null; }
  const p = document.getElementById('prog-i');
  if(p) p.style.width = '0%';
  document.getElementById('nav').style.display = 'none';
  document.body.classList.remove('navigating');
  // Return the camera to a plain north-up overhead view.
  map.easeTo({pitch: 0, bearing: 0, duration: 500});
}

// ── Camera ──────────────────────────────────────────────────────────────────
// This is what raster tiles could not do: rotate to the direction of travel
// and tilt into a 3D view, while MapLibre keeps every label upright.
const NAV_PITCH = 55;
function navCamera(lngLat, brg){
  map.easeTo({
    center: lngLat,
    bearing: headingUp ? brg : 0,
    pitch: headingUp ? NAV_PITCH : 0,
    zoom: 17.5,
    padding: {top: Math.round(window.innerHeight * 0.42), bottom: 0, left: 0, right: 0},
    duration: 600,
    essential: true
  });
}

function updateRoadLabel(next, st){
  const ahead = (next && next.name) ? next.name : (st.name || '');
  if(ahead && next && next.maneuver && next.maneuver.location){
    const ll = next.maneuver.location;
    if(!roadLabel){
      roadLabel = makeMarker(ll, `<div class="roadlabel">${esc(ahead)}</div>`, 'lblwrap');
    } else {
      roadLabel.setLngLat(ll);
      const d = roadLabel.getElement().querySelector('.roadlabel');
      if(d && d.textContent !== ahead) d.textContent = ahead;
    }
  } else if(roadLabel){ roadLabel.remove(); roadLabel = null; }
}

// Shared HUD update for both simulated and live navigation.
function updateHud(travelled, seg, kmh){
  const total = rtInfo.distance;
  let acc = 0, idx = 0;
  for(let i = 0; i < steps.length; i++){
    if(travelled < acc + steps[i].distance){ idx = i; break; }
    acc += steps[i].distance; idx = i;
  }
  const st = steps[idx], next = steps[idx+1];
  const toTurn = Math.max(0, (acc + st.distance) - travelled);

  document.getElementById('nav-arrow').textContent = arrowFor(next || st);
  document.getElementById('nav-road').textContent =
    (next && next.name) ? next.name : (st.name || manText(next || st));
  document.getElementById('nav-to').textContent =
    fmtDist(toTurn) + ' · ' + manText(next || st);
  renderLanes(st);
  updateRoadLabel(next, st);

  const limit = speeds[Math.min(seg, speeds.length-1)] || null;
  const sp = document.getElementById('nav-speed');
  sp.innerHTML = kmh + '<small>km/h</small>';
  document.getElementById('nav-limit').textContent = limit ? limit : '—';
  sp.className = 'cur' + (limit && kmh > limit ? ' over' : '');

  document.getElementById('prog-i').style.width =
    Math.min(100, (travelled/total)*100).toFixed(1) + '%';

  const remain = Math.max(0, total - travelled);
  const secsLeft = remain / (total / rtInfo.duration);
  const eta = new Date(Date.now() + secsLeft*1000);
  document.getElementById('eta-time').textContent = Math.round(secsLeft/60) + ' min';
  document.getElementById('eta-rest').textContent =
    fmtDist(remain) + ' · ' + eta.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  renderSteps(idx);
  return remain;
}

function arrived(){
  document.getElementById('nav-arrow').textContent = '⚑';
  document.getElementById('nav-road').textContent = 'Arrived';
  document.getElementById('nav-to').textContent = '';
  document.getElementById('lanes').innerHTML = '';
  document.getElementById('prog-i').style.width = '100%';
  document.getElementById('eta-rest').textContent = '0 m remaining';
  if(roadLabel){ roadLabel.remove(); roadLabel = null; }
  renderSteps(steps.length);
}

// ── Simulated drive (preview) ───────────────────────────────────────────────
function startDrive(){
  if(!path.length || !rtInfo || !(rtInfo.duration > 0) || !(rtInfo.distance > 0)) return;
  stopDrive();
  hideStartMarkers();
  document.getElementById('nav').style.display = 'block';
  document.body.classList.add('navigating');
  car = makeMarker(path[0], '<i></i>', 'puck');

  let seg = 0, along = 0, travelled = 0;
  const total = rtInfo.distance, SPEED_UP = 8, tick = 100;
  const mPerTick = (total / rtInfo.duration) * (tick/1000) * SPEED_UP;

  drive = setInterval(() => {
    let need = mPerTick;
    while(need > 0 && seg < path.length-1){
      const segLen = dist(path[seg], path[seg+1]);
      const left = segLen - along;
      if(need < left){ along += need; need = 0; }
      else { need -= left; seg++; along = 0; }
    }
    travelled = Math.min(travelled + mPerTick, total);
    if(seg >= path.length-1){
      car.setLngLat(path[path.length-1]);
      arrived();
      clearInterval(drive); drive = null;
      return;
    }
    const a = path[seg], b = path[seg+1];
    const segLen = dist(a,b) || 1, f = along/segLen;
    const pos = [a[0] + (b[0]-a[0])*f, a[1] + (b[1]-a[1])*f];
    car.setLngLat(pos);
    const brg = bearing(a,b);
    navCamera(pos, brg);
    const el = car.getElement().querySelector('i');
    if(el) el.style.transform = headingUp ? 'rotate(0deg)' : `rotate(${brg}deg)`;
    updateHud(travelled, seg, Math.round((total/rtInfo.duration)*3.6));
  }, tick);
}

// ── Live GPS navigation ─────────────────────────────────────────────────────
function projectOnSeg(p, a, b){
  const t = Math.PI/180, R = 6371000;
  const latRef = (a[1] + b[1]) / 2 * t;
  const px = (p[0]-a[0])*t*Math.cos(latRef)*R, py = (p[1]-a[1])*t*R;
  const bx = (b[0]-a[0])*t*Math.cos(latRef)*R, by = (b[1]-a[1])*t*R;
  const len2 = bx*bx + by*by;
  let u = len2 ? (px*bx + py*by)/len2 : 0;
  u = Math.max(0, Math.min(1, u));
  return {dist: Math.hypot(px - bx*u, py - by*u), along: u*Math.sqrt(len2)};
}
function snapToRoute(ll){
  let best = null, acc = 0;
  for(let i = 0; i < path.length - 1; i++){
    const pr = projectOnSeg(ll, path[i], path[i+1]);
    if(!best || pr.dist < best.off) best = {off: pr.dist, travelled: acc + pr.along, seg: i};
    acc += dist(path[i], path[i+1]);
  }
  return best;
}

function locate(timeout){
  return new Promise(resolve => {
    if(!navigator.geolocation || !window.isSecureContext) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      p => resolve([p.coords.longitude, p.coords.latitude]),
      () => resolve(null),
      {enableHighAccuracy:true, timeout: timeout || 8000, maximumAge: 30000});
  });
}

function startLiveNav(){
  if(!path.length || !rtInfo) return;
  if(!navigator.geolocation || !window.isSecureContext){
    sect.textContent = 'Live navigation needs HTTPS';
    out.innerHTML = '<div class="muted">Browsers only stream GPS over a secure '
                  + 'connection. Open <b>https://maps.homelab.lan</b>.</div>';
    sheetUp();
    return;
  }
  stopDrive();
  hideStartMarkers();
  liveMode = true;
  document.getElementById('nav').style.display = 'block';
  document.body.classList.add('navigating');
  watchId = navigator.geolocation.watchPosition(onFix,
    () => {
      document.getElementById('nav-road').textContent = 'Waiting for GPS…';
      document.getElementById('nav-to').textContent = 'No signal';
    },
    {enableHighAccuracy:true, maximumAge:1000, timeout:15000});
}

function onFix(p){
  const ll = [p.coords.longitude, p.coords.latitude];
  const snap = snapToRoute(ll);
  if(!snap) return;
  if(!car) car = makeMarker(ll, '<i></i>', 'puck');
  else car.setLngLat(ll);

  let brg = p.coords.heading;
  if(brg == null || isNaN(brg)){
    const i = Math.min(snap.seg, path.length - 2);
    brg = bearing(path[i], path[i+1]);
  }
  navCamera(ll, brg);
  const el = car.getElement().querySelector('i');
  if(el) el.style.transform = headingUp ? 'rotate(0deg)' : `rotate(${brg}deg)`;

  const kmh = (p.coords.speed != null && !isNaN(p.coords.speed))
            ? Math.round(p.coords.speed * 3.6) : 0;
  const remain = updateHud(Math.min(snap.travelled, rtInfo.distance), snap.seg, kmh);
  if(snap.off > 40){
    document.getElementById('nav-to').textContent =
      'Off route · ' + document.getElementById('nav-to').textContent;
  }
  if(remain < 30) arrived();
}

// ── Routing ─────────────────────────────────────────────────────────────────
function beginRoute(start, dest){
  pins.forEach(p => p.remove()); pins = [];
  pts = [start, dest];
  pins.push(makeMarker(start, '', 'pin'));
  pins.push(makeMarker(dest, '', 'pin'));
  setMe(start);
  sheetUp();
  route();
}

async function routeTo(h){
  const dest = [+h.lon, +h.lat];
  sect.textContent = 'Finding your location…';
  out.innerHTML = '<div class="muted">Getting GPS position…</div>';
  sheetUp();
  let start = await locate();
  if(!start && mePin){ const l = mePin.getLngLat(); start = [l.lng, l.lat]; }
  if(!start){
    sect.textContent = 'Where are you starting from?';
    out.innerHTML = '<div class="muted">' + (window.isSecureContext
      ? 'Location is unavailable or was blocked.'
      : 'This page is on http://; browsers only allow GPS over https.')
      + ' Tap your starting point on the map, then choose Directions again.</div>';
    return;
  }
  if(dist(start, dest) < 25){
    sect.textContent = 'You are already there';
    out.innerHTML = '<div class="muted">That destination is within 25 m.</div>';
    return;
  }
  beginRoute(start, dest);
}

async function route(){
  const c = pts.map(p => `${p[0]},${p[1]}`).join(';');
  sect.textContent = 'Routing…';
  try{
    const j = await getJSON(`${OSRM}/route/v1/driving/${c}`
      + `?overview=full&geometries=geojson&steps=true&annotations=speed`);
    if(j.code !== 'Ok' || !j.routes.length){ sect.textContent = 'No route found.'; return; }
    const rt = j.routes[0];
    if(!(rt.distance > 0) || !(rt.duration > 0)){
      sect.textContent = 'Start and destination are the same';
      out.innerHTML = '<div class="muted">Pick two different points.</div>';
      return;
    }
    drawRoute(rt.geometry);
    fitTo(rt.geometry.coordinates);
    path = rt.geometry.coordinates;
    steps = (rt.legs || []).flatMap(l => l.steps || []);
    speeds = (rt.legs || []).flatMap(l => (l.annotation && l.annotation.speed) || [])
                            .map(v => Math.round(v * 3.6 / 5) * 5);
    rtInfo = {distance: rt.distance, duration: rt.duration};
    renderSteps(-1);
    const km = (rt.distance/1000).toFixed(1), min = Math.round(rt.duration/60);
    sect.innerHTML = `${km} km &middot; ${min} min ` +
      `<span class="lnk" id="golive">➤ Navigate</span> ` +
      `<span class="lnk" id="godrive" style="opacity:.7">▶ Preview</span>`;
    document.getElementById('golive').onclick = startLiveNav;
    document.getElementById('godrive').onclick = startDrive;
    sheetUp();
  }catch(e){
    sect.textContent = 'Routing failed';
    out.innerHTML = `<div class="muted">${esc(e.message)}</div>`;
  }
}

// ── Wiring ──────────────────────────────────────────────────────────────────
document.querySelectorAll('.chip').forEach(btn => {
  btn.onclick = () => browse(btn.dataset.cat, btn);
});

const qEl = document.getElementById('q');
qEl.addEventListener('keydown', e => { if(e.key === 'Enter'){ sheetUp(); search(); } });
qEl.addEventListener('focus', sheetUp);
document.getElementById('clearq').onclick = () => {
  qEl.value = ''; out.innerHTML = ''; clearMap();
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  sect.textContent = 'Explore nearby';
};

document.getElementById('t-zin').onclick  = () => map.zoomIn();
document.getElementById('t-zout').onclick = () => map.zoomOut();
document.getElementById('t-layers').onclick = () => {
  if(liveMode || drive){
    // While navigating this toggles heading-up/3D against north-up/flat.
    headingUp = !headingUp;
    map.easeTo({bearing: headingUp ? map.getBearing() : 0,
                pitch: headingUp ? NAV_PITCH : 0, duration: 400});
    return;
  }
  // Otherwise tilt the overhead view in and out.
  map.easeTo({pitch: map.getPitch() > 10 ? 0 : 50, duration: 500});
};
document.getElementById('t-me').onclick = async () => {
  const ll = await locate();
  if(ll){ map.easeTo({center: ll, zoom: 17, duration: 600}); setMe(ll); return; }
  if(!window.isSecureContext){
    sect.textContent = 'Location needs HTTPS';
    out.innerHTML = '<div class="muted">Browsers only share GPS over a secure '
                  + 'connection. Open <b>https://maps.homelab.lan</b>.</div>';
    sheetUp();
  }
  map.easeTo({center: [39.19, 21.54], zoom: 15});
};
document.getElementById('nav-x').onclick = stopDrive;

function saved(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); }
                   catch(e){ return null; } }
function quick(k, label){
  const v = saved(k);
  if(v){ map.easeTo({center: v, zoom: 16}); sheetDown(); }
  else if(confirm(`Save the current map centre as ${label}?`)){
    const c = map.getCenter();
    localStorage.setItem(k, JSON.stringify([c.lng, c.lat]));
  }
}
document.getElementById('qh').onclick = () => quick('home', 'Home');
document.getElementById('qw').onclick = () => quick('work', 'Work');
document.getElementById('qs').onclick = () => {
  out.innerHTML = ''; sect.textContent = 'Saved places';
  const rows = [['home','🏠 Home'],['work','💼 Work']].filter(([k]) => saved(k));
  if(!rows.length){
    out.innerHTML = '<div class="muted">Nothing saved yet — tap Home or Work '
                  + 'to save the current spot.</div>';
  } else {
    rows.forEach(([k,label]) => {
      const d = document.createElement('div'); d.className = 'hit';
      d.innerHTML = `<div class="ico">📍</div><div><div class="hit-main">${label}</div></div>`;
      d.onclick = () => { map.easeTo({center: saved(k), zoom: 16}); sheetDown(); };
      out.appendChild(d);
    });
  }
  sheetUp();
};
document.getElementById('qr').onclick = () => {
  sect.textContent = 'Directions';
  out.innerHTML = '<div class="muted">Tap the map for a start point, then again '
                + 'for the destination — or use “Directions” on any result.</div>';
  sheetUp();
};

// Tap the map to build a route by hand.
map.on('click', e => {
  if(pts.length >= 2) return;
  const ll = [e.lngLat.lng, e.lngLat.lat];
  pts.push(ll);
  const label = pts.length === 1 ? 'Start' : 'Destination';
  pins.push(makeMarker(ll, '', 'pin'));
  const pu = popup(ll, `<b>${label}</b>`);
  if(pts.length === 2) route();
  reverse(ll).then(name => pu.setHTML(`<b>${label}</b><br>${esc(name)}`))
             .catch(() => {});
});

map.on('load', () => {
  setMe([39.19, 21.54]);
  sheetDown();
});
</script>
