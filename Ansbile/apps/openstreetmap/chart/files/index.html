<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homelab Maps</title>
<link rel="stylesheet" href="/vendor/leaflet.css">
<style>
  :root { --bg:#fff; --fg:#111; --panel:#f7f7f8; --border:#d8d8dc; --accent:#2b6cb0;
          --sheet:#1c1f26; --sheet2:#262a33; --chip:#2a2e37; --txt:#e9eaee; --dim:#9aa0ad; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overflow:hidden;
               font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
               background:#11131a; color:var(--txt); }
  #map { position:absolute; inset:0; background:#11131a; }

  /* Permanent night map, like the reference. */
  .leaflet-tile-pane {
    filter: invert(1) hue-rotate(180deg) brightness(.82) contrast(1.1) saturate(.7);
  }
  .leaflet-control-zoom { display:none; }

  /* ── Category chips ─────────────────────────────────────────────────── */
  #chips { position:absolute; top:0; left:0; right:0; z-index:900;
           display:flex; gap:9px; padding:12px 12px 6px;
           overflow-x:auto; scrollbar-width:none; }
  #chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; display:flex; align-items:center; gap:7px;
          background:var(--sheet); color:var(--txt); border:0;
          border-radius:999px; padding:9px 15px; font-size:13.5px; font-weight:600;
          box-shadow:0 3px 12px rgba(0,0,0,.45); cursor:pointer; white-space:nowrap; }
  .chip:hover { background:var(--sheet2); }
  .chip.on { background:#1a73e8; color:#fff; }

  /* ── Right-side floating controls ───────────────────────────────────── */
  #tools { position:absolute; right:12px; top:50%; transform:translateY(-50%);
           z-index:900; display:flex; flex-direction:column; gap:10px; }
  .tool { width:46px; height:46px; border-radius:14px; border:0; cursor:pointer;
          background:var(--sheet); color:var(--txt); font-size:17px; font-weight:700;
          box-shadow:0 3px 12px rgba(0,0,0,.45);
          display:flex; align-items:center; justify-content:center; }
  .tool:hover { background:var(--sheet2); }
  .tool.blue { color:#4c8dff; }

  /* ── Bottom sheet ───────────────────────────────────────────────────── */
  #sheet { position:absolute; left:0; right:0; bottom:0; z-index:950;
           background:var(--sheet); border-radius:20px 20px 0 0;
           box-shadow:0 -6px 30px rgba(0,0,0,.5);
           transition:transform .25s ease; max-height:72%;
           display:flex; flex-direction:column; }
  #sheet.down { transform:translateY(calc(100% - 132px)); }
  #grip { padding:9px 0 4px; display:flex; justify-content:center; cursor:grab; flex:none; }
  #grip i { width:38px; height:4px; border-radius:3px; background:#4a505d; display:block; }
  #searchbar { display:flex; align-items:center; gap:10px; margin:2px 14px 12px;
               background:var(--sheet2); border-radius:999px; padding:11px 15px; flex:none; }
  #searchbar input { flex:1; background:none; border:0; outline:0;
                     color:var(--txt); font-size:15px; }
  #searchbar input::placeholder { color:var(--dim); }
  #searchbar .ic { color:var(--dim); font-size:15px; }
  #quick { display:flex; gap:9px; padding:0 14px 12px; overflow-x:auto;
           scrollbar-width:none; flex:none; }
  #quick::-webkit-scrollbar { display:none; }
  .q { flex:none; display:flex; align-items:center; gap:7px; background:var(--sheet2);
       border:0; border-radius:999px; padding:9px 14px; color:var(--txt);
       font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .q:hover { filter:brightness(1.15); }
  #sheetbody { overflow-y:auto; padding-bottom:14px; }
  .sect { padding:4px 16px 10px; font-size:15px; font-weight:700; }

  /* ── Result rows ────────────────────────────────────────────────────── */
  .hit { padding:11px 16px; cursor:pointer; display:flex; gap:12px;
         align-items:flex-start; border-bottom:1px solid #2b303a; }
  .hit:hover { background:var(--sheet2); }
  .hit .ico { width:38px; height:38px; border-radius:50%; flex:none;
              background:var(--sheet2); display:flex; align-items:center;
              justify-content:center; font-size:17px; }
  .hit-main { font-weight:600; }
  .hit-sub { color:var(--dim); font-size:12.5px; line-height:1.35; margin-top:2px;
             overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hit-meta { font-size:11.5px; color:var(--dim); margin-top:4px; }
  .lnk { color:#4c8dff; cursor:pointer; font-weight:600; }
  .muted { color:var(--dim); padding:12px 16px; font-size:13px; }

  /* ── Map POI pins ───────────────────────────────────────────────────── */
  .poi { display:flex; align-items:center; gap:5px; white-space:nowrap; }
  .poi b { width:26px; height:26px; border-radius:50%; display:flex; flex:none;
           align-items:center; justify-content:center; font-size:13px;
           box-shadow:0 2px 6px rgba(0,0,0,.6); }
  .poi span { font-size:11px; font-weight:700; color:#fff; max-width:118px;
              overflow:hidden; text-overflow:ellipsis;
              text-shadow:0 1px 3px #000, 0 0 6px #000; }
  .me { width:16px; height:16px; border-radius:50%; background:#1a73e8;
        border:3px solid #fff; box-shadow:0 0 0 4px rgba(26,115,232,.35); }

  /* ── Waze/Google-style navigation overlay ─────────────────────────────── */
  #nav { display:none; position:absolute; inset:0; z-index:1000; pointer-events:none;
         font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  #nav .top { pointer-events:auto; margin:10px; border-radius:14px; overflow:hidden;
              background:#12151c; color:#fff; box-shadow:0 6px 24px rgba(0,0,0,.45); }
  #lanes { display:flex; gap:0; padding:10px 8px 6px; justify-content:center;
           border-bottom:1px solid #262b36; }
  #lanes .ln { flex:1; text-align:center; font-size:22px; color:#5d6577;
               border-right:1px solid #262b36; }
  #lanes .ln:last-child { border-right:0; }
  #lanes .ln.on { color:#22c55e; }
  #banner { display:flex; gap:14px; align-items:center; padding:14px 16px; }
  #banner .arrow { font-size:34px; line-height:1; }
  #banner .txt { flex:1; min-width:0; }
  #banner .road { font-size:19px; font-weight:700; white-space:nowrap;
                  overflow:hidden; text-overflow:ellipsis; }
  #banner .to { font-size:15px; opacity:.75; margin-top:2px; }
  #speed { position:absolute; left:16px; bottom:92px; pointer-events:auto;
           display:flex; flex-direction:column; align-items:center; gap:6px; }
  .limit { width:56px; height:56px; border-radius:50%; background:#fff; color:#111;
           border:5px solid #e11d48; display:flex; align-items:center;
           justify-content:center; font-weight:800; font-size:19px;
           box-shadow:0 4px 14px rgba(0,0,0,.4); }
  .cur { background:#12151c; color:#fff; border-radius:10px; padding:4px 9px;
         font-size:12px; font-weight:700; box-shadow:0 4px 14px rgba(0,0,0,.4); }
  .cur.over { background:#e11d48; }
  #eta { position:absolute; left:50%; transform:translateX(-50%); bottom:16px;
         pointer-events:auto; display:flex; align-items:center; gap:14px;
         background:#12151c; color:#fff; border-radius:16px; padding:10px 16px;
         box-shadow:0 6px 24px rgba(0,0,0,.45); white-space:nowrap; }
  #eta .big { color:#22c55e; font-weight:700; font-size:17px; }
  #eta .sub { font-size:13px; opacity:.8; }
  #eta .x { background:#e11d48; border:0; color:#fff; width:34px; height:34px;
            border-radius:50%; font-size:16px; cursor:pointer; margin:0; }
  /* The tile server renders the standard light carto style; filter it to a
     dark night theme while navigating, like the reference app. */
  body.navigating .leaflet-tile-pane {
    filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(1.15) saturate(.75);
  }
  .puck { width:0;height:0; }
  .puck i { display:block; width:0;height:0; border-left:11px solid transparent;
            border-right:11px solid transparent; border-bottom:26px solid #22c55e;
            transform-origin:50% 70%; filter:drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
  #drive { display:none; padding:10px 16px; border-bottom:1px solid var(--border); }
  #drive .row { display:flex; gap:8px; }
  #drive button { margin-top:0; }
  #now { display:none; padding:12px 16px; background:var(--accent); color:#fff; }
  #now .man { font-size:15px; font-weight:600; }
  #now .dist { font-size:12px; opacity:.9; margin-top:2px; }
  .step { padding:9px 16px; border-bottom:1px solid var(--border); font-size:13px; display:flex; gap:10px; }
  .step.done { opacity:.4; }
  .step.cur { background:var(--bg); font-weight:600; }
  .step .d { opacity:.6; font-size:12px; white-space:nowrap; }
  .car { font-size:26px; line-height:1; text-align:center;
         filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  @media (max-width:760px){ #app{flex-direction:column} #side{width:auto;height:46%} }
</style>
</head>
<body>
<div id="map">
  <div id="nav">
    <div class="top">
      <div id="lanes"></div>
      <div id="banner">
        <div class="arrow" id="nav-arrow">↑</div>
        <div class="txt">
          <div class="road" id="nav-road"></div>
          <div class="to"  id="nav-to"></div>
        </div>
      </div>
    </div>
    <div id="speed">
      <div class="limit" id="nav-limit">—</div>
      <div class="cur" id="nav-speed">0 km/h</div>
    </div>
    <div id="eta">
      <div>
        <div class="big" id="eta-time"></div>
        <div class="sub" id="eta-rest"></div>
      </div>
      <button class="x" id="nav-x" title="End navigation">✕</button>
    </div>
  </div>
</div>

<div id="chips">
  <button class="chip" data-cat="restaurant">🍽️ Restaurants</button>
  <button class="chip" data-cat="cafe">☕ Coffee</button>
  <button class="chip" data-cat="fuel">⛽ Fuel</button>
  <button class="chip" data-cat="pharmacy">💊 Pharmacy</button>
  <button class="chip" data-cat="hospital">🏥 Hospitals</button>
  <button class="chip" data-cat="supermarket">🛒 Groceries</button>
  <button class="chip" data-cat="mall">🛍️ Malls</button>
  <button class="chip" data-cat="mosque">🕌 Mosques</button>
  <button class="chip" data-cat="atm">🏧 ATMs</button>
  <button class="chip" data-cat="park">🌳 Parks</button>
</div>

<div id="tools">
  <button class="tool" id="t-layers" title="Toggle night mode">◈</button>
  <button class="tool" id="t-zin"    title="Zoom in">＋</button>
  <button class="tool" id="t-zout"   title="Zoom out">－</button>
  <button class="tool blue" id="t-me" title="Recentre">➤</button>
</div>

<div id="sheet">
  <div id="grip"><i></i></div>
  <div id="searchbar">
    <span class="ic">🔍</span>
    <input id="q" placeholder="Search here" autocomplete="off">
    <span class="ic" id="clearq" style="cursor:pointer">✕</span>
  </div>
  <div id="quick">
    <button class="q" id="qh">🏠 Home</button>
    <button class="q" id="qw">💼 Work</button>
    <button class="q" id="qs">🔖 Saved</button>
    <button class="q" id="qr">🧭 Route</button>
  </div>
  <div id="sheetbody">
    <div class="sect" id="sect">Explore nearby</div>
    <div id="out"></div>
  </div>
</div>

<script src="/vendor/leaflet.js"></script>
<script>
// Same-origin paths: nginx proxies these to Nominatim and OSRM, so the page
// works on any host or port it is served from, with no CORS and no extra DNS.
const NOMINATIM = '/geocode';
const OSRM      = '';

const map = L.map('map', {zoomControl:false}).setView([21.54, 39.19], 15);
L.tileLayer('/tile/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const out   = document.getElementById('out');
const sheet = document.getElementById('sheet');
const sect  = document.getElementById('sect');
let marker = null, pts = [], line = null, pins = [];

// The sheet collapses to just the search bar so the map stays the focus.
function sheetDown(){ sheet.classList.add('down'); }
function sheetUp(){ sheet.classList.remove('down'); }
document.getElementById('grip').onclick = () =>
  sheet.classList.contains('down') ? sheetUp() : sheetDown();

function esc(s){ return String(s).replace(/[&<>"']/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// A 502/503 from nginx is an HTML error page, not JSON. Check the status
// first so the user sees "still starting up" instead of a parser error.
async function getJSON(url){
  const r = await fetch(url);
  if(r.status === 502 || r.status === 503)
    throw new Error('service is still starting up — try again in a few minutes');
  if(!r.ok) throw new Error(`server returned ${r.status}`);
  return r.json();
}

// Split "Name, District" into the display name and the rest of the address,
// so a result reads like a place card rather than one long string.
function splitName(h){
  const parts = h.display_name.split(',');
  const primary = (h.name && h.name.trim()) ? h.name.trim() : parts[0].trim();
  const rest = h.display_name.startsWith(primary)
    ? parts.slice(1).join(',').trim()
    : parts.slice(1).join(',').trim();
  return [primary, rest];
}

const KIND = {
  hospital:'🏥', clinic:'🏥', doctors:'🏥', pharmacy:'💊',
  school:'🏫', university:'🎓', college:'🎓',
  restaurant:'🍽️', cafe:'☕', fast_food:'🍔',
  supermarket:'🛒', mall:'🛍️', bank:'🏦', atm:'🏧',
  fuel:'⛽', hotel:'🏨', mosque:'🕌', place_of_worship:'🕌',
  parking:'🅿️', police:'👮', fire_station:'🚒', park:'🌳',
  city:'🏙️', town:'🏙️', village:'🏘️', suburb:'🏘️', neighbourhood:'🏘️',
  postcode:'📮', residential:'🛣️', secondary:'🛣️', primary:'🛣️',
  trunk:'🛣️', tertiary:'🛣️', motorway:'🛣️'
};

let searchPins = [];
function clearSearchPins(){ searchPins.forEach(p => map.removeLayer(p)); searchPins = []; }

async function search(){
  const q = document.getElementById('q').value.trim();
  if(!q) return;
  out.innerHTML = '<div class="hit muted">Searching…</div>';
  try{
    // Bias results toward what the user is looking at, like Google Maps does,
    // but do not hard-restrict to it — a match outside the view still shows.
    const b = map.getBounds();
    const vb = [b.getWest(), b.getNorth(), b.getEast(), b.getSouth()].join(',');
    const url = `${NOMINATIM}/search?q=${encodeURIComponent(q)}`
              + `&format=json&addressdetails=1&namedetails=1&limit=15`
              + `&viewbox=${vb}&bounded=0`;
    const hits = await getJSON(url);
    if(!hits.length){
      out.innerHTML = '<div class="hit muted">No results. Try Arabic — most '
                    + 'Saudi places are tagged in Arabic (e.g. مستشفى instead '
                    + 'of hospital).</div>';
      return;
    }
    out.innerHTML = '';
    clearSearchPins();
    hits.forEach(h => {
      const [primary, rest] = splitName(h);
      const icon = KIND[h.type] || KIND[h.class] || '📍';
      const km = map.distance(map.getCenter(), [+h.lat, +h.lon]) / 1000;
      const d = document.createElement('div');
      d.className = 'hit';
      d.innerHTML =
        `<div class="hit-main">${icon} ${esc(primary)}</div>` +
        `<div class="hit-sub">${esc(rest)}</div>` +
        `<div class="hit-meta">${km < 1 ? Math.round(km*1000)+' m' : km.toFixed(1)+' km'} away` +
        ` &middot; <span class="lnk" data-act="route">Route here</span></div>`;

      const go = () => {
        map.setView([+h.lat, +h.lon], 17);
        if(marker) map.removeLayer(marker);
        marker = L.marker([+h.lat, +h.lon]).addTo(map)
                  .bindPopup(`<b>${esc(primary)}</b><br>${esc(rest)}`).openPopup();
      };
      d.onclick = ev => {
        if(ev.target.dataset.act === 'route'){
          // Use it as the destination: keep any existing start point.
          const dest = L.latLng(+h.lat, +h.lon);
          if(pts.length >= 2){ pts = [pts[0]]; pins.slice(1).forEach(p=>map.removeLayer(p)); pins = pins.slice(0,1); }
          if(pts.length === 0){
            alert('Click your starting point on the map first, then choose "Route here".');
            return;
          }
          pts.push(dest);
          pins.push(L.marker(dest).addTo(map).bindPopup('Destination: ' + esc(primary)));
          route();
          return;
        }
        go();
      };
      out.appendChild(d);
    });
  }catch(e){ out.innerHTML = `<div class="hit muted">Search failed: ${esc(e.message)}</div>`; }
}

async function reverse(ll){
  try{
    // 4s ceiling: a stalled geocoder must never hold up the map.
    const ac = new AbortController();
    const t = setTimeout(() => ac.abort(), 4000);
    const r = await fetch(`${NOMINATIM}/reverse?lat=${ll.lat}&lon=${ll.lng}&format=json`,
                          {signal: ac.signal});
    clearTimeout(t);
    if(!r.ok) throw new Error('geocoder unavailable');
    const j = await r.json();
    return j.display_name || `${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`;
  }catch(e){ return `${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`; }
}

// ── Drive simulation ────────────────────────────────────────────────────────
// The route geometry is a list of [lng,lat] points. We walk it at a speed
// derived from OSRM's own duration estimate, so the drive takes roughly the
// time the route claims, and surface the matching turn instruction as we go.
const puckIcon = L.divIcon({className:'puck', html:'<i></i>',
                            iconSize:[22,26], iconAnchor:[11,18]});
let car = null, drive = null, path = [], steps = [], rtInfo = null, speeds = [];

const MAN = {
  'depart':'Start', 'arrive':'Arrive', 'turn':'Turn', 'new name':'Continue',
  'merge':'Merge', 'on ramp':'Take the ramp', 'off ramp':'Take the exit',
  'fork':'Keep', 'end of road':'At the end of the road', 'continue':'Continue',
  'roundabout':'Enter the roundabout', 'rotary':'Enter the rotary',
  'exit roundabout':'Exit the roundabout', 'exit rotary':'Exit the rotary'
};
// Big directional glyph for the banner, chosen from the maneuver modifier.
const ARROW = {
  'left':'↰', 'slight left':'↖', 'sharp left':'↰',
  'right':'↱', 'slight right':'↗', 'sharp right':'↱',
  'straight':'↑', 'uturn':'↩'
};
function arrowFor(st){
  const m = st.maneuver;
  if(m.type === 'arrive') return '⚑';
  if(m.type === 'depart') return '↑';
  if(m.type.indexOf('roundabout') === 0 || m.type.indexOf('rotary') === 0) return '↻';
  return ARROW[m.modifier] || '↑';
}
function manText(st){
  const m = st.maneuver;
  const head = MAN[m.type] || 'Continue';
  const mod = m.modifier ? ' ' + m.modifier : '';
  if(m.type === 'arrive') return 'Arrive at destination';
  if(m.type === 'depart') return 'Head ' + (m.modifier || 'off');
  return head + mod;
}
function fmtDist(m){ return m >= 1000 ? (m/1000).toFixed(1)+' km' : Math.round(m)+' m'; }

function dist(a,b){
  const R=6371000, t=Math.PI/180;
  const dLat=(b[1]-a[1])*t, dLon=(b[0]-a[0])*t;
  const la1=a[1]*t, la2=b[1]*t;
  const h=Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
// Compass bearing a→b, degrees clockwise from north.
function bearing(a,b){
  const t=Math.PI/180;
  const y=Math.sin((b[0]-a[0])*t)*Math.cos(b[1]*t);
  const x=Math.cos(a[1]*t)*Math.sin(b[1]*t) -
          Math.sin(a[1]*t)*Math.cos(b[1]*t)*Math.cos((b[0]-a[0])*t);
  return (Math.atan2(y,x)/t + 360) % 360;
}

// Lane guidance. The extract carries no turn:lanes tags, so approximate it
// from the intersection's own bearings: one arrow per available exit, with
// the one we actually take highlighted.
function renderLanes(st){
  const el = document.getElementById('lanes');
  const ins = (st.intersections && st.intersections[0]) || null;
  if(!ins || !ins.bearings || ins.bearings.length < 2){ el.innerHTML = ''; return; }
  const outB = ins.bearings[ins.out !== undefined ? ins.out : 0];
  el.innerHTML = ins.bearings.map((b,i) => {
    const rel = ((b - ins.bearings[ins.in !== undefined ? ins.in : 0] + 540) % 360) - 180;
    const g = Math.abs(rel) < 25 ? '↑' : rel > 0 ? '↱' : '↰';
    const on = (b === outB) ? ' on' : '';
    return `<div class="ln${on}">${g}</div>`;
  }).join('');
}

// Turn list in the sheet: completed steps dim, the active one highlights.
function renderSteps(activeIdx){
  out.innerHTML = '';
  steps.forEach((st,i) => {
    const d = document.createElement('div');
    d.className = 'hit';
    d.style.opacity = i < activeIdx ? '.45' : '1';
    if(i === activeIdx) d.style.background = 'var(--sheet2)';
    d.innerHTML = `<div class="ico">${arrowFor(st)}</div>` +
      `<div style="min-width:0;flex:1"><div class="hit-main">${esc(manText(st))}</div>` +
      `<div class="hit-sub">${esc(st.name || '')}</div></div>` +
      `<div class="hit-meta">${fmtDist(st.distance)}</div>`;
    out.appendChild(d);
  });
}

function stopDrive(){
  if(drive){ clearInterval(drive); drive = null; }
  if(car){ map.removeLayer(car); car = null; }
  document.getElementById('nav').style.display = 'none';
  document.body.classList.remove('navigating');
}

function startDrive(){
  if(!path.length) return;
  stopDrive();
  const nav = document.getElementById('nav');
  nav.style.display = 'block';
  document.body.classList.add('navigating');
  car = L.marker([path[0][1], path[0][0]], {icon:puckIcon, zIndexOffset:1000}).addTo(map);

  let seg = 0, along = 0, travelled = 0;
  const total = rtInfo.distance;
  const SPEED_UP = 8, tick = 100;
  const mPerTick = (total / rtInfo.duration) * (tick/1000) * SPEED_UP;
  const started = Date.now();

  map.setZoom(17);

  drive = setInterval(() => {
    let need = mPerTick;
    while(need > 0 && seg < path.length-1){
      const segLen = dist(path[seg], path[seg+1]);
      const left = segLen - along;
      if(need < left){ along += need; need = 0; }
      else { need -= left; seg++; along = 0; }
    }
    travelled = Math.min(travelled + mPerTick, total);

    if(seg >= path.length-1){
      const end = path[path.length-1];
      car.setLatLng([end[1], end[0]]);
      document.getElementById('nav-arrow').textContent = '⚑';
      document.getElementById('nav-road').textContent = 'Arrived';
      document.getElementById('nav-to').textContent = '';
      document.getElementById('lanes').innerHTML = '';
      document.getElementById('eta-rest').textContent = '0 m remaining';
      renderSteps(steps.length);
      clearInterval(drive); drive = null;
      return;
    }

    const a = path[seg], b = path[seg+1];
    const segLen = dist(a,b) || 1, f = along/segLen;
    const pos = [a[1] + (b[1]-a[1])*f, a[0] + (b[0]-a[0])*f];
    car.setLatLng(pos);
    map.panTo(pos, {animate:false});

    // Rotate the puck to the direction of travel (heading-up feel without
    // rotating the tiles, which Leaflet cannot do natively).
    const brg = bearing(a,b);
    const el = car.getElement() && car.getElement().querySelector('i');
    if(el) el.style.transform = `rotate(${brg}deg)`;

    // Current step + distance to the next maneuver.
    let acc = 0, idx = 0;
    for(let i=0;i<steps.length;i++){
      if(travelled < acc + steps[i].distance){ idx = i; break; }
      acc += steps[i].distance; idx = i;
    }
    const st = steps[idx];
    const next = steps[idx+1];
    const toTurn = Math.max(0, (acc + st.distance) - travelled);

    document.getElementById('nav-arrow').textContent = arrowFor(next || st);
    document.getElementById('nav-road').textContent =
      (next && next.name) ? next.name : (st.name || manText(next || st));
    document.getElementById('nav-to').textContent =
      fmtDist(toTurn) + ' · ' + manText(next || st);
    renderLanes(st);

    // Speed: derived from the simulated pace, capped for realism.
    const kmh = Math.round((mPerTick/(tick/1000)) * 3.6 / SPEED_UP * SPEED_UP);
    const limit = speeds[Math.min(seg, speeds.length-1)] || null;
    const sp = document.getElementById('nav-speed');
    sp.textContent = kmh + ' km/h';
    const lim = document.getElementById('nav-limit');
    lim.textContent = limit ? limit : '—';
    sp.className = 'cur' + (limit && kmh > limit ? ' over' : '');

    const remain = total - travelled;
    const secsLeft = remain / (total/rtInfo.duration);
    const eta = new Date(Date.now() + secsLeft*1000);
    document.getElementById('eta-time').textContent =
      Math.round(secsLeft/60) + ' min';
    document.getElementById('eta-rest').textContent =
      fmtDist(remain) + ' · ' +
      eta.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

    renderSteps(idx);
  }, tick);
}

async function route(){
  const c = pts.map(p => `${p.lng},${p.lat}`).join(';');
  sect.textContent = 'Routing…';
  try{
    const j = await getJSON(`${OSRM}/route/v1/driving/${c}?overview=full&geometries=geojson&steps=true&annotations=speed`);
    if(j.code !== 'Ok' || !j.routes.length){ sect.textContent = 'No route found.'; return; }
    const rt = j.routes[0];
    if(line) map.removeLayer(line);
    line = L.geoJSON({type:'Feature', geometry: rt.geometry},
                     {style:{color:'#2b6cb0', weight:5, opacity:.8}}).addTo(map);
    map.fitBounds(line.getBounds(), {padding:[40,40]});
    const km = (rt.distance/1000).toFixed(1);
    const min = Math.round(rt.duration/60);
    path = rt.geometry.coordinates;
    steps = (rt.legs || []).flatMap(l => l.steps || []);
    // OSRM speed annotation is m/s per geometry segment — the closest thing
    // to a speed limit available without maxspeed tags.
    speeds = (rt.legs || []).flatMap(l => (l.annotation && l.annotation.speed) || [])
                            .map(v => Math.round(v * 3.6 / 5) * 5);
    rtInfo = {distance: rt.distance, duration: rt.duration};
    renderSteps(-1);
    // Live inside the header so renderSteps() — which rewrites `out` on every
    // tick — cannot delete it mid-drive.
    sect.innerHTML = `${km} km &middot; ${min} min ` +
      `<span class="lnk" id="godrive">▶ Start drive</span>`;
    document.getElementById('godrive').onclick = startDrive;
    sheetUp();
  }catch(e){ sect.textContent = 'Routing failed'; out.innerHTML =
      `<div class="muted">${esc(e.message)}</div>`; }
}

map.on('click', e => {
  if(pts.length >= 2) return;
  pts.push(e.latlng);
  const label = pts.length === 1 ? 'Start' : 'Destination';
  const pin = L.marker(e.latlng).addTo(map)
               .bindPopup(`<b>${label}</b>`).openPopup();
  pins.push(pin);

  // Route immediately — never behind reverse geocoding, which blocks for the
  // proxy timeout whenever Nominatim is down and would strand the route.
  if(pts.length === 2) route();

  // Fill in the street name afterwards, best-effort.
  reverse(e.latlng).then(name =>
    pin.setPopupContent(`<b>${label}</b><br>${esc(name)}`)).catch(() => {});
});

document.getElementById('q').addEventListener('keydown', e => { if(e.key === 'Enter') search(); });
document.getElementById('nav-x').onclick = stopDrive;

// ── Category browse ─────────────────────────────────────────────────────────
// Nominatim's amenity search over the current viewport, so chips behave like
// the "Restaurants / Coffee" row in Google Maps.
const CAT_COLOR = {
  restaurant:'#ef6c3b', cafe:'#ef6c3b', fuel:'#3b82f6', pharmacy:'#16a34a',
  hospital:'#16a34a', supermarket:'#f59e0b', mall:'#a855f7', mosque:'#14b8a6',
  atm:'#6366f1', park:'#22c55e'
};
let poiPins = [];
function clearPois(){ poiPins.forEach(p => map.removeLayer(p)); poiPins = []; }

function poiIcon(cat, label){
  const c = CAT_COLOR[cat] || '#7c8496';
  const g = KIND[cat] || '📍';
  return L.divIcon({className:'', iconSize:[0,0], iconAnchor:[13,13],
    html:`<div class="poi"><b style="background:${c}">${g}</b>` +
         `<span>${label.replace(/[<>&]/g,'')}</span></div>`});
}

async function browse(cat, btn){
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  if(btn) btn.classList.add('on');
  sect.textContent = 'Loading…';
  sheetUp();
  out.innerHTML = '<div class="muted">Searching nearby…</div>';
  const b = map.getBounds();
  const vb = [b.getWest(), b.getNorth(), b.getEast(), b.getSouth()].join(',');
  try{
    const hits = await getJSON(`${NOMINATIM}/search?q=${encodeURIComponent(cat)}`
      + `&format=json&addressdetails=1&limit=25&viewbox=${vb}&bounded=1`);
    clearPois();
    if(!hits.length){
      sect.textContent = 'Nothing found nearby';
      out.innerHTML = '<div class="muted">No ' + esc(cat)
        + ' mapped in this area. Try zooming out, or search in Arabic.</div>';
      return;
    }
    sect.textContent = hits.length + ' ' + cat + ' nearby';
    renderHits(hits, cat);
    hits.forEach(h => {
      const [primary] = splitName(h);
      poiPins.push(L.marker([+h.lat, +h.lon], {icon: poiIcon(cat, primary)})
                    .addTo(map).on('click', () => focusHit(h)));
    });
  }catch(e){
    sect.textContent = 'Explore nearby';
    out.innerHTML = `<div class="muted">${esc(e.message)}</div>`;
  }
}

function focusHit(h){
  const [primary, rest] = splitName(h);
  map.setView([+h.lat, +h.lon], 17);
  if(marker) map.removeLayer(marker);
  marker = L.marker([+h.lat, +h.lon]).addTo(map)
            .bindPopup(`<b>${esc(primary)}</b><br>${esc(rest)}`).openPopup();
  sheetDown();
}

// Shared renderer for chip browse and free-text search.
function renderHits(hits, cat){
  out.innerHTML = '';
  hits.forEach(h => {
    const [primary, rest] = splitName(h);
    const icon = KIND[h.type] || KIND[cat] || KIND[h.class] || '📍';
    const km = map.distance(map.getCenter(), [+h.lat, +h.lon]) / 1000;
    const d = document.createElement('div');
    d.className = 'hit';
    d.innerHTML =
      `<div class="ico">${icon}</div>` +
      `<div style="min-width:0;flex:1">` +
        `<div class="hit-main">${esc(primary)}</div>` +
        `<div class="hit-sub">${esc(rest)}</div>` +
        `<div class="hit-meta">${km < 1 ? Math.round(km*1000)+' m' : km.toFixed(1)+' km'} away` +
        ` &middot; <span class="lnk" data-act="route">Directions</span></div>` +
      `</div>`;
    d.onclick = ev => {
      if(ev.target.dataset.act === 'route'){ routeTo(h); return; }
      focusHit(h);
    };
    out.appendChild(d);
  });
}

// Route from the map centre (the "you are here" dot) to the chosen place.
function routeTo(h){
  const dest = L.latLng(+h.lat, +h.lon);
  pins.forEach(p => map.removeLayer(p)); pins = [];
  pts = [map.getCenter(), dest];
  pins.push(L.marker(pts[0]).addTo(map).bindPopup('Start'));
  pins.push(L.marker(dest).addTo(map).bindPopup('Destination'));
  sheetUp();
  route();
}

document.querySelectorAll('.chip').forEach(btn => {
  btn.onclick = () => browse(btn.dataset.cat, btn);
});

// ── Search bar ──────────────────────────────────────────────────────────────
const qEl = document.getElementById('q');
qEl.addEventListener('keydown', e => { if(e.key === 'Enter'){ sheetUp(); search(); } });
qEl.addEventListener('focus', sheetUp);
document.getElementById('clearq').onclick = () => {
  qEl.value = ''; out.innerHTML = ''; clearPois();
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  sect.textContent = 'Explore nearby';
};

// ── Tools ───────────────────────────────────────────────────────────────────
document.getElementById('t-zin').onclick  = () => map.zoomIn();
document.getElementById('t-zout').onclick = () => map.zoomOut();
document.getElementById('t-layers').onclick = () =>
  document.body.classList.toggle('daylight');
document.getElementById('t-me').onclick = () => {
  if(!navigator.geolocation){ map.setView([21.54,39.19], 15); return; }
  navigator.geolocation.getCurrentPosition(
    p => { const ll=[p.coords.latitude,p.coords.longitude];
           map.setView(ll,16); setMe(ll); },
    () => map.setView([21.54,39.19], 15));
};

// Blue "you are here" dot. Real geolocation needs a trusted HTTPS cert;
// without it we simply show the map centre as the reference point.
let mePin = null;
function setMe(ll){
  if(mePin) map.removeLayer(mePin);
  mePin = L.marker(ll, {icon: L.divIcon({className:'', html:'<div class="me"></div>',
          iconSize:[16,16], iconAnchor:[8,8]}), interactive:false}).addTo(map);
}
setMe([21.54, 39.19]);

// ── Quick actions ───────────────────────────────────────────────────────────
function saved(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); }
                   catch(e){ return null; } }
function setSaved(k, ll){ localStorage.setItem(k, JSON.stringify(ll)); }
function quick(k, label){
  const v = saved(k);
  if(v){ map.setView(v, 16); sheetDown(); }
  else if(confirm(`Save the current map centre as ${label}?`)){
    const c = map.getCenter(); setSaved(k, [c.lat, c.lng]);
  }
}
document.getElementById('qh').onclick = () => quick('home', 'Home');
document.getElementById('qw').onclick = () => quick('work', 'Work');
document.getElementById('qs').onclick = () => {
  out.innerHTML = '';
  sect.textContent = 'Saved places';
  const rows = [['home','🏠 Home'],['work','💼 Work']]
    .filter(([k]) => saved(k));
  if(!rows.length){ out.innerHTML =
    '<div class="muted">Nothing saved yet — tap Home or Work to save the current spot.</div>';
    return; }
  rows.forEach(([k,label]) => {
    const d=document.createElement('div'); d.className='hit';
    d.innerHTML=`<div class="ico">📍</div><div><div class="hit-main">${label}</div></div>`;
    d.onclick=()=>{ map.setView(saved(k),16); sheetDown(); };
    out.appendChild(d);
  });
  sheetUp();
};
document.getElementById('qr').onclick = () => {
  sect.textContent = 'Directions';
  out.innerHTML = '<div class="muted">Tap the map for a start point, then again '
                + 'for the destination — or use “Directions” on any result.</div>';
  sheetUp();
};

// Map clicks still build a route, as before.
map.on('click', async e => {
  if(pts.length >= 2) return;
  pts.push(e.latlng);
  const label = pts.length === 1 ? 'Start' : 'Destination';
  const pin = L.marker(e.latlng).addTo(map).bindPopup(`${label}: loading…`).openPopup();
  pins.push(pin);
  pin.setPopupContent(`<b>${label}</b><br>` + esc(await reverse(e.latlng)));
  if(pts.length === 2) route();
});

sheetDown();
</script>
