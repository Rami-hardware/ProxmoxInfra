- name: Ensure application directory exists
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Copy Node.js alert forwarder code
  ansible.builtin.copy:
    dest: "{{ app_dir }}/server.js"
    mode: '0644'
    content: |
      const express = require('express');
      const axios = require('axios');

      const app = express();
      app.use(express.json());

          const DISCORD_WEBHOOK_URL = process.env.DISCORD_WEBHOOK_URL;

          if (!DISCORD_WEBHOOK_URL) {
            console.error("DISCORD_WEBHOOK_URL is not set");
            process.exit(1);
          }
      app.post('/alertmanager', async (req, res) => {
        const alerts = req.body.alerts || [];

        if (!alerts.length) {
          console.warn('Received alert with empty alerts array');
          return res.status(400).send('No alerts to process');
        }

        const messages = alerts.map(alert => {
          const summary = alert.annotations?.summary || alert.labels?.alertname || 'No summary';
          const status = alert.status || 'unknown';
          const description = alert.annotations?.description || '';
          return `**Alert:** ${summary}\nStatus: ${status}\n${description}`;
        });

        const payload = {
          content: messages.join('\n\n')
        };

        try {
          console.log('Sending payload to Discord:', payload.content);
          await axios.post(DISCORD_WEBHOOK_URL, payload, {
            headers: { 'Content-Type': 'application/json' }
          });
          res.status(200).send('Alert forwarded to Discord');
        } catch (error) {
          console.error('Error sending alert to Discord:', error.response?.data || error.message);
          res.status(500).send('Failed to send alert to Discord');
        }
      });

      app.get('/alertmanager', (req, res) => {
        console.log('GET /alertmanager called');
        res.send('Alertmanager webhook server is running');
      });

      const PORT = process.env.PORT || 3002;
      app.listen(PORT, () => {
        console.log(`Alertmanager webhook server listening on port ${PORT}`);
      });

- name: Check if Node.js 20 is installed
  ansible.builtin.command: node -v
  register: middleware_node_version_check
  ignore_errors: true
  changed_when: false


- name: Download NodeSource Node.js 20 setup script
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/setup_20.x
    dest: /tmp/setup_node_20.sh
    mode: '0755'
  when: middleware_node_version_check.rc != 0
        or middleware_node_version_check.stdout is not search("^v20\.")


- name: Run NodeSource Node.js 20 setup script
  ansible.builtin.command: /bin/bash /tmp/setup_node_20.sh
  become: true
  changed_when: true
  when: middleware_node_version_check.rc != 0
        or middleware_node_version_check.stdout is not search("^v20\.")

- name: Install Node.js 20
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true
  become: true


- name: Initialize npm project
  ansible.builtin.command:
    cmd: npm init -y
    chdir: "{{ app_dir }}"
    creates: "{{ app_dir }}/package.json"
  environment:
    HOME: "/root"


- name: Install required npm packages
  ansible.builtin.command:
    cmd: npm install express axios
    chdir: "{{ app_dir }}"
    creates: "{{ app_dir }}/node_modules"
  environment:
    HOME: "/root"

- name: Install pm2 globally
  community.general.npm:
    name: pm2
    global: true
  changed_when: false

- name: Start the app with pm2
  ansible.builtin.command: pm2 start server.js --name alert-forwarder --update-env
  args:
    chdir: "{{ app_dir }}"
    creates: "/root/.pm2/pids/alert-forwarder.pid"
  environment:
    DISCORD_WEBHOOK_URL: "{{ lookup('env', 'DISCORD_WEBHOOK_URL') }}"
  become: true


- name: Save pm2 process list
  ansible.builtin.command: pm2 save
  register: middleware_pm2_save
  changed_when: "'Dumping process list' in middleware_pm2_save.stdout"

- name: Enable pm2 to start on boot
  ansible.builtin.command: pm2 startup systemd -u root --hp /root
  args:
    creates: /etc/systemd/system/pm2-root.service
