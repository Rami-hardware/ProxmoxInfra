---
- name: Install runner dependencies
  ansible.builtin.apt:
    name: "{{ ci_runner_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create runner group
  ansible.builtin.group:
    name: "{{ ci_runner_group }}"

# CI steps call sudo (docker, apt-get) and Ansible uses become on the
# controller (this host).
- name: Allow runner users passwordless sudo
  ansible.builtin.template:
    src: sudoers-runner.j2
    dest: /etc/sudoers.d/ci-runners
    owner: root
    group: root
    mode: '0440'
    validate: visudo -cf %s

- name: Install kubectl
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ ci_runner_kubectl_version }}/bin/linux/amd64/kubectl"
    checksum: "sha256:https://dl.k8s.io/release/{{ ci_runner_kubectl_version }}/bin/linux/amd64/kubectl.sha256"
    dest: /usr/local/bin/kubectl
    mode: '0755'

# CI runs kubectl (ArgoCD dry runs, the cloudflared secret) and the Cloudflare
# Terraform backend reads /etc/rancher/k3s/k3s.yaml, the path it has on the
# k3s server itself.
- name: Read k3s kubeconfig from the server
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  delegate_to: git-k3s-server
  register: ci_runner_k3s_kubeconfig
  no_log: true

- name: Create k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'

# Shared by every instance (group-readable) — the Cloudflare Terraform
# backend reads this exact path.
- name: Install shared kubeconfig pointing at the k3s server
  ansible.builtin.copy:
    content: "{{ ci_runner_k3s_kubeconfig.content | b64decode | replace('https://127.0.0.1:6443', ci_runner_k3s_api) }}"
    dest: /etc/rancher/k3s/k3s.yaml
    owner: root
    group: "{{ ci_runner_group }}"
    mode: '0640'
  vars:
    ci_runner_k3s_api: "https://{{ hostvars['git-k3s-server']['ansible_host'] }}:6443"
  no_log: true

- name: Install and register each runner instance
  ansible.builtin.include_tasks: instance.yml
  loop: "{{ ci_runner_instances }}"
  loop_control:
    loop_var: ci_runner_instance
