---
- name: Install and register the runner
  ansible.builtin.include_tasks: install.yml

- name: Install CI runner cleanup script
  ansible.builtin.template:
    src: ci-runner-cleanup.sh.j2
    dest: /usr/local/sbin/ci-runner-cleanup
    mode: '0755'

- name: Install CI runner cleanup service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: '0644'
  loop:
    - ci-runner-cleanup.service
    - ci-runner-cleanup.timer
  notify: Reload systemd

- name: Flush handlers so systemd sees the new timer
  ansible.builtin.meta: flush_handlers

- name: Enable CI runner cleanup timer
  ansible.builtin.systemd:
    name: ci-runner-cleanup.timer
    enabled: true
    state: started
