- name: Get host hostname
  ansible.builtin.command: hostname
  register: host_name_result

- name: Ensure Promtail config directory exists
  ansible.builtin.file:
    path: /opt/services/promtail
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Create .env file for Docker Compose
  ansible.builtin.copy:
    dest: /opt/services/promtail/.env
    content: "HOSTNAME={{ host_name_result.stdout }}\n"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

- name: Create Promtail config file
  ansible.builtin.copy:
    dest: /opt/services/promtail/config.yml
    content: |
      server:
        http_listen_port: 9080
        grpc_listen_port: 0

      positions:
        filename: /tmp/positions.yaml

      clients:
        - url: http://192.168.1.203:3100/loki/api/v1/push

      scrape_configs:
        - job_name: samba-logs
          static_configs:
            - targets: ['localhost']
              labels:
                job: samba
                host: ${HOSTNAME}
                __path__: /var/log/samba/*.log

        - job_name: docker-logs
          static_configs:
            - targets: ['localhost']
              labels:
                job: docker
                host: ${HOSTNAME}
                __path__: /var/log/containers/*.log

        - job_name: system
          static_configs:
            - targets: ['localhost']
              labels:
                job: varlogs
                host: ${HOSTNAME}
                __path__: /var/log/{syslog,*.log}
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

- name: Start Promtail via Docker Compose
  ansible.builtin.command: docker-compose -f /opt/services/promtail/docker-compose.yml up -d
  args:
    chdir: /opt/services/promtail
