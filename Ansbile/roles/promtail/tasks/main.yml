- name: Set Promtail hostname fact
  ansible.builtin.set_fact:
    promtail_hostname: "{{ ansible_hostname }}"

- name: Ensure Promtail config directory exists
  ansible.builtin.file:
    path: "{{ promtail_config_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Create .env file for Docker Compose
  ansible.builtin.copy:
    dest: "{{ promtail_config_dir }}/.env"
    content: "HOSTNAME={{ promtail_hostname }}\n"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

- name: Create Promtail config file
  ansible.builtin.copy:
    dest: "{{ promtail_config_dir }}/config.yml"
    content: |
      server:
        http_listen_port: 9080
        grpc_listen_port: 0

      positions:
        filename: /tmp/positions.yaml

      clients:
        - url: {{ promtail_loki_url }}

      scrape_configs:
        - job_name: samba-logs
          static_configs:
            - targets: ['localhost']
              labels:
                job: samba
                host: ${HOSTNAME}
                __path__: /var/log/samba/*.log

        - job_name: docker-logs
          static_configs:
            - targets: ['localhost']
              labels:
                job: docker
                host: ${HOSTNAME}
                __path__: /var/log/containers/*.log

        - job_name: system
          static_configs:
            - targets: ['localhost']
              labels:
                job: varlogs
                host: ${HOSTNAME}
                __path__: /var/log/{syslog,*.log}
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
