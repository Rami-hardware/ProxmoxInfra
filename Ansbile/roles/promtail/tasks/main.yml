- name: Set Promtail hostname fact
  ansible.builtin.set_fact:
    promtail_hostname: "{{ ansible_facts['hostname'] }}"
- name: Ensure Promtail config directory exists
  ansible.builtin.file:
    path: /opt/services/promtail
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
- name: Create .env file for Docker Compose
  ansible.builtin.copy:
    dest: /opt/services/promtail/.env
    content: "HOST_HOSTNAME={{ promtail_hostname }}\n"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
- name: Create Promtail config file
  ansible.builtin.copy:
    dest: /opt/services/promtail/config.yml
    content: |
      server:
        http_listen_port: 9080
        grpc_listen_port: 0

      positions:
        filename: /tmp/positions.yaml

      clients:
        - url: http://192.168.1.203:3100/loki/api/v1/push

      scrape_configs:
        - job_name: samba-logs
          static_configs:
            - targets: ['localhost']
              labels:
                job: samba
                host: ${HOST_HOSTNAME}
                __path__: /var/log/samba/*.log

        - job_name: docker
          pipeline_stages:
            - docker: {}
          static_configs:
            - targets:
                - localhost
              labels:
                job: docker
                host: ${HOST_HOSTNAME}
                __path__: /var/lib/docker/containers/*/*-json.log

        - job_name: system
          static_configs:
            - targets: ['localhost']
              labels:
                job: varlogs
                host: ${HOST_HOSTNAME}
                __path__: /var/log/{syslog,*.log}
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
