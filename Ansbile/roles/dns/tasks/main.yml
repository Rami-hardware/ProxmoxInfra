- name: Ensure DNS is set via systemd-resolved (Docker-safe)
  become: true
  block:

    - name: Configure systemd-resolved DNS
      ansible.builtin.blockinfile:
        path: /etc/systemd/resolved.conf
        marker: "# {mark} ANSIBLE MANAGED DNS"
        block: |
          [Resolve]
          # AdGuard is the ONLY global resolver: it is authoritative for
          # *.homelab.lan and forwards public names upstream (Quad9 DoH with
          # plain-UDP fallbacks). Public resolvers must NOT be listed beside
          # it — systemd-resolved accepts their NXDOMAIN for internal names
          # as a valid answer without failing over to AdGuard.
          DNS={{ hostvars['gateway-server']['ansible_host'] }}
          FallbackDNS=1.1.1.1 8.8.8.8
          Domains=~homelab.lan
          DNSStubListener=yes
        backup: true

    - name: Restart systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
        enabled: true

    - name: Ensure /etc/resolv.conf points to systemd-resolved stub
      # The stub (127.0.0.53), not the uplink file: only the stub routes
      # ~homelab.lan to AdGuard. The uplink file flattens all servers into
      # one ordered list, and glibc stops at the first answer — public
      # resolvers would again NXDOMAIN internal names.
      ansible.builtin.file:
        src: /run/systemd/resolve/stub-resolv.conf
        dest: /etc/resolv.conf
        state: link
        force: true
