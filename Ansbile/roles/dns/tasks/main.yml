- name: Ensure DNS is set via systemd-resolved (Docker-safe)
  become: true
  block:

    - name: Configure systemd-resolved DNS
      ansible.builtin.blockinfile:
        path: /etc/systemd/resolved.conf
        marker: "# {mark} ANSIBLE MANAGED DNS"
        block: |
          [Resolve]
          # AdGuard first: it is authoritative for *.homelab.lan, so public
          # resolvers alone make every internal hostname NXDOMAIN.
          DNS={{ internal_dns | default('192.168.10.200') }}
          FallbackDNS=1.1.1.1 8.8.8.8
          Domains=~homelab.lan
          DNSStubListener=yes
        backup: true

    - name: Restart systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
        enabled: true

    - name: Ensure /etc/resolv.conf points to systemd-resolved (NON-stub)
      ansible.builtin.file:
        src: /run/systemd/resolve/resolv.conf
        dest: /etc/resolv.conf
        state: link
        force: true
