---
# Exists on the cloud-init VMs, not on the minimal LXC template.
- name: Ensure apt-daily-upgrade timer drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/apt-daily-upgrade.timer.d
    state: directory
    mode: '0755'

- name: Pin unattended-upgrades install window to 10:00 local (07:00 UTC; VMs run UTC)
  ansible.builtin.template:
    src: apt-daily-upgrade-override.conf.j2
    dest: /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf
    mode: '0644'
  notify: Restart apt-daily-upgrade timer

- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: '0755'

- name: Cap systemd-journal size (default 10% of root fs is too much on small VMs)
  ansible.builtin.template:
    src: journald-size-cap.conf.j2
    dest: /etc/systemd/journald.conf.d/00-size-cap.conf
    mode: '0644'
  notify: Restart systemd-journald

# Validated with `sshd -t` before it replaces anything, so a bad line can't
# lock Ansible out.
- name: Enforce key-only SSH
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd
