---
# Who may use the admin-only services (`admin_only: true` in
# nginx_services_local: no login of their own): the home LAN only — never
# the public internet (Cloudflare tunnel) or a VPN range. Keep in sync with
# argocd-apps/components/mesh-network-policy (allow-admin-api).
nginx_config_admin_clients:
  - 192.168.10.0/24

# Admin clients + the pod network (blackbox-exporter probes these URLs).
nginx_config_admin_source_ranges: "{{ nginx_config_admin_clients + ['10.42.0.0/16'] }}"

# Image of the ca-cert pod (serves the local CA at http://ca.homelab.lan).
# renovate: datasource=docker depName=nginx
nginx_config_ca_nginx_version: "1.31.4-alpine"
