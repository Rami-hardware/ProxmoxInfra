- name: Deploy main nginx.conf
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /opt/nginx/conf/nginx.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx container

- name: Deploy proxy common snippet
  ansible.builtin.template:
    src: proxy-common.conf.j2
    dest: /opt/nginx/conf/snippets/proxy-common.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx container

- name: Deploy vhosts config
  ansible.builtin.template:
    src: vhosts.j2
    dest: /opt/nginx/conf/conf.d/services.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx container

- name: Test nginx config inside container
  ansible.builtin.command: docker exec nginx nginx -t
  register: nginx_config_test
  changed_when: false
  failed_when: nginx_config_test.rc != 0

- name: Reload nginx container
  ansible.builtin.command: docker exec nginx nginx -s reload
  changed_when: false
