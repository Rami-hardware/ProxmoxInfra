- name: Remove wrongly created nginx config files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /opt/services/default.conf
    - /opt/services/authelia.conf


- name: Ensure /opt/services exists
  ansible.builtin.file:
    path: /opt/services
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Deploy Authelia nginx auth snippet
  ansible.builtin.copy:
    dest: /opt/services/uthelia.conf
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
    content: |
      # Authelia auth request endpoint
      location = /authelia {
          internal;
          proxy_pass http://authelia:9091/api/verify;
          proxy_set_header Content-Length "";
          proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $http_host;
          proxy_set_header X-Forwarded-URI $request_uri;
          proxy_set_header X-Forwarded-For $remote_addr;
      }

      error_page 401 =302 https://auth.respawnxd.co/?rd=$scheme://$http_host$request_uri;

- name: Deploy Nginx reverse proxy config
  ansible.builtin.copy:
    dest: /opt/services/default.conf
    content: |
      server {
          listen 81 default_server;
          listen [::]:81 default_server;

          root /var/www/html;
          index index.html index.htm index.nginx-debian.html;

          server_name _;

          location / {
              try_files $uri $uri/ =404;
          }

          location /nginx_status {
              stub_status;
              allow 127.0.0.1;
              deny all;
          }
      }

      server {
          listen 80;
          server_name portainer.respawnxd.co;
          location / {
              proxy_pass http://192.168.1.200:9000;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }

      server {
          listen 80;
          server_name adguard.respawnxd.co;

          location / {
              proxy_pass http://192.168.1.200:8081;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }

      server {
          listen 80;
          server_name jellyfin.respawnxd.co;

          location / {
              auth_request /authelia;
              include /etc/nginx/snippets/authelia.conf;
              proxy_pass http://192.168.1.201:8096;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }

      server {
          listen 80;
          server_name overseerr.respawnxd.co;

          location / {
              proxy_pass http://192.168.1.201:5055;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }

      server {
          listen 80;
          server_name bazarr.respawnxd.co;

          location / {
              proxy_pass http://192.168.1.201:6767;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }

      server {
          listen 80;
          server_name qbittorrent.respawnxd.co;

          location / {
              proxy_pass http://192.168.1.201:8080;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }

      server {
          listen 80;
          server_name amp.respawnxd.co;

          location / {
              proxy_pass http://192.168.1.202:8080;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }
      server {
            server_name auth.respawnxd.co;
            location / {
                proxy_pass http://192.168.1.205:9091;
            }
        }
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  notify:
    - Reload nginx container

