- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Ensure snippets directory exists
  ansible.builtin.file:
    path: /etc/nginx/snippets
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy proxy common snippet
  ansible.builtin.template:
    src: proxy-common.conf.j2
    dest: /etc/nginx/snippets/proxy-common.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Deploy vhosts config
  ansible.builtin.template:
    src: vhosts.j2
    dest: /etc/nginx/sites-available/services.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable services site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/services.conf
    dest: /etc/nginx/sites-enabled/services.conf
    state: link
    force: true
  notify: Reload nginx

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
