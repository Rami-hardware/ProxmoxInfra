---
# ── Local CA (cert-manager homelab-ca-issuer, ca.homelab.lan) ────────────────
- name: Ensure local TLS working directory exists
  ansible.builtin.file:
    path: /opt/k3s/local-tls
    state: directory
    owner: root
    group: root
    mode: "0700"
  delegate_to: git-k3s-server

- name: Generate local CA private key
  community.crypto.openssl_privatekey:
    path: /opt/k3s/local-tls/ca.key
    size: 4096
    mode: "0600"
  delegate_to: git-k3s-server

- name: Generate local CA CSR
  community.crypto.openssl_csr:
    path: /opt/k3s/local-tls/ca.csr
    privatekey_path: /opt/k3s/local-tls/ca.key
    common_name: Local Homelab CA
    organization_name: Homelab
    basic_constraints:
      - "CA:TRUE"
    basic_constraints_critical: true
    mode: "0600"
  delegate_to: git-k3s-server

- name: Generate local CA certificate
  community.crypto.x509_certificate:
    path: /opt/k3s/local-tls/ca.crt
    privatekey_path: /opt/k3s/local-tls/ca.key
    csr_path: /opt/k3s/local-tls/ca.csr
    provider: selfsigned
    selfsigned_not_after: "+3650d"
    mode: "0644"
  delegate_to: git-k3s-server

- name: Read local CA cert
  ansible.builtin.slurp:
    src: /opt/k3s/local-tls/ca.crt
  register: nginx_config_local_ca_crt
  delegate_to: git-k3s-server

- name: Ensure ingress namespaces exist
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      k3s kubectl create namespace {{ ns_item }} --dry-run=client -o yaml | k3s kubectl apply -f -
    executable: /bin/bash
  delegate_to: git-k3s-server
  changed_when: false
  loop: >-
    {{ (
      nginx_services_local | map(attribute='namespace') | list +
      nginx_services       | map(attribute='namespace') | list +
      nginx_config_extra_namespaces | default([])
    ) | unique | list }}
  loop_control:
    loop_var: ns_item

- name: Ensure k3s ingress manifests directory exists
  ansible.builtin.file:
    path: /opt/k3s/manifests
    state: directory
    owner: root
    group: root
    mode: "0755"
  delegate_to: git-k3s-server

- name: Template ingress-services manifest
  ansible.builtin.template:
    src: ingress-services.yml.j2
    dest: /opt/k3s/manifests/ingress-services.yml
    owner: root
    group: root
    mode: "0644"
  delegate_to: git-k3s-server

- name: Apply ingress-services manifest
  ansible.builtin.command: >
    k3s kubectl apply --server-side --force-conflicts
    -f /opt/k3s/manifests/ingress-services.yml
  changed_when: true
  delegate_to: git-k3s-server

# Routes that moved from a node-IP -ext Service to the app's own Service
# leave their old headless -ext Service behind (apply never prunes). Runs
# after the apply, so no ingress points at a deleted Service. Its Endpoints
# go with it.
- name: Remove -ext Services of routes that now use the app's Service
  ansible.builtin.command: >
    k3s kubectl delete service {{ item.k8s_service | default(item.name) }}-ext
    -n {{ item.namespace | default('media') }} --ignore-not-found
  loop: "{{ (nginx_services_local + nginx_services) | rejectattr('ip', 'defined') | list }}"
  loop_control:
    label: "{{ item.namespace | default('media') }}/{{ item.k8s_service | default(item.name) }}-ext"
  register: nginx_config_ext_cleanup
  changed_when: "'deleted' in nginx_config_ext_cleanup.stdout"
  delegate_to: git-k3s-server

# ── Publish CA cert to a world-readable path for easy scp/curl ───────────────
# Unused TLS leftovers: no ingress references these. Every ingress gets its
# own cert-manager certificate (homelab-ca-issuer, or the Let's Encrypt
# wildcard for the public names).
- name: Remove unused local-tls and cloudflare-origin-tls secrets
  ansible.builtin.command: >
    k3s kubectl delete secret local-tls cloudflare-origin-tls
    -n {{ item }} --ignore-not-found
  loop: [argocd, istio-system, media, monitoring, network]
  register: nginx_config_old_tls
  changed_when: "'deleted' in nginx_config_old_tls.stdout"
  delegate_to: git-k3s-server

- name: Remove the unused letsencrypt-cloudflare ClusterIssuer and its account key
  ansible.builtin.shell:
    cmd: |
      k3s kubectl delete clusterissuer letsencrypt-cloudflare --ignore-not-found
      k3s kubectl delete secret letsencrypt-cloudflare-key -n cert-manager --ignore-not-found
  register: nginx_config_old_issuer
  changed_when: "'deleted' in nginx_config_old_issuer.stdout"
  delegate_to: git-k3s-server

- name: Remove the old local wildcard cert files
  ansible.builtin.file:
    path: "/opt/k3s/local-tls/{{ item }}"
    state: absent
  loop: [local.key, local.csr, local.crt]
  delegate_to: git-k3s-server

- name: Publish CA cert to world-readable path
  ansible.builtin.copy:
    content: "{{ nginx_config_local_ca_crt.content | b64decode }}"
    dest: /opt/k3s/local-ca.crt
    owner: root
    group: root
    mode: "0644"
  delegate_to: git-k3s-server

# ── Distribute CA to every managed host ──────────────────────────────────────
- name: Install CA cert on managed hosts
  ansible.builtin.copy:
    content: "{{ nginx_config_local_ca_crt.content | b64decode }}"
    dest: /usr/local/share/ca-certificates/homelab-local-ca.crt
    owner: root
    group: root
    mode: "0644"
  delegate_to: "{{ nginx_config_host }}"
  become: true
  ignore_unreachable: true
  loop: "{{ groups['all'] | difference(['host-node']) }}"
  loop_control:
    loop_var: nginx_config_host
  register: nginx_config_ca_install

- name: Update CA trust store on managed hosts
  ansible.builtin.command: update-ca-certificates
  delegate_to: "{{ nginx_config_host }}"
  become: true
  changed_when: true
  ignore_unreachable: true
  loop: "{{ nginx_config_ca_install.results | selectattr('changed', 'defined') | selectattr('changed') | map(attribute='nginx_config_host') | list }}"
  loop_control:
    loop_var: nginx_config_host

# ── Auto-trust CA on Ansible controller ──────────────────────────────────────
- name: Write CA cert to controller
  ansible.builtin.copy:
    content: "{{ nginx_config_local_ca_crt.content | b64decode }}"
    dest: /usr/local/share/ca-certificates/homelab-local-ca.crt
    mode: "0644"
  delegate_to: localhost
  become: true
  register: nginx_config_ca_controller

- name: Update CA trust store on controller
  ansible.builtin.command: update-ca-certificates
  delegate_to: localhost
  become: true
  changed_when: true
  when: nginx_config_ca_controller is changed
