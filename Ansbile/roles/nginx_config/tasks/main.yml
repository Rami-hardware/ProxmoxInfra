- name: Remove wrongly created default.conf directory if it exists
  ansible.builtin.file:
    path: /opt/services/default.conf
    state: absent

- name: Deploy Nginx reverse proxy config
  ansible.builtin.copy:
    dest: /opt/services/default.conf
    content: |
      server {
          listen 81 default_server;
          listen [::]:81 default_server;

          root /var/www/html;
          index index.html index.htm index.nginx-debian.html;

          server_name _;

          location / {
              try_files $uri $uri/ =404;
          }

          location /nginx_status {
              stub_status;
              allow 127.0.0.1;
              deny all;
          }
      }

      server {
          listen 80;
          server_name uptime.respawnxd.co;

          location / {
              proxy_pass http://192.168.1.200:3001;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }

      server {
          listen 80;
          server_name portainer.respawnxd.co;

          location / {
              proxy_pass http://192.168.1.200:9000;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }

      server {
          listen 80;
          server_name adguard.respawnxd.co;

          location / {
              proxy_pass http://192.168.1.200:8081;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }

      server {
          listen 80;
          server_name jellyfin.respawnxd.co;
          access_log /var/log/nginx/access.log;
          error_log  /var/log/nginx/error.log warn;
          location / {
              proxy_pass http://192.168.1.201:8096;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }

      server {
          listen 80;
          server_name overseerr.respawnxd.co;

          location / {
              proxy_pass http://192.168.1.201:5055;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }

      server {
          listen 80;
          server_name bazarr.respawnxd.co;

          location / {
              proxy_pass http://192.168.1.201:6767;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }

      server {
          listen 80;
          server_name qbittorrent.respawnxd.co;

          location / {
              proxy_pass http://192.168.1.201:8080;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }

      server {
          listen 80;
          server_name amp.respawnxd.co;

          location / {
              proxy_pass http://192.168.1.202:8080;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }
    owner: root
    group: root
    mode: '0644'

  notify:
    - Reload nginx container

- name: Stop systemd-resolved service
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: false

- name: Remove /etc/resolv.conf
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent

- name: Create new resolv.conf pointing to AdGuard
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    owner: 1000
    group: 1000
    mode: '0700'
    content: |
      nameserver 127.0.0.1
      options edns0
      nameserver {{ fallback_dns }}

- name: Fix AdGuard config directory permissions
  ansible.builtin.file:
    path: /var/lib/docker/volumes/docker_adguard_config/_data
    owner: 1000
    group: 1000
    mode: '0700'
    recurse: true
    state: directory

- name: Fix file permissions inside AdGuard config
  ansible.builtin.find:
    paths: /var/lib/docker/volumes/docker_adguard_config/_data
    file_type: file
  register: adguard_config_files

- name: Set correct permissions on config files
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: 1000
    group: 1000
    mode: '0600'
  loop: "{{ adguard_config_files.files }}"

- name: Fix AdGuard work directory permissions
  ansible.builtin.file:
    path: /var/lib/docker/volumes/docker_adguard_work/_data
    owner: 1000
    group: 1000
    mode: '0700'
    recurse: true
    state: directory

- name: Fix file permissions inside AdGuard work
  ansible.builtin.find:
    paths: /var/lib/docker/volumes/docker_adguard_work/_data
    file_type: file
  register: adguard_work_files

- name: Set correct permissions on work files
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: 1000
    group: 1000
    mode: '0600'
  loop: "{{ adguard_work_files.files }}"

  notify:
    - Reload adguardhome container
