- name: Ensure nginx cert directory exists
  ansible.builtin.file:
    path: /opt/nginx/certs
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy Cloudflare origin certificate
  ansible.builtin.copy:
    src: origin.pem
    dest: /opt/nginx/certs/origin.pem
    owner: root
    group: root
    mode: "0644"

- name: Deploy Cloudflare origin private key
  ansible.builtin.copy:
    src: origin.key
    dest: /opt/nginx/certs/origin.key
    owner: root
    group: root
    mode: "0600"


- name: Ensure nginx config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/nginx/conf
    - /opt/nginx/conf/snippets
    - /opt/nginx/conf/conf.d
    - /opt/nginx/logs


- name: Deploy main nginx.conf
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /opt/nginx/conf/nginx.conf
    owner: root
    group: root
    mode: "0644"

- name: Deploy proxy common snippet
  ansible.builtin.template:
    src: proxy-common.conf.j2
    dest: /opt/nginx/conf/snippets/proxy-common.conf
    owner: root
    group: root
    mode: "0644"


- name: Deploy vhosts config
  ansible.builtin.template:
    src: vhosts.j2
    dest: /opt/nginx/conf/conf.d/services.conf
    owner: root
    group: root
    mode: "0644"


# TLS secret for public ingress (Cloudflare origin cert) — one per namespace
- name: Slurp origin cert from gateway-server
  ansible.builtin.slurp:
    src: /opt/nginx/certs/origin.pem
  register: nginx_config_origin_cert

- name: Slurp origin key from gateway-server
  ansible.builtin.slurp:
    src: /opt/nginx/certs/origin.key
  register: nginx_config_origin_key

- name: Copy origin cert to k3s control plane
  ansible.builtin.copy:
    content: "{{ nginx_config_origin_cert.content | b64decode }}"
    dest: /tmp/cloudflare-origin.pem
    mode: "0600"
  delegate_to: git-k3s-server

- name: Copy origin key to k3s control plane
  ansible.builtin.copy:
    content: "{{ nginx_config_origin_key.content | b64decode }}"
    dest: /tmp/cloudflare-origin.key
    mode: "0600"
  delegate_to: git-k3s-server

- name: Create cloudflare-origin-tls secret in each public service namespace
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      k3s kubectl create secret tls cloudflare-origin-tls \
        --cert=/tmp/cloudflare-origin.pem \
        --key=/tmp/cloudflare-origin.key \
        -n {{ item }} \
        --dry-run=client -o yaml | k3s kubectl apply -f -
    executable: /bin/bash
  loop: "{{ nginx_services | map(attribute='namespace') | unique | list }}"
  changed_when: true
  delegate_to: git-k3s-server

- name: Remove temp cert files from k3s control plane
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/cloudflare-origin.pem
    - /tmp/cloudflare-origin.key
  delegate_to: git-k3s-server


# Kubernetes Ingress resources for all services
- name: Ensure k3s manifests directory exists on control plane
  ansible.builtin.file:
    path: /opt/k3s/manifests
    state: directory
    owner: root
    group: root
    mode: "0755"
  delegate_to: git-k3s-server

- name: Template ingress-services manifest onto control plane
  ansible.builtin.template:
    src: ingress-services.yml.j2
    dest: /opt/k3s/manifests/ingress-services.yml
    owner: root
    group: root
    mode: "0644"
  delegate_to: git-k3s-server

- name: Apply ingress-services manifest
  ansible.builtin.command: >
    k3s kubectl apply --server-side --force-conflicts
    -f /opt/k3s/manifests/ingress-services.yml
  changed_when: true
  delegate_to: git-k3s-server
