---
- name: Ensure Grafana data directory exists
  ansible.builtin.file:
    path: "{{ grafana_data_dir }}"
    state: directory
    mode: '0755'

- name: Ensure Grafana provisioning datasources directory exists
  ansible.builtin.file:
    path: "{{ grafana_provisioning_dir }}"
    state: directory
    mode: '0755'

- name: Template Grafana datasources provisioning
  ansible.builtin.template:
    src: datasources.yml.j2
    dest: "{{ grafana_provisioning_dir }}/datasources.yml"
    mode: '0644'
  notify: Restart Grafana

- name: Set ownership of Grafana data directory to UID 472
  ansible.builtin.file:
    path: "{{ grafana_data_dir }}"
    owner: 472
    group: 472
    recurse: true

# Dashboards as code — JSONs live in the repo (files/dashboards/) and are
# provisioned into the folder "Homelab" on startup. allowUiUpdates stays on,
# so UI edits work; they just don't flow back to git.
- name: Ensure Grafana dashboards provisioning directory exists
  ansible.builtin.file:
    path: "{{ grafana_provisioning_dir | dirname }}/dashboards"
    state: directory
    mode: '0755'

- name: Provision Grafana dashboard provider
  ansible.builtin.template:
    src: dashboards-provider.yml.j2
    dest: "{{ grafana_provisioning_dir | dirname }}/dashboards/provider.yml"
    mode: '0644'

- name: Provision Grafana dashboards from repo
  ansible.builtin.copy:
    src: dashboards/
    dest: "{{ grafana_provisioning_dir | dirname }}/dashboards/"
    mode: '0644'

# copy only adds files; a dashboard removed from the repo must also leave the
# host, or Grafana keeps provisioning it.
- name: Find provisioned dashboard files
  ansible.builtin.find:
    paths: "{{ grafana_provisioning_dir | dirname }}/dashboards"
    patterns: "*.json"
  register: grafana_provisioned_dashboards

- name: Remove dashboards that are no longer in the repo
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ grafana_provisioned_dashboards.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename) not in (lookup('ansible.builtin.fileglob', role_path ~ '/files/dashboards/*.json', wantlist=True) | map('basename') | list)
