---
- name: Ensure Grafana data directory exists
  ansible.builtin.file:
    path: "{{ grafana_data_dir }}"
    state: directory
    mode: '0755'

- name: Ensure Grafana provisioning datasources directory exists
  ansible.builtin.file:
    path: "{{ grafana_provisioning_dir }}"
    state: directory
    mode: '0755'

- name: Template Grafana datasources provisioning
  ansible.builtin.template:
    src: datasources.yml.j2
    dest: "{{ grafana_provisioning_dir }}/datasources.yml"
    mode: '0644'

- name: Set ownership of Grafana data directory to UID 472
  ansible.builtin.file:
    path: "{{ grafana_data_dir }}"
    owner: 472
    group: 472
    recurse: true
