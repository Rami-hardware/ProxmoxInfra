# The DNS swap is only needed to install ufw (AdGuard may not be up yet on a
# fresh host). Doing it every run briefly pointed the gateway at public DNS,
# which can't resolve homelab.lan.
- name: Check whether UFW is installed
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: ufw_binary

- name: Temporarily use public DNS for package installation
  when: not ufw_binary.stat.exists
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      nameserver 1.1.1.1
      nameserver 8.8.8.8
    owner: root
    group: root
    mode: '0644'

- name: Ensure UFW is installed
  when: not ufw_binary.stat.exists
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Restore resolv.conf to AdGuard
  when: not ufw_binary.stat.exists
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      nameserver 127.0.0.1
      options edns0
      nameserver {{ fallback_dns | default('1.1.1.1') }}
    owner: root
    group: root
    mode: '0644'

- name: Allow SSH
  community.general.ufw:
    rule: allow
    name: OpenSSH
  failed_when: false
- name: Allow TCP ports for services
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ service_tcp_ports | default([]) }}"
- name: Allow UDP ports for services
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: udp
  loop: "{{ service_udp_ports | default([]) }}"
# Metrics ports only Prometheus may reach. Its scrapes of another node
# arrive from monitoring-server's IP (source-NATed), not the pod network.
- name: Allow Prometheus to scrape metrics ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    src: "{{ hostvars['monitoring-server']['ansible_host'] }}"
    comment: prometheus scrape
  loop: "{{ ufw_prometheus_ports | default([]) }}"

# Promtail's metrics port, open to anyone; Promtail was replaced by Alloy.
- name: Remove the old Promtail port rules
  community.general.ufw:
    rule: allow
    port: "9080"
    proto: "{{ item }}"
    delete: true
  loop: [tcp, udp, any]

- name: Allow Falco metrics scraping
  community.general.ufw:
    rule: allow
    port: "8765"
    proto: tcp

- name: Allow K3s pod network
  community.general.ufw:
    rule: allow
    src: 10.42.0.0/16

- name: Allow K3s service network
  community.general.ufw:
    rule: allow
    src: 10.43.0.0/16

- name: Allow K3s Flannel VXLAN traffic between nodes
  community.general.ufw:
    rule: allow
    port: "8472"
    proto: udp

- name: Allow MetalLB speaker memberlist traffic between nodes (TCP)
  community.general.ufw:
    rule: allow
    port: "7946"
    proto: tcp

- name: Allow MetalLB speaker memberlist traffic between nodes (UDP)
  community.general.ufw:
    rule: allow
    port: "7946"
    proto: udp

- name: Set UFW forward policy to accept for K3s pod routing
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'
  register: ufw_forward_policy

- name: Enable UFW (if not already)
  community.general.ufw:
    state: enabled
    policy: deny
