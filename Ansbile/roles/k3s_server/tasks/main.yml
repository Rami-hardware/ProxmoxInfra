---
# ── K3s Configuration (runs before install so first-boot picks it up) ─────────
- name: Ensure K3s config directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'

- name: Write K3s DNS resolv.conf
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/resolv.conf
    content: |
      nameserver {{ hostvars['gateway-server']['ansible_host'] }}
      nameserver {{ k3s_server_public_dns_fallback }}
    mode: '0644'
  register: k3s_server_resolv_conf_result
  notify: Restart k3s

- name: Write K3s server config
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    content: |
      service-node-port-range: "1024-65535"
      resolv-conf: /etc/rancher/k3s/resolv.conf
      disable:
        - traefik
        - servicelb
    mode: '0644'
  register: k3s_server_config_result
  notify: Restart k3s

# ── System Prerequisites ──────────────────────────────────────────────────────
- name: Gather system facts
  ansible.builtin.setup:

- name: Check if swap is enabled
  ansible.builtin.command: swapon --noheadings
  register: k3s_server_swap_status
  changed_when: false
  failed_when: false

- name: Disable swap immediately if enabled
  ansible.builtin.command: swapoff -a
  when: k3s_server_swap_status.stdout != ""
  changed_when: k3s_server_swap_status.stdout != ""

- name: Disable swap permanently in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(?!#)(.*\sswap\s.*)$'
    replace: '# \1'
  register: k3s_server_swap_fstab

- name: Ensure curl is installed
  ansible.builtin.package:
    name: curl
    state: present

# ── K3s Install ───────────────────────────────────────────────────────────────
- name: Download K3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: '0755'

- name: Install K3s server if not already installed
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s-install.sh
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_server_version }}"

# Flush here so K3s restarts (if config changed) before we check CoreDNS
- name: Flush handlers
  ansible.builtin.meta: flush_handlers

# ── Post-install: Ensure DNS is healthy before apps deploy ────────────────────
- name: Wait for K3s API to be available
  ansible.builtin.command:
    cmd: k3s kubectl get nodes
  register: k3s_server_api_check
  until: k3s_server_api_check.rc == 0
  retries: 30
  delay: 5
  changed_when: false

# AdGuard (gateway) is authoritative for *.homelab.lan — forwarding to public
# resolvers would make every internal hostname NXDOMAIN for pods.
- name: Wait for CoreDNS configmap to exist
  ansible.builtin.command:
    cmd: k3s kubectl get configmap coredns -n kube-system
  register: k3s_server_coredns_cm_check
  until: k3s_server_coredns_cm_check.rc == 0
  retries: 24
  delay: 5
  changed_when: false

- name: Stage CoreDNS internal zone override
  ansible.builtin.template:
    src: homelab.server.j2
    dest: /etc/rancher/k3s/coredns-custom/homelab.server
    mode: '0644'
  register: k3s_server_coredns_zone_stage

# *.override files can't hold a second forward plugin (duplicate plugin in the
# default server block), and *.server blocks are never touched by k3s addon
# reconciliation — so the internal zone lives in coredns-custom and survives
# k3s re-applying the coredns configmap on upgrades.
# NOTE: this manages the whole coredns-custom data map — add more zone files to
# the template dir and this task, not by hand.
- name: Apply CoreDNS internal zone configmap
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      k3s kubectl create configmap coredns-custom -n kube-system \
        --from-file=homelab.server=/etc/rancher/k3s/coredns-custom/homelab.server \
        --dry-run=client -o yaml | k3s kubectl apply -f -
    executable: /bin/bash
  register: k3s_server_coredns_custom_result
  changed_when: >
    'configured' in k3s_server_coredns_custom_result.stdout
    or 'created' in k3s_server_coredns_custom_result.stdout

# policy sequential: prefer AdGuard, only fall back to public DNS on transport
# failure. The default random policy would send ~50% of homelab.lan queries to
# public resolvers (NXDOMAIN) if both upstreams were listed.
- name: Patch CoreDNS to forward non-cluster DNS to AdGuard on the gateway
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      k3s kubectl get configmap coredns -n kube-system -o yaml | \
        sed 's|forward . /etc/resolv.conf|forward . {{ hostvars['gateway-server']['ansible_host'] }} {{ k3s_server_public_dns_fallback }} {\n    policy sequential\n}|g' | \
        k3s kubectl apply -f -
    executable: /bin/bash
  register: k3s_server_coredns_patch_result
  retries: 12
  delay: 5
  until: k3s_server_coredns_patch_result.rc == 0
  changed_when: "'configured' in k3s_server_coredns_patch_result.stdout"

# k3s addon reconciliation can reset the configmap (upgrade, manifest change)
# and the sed above would then no-op silently — assert the desired state.
- name: Verify CoreDNS forward targets gateway with public fallback
  ansible.builtin.command:
    cmd: k3s kubectl get configmap coredns -n kube-system -o jsonpath='{.data.Corefile}'
  register: k3s_server_coredns_forward_verify
  changed_when: false
  failed_when: >
    'forward . ' ~ hostvars['gateway-server']['ansible_host']
    ~ ' ' ~ k3s_server_public_dns_fallback not in k3s_server_coredns_forward_verify.stdout

- name: Verify CoreDNS internal zone is loaded
  ansible.builtin.command:
    cmd: k3s kubectl get configmap coredns-custom -n kube-system -o jsonpath='{.data.homelab\.server}'
  register: k3s_server_coredns_zone_verify
  changed_when: false
  failed_when: >
    k3s_server_internal_domain ~ ':53' not in k3s_server_coredns_zone_verify.stdout

- name: Restart CoreDNS to apply new forward config
  ansible.builtin.command:
    cmd: k3s kubectl rollout restart deployment/coredns -n kube-system
  changed_when: true
  when: >
    (k3s_server_config_result is defined and k3s_server_config_result.changed)
    or (k3s_server_resolv_conf_result is defined and k3s_server_resolv_conf_result.changed)
    or (k3s_server_coredns_zone_stage is defined and k3s_server_coredns_zone_stage.changed)
    or ('configured' in k3s_server_coredns_patch_result.stdout)
    or ('configured' in k3s_server_coredns_custom_result.stdout)
    or ('created' in k3s_server_coredns_custom_result.stdout)

- name: Wait for CoreDNS to be ready
  ansible.builtin.command:
    cmd: k3s kubectl rollout status deployment/coredns -n kube-system --timeout=60s
  changed_when: false


# ── Helm Install ─────────────────────────────────────────────────────────────
- name: Check if Helm is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/helm
  register: k3s_server_helm_check

- name: Download Helm install script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get-helm-3.sh
    mode: '0755'
  when: not k3s_server_helm_check.stat.exists

- name: Install Helm
  ansible.builtin.command:
    cmd: /tmp/get-helm-3.sh
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: not k3s_server_helm_check.stat.exists
  changed_when: true

- name: Make k3s kubeconfig readable by all users
  ansible.builtin.file:
    path: /etc/rancher/k3s/k3s.yaml
    mode: '0644'

- name: Set KUBECONFIG for all users via /etc/environment
  ansible.builtin.lineinfile:
    path: /etc/environment
    line: 'KUBECONFIG=/etc/rancher/k3s/k3s.yaml'
    regexp: '^KUBECONFIG='
    state: present

- name: Set HELM_REPOSITORY_CONFIG for all users via /etc/environment
  ansible.builtin.lineinfile:
    path: /etc/environment
    line: 'HELM_REPOSITORY_CONFIG=/etc/helm/repositories.yaml'
    regexp: '^HELM_REPOSITORY_CONFIG='
    state: present

- name: Set HELM_REPOSITORY_CACHE for all users via /etc/environment
  ansible.builtin.lineinfile:
    path: /etc/environment
    line: 'HELM_REPOSITORY_CACHE=/etc/helm/cache'
    regexp: '^HELM_REPOSITORY_CACHE='
    state: present

- name: Ensure helm binary is in system PATH for all users
  ansible.builtin.file:
    src: /usr/local/bin/helm
    dest: /usr/bin/helm
    state: link

- name: Verify Helm installation
  ansible.builtin.command: /usr/local/bin/helm version --short
  register: k3s_server_helm_version
  changed_when: false

- name: Show Helm version
  ansible.builtin.debug:
    msg: "Helm installed: {{ k3s_server_helm_version.stdout }}"


# ── Token (used by k3s_agent role) ───────────────────────────────────────────
- name: Check if node token exists
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s/server/node-token
  register: k3s_server_token_file

- name: Read K3s node token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_server_k3s_token_raw
  when: k3s_server_token_file.stat.exists
  changed_when: false

- name: Set K3s token fact
  ansible.builtin.set_fact:
    k3s_server_k3s_token: "{{ k3s_server_k3s_token_raw.content | b64decode | trim }}"
  when: k3s_server_token_file.stat.exists
