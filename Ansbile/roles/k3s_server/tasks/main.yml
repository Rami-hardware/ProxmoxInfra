- name: Ensure curl is installed
  ansible.builtin.package:
    name: curl
    state: present

- name: Download K3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: '0755'
  register: k3s_server_k3s_install_script_download

- name: Ensure K3s install script was downloaded successfully
  ansible.builtin.assert:
    that:
      - k3s_install_script_download is succeeded
    success_msg: "K3s install script was downloaded successfully"
    fail_msg: "Failed to download K3s install script"


- name: Install K3s server if not already installed
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_server_version }}"
  when: not ansible_local.k3s.exists

- name: Read K3s node token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_server_k3s_token_raw
  when: ansible_local.k3s | default(false)

- name: Set K3s token fact
  ansible.builtin.set_fact:
    k3s_server_k3s_token: "{{ k3s_server_k3s_token_raw.content | b64decode | trim }}"
  when: ansible_local.k3s | default(false)
