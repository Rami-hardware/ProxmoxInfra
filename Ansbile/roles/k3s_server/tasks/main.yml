- name: Check if K3S is installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_installation_status
  ignore_errors: true

- name: Install K3S server
  ansible.builtin.unarchive:
    src: https://github.com/k3s-io/k3s/releases/download/v1.20.4+k3s1/k3s
    dest: /usr/local/bin
    remote_src: true
  args:
    creates: /usr/local/bin/k3s
  when: not k3s_installation_status.stat.exists or "'No such file or directory' not in stderr"
