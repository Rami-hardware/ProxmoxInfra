---
k3s_apps_manifest_dir: /opt/k3s/manifests
# Local charts (alert-forwarder) copied from the CI checkout for Helm.
k3s_apps_chart_dir: /opt/k3s/charts
k3s_apps_falco_config_dir: /opt/falco
k3s_apps_metallb_ip_range: "192.168.10.210-192.168.10.220"
k3s_apps_ingress_nginx_ip: "192.168.10.210"
# Nodes that each run one ingress-nginx replica (hostNetwork: ports 80/443
# must be free on them).
k3s_apps_ingress_nodes:
  - git-k3s-server
  - monitoring-server
# Tempo keeps its trace data on this node's local disk.
k3s_apps_tempo_node: git-k3s-server

# alert-forwarder image: CI tags it app-<content hash of its directory> and
# only builds a tag that doesn't exist yet (build-image.yml), so an unchanged
# app keeps its tag and isn't restarted. Runs outside CI fall back to :latest.
k3s_apps_alert_forwarder_image_tag: "{{ lookup('env', 'ALERT_FORWARDER_TAG') | default('latest', true) }}"

# Public domain proxied by Cloudflare. Its wildcard cert (Let's Encrypt,
# DNS-01) is ingress-nginx's default certificate.
k3s_apps_public_domain: darkestserver.com
k3s_apps_public_cert_name: darkestserver-wildcard

# Cloudflare Tunnel connector (templates/cloudflared.yml.j2). Two replicas on
# different nodes keep the public sites up when one node or pod restarts.
# Grafana Alloy log agent (templates/alloy.yml.j2), one per node.
# renovate: datasource=docker depName=grafana/alloy
k3s_apps_alloy_version: "v1.21.3"
# renovate: datasource=docker depName=cloudflare/cloudflared
k3s_apps_cloudflared_version: "2026.10.7"
k3s_apps_cloudflared_replicas: 2
# Nodes whose IP may carry Cloudflare Tunnel traffic to the ingress (any
# node can run a cloudflared pod), trusted for X-Forwarded-For.
k3s_apps_ingress_trusted_nodes:
  - git-k3s-server
  - media-server
  - monitoring-server
  - gateway-server

# Istio chart version (base, istiod, cni, ztunnel must match) and the
# Gateway API release it was built against (istio/istio go.mod).
# renovate: datasource=github-releases depName=istio/istio
k3s_apps_istio_version: "1.30.8"

# Helm charts pinned to what was installed on 2026-11-13 (they used to float to
# the newest chart on every deploy). Bump on purpose.
# renovate: datasource=helm depName=cert-manager registryUrl=https://charts.jetstack.io
k3s_apps_cert_manager_chart_version: "v1.21.3"
# renovate: datasource=helm depName=metallb registryUrl=https://metallb.github.io/metallb
k3s_apps_metallb_chart_version: "0.16.2"
# renovate: datasource=helm depName=ingress-nginx registryUrl=https://kubernetes.github.io/ingress-nginx
k3s_apps_ingress_nginx_chart_version: "4.15.1"
# renovate: datasource=helm depName=argo-cd registryUrl=https://argoproj.github.io/argo-helm
k3s_apps_argocd_chart_version: "10.18.0"
# renovate: datasource=helm depName=argocd-image-updater registryUrl=https://argoproj.github.io/argo-helm
k3s_apps_image_updater_chart_version: "0.8.5"

# helm-diff plugin, used by kubernetes.core.helm to skip unchanged releases.
# Checksum from the release's signed .prov file.
k3s_apps_helm_plugins_dir: /etc/helm/plugins
# renovate: datasource=github-releases depName=databus23/helm-diff
k3s_apps_helm_diff_version: "3.15.15"
k3s_apps_helm_diff_checksum: "sha256:504e99410611daa70702362e1b10dc74929df8a912cb3f6b5d21d1ee9d0cb7d9"
# renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
k3s_apps_gateway_api_version: v1.5.1

# Namespaces in the Istio ambient mesh (ztunnel: mTLS between pods).
# Labelled with kubectl on every run so the label survives ArgoCD re-syncs.
k3s_apps_ambient_namespaces:
  - media
  - monitoring
  - network
# Namespaces that also get a waypoint proxy, for L7 metrics
# (istio_requests_total) and traces between their Services.
k3s_apps_waypoint_namespaces:
  - media

# Every K3s node (host-level tasks delegated to each).
k3s_apps_nodes:
  - git-k3s-server
  - gateway-server
  - media-server
  - monitoring-server

# ── Homarr ────────────────────────────────────────────────────────────────────
# Installed from the upstream Helm chart (homarr-labs/homarr), not from a
# manifest in argocd-apps/. Pinned so a chart release cannot change the
# deployment on an unrelated playbook run.
# renovate: datasource=helm depName=homarr registryUrl=https://homarr-labs.github.io/charts
k3s_apps_homarr_chart_version: "8.29.1"
k3s_apps_homarr_namespace: media
k3s_apps_homarr_node: media-server
k3s_apps_homarr_node_port: 7575
k3s_apps_homarr_hostname: homarr.homelab.lan
k3s_apps_homarr_timezone: "Asia/Riyadh"
k3s_apps_homarr_storage_size: 1Gi
# Holds db-encryption-key, generated on the node on first run. Never in git.
k3s_apps_homarr_encryption_secret: homarr-db-encryption

# ── Intel GPU device plugin ───────────────────────────────────────────────────
# Hands the media node's Arc GPU (i915) to pods as the resource
# gpu.intel.com/i915, so Jellyfin, Bazarr and intel-gpu-exporter get
# /dev/dri without running privileged.
# renovate: datasource=docker depName=intel/intel-gpu-plugin
k3s_apps_gpu_plugin_version: "0.37.1"
k3s_apps_gpu_plugin_node: media-server
# One GPU, shared by up to this many pods at once: Jellyfin + Bazarr +
# intel-gpu-exporter + 1 spare, so a rolling update's surge pod is not stuck
# Pending.
k3s_apps_gpu_plugin_shared_dev_num: 4

# ── Pinned images of the cluster workloads above (bumped by Renovate PRs) ────
# renovate: datasource=docker depName=grafana/tempo
k3s_apps_tempo_version: "2.6.1"
# renovate: datasource=docker depName=prom/node-exporter
k3s_apps_node_exporter_version: "v1.12.1"
# renovate: datasource=docker depName=registry.k8s.io/kube-state-metrics/kube-state-metrics
k3s_apps_kube_state_metrics_version: "v2.10.0"
