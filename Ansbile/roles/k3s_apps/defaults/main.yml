---
k3s_apps_manifest_dir: /opt/k3s/manifests
k3s_apps_falco_config_dir: /opt/falco
k3s_apps_metallb_ip_range: "192.168.10.210-192.168.10.220"
k3s_apps_ingress_nginx_ip: "192.168.10.210"
# Nodes that each run one ingress-nginx replica (hostNetwork: ports 80/443
# must be free on them).
k3s_apps_ingress_nodes:
  - git-k3s-server
  - monitoring-server
# Tempo keeps its trace data on this node's local disk.
k3s_apps_tempo_node: git-k3s-server

# Public domain proxied by Cloudflare. Its wildcard cert (Let's Encrypt,
# DNS-01) is ingress-nginx's default certificate.
k3s_apps_public_domain: darkestserver.com
k3s_apps_public_cert_name: darkestserver-wildcard

# Istio chart version (base, istiod, cni, ztunnel must match) and the
# Gateway API release it was built against (istio/istio go.mod).
k3s_apps_istio_version: "1.30.8"
k3s_apps_gateway_api_version: v1.5.1

# Namespaces in the Istio ambient mesh (ztunnel: mTLS between pods).
# Labelled with kubectl on every run so the label survives ArgoCD re-syncs.
k3s_apps_ambient_namespaces:
  - media
  - monitoring
  - network
# Namespaces that also get a waypoint proxy, for L7 metrics
# (istio_requests_total) and traces between their Services.
k3s_apps_waypoint_namespaces:
  - media

# Every K3s node — promtail's hostPath config is deployed to each of these.
k3s_apps_nodes:
  - git-k3s-server
  - gateway-server
  - media-server
  - monitoring-server

# ── Homarr ────────────────────────────────────────────────────────────────────
# Installed from the upstream Helm chart (homarr-labs/homarr), not from a
# manifest in argocd-apps/. Pinned so a chart release cannot change the
# deployment on an unrelated playbook run.
k3s_apps_homarr_chart_version: "8.29.1"
k3s_apps_homarr_namespace: media
k3s_apps_homarr_node: media-server
k3s_apps_homarr_node_port: 7575
k3s_apps_homarr_hostname: homarr.homelab.lan
k3s_apps_homarr_timezone: "Asia/Riyadh"
k3s_apps_homarr_storage_size: 1Gi
# Holds db-encryption-key, generated on the node on first run. Never in git.
k3s_apps_homarr_encryption_secret: homarr-db-encryption
