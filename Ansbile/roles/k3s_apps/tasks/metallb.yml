---
# ── MetalLB via Helm ─────────────────────────────────────────────────────────
- name: Deploy MetalLB via Helm
  kubernetes.core.helm:
    name: metallb
    chart_ref: metallb/metallb
    chart_version: "{{ k3s_apps_metallb_chart_version }}"
    release_namespace: metallb-system
    create_namespace: true
    update_repo_cache: false
    wait: true
    wait_timeout: 5m
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  environment:
    HELM_REPOSITORY_CONFIG: /etc/helm/repositories.yaml
    HELM_REPOSITORY_CACHE: /etc/helm/cache
    HELM_PLUGINS: "{{ k3s_apps_helm_plugins_dir }}"

- name: Template MetalLB IP pool config
  ansible.builtin.template:
    src: metallb-config.yml.j2
    dest: /tmp/metallb-config.yml
    mode: '0600'

- name: Apply MetalLB IP pool config
  ansible.builtin.command:
    cmd: k3s kubectl apply -f /tmp/metallb-config.yml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

- name: Remove MetalLB config tempfile
  ansible.builtin.file:
    path: /tmp/metallb-config.yml
    state: absent
