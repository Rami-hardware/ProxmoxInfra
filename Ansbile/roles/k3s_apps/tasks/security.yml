---
# ── Security stack ────────────────────────────────────────────────────────────
- name: Ensure Falco config directory exists on all nodes
  ansible.builtin.file:
    path: "{{ k3s_apps_falco_config_dir }}"
    state: directory
    mode: '0755'
  delegate_to: "{{ k3s_node }}"
  loop:
    - git-k3s-server
    - media-server
    - monitoring-server
    - gateway-server
  loop_control:
    loop_var: k3s_node
