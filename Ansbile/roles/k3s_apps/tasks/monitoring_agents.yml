---
# ── Cluster monitoring workloads (owned by Ansible, not ArgoCD) ─────────────
# Prometheus RBAC — allows scraping kubelet /metrics/cadvisor
- name: Template Prometheus RBAC manifest
  ansible.builtin.template:
    src: prometheus-rbac.yml.j2
    dest: "{{ k3s_apps_manifest_dir }}/prometheus-rbac.yml"
    mode: '0644'

# kube-state-metrics — enriches cAdvisor metrics with K8s labels (namespace, pod, container)
- name: Template kube-state-metrics manifest
  ansible.builtin.template:
    src: kube-state-metrics.yml.j2
    dest: "{{ k3s_apps_manifest_dir }}/kube-state-metrics.yml"
    mode: '0644'

- name: Template node-exporter DaemonSet manifest
  ansible.builtin.template:
    src: node-exporter-daemonset.yml.j2
    dest: "{{ k3s_apps_manifest_dir }}/node-exporter.yml"
    mode: '0644'

- name: Template Alloy (log agent) manifest
  ansible.builtin.template:
    src: alloy.yml.j2
    dest: "{{ k3s_apps_manifest_dir }}/alloy.yml"
    mode: '0644'

- name: Apply cluster monitoring manifests
  ansible.builtin.command:
    cmd: "k3s kubectl apply --server-side --force-conflicts -f {{ k3s_apps_manifest_dir }}/{{ item }}.yml"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  loop:
    - prometheus-rbac
    - kube-state-metrics
    - node-exporter
    - alloy
  changed_when: true

# Promtail (end of life) was replaced by Alloy; remove what is left of it.
- name: Check for the old Promtail manifest
  ansible.builtin.stat:
    path: "{{ k3s_apps_manifest_dir }}/promtail.yml"
  register: k3s_apps_promtail_manifest

- name: Remove Promtail from the cluster
  ansible.builtin.command:
    cmd: k3s kubectl delete -f {{ k3s_apps_manifest_dir }}/promtail.yml --ignore-not-found
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: k3s_apps_promtail_manifest.stat.exists
  changed_when: true

- name: Remove the old Promtail manifest
  ansible.builtin.file:
    path: "{{ k3s_apps_manifest_dir }}/promtail.yml"
    state: absent

- name: Remove Promtail config and read positions from the nodes
  ansible.builtin.file:
    path: "{{ item.1 }}"
    state: absent
  delegate_to: "{{ item.0 }}"
  loop: "{{ k3s_apps_nodes | product(['/opt/promtail', '/var/lib/promtail']) | list }}"
  loop_control:
    label: "{{ item.0 }}: {{ item.1 }}"
