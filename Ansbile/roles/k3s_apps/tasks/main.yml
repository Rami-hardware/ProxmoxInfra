---
# ── Helm Repos ────────────────────────────────────────────────────────────────
# Use a system-wide repo config so all users (root, github, etc.) share the same repos
- name: Ensure system-wide Helm config directory exists
  ansible.builtin.file:
    path: /etc/helm
    state: directory
    mode: '0755'

- name: Ensure system-wide Helm cache directory exists
  ansible.builtin.file:
    path: /etc/helm/cache
    state: directory
    mode: '0755'

- name: Add ingress-nginx Helm repo
  ansible.builtin.command:
    cmd: helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    HELM_REPOSITORY_CONFIG: /etc/helm/repositories.yaml
    HELM_REPOSITORY_CACHE: /etc/helm/cache
  register: k3s_apps_helm_repo_nginx
  changed_when: "'already exists' not in k3s_apps_helm_repo_nginx.stdout"
  failed_when: k3s_apps_helm_repo_nginx.rc != 0 and 'already exists' not in k3s_apps_helm_repo_nginx.stdout

- name: Add cert-manager Helm repo
  ansible.builtin.command:
    cmd: helm repo add jetstack https://charts.jetstack.io
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    HELM_REPOSITORY_CONFIG: /etc/helm/repositories.yaml
    HELM_REPOSITORY_CACHE: /etc/helm/cache
  register: k3s_apps_helm_repo_certmanager
  changed_when: "'already exists' not in k3s_apps_helm_repo_certmanager.stdout"
  failed_when: k3s_apps_helm_repo_certmanager.rc != 0 and 'already exists' not in k3s_apps_helm_repo_certmanager.stdout

- name: Add MetalLB Helm repo
  ansible.builtin.command:
    cmd: helm repo add metallb https://metallb.github.io/metallb
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    HELM_REPOSITORY_CONFIG: /etc/helm/repositories.yaml
    HELM_REPOSITORY_CACHE: /etc/helm/cache
  register: k3s_apps_helm_repo_metallb
  changed_when: "'already exists' not in k3s_apps_helm_repo_metallb.stdout"
  failed_when: k3s_apps_helm_repo_metallb.rc != 0 and 'already exists' not in k3s_apps_helm_repo_metallb.stdout

- name: Add Argo Helm repo
  ansible.builtin.command:
    cmd: helm repo add argo https://argoproj.github.io/argo-helm
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    HELM_REPOSITORY_CONFIG: /etc/helm/repositories.yaml
    HELM_REPOSITORY_CACHE: /etc/helm/cache
  register: k3s_apps_helm_repo_argo
  changed_when: "'already exists' not in k3s_apps_helm_repo_argo.stdout"
  failed_when: k3s_apps_helm_repo_argo.rc != 0 and 'already exists' not in k3s_apps_helm_repo_argo.stdout

- name: Add homarr Helm repo
  ansible.builtin.command:
    cmd: helm repo add homarr-labs https://homarr-labs.github.io/charts/
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    HELM_REPOSITORY_CONFIG: /etc/helm/repositories.yaml
    HELM_REPOSITORY_CACHE: /etc/helm/cache
  register: k3s_apps_helm_repo_homarr
  changed_when: "'already exists' not in k3s_apps_helm_repo_homarr.stdout"
  failed_when: k3s_apps_helm_repo_homarr.rc != 0 and 'already exists' not in k3s_apps_helm_repo_homarr.stdout

- name: Ensure Helm repositories file is world-readable
  ansible.builtin.file:
    path: /etc/helm/repositories.yaml
    mode: '0644'
  failed_when: false

- name: Update Helm repos
  ansible.builtin.command:
    cmd: helm repo update
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    HELM_REPOSITORY_CONFIG: /etc/helm/repositories.yaml
    HELM_REPOSITORY_CACHE: /etc/helm/cache
  changed_when: false

- name: Ensure Helm cache is world-writable
  ansible.builtin.file:
    path: /etc/helm/cache
    state: directory
    mode: '0777'
    recurse: true

- name: Ensure K3s manifests directory exists
  ansible.builtin.file:
    path: "{{ k3s_apps_manifest_dir }}"
    state: directory
    mode: '0755'

# ── Cluster monitoring workloads (owned by Ansible, not ArgoCD) ─────────────
# Prometheus RBAC — allows scraping kubelet /metrics/cadvisor
- name: Template Prometheus RBAC manifest
  ansible.builtin.template:
    src: prometheus-rbac.yml.j2
    dest: "{{ k3s_apps_manifest_dir }}/prometheus-rbac.yml"
    mode: '0644'

# kube-state-metrics — enriches cAdvisor metrics with K8s labels (namespace, pod, container)
- name: Template kube-state-metrics manifest
  ansible.builtin.template:
    src: kube-state-metrics.yml.j2
    dest: "{{ k3s_apps_manifest_dir }}/kube-state-metrics.yml"
    mode: '0644'

- name: Template node-exporter DaemonSet manifest
  ansible.builtin.template:
    src: node-exporter-daemonset.yml.j2
    dest: "{{ k3s_apps_manifest_dir }}/node-exporter.yml"
    mode: '0644'

# promtail reads its config from /opt/promtail on every node (hostPath)
- name: Ensure promtail config directory exists on K3s nodes
  ansible.builtin.file:
    path: /opt/promtail
    state: directory
    mode: '0755'
  delegate_to: "{{ k3s_node }}"
  loop: "{{ k3s_apps_nodes }}"
  loop_control:
    loop_var: k3s_node

- name: Deploy promtail config to all K3s nodes
  ansible.builtin.template:
    src: promtail-config.yml.j2
    dest: /opt/promtail/config.yml
    mode: '0644'
  delegate_to: "{{ k3s_node }}"
  loop: "{{ k3s_apps_nodes }}"
  loop_control:
    loop_var: k3s_node

- name: Template promtail DaemonSet manifest
  ansible.builtin.template:
    src: promtail-daemonset.yml.j2
    dest: "{{ k3s_apps_manifest_dir }}/promtail.yml"
    mode: '0644'

- name: Apply cluster monitoring manifests
  ansible.builtin.command:
    cmd: "k3s kubectl apply --server-side --force-conflicts -f {{ k3s_apps_manifest_dir }}/{{ item }}.yml"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  loop:
    - prometheus-rbac
    - kube-state-metrics
    - node-exporter
    - promtail
  changed_when: true

# ── Namespaces ────────────────────────────────────────────────────────────────
# ArgoCD creates the app namespaces on first sync; create any that are missing
# so the Istio ambient labels (set after Istio is installed) can always apply.
- name: Ensure managed namespaces exist
  ansible.builtin.command:
    cmd: "k3s kubectl create namespace {{ item }}"
  register: k3s_apps_ns_create_result
  loop: "{{ k3s_apps_ambient_namespaces }}"
  changed_when: k3s_apps_ns_create_result.rc == 0
  failed_when: >-
    k3s_apps_ns_create_result.rc != 0
    and 'AlreadyExists' not in k3s_apps_ns_create_result.stderr

# ── cert-manager via Helm ────────────────────────────────────────────────────
- name: Deploy cert-manager via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install cert-manager jetstack/cert-manager
      --namespace cert-manager
      --create-namespace
      --set crds.enabled=true
      --set 'extraArgs={--dns01-recursive-nameservers-only,--dns01-recursive-nameservers=1.1.1.1:53\,8.8.8.8:53}'
      --wait
      --timeout 5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    HELM_REPOSITORY_CONFIG: /etc/helm/repositories.yaml
    HELM_REPOSITORY_CACHE: /etc/helm/cache
  changed_when: true

- name: Create cert-manager CA secret from local CA
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      k3s kubectl create secret tls homelab-ca-secret \
        --cert=/opt/k3s/local-tls/ca.crt \
        --key=/opt/k3s/local-tls/ca.key \
        --namespace=cert-manager \
        --dry-run=client -o yaml | k3s kubectl apply -f -
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

- name: Template cert-manager ClusterIssuer
  ansible.builtin.template:
    src: cert-manager-issuer.yml.j2
    dest: /tmp/cert-manager-issuer.yml
    mode: '0600'

- name: Apply cert-manager ClusterIssuer
  ansible.builtin.command:
    cmd: k3s kubectl apply -f /tmp/cert-manager-issuer.yml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

- name: Remove cert-manager issuer tempfile
  ansible.builtin.file:
    path: /tmp/cert-manager-issuer.yml
    state: absent

# ── MetalLB via Helm ─────────────────────────────────────────────────────────
- name: Deploy MetalLB via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install metallb metallb/metallb
      --namespace metallb-system
      --create-namespace
      --wait
      --timeout 5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    HELM_REPOSITORY_CONFIG: /etc/helm/repositories.yaml
    HELM_REPOSITORY_CACHE: /etc/helm/cache
  changed_when: true

- name: Template MetalLB IP pool config
  ansible.builtin.template:
    src: metallb-config.yml.j2
    dest: /tmp/metallb-config.yml
    mode: '0600'

- name: Apply MetalLB IP pool config
  ansible.builtin.command:
    cmd: k3s kubectl apply -f /tmp/metallb-config.yml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

- name: Remove MetalLB config tempfile
  ansible.builtin.file:
    path: /tmp/metallb-config.yml
    state: absent

# ── ingress-nginx via Helm ────────────────────────────────────────────────────
- name: Template ingress-nginx Helm values
  ansible.builtin.template:
    src: ingress-nginx-values.yml.j2
    dest: /tmp/ingress-nginx-values.yml
    mode: '0600'

- name: Deploy ingress-nginx via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx
      --namespace ingress-nginx
      --create-namespace
      --values /tmp/ingress-nginx-values.yml
      --wait
      --timeout 5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    HELM_REPOSITORY_CONFIG: /etc/helm/repositories.yaml
    HELM_REPOSITORY_CACHE: /etc/helm/cache
  changed_when: true

- name: Remove ingress-nginx values tempfile
  ansible.builtin.file:
    path: /tmp/ingress-nginx-values.yml
    state: absent

# ── Let's Encrypt wildcard for the public domain ─────────────────────────────
# One publicly trusted cert, served by ingress-nginx as its default certificate,
# so the same *.{{ k3s_apps_public_domain }} URL works through Cloudflare (Full
# strict) and directly on the LAN (split-horizon DNS in the adguard role).
# DNS-01 via the Cloudflare API with CF_DNS_API_TOKEN (Zone.DNS edit on this
# zone only — CF_API_TOKEN belongs to the Cloudflare exporter). cert-manager
# checks propagation against public resolvers only (extraArgs above), since
# local DNS answers this zone itself.
- name: Create Cloudflare API token secret for cert-manager
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      k3s kubectl create secret generic cloudflare-api-token \
        --from-literal=api-token="$CF_DNS_API_TOKEN" \
        --namespace=cert-manager \
        --dry-run=client -o yaml | k3s kubectl apply -f -
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    CF_DNS_API_TOKEN: "{{ lookup('env', 'CF_DNS_API_TOKEN') }}"
  no_log: true
  changed_when: true

- name: Template Let's Encrypt issuer and wildcard certificate
  ansible.builtin.template:
    src: letsencrypt-wildcard.yml.j2
    dest: "{{ k3s_apps_manifest_dir }}/letsencrypt-wildcard.yml"
    mode: '0644'

- name: Apply Let's Encrypt issuer and wildcard certificate
  ansible.builtin.command:
    cmd: "k3s kubectl apply -f {{ k3s_apps_manifest_dir }}/letsencrypt-wildcard.yml"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

# DNS-01 takes 1-3 minutes on first issue; renewals happen in place.
- name: Wait for the wildcard certificate to be issued
  ansible.builtin.command:
    cmd: >
      k3s kubectl wait certificate/{{ k3s_apps_public_cert_name }}
      -n ingress-nginx --for=condition=Ready --timeout=600s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

# ── Cloudflare Tunnel connector ──────────────────────────────────────────────
- name: Template cloudflared manifest
  ansible.builtin.template:
    src: cloudflared.yml.j2
    dest: "{{ k3s_apps_manifest_dir }}/cloudflared.yml"
    mode: '0644'

- name: Apply cloudflared manifest
  ansible.builtin.command:
    cmd: k3s kubectl apply -f {{ k3s_apps_manifest_dir }}/cloudflared.yml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

# ── ArgoCD via Helm ────────────────────────────────────────────────────────────
# NodePort exposes argocd-server so the gateway's nginx (nginx_services_local
# in group_vars/gateway-vm.yml) can proxy argocd.homelab.lan to it, same
# pattern as grafana/prometheus/tempo. Uses a values file rather than --set
# strings because the RBAC policy.csv value contains commas, which Helm's
# --set/--set-string parser treats as field separators.
- name: Template ArgoCD Helm values
  ansible.builtin.template:
    src: argocd-values.yml.j2
    dest: /tmp/argocd-values.yml
    mode: '0600'

- name: Deploy ArgoCD via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install argocd argo/argo-cd
      --namespace argocd
      --create-namespace
      --values /tmp/argocd-values.yml
      --wait
      --timeout 5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    HELM_REPOSITORY_CONFIG: /etc/helm/repositories.yaml
    HELM_REPOSITORY_CACHE: /etc/helm/cache
  changed_when: true

- name: Remove ArgoCD values tempfile
  ansible.builtin.file:
    path: /tmp/argocd-values.yml
    state: absent

# ── ArgoCD Image Updater ──────────────────────────────────────────────────────
# Watches image digests on :latest tags and commits the resolved digest back
# into argocd-apps/*.yaml so ArgoCD redeploys — the SSH key here is the same
# one Ansible uses to log into the VMs, registered separately as a GitHub
# Deploy Key (write access) so it can also push commits to this repo.
- name: Deploy ArgoCD Image Updater via Helm
  # Pinned to the last chart release before the app switched from
  # annotation-driven config (Application annotations, what we use below)
  # to the CRD-based model in v1.0.0+ (argoproj-labs/argocd-image-updater#1170).
  ansible.builtin.command:
    cmd: >
      helm upgrade --install argocd-image-updater
      argo/argocd-image-updater
      --version 0.8.5
      --namespace argocd
      --create-namespace
      --wait
      --timeout 5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    HELM_REPOSITORY_CONFIG: /etc/helm/repositories.yaml
    HELM_REPOSITORY_CACHE: /etc/helm/cache
  changed_when: true

- name: Read controller SSH private key
  ansible.builtin.set_fact:
    k3s_apps_git_ssh_key: "{{ lookup('file', '~/.ssh/id_rsa') }}"
  no_log: true
  delegate_to: localhost

- name: Template git SSH secret manifest for Image Updater
  ansible.builtin.template:
    src: image-updater-git-secret.yml.j2
    dest: /tmp/image-updater-git-secret.yml
    mode: '0600'
  no_log: true

- name: Apply git SSH secret for Image Updater
  ansible.builtin.command:
    cmd: k3s kubectl apply -f /tmp/image-updater-git-secret.yml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true
  no_log: true

- name: Remove git SSH secret tempfile
  ansible.builtin.file:
    path: /tmp/image-updater-git-secret.yml
    state: absent

# ArgoCD itself also needs credentials to clone/pull the repo over SSH
# (argocd-apps-app.yaml sources use git@github.com:... now that write-back
# needs SSH) — registered as a repo-creds Secret per ArgoCD's own convention.
- name: Template ArgoCD repo credentials secret manifest
  ansible.builtin.template:
    src: argocd-repo-creds-secret.yml.j2
    dest: /tmp/argocd-repo-creds-secret.yml
    mode: '0600'
  no_log: true

- name: Apply ArgoCD repo credentials secret
  ansible.builtin.command:
    cmd: k3s kubectl apply -f /tmp/argocd-repo-creds-secret.yml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true
  no_log: true

- name: Remove ArgoCD repo credentials tempfile
  ansible.builtin.file:
    path: /tmp/argocd-repo-creds-secret.yml
    state: absent

# Apply ArgoCD Application manifests — these point ArgoCD at paths in this
# repo (argocd-apps/) and it takes over syncing them from there.
- name: Find ArgoCD Application manifests
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/argocd-apps"
    patterns: "*-app.yaml"
    recurse: false
  delegate_to: localhost
  become: false
  register: k3s_apps_argocd_app_manifests

# Applied by discovery rather than a hardcoded list, so adding a new
# argocd-apps/<name>-app.yaml is enough to register it — no role edit,
# and no manual kubectl apply on a fresh cluster.
- name: Apply ArgoCD Application manifests
  ansible.builtin.command:
    cmd: "k3s kubectl apply -f {{ playbook_dir }}/argocd-apps/{{ item }}"
  loop: "{{ k3s_apps_argocd_app_manifests.files
            | map(attribute='path') | map('basename') | sort }}"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

# ── alert-forwarder via Helm ──────────────────────────────────────────────────
- name: Deploy alert-forwarder via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install alert-forwarder
      {{ playbook_dir }}/apps/alert-forwarder/chart
      --namespace monitoring
      --create-namespace
      --set image.tag={{ k3s_apps_alert_forwarder_image_tag }}
      --set-string discordWebhookUrl={{ lookup('env', 'DISCORD_WEBHOOK_URL') | quote }}
      --wait
      --timeout 5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    HELM_REPOSITORY_CONFIG: /etc/helm/repositories.yaml
    HELM_REPOSITORY_CACHE: /etc/helm/cache
  changed_when: true
  no_log: true

# ── Istio service mesh via Helm ───────────────────────────────────────────────
- name: Add Istio Helm repo
  ansible.builtin.command:
    cmd: helm repo add istio https://istio-release.storage.googleapis.com/charts
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    HELM_REPOSITORY_CONFIG: /etc/helm/repositories.yaml
    HELM_REPOSITORY_CACHE: /etc/helm/cache
  register: k3s_apps_helm_repo_istio
  changed_when: "'already exists' not in k3s_apps_helm_repo_istio.stdout"
  failed_when: k3s_apps_helm_repo_istio.rc != 0 and 'already exists' not in k3s_apps_helm_repo_istio.stdout

- name: Update Helm repos (Istio)
  ansible.builtin.command:
    cmd: helm repo update
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    HELM_REPOSITORY_CONFIG: /etc/helm/repositories.yaml
    HELM_REPOSITORY_CACHE: /etc/helm/cache
  changed_when: false

- name: Deploy Istio base (CRDs) via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install istio-base istio/base
      --namespace istio-system
      --version {{ k3s_apps_istio_version }}
      --create-namespace
      --wait
      --timeout 5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    HELM_REPOSITORY_CONFIG: /etc/helm/repositories.yaml
    HELM_REPOSITORY_CACHE: /etc/helm/cache
  changed_when: true

# ── Tempo (tracing backend) ───────────────────────────────────────────────────
- name: Template Tempo manifest
  ansible.builtin.template:
    src: tempo.yml.j2
    dest: "{{ k3s_apps_manifest_dir }}/tempo.yml"
    mode: '0644'

- name: Apply Tempo manifest
  ansible.builtin.command:
    cmd: "k3s kubectl apply --server-side --force-conflicts -f {{ k3s_apps_manifest_dir }}/tempo.yml"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

- name: Wait for Tempo deployment to be ready
  ansible.builtin.command:
    cmd: "k3s kubectl rollout status deployment/tempo -n istio-system --timeout=120s"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Deploy Istiod via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install istiod istio/istiod
      --namespace istio-system
      --version {{ k3s_apps_istio_version }}
      --set profile=ambient
      --set nodeSelector."kubernetes\.io/hostname"=git-k3s-server
      --set meshConfig.enablePrometheusMerge=true
      --set global.proxy.resources.requests.cpu=20m
      --set global.proxy.resources.requests.memory=64Mi
      --set global.proxy.resources.limits.cpu=200m
      --set global.proxy.resources.limits.memory=128Mi
      --set meshConfig.defaultConfig.tracing.zipkin.address=tempo.istio-system.svc.cluster.local:9411
      --set meshConfig.enableTracing=true
      --set meshConfig.defaultConfig.tracing.sampling=100
      --set meshConfig.accessLogFile=/dev/stdout
      --set meshConfig.accessLogEncoding=JSON
      --wait
      --timeout 5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    HELM_REPOSITORY_CONFIG: /etc/helm/repositories.yaml
    HELM_REPOSITORY_CACHE: /etc/helm/cache
  changed_when: true

# ── Istio ambient data plane ─────────────────────────────────────────────────
# Ambient replaces per-pod sidecars with one ztunnel per node (L4 + mTLS) and
# an optional per-namespace waypoint proxy (L7 metrics and traces).
# global.platform=k3s points istio-cni at k3s's CNI dirs
# (/var/lib/rancher/k3s/agent/etc/cni/net.d, /var/lib/rancher/k3s/data/cni).
- name: Download Gateway API CRDs (needed for waypoints)
  ansible.builtin.get_url:
    url: "https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ k3s_apps_gateway_api_version }}/standard-install.yaml"
    dest: "{{ k3s_apps_manifest_dir }}/gateway-api-crds.yml"
    mode: '0644'
    timeout: 60
  register: k3s_apps_gateway_api_download
  retries: 3
  delay: 10
  until: k3s_apps_gateway_api_download is succeeded

- name: Apply Gateway API CRDs
  ansible.builtin.command:
    cmd: k3s kubectl apply --server-side --force-conflicts -f {{ k3s_apps_manifest_dir }}/gateway-api-crds.yml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

- name: Deploy istio-cni via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install istio-cni istio/cni
      --namespace istio-system
      --version {{ k3s_apps_istio_version }}
      --set profile=ambient
      --set global.platform=k3s
      --set resources.requests.cpu=10m
      --set resources.requests.memory=32Mi
      --wait
      --timeout 5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    HELM_REPOSITORY_CONFIG: /etc/helm/repositories.yaml
    HELM_REPOSITORY_CACHE: /etc/helm/cache
  changed_when: true

- name: Deploy ztunnel via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install ztunnel istio/ztunnel
      --namespace istio-system
      --version {{ k3s_apps_istio_version }}
      --set profile=ambient
      --set global.platform=k3s
      --set resources.requests.cpu=20m
      --set resources.requests.memory=48Mi
      --wait
      --timeout 5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    HELM_REPOSITORY_CONFIG: /etc/helm/repositories.yaml
    HELM_REPOSITORY_CACHE: /etc/helm/cache
  changed_when: true

# Pods move to ambient when they restart; running sidecar pods keep working
# alongside them until then.
- name: Enroll managed namespaces in Istio ambient mode
  ansible.builtin.command:
    cmd: >
      k3s kubectl label namespace {{ item }}
      istio.io/dataplane-mode=ambient istio-injection-
      --overwrite
  loop: "{{ k3s_apps_ambient_namespaces }}"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

- name: Template waypoint proxies
  ansible.builtin.template:
    src: istio-waypoints.yml.j2
    dest: "{{ k3s_apps_manifest_dir }}/istio-waypoints.yml"
    mode: '0644'

- name: Apply waypoint proxies
  ansible.builtin.command:
    cmd: k3s kubectl apply -f {{ k3s_apps_manifest_dir }}/istio-waypoints.yml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

- name: Route namespace Service traffic through its waypoint
  ansible.builtin.command:
    cmd: "k3s kubectl label namespace {{ item }} istio.io/use-waypoint=waypoint --overwrite"
  loop: "{{ k3s_apps_waypoint_namespaces }}"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

# ── Security stack ────────────────────────────────────────────────────────────
- name: Ensure Falco config directory exists on all nodes
  ansible.builtin.file:
    path: "{{ k3s_apps_falco_config_dir }}"
    state: directory
    mode: '0755'
  delegate_to: "{{ k3s_node }}"
  loop:
    - git-k3s-server
    - media-server
    - monitoring-server
    - gateway-server
  loop_control:
    loop_var: k3s_node

# ── NetworkPolicy engine ─────────────────────────────────────────────────────
# k3s's built-in kube-router controller enforces NetworkPolicy. Calico used to
# be installed in policy-only mode as well, but its rules only match cali*
# interfaces and flannel's pods use veth*, so it never enforced anything.
# Remove it if an older run installed it.
- name: Check for the old Calico policy-only manifest
  ansible.builtin.stat:
    path: "{{ k3s_apps_manifest_dir }}/calico-policy-only.yml"
  register: k3s_apps_calico_manifest

- name: Remove Calico policy-only
  ansible.builtin.command:
    cmd: >
      k3s kubectl delete -f {{ k3s_apps_manifest_dir }}/calico-policy-only.yml
      --ignore-not-found --wait=true --timeout=300s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: k3s_apps_calico_manifest.stat.exists
  changed_when: true

- name: Remove the old Calico policy-only manifest
  ansible.builtin.file:
    path: "{{ k3s_apps_manifest_dir }}/calico-policy-only.yml"
    state: absent

# Calico's CNI files stay behind in /etc/cni/net.d. k3s reads its own CNI dir
# (/var/lib/rancher/k3s/agent/etc/cni/net.d), so they are inert, just clutter.
- name: Remove leftover Calico CNI files on all nodes
  ansible.builtin.file:
    path: "/etc/cni/net.d/{{ item.1 }}"
    state: absent
  delegate_to: "{{ item.0 }}"
  loop: "{{ ['git-k3s-server', 'media-server', 'monitoring-server', 'gateway-server'] | product(['10-calico.conflist', 'calico-kubeconfig']) | list }}"
  loop_control:
    label: "{{ item.0 }}: {{ item.1 }}"

# Hand-applied 2026-09-28 and never in git, so ArgoCD can't prune it. It
# allowed all of 10.42.0.0/16 (every pod) into media; the mesh policies in
# argocd-apps/components/mesh-network-policy replace it.
- name: Remove the interim allow-all-pods NetworkPolicy in media
  ansible.builtin.command:
    cmd: k3s kubectl delete networkpolicy allow-flannel-crossnode-interim -n media --ignore-not-found
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: k3s_apps_interim_np
  changed_when: "'deleted' in k3s_apps_interim_np.stdout"

# ── Homarr ────────────────────────────────────────────────────────────────────
# Installed from the upstream Helm chart rather than a hand-written manifest.
# The chart only accepts SECRET_ENCRYPTION_KEY through an existing Secret, so
# the key is generated once on the node and never stored in git.
- name: Create Homarr namespace
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      k3s kubectl create namespace {{ k3s_apps_homarr_namespace }} \
        --dry-run=client -o yaml | k3s kubectl apply -f -
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

# Generated on the node with openssl and kept out of the repo. The lookup of
# the existing Secret runs first so a re-run never rotates the key — rotating
# it would make every stored integration credential undecryptable.
- name: Check for existing Homarr encryption key
  ansible.builtin.command:
    cmd: >
      k3s kubectl get secret {{ k3s_apps_homarr_encryption_secret }}
      -n {{ k3s_apps_homarr_namespace }} -o jsonpath={.data.db-encryption-key}
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: k3s_apps_homarr_existing_key
  failed_when: false
  changed_when: false

- name: Generate Homarr encryption key
  ansible.builtin.command:
    cmd: openssl rand -hex 32
  register: k3s_apps_homarr_new_key
  when: k3s_apps_homarr_existing_key.rc != 0
  changed_when: true
  no_log: true

- name: Create Homarr encryption key secret
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      k3s kubectl create secret generic {{ k3s_apps_homarr_encryption_secret }} \
        --from-literal=db-encryption-key='{{ k3s_apps_homarr_new_key.stdout }}' \
        --namespace={{ k3s_apps_homarr_namespace }} \
        --dry-run=client -o yaml | k3s kubectl apply -f -
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: k3s_apps_homarr_existing_key.rc != 0
  changed_when: true
  no_log: true

- name: Template Homarr Helm values
  ansible.builtin.template:
    src: homarr-values.yml.j2
    dest: /tmp/homarr-values.yml
    mode: '0600'

- name: Install Homarr via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install homarr homarr-labs/homarr
      --namespace {{ k3s_apps_homarr_namespace }}
      --version {{ k3s_apps_homarr_chart_version }}
      --values /tmp/homarr-values.yml
      --wait
      --timeout 5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    HELM_REPOSITORY_CONFIG: /etc/helm/repositories.yaml
    HELM_REPOSITORY_CACHE: /etc/helm/cache
  changed_when: true
