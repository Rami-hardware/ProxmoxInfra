---
- name: Ensure K3s manifests directory exists
  ansible.builtin.file:
    path: "{{ k3s_apps_manifest_dir }}"
    state: directory
    mode: '0755'

# Runs on each app's target node — only apps with a config_path (i.e. not skip_pv)
# loop_control loop_var avoids Ansible resolving delegate_to before item is bound
- name: Ensure app config directories exist on target nodes
  ansible.builtin.file:
    path: "{{ app.config_path }}"
    state: directory
    mode: '0755'
  delegate_to: "{{ app.target_node }}"
  loop: "{{ k3s_apps_list | selectattr('config_path', 'defined') | list }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"

# Deploy authelia configuration files to its config directory on the target node
- name: Deploy authelia configuration.yml
  ansible.builtin.template:
    src: configuration.yml.j2
    dest: "{{ (k3s_apps_list | selectattr('name', 'equalto', 'authelia') | first).config_path }}/configuration.yml"
    mode: '0600'
  delegate_to: "{{ (k3s_apps_list | selectattr('name', 'equalto', 'authelia') | first).target_node }}"
  when: k3s_apps_list | selectattr('name', 'equalto', 'authelia') | list | length > 0

- name: Deploy authelia users_database.yml
  ansible.builtin.template:
    src: users_database.yml.j2
    dest: "{{ (k3s_apps_list | selectattr('name', 'equalto', 'authelia') | first).config_path }}/users_database.yml"
    mode: '0600'
  delegate_to: "{{ (k3s_apps_list | selectattr('name', 'equalto', 'authelia') | first).target_node }}"
  when: k3s_apps_list | selectattr('name', 'equalto', 'authelia') | list | length > 0

# Prometheus RBAC — allows scraping kubelet /metrics/cadvisor
- name: Template Prometheus RBAC manifest
  ansible.builtin.template:
    src: prometheus-rbac.yml.j2
    dest: "{{ k3s_apps_manifest_dir }}/prometheus-rbac.yml"
    mode: '0644'

# kube-state-metrics — enriches cAdvisor metrics with K8s labels (namespace, pod, container)
- name: Template kube-state-metrics manifest
  ansible.builtin.template:
    src: kube-state-metrics.yml.j2
    dest: "{{ k3s_apps_manifest_dir }}/kube-state-metrics.yml"
    mode: '0644'

# node-exporter runs as a DaemonSet on all nodes (media, monitoring, git-k3s-server)
# Delete old Deployment if it exists — it was previously managed by the generic app template
- name: Remove node-exporter Deployment if present (replaced by DaemonSet)
  ansible.builtin.command:
    cmd: k3s kubectl delete deployment node-exporter -n monitoring --ignore-not-found
  changed_when: false

- name: Template node-exporter DaemonSet manifest
  ansible.builtin.template:
    src: node-exporter-daemonset.yml.j2
    dest: "{{ k3s_apps_manifest_dir }}/node-exporter.yml"
    mode: '0644'

# promtail runs as a DaemonSet — deploy config to all K3s nodes and ensure /opt/promtail exists
- name: Ensure promtail config directory exists on K3s nodes
  ansible.builtin.file:
    path: /opt/promtail
    state: directory
    mode: '0755'
  delegate_to: "{{ k3s_node }}"
  loop:
    - media-server
    - monitoring-server
    - git-k3s-server
    - gateway-server
  loop_control:
    loop_var: k3s_node

- name: Deploy promtail config to all K3s nodes
  ansible.builtin.template:
    src: promtail-config.yml.j2
    dest: /opt/promtail/config.yml
    mode: '0644'
  delegate_to: "{{ k3s_node }}"
  loop:
    - media-server
    - monitoring-server
    - git-k3s-server
    - gateway-server
  loop_control:
    loop_var: k3s_node

- name: Remove promtail Deployment if present (replaced by DaemonSet)
  ansible.builtin.command:
    cmd: k3s kubectl delete deployment promtail -n monitoring --ignore-not-found
  changed_when: false

- name: Template promtail DaemonSet manifest
  ansible.builtin.template:
    src: promtail-daemonset.yml.j2
    dest: "{{ k3s_apps_manifest_dir }}/promtail.yml"
    mode: '0644'

# Remove manifests for apps that were deleted from k3s_apps_list
- name: Find existing app manifests on disk
  ansible.builtin.find:
    paths: "{{ k3s_apps_manifest_dir }}"
    patterns: "*.yml"
  register: k3s_apps_existing_manifests

- name: Delete resources and manifest for removed apps
  ansible.builtin.command:
    cmd: "k3s kubectl delete -f {{ item.path }} --ignore-not-found"
  loop: "{{ k3s_apps_existing_manifests.files }}"
  when: >
    (item.path | basename | splitext)[0] not in
    (k3s_apps_list | map(attribute='name') | list) + ['node-exporter', 'promtail', 'kube-state-metrics', 'prometheus-rbac', 'ingress-nginx', 'ingress-services']
  changed_when: true

- name: Remove stale manifest files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ k3s_apps_existing_manifests.files }}"
  when: >
    (item.path | basename | splitext)[0] not in
    (k3s_apps_list | map(attribute='name') | list) + ['node-exporter', 'promtail', 'kube-state-metrics', 'prometheus-rbac', 'ingress-nginx', 'ingress-services']

# Single template for all apps — item.* variables drive the output
- name: Template app manifests
  ansible.builtin.template:
    src: app.yml.j2
    dest: "{{ k3s_apps_manifest_dir }}/{{ item.name }}.yml"
    mode: '0644'
  loop: "{{ k3s_apps_list }}"

# Check current PV — delete if path changed OR namespace changed OR PV is Released
# Only apps with a config_path have a PV to check
- name: Check current PV state
  ansible.builtin.command:
    cmd: >
      k3s kubectl get pv {{ item.name }}-config-pv
      -o jsonpath={.spec.hostPath.path},{.spec.claimRef.namespace},{.status.phase}
  register: k3s_apps_pv_check
  failed_when: false
  changed_when: false
  loop: "{{ k3s_apps_list | selectattr('config_path', 'defined') | list }}"

- name: Delete PVC when PV needs to be recreated
  ansible.builtin.shell:
    cmd: |
      for ns in $(k3s kubectl get namespaces -o jsonpath='{.items[*].metadata.name}'); do
        k3s kubectl delete pvc {{ item.item.name }}-config-pvc -n "$ns" --ignore-not-found
      done
  loop: "{{ k3s_apps_pv_check.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.rc is defined and item.rc == 0
    - >
      item.stdout.split(',')[0] != item.item.config_path or
      item.stdout.split(',')[1] != item.item.namespace or
      item.stdout.split(',')[2] == 'Released'
  changed_when: false

- name: Delete PV when PV needs to be recreated
  ansible.builtin.command:
    cmd: "k3s kubectl delete pv {{ item.item.name }}-config-pv --ignore-not-found"
  loop: "{{ k3s_apps_pv_check.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.rc is defined and item.rc == 0
    - >
      item.stdout.split(',')[0] != item.item.config_path or
      item.stdout.split(',')[1] != item.item.namespace or
      item.stdout.split(',')[2] == 'Released'
  changed_when: false

- name: Show K3s cluster nodes
  ansible.builtin.command:
    cmd: "k3s kubectl get nodes -o wide"
  changed_when: false

- name: Apply all K3s app manifests
  ansible.builtin.command:
    cmd: "k3s kubectl apply --server-side --force-conflicts -f {{ k3s_apps_manifest_dir }}"
  changed_when: true
  register: k3s_apps_apply_result
  when: k3s_apps_list | length > 0

- name: Show apply output
  ansible.builtin.debug:
    msg: "{{ k3s_apps_apply_result.stdout_lines }}"
  when: k3s_apps_list | length > 0

# Force a rollout restart so ProgressDeadlineExceeded from prior failed runs doesn't
# cause an immediate 0-second failure on the next run.
- name: Restart deployments that have exceeded their progress deadline
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      STATUS=$(k3s kubectl rollout status deployment/{{ item.name }} -n {{ item.namespace }} --timeout=5s 2>&1 || true)
      if echo "$STATUS" | grep -q "exceeded its progress deadline"; then
        k3s kubectl rollout restart deployment/{{ item.name }} -n {{ item.namespace }}
      fi
    executable: /bin/bash
  loop: "{{ k3s_apps_list }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false

- name: Wait for app deployments to be ready
  ansible.builtin.command:
    cmd: "k3s kubectl rollout status deployment/{{ item.name }} -n {{ item.namespace }} --timeout=300s"
  changed_when: false
  loop: "{{ k3s_apps_list }}"
  register: k3s_apps_rollout
  ignore_errors: true

- name: Show pod status for failed deployments
  ansible.builtin.command:
    cmd: "k3s kubectl get pods -n {{ item.item.namespace }} -l app={{ item.item.name }} -o wide"
  when: item.failed | default(false)
  loop: "{{ k3s_apps_rollout.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  changed_when: false

- name: Show pod events for failed deployments
  ansible.builtin.command:
    cmd: "k3s kubectl get events -n {{ item.item.namespace }} --field-selector involvedObject.name={{ item.item.name }} --sort-by='.lastTimestamp'"
  when: item.failed | default(false)
  loop: "{{ k3s_apps_rollout.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  changed_when: false

- name: Describe pods for failed deployments
  ansible.builtin.command:
    cmd: "k3s kubectl describe pods -n {{ item.item.namespace }} -l app={{ item.item.name }}"
  when: item.failed | default(false)
  loop: "{{ k3s_apps_rollout.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  changed_when: false

- name: Fail if any deployment did not become ready
  ansible.builtin.fail:
    msg: "Deployment '{{ item.item.name }}' in namespace '{{ item.item.namespace }}' failed to become ready. See describe output above."
  when: item.failed | default(false)
  loop: "{{ k3s_apps_rollout.results }}"
  loop_control:
    label: "{{ item.item.name }}"


# ingress-nginx controller
- name: Template ingress-nginx manifest
  ansible.builtin.template:
    src: ingress-nginx.yml.j2
    dest: "{{ k3s_apps_manifest_dir }}/ingress-nginx.yml"
    mode: "0644"

- name: Apply ingress-nginx manifest
  ansible.builtin.command: >
    k3s kubectl apply --server-side --force-conflicts
    -f {{ k3s_apps_manifest_dir }}/ingress-nginx.yml
  changed_when: true

- name: Wait for ingress-nginx controller to be ready
  ansible.builtin.command: >
    k3s kubectl rollout status deployment/ingress-nginx-controller
    -n ingress-nginx --timeout=120s
  changed_when: false
