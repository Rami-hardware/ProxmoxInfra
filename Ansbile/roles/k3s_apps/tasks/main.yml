# ── ingress-nginx via Helm ────────────────────────────────────────────────────
- name: Template ingress-nginx Helm values
  ansible.builtin.template:
    src: ingress-nginx-values.yml.j2
    dest: /tmp/ingress-nginx-values.yml
    mode: '0600'

- name: Deploy ingress-nginx via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx
      --namespace ingress-nginx
      --create-namespace
      --values /tmp/ingress-nginx-values.yml
      --wait
      --timeout 5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    HELM_REPOSITORY_CONFIG: /etc/helm/repositories.yaml
    HELM_REPOSITORY_CACHE: /etc/helm/cache
  changed_when: true

- name: Remove ingress-nginx values tempfile
  ansible.builtin.file:
    path: /tmp/ingress-nginx-values.yml
    state: absent

# ── alert-forwarder via Helm ──────────────────────────────────────────────────
- name: Deploy alert-forwarder via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install alert-forwarder
      {{ playbook_dir }}/apps/alert-forwarder/chart
      --namespace monitoring
      --create-namespace
      --set image.tag={{ alert_forwarder_image_tag | default('latest') }}
      --set-string discordWebhookUrl={{ lookup('env', 'DISCORD_WEBHOOK_URL') | quote }}
      --wait
      --timeout 5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    HELM_REPOSITORY_CONFIG: /etc/helm/repositories.yaml
    HELM_REPOSITORY_CACHE: /etc/helm/cache
  changed_when: true
  no_log: true

# ── Istio service mesh via Helm ───────────────────────────────────────────────
- name: Add Istio Helm repo
  ansible.builtin.command:
    cmd: helm repo add istio https://istio-release.storage.googleapis.com/charts
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    HELM_REPOSITORY_CONFIG: /etc/helm/repositories.yaml
    HELM_REPOSITORY_CACHE: /etc/helm/cache
  register: k3s_apps_helm_repo_istio
  changed_when: "'already exists' not in k3s_apps_helm_repo_istio.stdout"
  failed_when: k3s_apps_helm_repo_istio.rc != 0 and 'already exists' not in k3s_apps_helm_repo_istio.stdout

- name: Update Helm repos (Istio)
  ansible.builtin.command:
    cmd: helm repo update
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    HELM_REPOSITORY_CONFIG: /etc/helm/repositories.yaml
    HELM_REPOSITORY_CACHE: /etc/helm/cache
  changed_when: false

- name: Deploy Istio base (CRDs) via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install istio-base istio/base
      --namespace istio-system
      --create-namespace
      --wait
      --timeout 5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    HELM_REPOSITORY_CONFIG: /etc/helm/repositories.yaml
    HELM_REPOSITORY_CACHE: /etc/helm/cache
  changed_when: true

# ── Remove Jaeger (replaced by Tempo) ─────────────────────────────────────────
- name: Remove old Jaeger resources
  ansible.builtin.command:
    cmd: "k3s kubectl delete -f {{ k3s_apps_manifest_dir }}/jaeger.yml --ignore-not-found"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true
  failed_when: false

- name: Remove old Jaeger manifest file
  ansible.builtin.file:
    path: "{{ k3s_apps_manifest_dir }}/jaeger.yml"
    state: absent

# ── Tempo (tracing backend) ───────────────────────────────────────────────────
- name: Template Tempo manifest
  ansible.builtin.template:
    src: tempo.yml.j2
    dest: "{{ k3s_apps_manifest_dir }}/tempo.yml"
    mode: '0644'

- name: Apply Tempo manifest
  ansible.builtin.command:
    cmd: "k3s kubectl apply --server-side --force-conflicts -f {{ k3s_apps_manifest_dir }}/tempo.yml"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

- name: Wait for Tempo deployment to be ready
  ansible.builtin.command:
    cmd: "k3s kubectl rollout status deployment/tempo -n istio-system --timeout=120s"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Deploy Istiod via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install istiod istio/istiod
      --namespace istio-system
      --set meshConfig.enablePrometheusMerge=true
      --set global.proxy.resources.requests.cpu=20m
      --set global.proxy.resources.requests.memory=64Mi
      --set global.proxy.resources.limits.cpu=200m
      --set global.proxy.resources.limits.memory=128Mi
      --set meshConfig.defaultConfig.tracing.zipkin.address=tempo.istio-system.svc.cluster.local:9411
      --set meshConfig.enableTracing=true
      --set meshConfig.defaultConfig.tracing.sampling=100
      --wait
      --timeout 5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    HELM_REPOSITORY_CONFIG: /etc/helm/repositories.yaml
    HELM_REPOSITORY_CACHE: /etc/helm/cache
  changed_when: true

# ── Security stack ────────────────────────────────────────────────────────────
- name: Ensure Falco config directory exists on all nodes
  ansible.builtin.file:
    path: "{{ falco_config_dir }}"
    state: directory
    mode: '0755'
  delegate_to: "{{ k3s_node }}"
  loop:
    - git-k3s-server
    - media-server
    - monitoring-server
    - gateway-server
  loop_control:
    loop_var: k3s_node
