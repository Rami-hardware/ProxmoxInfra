---
# One task file per component, each imported with the tag k3s_apps_<file>.
# CI (detect-changed-hosts.sh) runs only the component whose task file or
# template changed (--tags k3s_apps_<file>); main.yml/defaults/handlers run
# the whole role. Components must not use registers/facts from each other.
# Order matters on a fresh cluster (Helm repos and namespaces first).

- name: "Helm Repos"
  ansible.builtin.import_tasks: helm_repos.yml
  tags: [k3s_apps_helm_repos]

- name: "Cluster monitoring workloads (owned by Ansible, not ArgoCD)"
  ansible.builtin.import_tasks: monitoring_agents.yml
  tags: [k3s_apps_monitoring_agents]

- name: "Namespaces"
  ansible.builtin.import_tasks: namespaces.yml
  tags: [k3s_apps_namespaces]

- name: "Cert-manager via Helm"
  ansible.builtin.import_tasks: cert_manager.yml
  tags: [k3s_apps_cert_manager]

- name: "MetalLB via Helm"
  ansible.builtin.import_tasks: metallb.yml
  tags: [k3s_apps_metallb]

- name: "Ingress-nginx via Helm"
  ansible.builtin.import_tasks: ingress_nginx.yml
  tags: [k3s_apps_ingress_nginx]

- name: "Let's Encrypt wildcard for the public domain"
  ansible.builtin.import_tasks: letsencrypt.yml
  tags: [k3s_apps_letsencrypt]

- name: "Cloudflare Tunnel connector"
  ansible.builtin.import_tasks: cloudflared.yml
  tags: [k3s_apps_cloudflared]

- name: "ArgoCD via Helm"
  ansible.builtin.import_tasks: argocd.yml
  tags: [k3s_apps_argocd]

- name: "ArgoCD Image Updater"
  ansible.builtin.import_tasks: image_updater.yml
  tags: [k3s_apps_image_updater]

- name: "Alert-forwarder via Helm"
  ansible.builtin.import_tasks: alert_forwarder.yml
  tags: [k3s_apps_alert_forwarder]

- name: "Istio service mesh via Helm"
  ansible.builtin.import_tasks: istio.yml
  tags: [k3s_apps_istio]

- name: "Tempo (tracing backend)"
  ansible.builtin.import_tasks: tempo.yml
  tags: [k3s_apps_tempo]

- name: "Istio ambient data plane"
  ansible.builtin.import_tasks: istio_ambient.yml
  tags: [k3s_apps_istio_ambient]

- name: "Security stack"
  ansible.builtin.import_tasks: security.yml
  tags: [k3s_apps_security]

- name: "NetworkPolicy engine"
  ansible.builtin.import_tasks: network_policy.yml
  tags: [k3s_apps_network_policy]

- name: "Homarr"
  ansible.builtin.import_tasks: homarr.yml
  tags: [k3s_apps_homarr]
