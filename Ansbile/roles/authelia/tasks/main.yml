- name: Ensure Authelia directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ authelia_base_dir }}"
    - "{{ authelia_secrets_dir }}"

- name: Deploy Authelia users database
  ansible.builtin.copy:
    src: users_database.yml
    dest: "{{ authelia_base_dir }}/users_database.yml"
    mode: "0644"

- name: Deploy Authelia configuration
  ansible.builtin.template:
    src: configuration.yml.j2
    dest: "{{ authelia_base_dir }}/configuration.yml"
    mode: "0644"
  notify: Restart authelia container

- name: Generate Authelia secrets (idempotent)
  ansible.builtin.copy:
    dest: "{{ authelia_secrets_dir }}/{{ item.name }}"
    content: "{{ lookup('ansible.builtin.password', '/dev/null', length=64, chars='hex') }}"
    mode: "0600"
    force: false
  loop:
    - name: session_secret
    - name: storage_secret
