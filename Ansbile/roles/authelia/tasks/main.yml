---
- name: Ensure authelia data directory exists on security-server
  ansible.builtin.file:
    path: /opt/authelia/data
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Template authelia K3s manifests
  ansible.builtin.template:
    src: k3s-manifests.yml.j2
    dest: /opt/k3s/manifests/authelia.yml
    owner: root
    group: root
    mode: "0600"
  delegate_to: git-k3s-server

- name: Apply authelia manifests
  ansible.builtin.command: >
    k3s kubectl apply --server-side --force-conflicts
    -f /opt/k3s/manifests/authelia.yml
  changed_when: true
  delegate_to: git-k3s-server

- name: Remove authelia manifest (contains sensitive data)
  ansible.builtin.file:
    path: /opt/k3s/manifests/authelia.yml
    state: absent
  delegate_to: git-k3s-server

- name: Wait for authelia to be ready
  ansible.builtin.command: >
    k3s kubectl rollout status deployment/authelia
    -n network --timeout=300s
  changed_when: false
  delegate_to: git-k3s-server
