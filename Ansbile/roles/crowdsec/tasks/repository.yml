---
- name: Install required packages for CrowdSec repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download CrowdSec GPG key
  ansible.builtin.get_url:
    url: https://packagecloud.io/crowdsec/crowdsec/gpgkey
    dest: /etc/apt/keyrings/crowdsec.asc
    mode: "0644"

- name: Add CrowdSec apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/crowdsec.asc]
      https://packagecloud.io/crowdsec/crowdsec/{{ 'ubuntu' if ansible_distribution == 'Ubuntu' else 'debian' }}/
      {{ ansible_distribution_release }} main
    filename: crowdsec
    state: present

- name: Update apt cache after adding CrowdSec repository
  ansible.builtin.apt:
    update_cache: true
