---
# tasks/main.yml for crowdsec role

- name: Install CrowdSec repository
  ansible.builtin.import_tasks: repository.yml

- name: Check if nginx-bouncer exists
  ansible.builtin.command: docker exec crowdsec cscli bouncers list -o json
  register: crowdsec_bouncer_list_json
  changed_when: false

- name: Create nginx-bouncer if missing
  ansible.builtin.command: docker exec crowdsec cscli bouncers add nginx-bouncer
  register: crowdsec_add_bouncer
  failed_when: false
  changed_when: "'API key' in crowdsec_add_bouncer.stdout"
  when: >
    crowdsec_bouncer_list_json.stdout | from_json
    | selectattr('name', 'equalto', 'nginx-bouncer') | list | length == 0

- name: Extract CrowdSec NGINX bouncer API key
  ansible.builtin.set_fact:
    crowdsec_nginx_bouncer_key: >-
      {% if crowdsec_add_bouncer.stdout is defined and 'API key' in crowdsec_add_bouncer.stdout %}
        {{ crowdsec_add_bouncer.stdout | regex_search('API key:\\s*(.+)', '\\1') }}
      {% else %}
        {{ (crowdsec_bouncer_list_json.stdout | from_json
           | selectattr('name','equalto','nginx-bouncer')
           | map(attribute='api_key')
           | first | default('')) }}
      {% endif %}

- name: Fail if CrowdSec NGINX bouncer key is not found
  ansible.builtin.fail:
    msg: "CrowdSec NGINX bouncer API key not found! Make sure the bouncer is registered."
  when: crowdsec_nginx_bouncer_key == ""

- name: Install CrowdSec NGINX bouncer package
  ansible.builtin.apt:
    name: crowdsec-nginx-bouncer
    state: present
    update_cache: true

- name: Configure CrowdSec NGINX bouncer
  ansible.builtin.template:
    src: crowdsec-nginx-bouncer.conf.j2
    dest: /etc/crowdsec/bouncers/crowdsec-nginx-bouncer.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart nginx bouncer

- name: Enable CrowdSec in nginx
  ansible.builtin.copy:
    dest: /etc/nginx/conf.d/crowdsec.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      load_module modules/ngx_http_crowdsec_module.so;

      http {
          crowdsec;
      }
  notify: Reload nginx
