- name: Get CrowdSec pod name
  ansible.builtin.command: >
    k3s kubectl -n security get pod -l app=crowdsec -o jsonpath='{.items[0].metadata.name}'
  delegate_to: git-k3s-server
  register: crowdsec_pod_name
  changed_when: false

- name: Wait for CrowdSec pod to be ready
  ansible.builtin.command: >
    k3s kubectl -n security wait pod/{{ crowdsec_pod_name.stdout }}
    --for=condition=Ready --timeout=120s
  delegate_to: git-k3s-server
  changed_when: false

# ------------------------------------------------------------
# Nginx bouncer — create once and save key to gateway
# ------------------------------------------------------------
- name: Check if nginx bouncer exists
  ansible.builtin.command: >
    k3s kubectl -n security exec {{ crowdsec_pod_name.stdout }}
    -- cscli bouncers list -o json
  delegate_to: git-k3s-server
  register: crowdsec_bouncers_json
  changed_when: false

- name: Set fact if nginx bouncer exists
  ansible.builtin.set_fact:
    crowdsec_nginx_bouncer_exists: >-
      {{
        (crowdsec_bouncers_json.stdout | default('[]', true) | from_json
         | selectattr('name', 'equalto', 'nginx-ingress-bouncer')
         | list | length) > 0
      }}

- name: Delete existing bouncer so key can be regenerated
  ansible.builtin.shell: |
    k3s kubectl -n security exec {{ crowdsec_pod_name.stdout }} \
      -- cscli bouncers delete nginx-ingress-bouncer
  delegate_to: git-k3s-server
  when: crowdsec_nginx_bouncer_exists
  changed_when: true

- name: Create bouncer and write key to temp file inside container
  ansible.builtin.shell: |
    k3s kubectl -n security exec {{ crowdsec_pod_name.stdout }} \
      -- sh -c 'cscli bouncers add nginx-ingress-bouncer -o raw > /tmp/bouncer.key 2>&1'
  delegate_to: git-k3s-server
  changed_when: true

- name: Read bouncer key from container temp file
  ansible.builtin.shell: |
    k3s kubectl -n security exec {{ crowdsec_pod_name.stdout }} \
      -- cat /tmp/bouncer.key
  delegate_to: git-k3s-server
  register: crowdsec_nginx_bouncer_key_cmd
  changed_when: false

- name: Set nginx bouncer API key fact
  ansible.builtin.set_fact:
    crowdsec_nginx_bouncer_key: "{{ crowdsec_nginx_bouncer_key_cmd.stdout | trim }}"

- name: Fail if nginx bouncer key is missing
  ansible.builtin.fail:
    msg: "CrowdSec bouncer key is empty — /tmp/bouncer.key contents: '{{ crowdsec_nginx_bouncer_key_cmd.stdout }}'"
  when: crowdsec_nginx_bouncer_key == ''

- name: Save nginx bouncer API key to gateway
  ansible.builtin.copy:
    dest: /opt/docker/crowdsec/nginx-ingress-bouncer.key
    content: "{{ crowdsec_nginx_bouncer_key }}"
    owner: root
    group: root
    mode: "0600"
  delegate_to: gateway-server

- name: Cleanup bouncer key temp file in container
  ansible.builtin.shell: |
    k3s kubectl -n security exec {{ crowdsec_pod_name.stdout }} \
      -- rm -f /tmp/bouncer.key
  delegate_to: git-k3s-server
  changed_when: false
