- name: Get CrowdSec pod name
  ansible.builtin.command: >
    k3s kubectl -n security get pod -l app=crowdsec -o jsonpath='{.items[0].metadata.name}'
  delegate_to: git-k3s-server
  register: crowdsec_pod_name
  changed_when: false

- name: Wait for CrowdSec pod to be ready
  ansible.builtin.command: >
    k3s kubectl -n security wait pod/{{ crowdsec_pod_name.stdout }}
    --for=condition=Ready --timeout=120s
  delegate_to: git-k3s-server
  changed_when: false

# ------------------------------------------------------------
# Nginx bouncer — create once and save key to gateway
# ------------------------------------------------------------
- name: Check if nginx bouncer exists
  ansible.builtin.command: >
    k3s kubectl -n security exec {{ crowdsec_pod_name.stdout }}
    -- cscli bouncers list -o json
  delegate_to: git-k3s-server
  register: crowdsec_bouncers_json
  changed_when: false

- name: Set fact if nginx bouncer exists
  ansible.builtin.set_fact:
    crowdsec_nginx_bouncer_exists: >-
      {{
        (crowdsec_bouncers_json.stdout | default('[]') | from_json
         | selectattr('name', 'equalto', 'nginx-bouncer')
         | list | length) > 0
      }}

- name: Create nginx bouncer and capture API key
  ansible.builtin.command: >
    k3s kubectl -n security exec {{ crowdsec_pod_name.stdout }}
    -- cscli bouncers add nginx-bouncer -o raw
  delegate_to: git-k3s-server
  register: crowdsec_nginx_bouncer_key_cmd
  when: not crowdsec_nginx_bouncer_exists
  changed_when: true

- name: Set nginx bouncer API key fact
  ansible.builtin.set_fact:
    crowdsec_nginx_bouncer_key: "{{ crowdsec_nginx_bouncer_key_cmd.stdout | trim }}"
  when: not crowdsec_nginx_bouncer_exists

- name: Fail if nginx bouncer key is missing
  ansible.builtin.fail:
    msg: "CrowdSec nginx bouncer API key could not be created!"
  when:
    - not crowdsec_nginx_bouncer_exists
    - crowdsec_nginx_bouncer_key | default('') == ''

- name: Save nginx bouncer API key to gateway
  ansible.builtin.copy:
    dest: /opt/docker/crowdsec/nginx-bouncer.key
    content: "{{ crowdsec_nginx_bouncer_key }}"
    owner: root
    group: root
    mode: "0600"
  delegate_to: gateway-server
  when: not crowdsec_nginx_bouncer_exists
