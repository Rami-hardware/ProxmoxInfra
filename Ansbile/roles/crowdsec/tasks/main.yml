- name: Get CrowdSec pod name
  ansible.builtin.command: >
    k3s kubectl -n security get pod -l app=crowdsec -o jsonpath='{.items[0].metadata.name}'
  delegate_to: git-k3s-server
  register: crowdsec_pod_name
  changed_when: false

- name: Wait for CrowdSec pod to be ready
  ansible.builtin.command: >
    k3s kubectl -n security wait pod/{{ crowdsec_pod_name.stdout }}
    --for=condition=Ready --timeout=120s
  delegate_to: git-k3s-server
  changed_when: false

- name: Wait for CrowdSec LAPI to be ready inside pod
  ansible.builtin.shell: |
    k3s kubectl -n security exec {{ crowdsec_pod_name.stdout }} \
      -- cscli lapi status
  delegate_to: git-k3s-server
  register: crowdsec_lapi_status
  until: crowdsec_lapi_status.rc == 0
  retries: 12
  delay: 10
  changed_when: false

# ------------------------------------------------------------
# Nginx bouncer — always recreate to ensure key is captured
# ------------------------------------------------------------
- name: Delete existing nginx-ingress-bouncer if present
  ansible.builtin.shell: |
    k3s kubectl -n security exec {{ crowdsec_pod_name.stdout }} \
      -- cscli bouncers delete nginx-ingress-bouncer 2>/dev/null || true
  delegate_to: git-k3s-server
  changed_when: false

- name: Create nginx-ingress-bouncer with JSON output
  ansible.builtin.shell: |
    k3s kubectl -n security exec {{ crowdsec_pod_name.stdout }} \
      -- cscli bouncers add nginx-ingress-bouncer -o json
  delegate_to: git-k3s-server
  register: crowdsec_bouncer_json
  changed_when: true

- name: Debug bouncer JSON output
  ansible.builtin.debug:
    msg: "{{ crowdsec_bouncer_json.stdout }}"

- name: Set nginx bouncer API key fact
  ansible.builtin.set_fact:
    crowdsec_nginx_bouncer_key: "{{ (crowdsec_bouncer_json.stdout | from_json).api_key }}"

- name: Fail if nginx bouncer key is missing
  ansible.builtin.fail:
    msg: "CrowdSec bouncer key is empty — raw output: {{ crowdsec_bouncer_json.stdout }}"
  when: crowdsec_nginx_bouncer_key == ''

- name: Save nginx bouncer API key to gateway
  ansible.builtin.copy:
    dest: /opt/docker/crowdsec/nginx-ingress-bouncer.key
    content: "{{ crowdsec_nginx_bouncer_key }}"
    owner: root
    group: root
    mode: "0600"
  delegate_to: gateway-server
