# Ensure we have a defined fact for the bouncer existence
- name: Initialize CrowdSec nginx bouncer existence fact
  ansible.builtin.set_fact:
    crowdsec_nginx_bouncer_exists: false
  when: crowdsec_nginx_bouncer_exists is not defined

# Set nginx bouncer API key fact if we created it
- name: Set nginx bouncer API key fact
  ansible.builtin.set_fact:
    crowdsec_nginx_bouncer_key: "{{ crowdsec_nginx_bouncer_key_cmd.stdout | trim }}"
  when: not crowdsec_nginx_bouncer_exists | default(false) and
        crowdsec_nginx_bouncer_key_cmd is defined

# Fail if the API key is missing
- name: Fail if nginx bouncer key is missing
  ansible.builtin.fail:
    msg: "CrowdSec nginx bouncer API key could not be created!"
  when:
    - not crowdsec_nginx_bouncer_exists | default(false)
    - crowdsec_nginx_bouncer_key | default('') == ''

# Save nginx bouncer API key to file
- name: Save nginx bouncer API key to file
  ansible.builtin.copy:
    dest: /opt/docker/crowdsec/nginx-bouncer.key
    content: "{{ crowdsec_nginx_bouncer_key | default('DUMMY_KEY') }}"
    owner: root
    group: root
    mode: "0600"
  when: not crowdsec_nginx_bouncer_exists | default(false)
