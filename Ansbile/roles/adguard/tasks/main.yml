---
# ── Binary + service management ───────────────────────────────────────────────
# AdGuard is the whole network's DNS (and the k3s pod-DNS upstream), so it runs
# as a managed systemd service pinned to {{ adguard_version }} — not an
# unpinned container. The binary previously existed only as a running process
# (deleted from disk, no unit file); this block makes installs/upgrades
# declarative and survives reboots.
- name: Check AdGuardHome binary
  ansible.builtin.stat:
    path: "{{ adguard_install_dir }}/AdGuardHome"
  register: adguard_binary

- name: Get installed AdGuardHome version
  ansible.builtin.command:
    cmd: "{{ adguard_install_dir }}/AdGuardHome --version"
  register: adguard_binary_version
  changed_when: false
  failed_when: false
  when: adguard_binary.stat.exists

- name: Download and install AdGuardHome binary
  # Skipped in check mode: get_url is a no-op there, so unarchive would fail
  # on the missing tarball and break the CI dry run.
  when: >
    (not adguard_binary.stat.exists
    or adguard_version not in (adguard_binary_version.stdout | default('')))
    and not ansible_check_mode
  block:
    - name: Download AdGuardHome release tarball
      ansible.builtin.get_url:
        url: "{{ adguard_download_base }}/{{ adguard_version }}/AdGuardHome_linux_amd64.tar.gz"
        dest: /tmp/AdGuardHome_linux_amd64.tar.gz
        mode: '0644'

    - name: Extract AdGuardHome tarball
      ansible.builtin.unarchive:
        src: /tmp/AdGuardHome_linux_amd64.tar.gz
        dest: /tmp
        remote_src: true

    - name: Install AdGuardHome binary
      ansible.builtin.copy:
        src: /tmp/AdGuardHome/AdGuardHome
        dest: "{{ adguard_install_dir }}/AdGuardHome"
        owner: root
        group: root
        mode: '0755'
        remote_src: true
      notify: Restart AdGuardHome

    - name: Clean up download artifacts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/AdGuardHome_linux_amd64.tar.gz
        - /tmp/AdGuardHome

- name: Install AdGuardHome systemd unit
  ansible.builtin.template:
    src: AdGuardHome.service.j2
    dest: /etc/systemd/system/AdGuardHome.service
    mode: '0644'
  notify: Restart AdGuardHome

- name: Enable AdGuardHome service
  ansible.builtin.systemd:
    name: AdGuardHome
    state: started
    enabled: true
    daemon_reload: true

# ── Resolver + config fix-ups (existing behaviour) ────────────────────────────
- name: Stop systemd-resolved service
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: false

- name: Remove /etc/resolv.conf
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent

- name: Create new resolv.conf pointing to AdGuard
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      nameserver 127.0.0.1
      options edns0
      nameserver {{ fallback_dns }}

# Only the http: section's address. No owner/mode here: the permission tasks
# below set 0600, and setting 0700 here flipped the mode on every run, which
# restarted AdGuard (and dropped LAN DNS) on every deploy.
- name: Change AdGuard web UI port
  ansible.builtin.replace:
    path: "{{ adguard_config_path }}"
    after: '^http:'
    before: '^users:'
    regexp: '^(\s+)address:.*'
    replace: '\1address: 0.0.0.0:{{ adguard_ui_port }}'
  notify: Restart AdGuardHome

- name: Fix AdGuard config directory permissions
  ansible.builtin.file:
    path: "{{ adguard_conf_dir }}"
    owner: 1000
    group: 1000
    mode: '0700'
    recurse: true
    state: directory

- name: Fix file permissions inside AdGuard config
  ansible.builtin.find:
    paths: "{{ adguard_conf_dir }}"
    file_type: file
  register: adguard_files

- name: Set correct permissions on config files
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: 1000
    group: 1000
    mode: '0600'
  loop: "{{ adguard_files.files }}"

- name: Fix AdGuard work directory permissions
  ansible.builtin.file:
    path: "{{ adguard_work_dir }}"
    owner: 1000
    group: 1000
    mode: '0700'
    recurse: true
    state: directory

- name: Fix file permissions inside AdGuard work
  ansible.builtin.find:
    paths: "{{ adguard_work_dir }}"
    file_type: file
  register: adguard_work_files

- name: Set correct permissions on work files
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: 1000
    group: 1000
    mode: '0600'
  loop: "{{ adguard_work_files.files }}"

# ── DNS rewrites (split-horizon) ──────────────────────────────────────────────
# Managed through the API, not the YAML: AdGuard rewrites its own config file
# and would overwrite edits made while it runs. Adds the managed entries and
# deletes the ones in adguard_rewrites_removed; any other rewrite added by
# hand in the UI is left alone. New records are added before old ones go.
- name: List AdGuard DNS rewrites
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ adguard_ui_port }}/control/rewrite/list"
    url_username: "{{ adguard_api_username }}"
    url_password: "{{ adguard_api_password }}"
    force_basic_auth: true
    return_content: true
  register: adguard_rewrite_list
  # Read-only, so it also runs under --check; skipped where CI provides no
  # AdGuard credentials (the Testing job).
  check_mode: false
  when: adguard_api_username | length > 0
  no_log: true

- name: Add missing AdGuard DNS rewrites
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ adguard_ui_port }}/control/rewrite/add"
    method: POST
    url_username: "{{ adguard_api_username }}"
    url_password: "{{ adguard_api_password }}"
    force_basic_auth: true
    body_format: json
    body:
      domain: "{{ item }}"
      answer: "{{ adguard_rewrite_answer }}"
  loop: "{{ adguard_rewrite_domains }}"
  loop_control:
    label: "{{ item }} -> {{ adguard_rewrite_answer }}"
  when: >-
    adguard_rewrite_list.json is defined
    and adguard_rewrite_list.json
    | selectattr('domain', 'equalto', item)
    | selectattr('answer', 'equalto', adguard_rewrite_answer)
    | list | length == 0
  changed_when: true

- name: Delete retired AdGuard DNS rewrites
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ adguard_ui_port }}/control/rewrite/delete"
    method: POST
    url_username: "{{ adguard_api_username }}"
    url_password: "{{ adguard_api_password }}"
    force_basic_auth: true
    body_format: json
    body:
      domain: "{{ item.domain }}"
      answer: "{{ item.answer }}"
  loop: >-
    {{ adguard_rewrite_list.json | default([])
       | selectattr('domain', 'in', adguard_rewrites_removed) | list }}
  loop_control:
    label: "{{ item.domain }} -> {{ item.answer }}"
  changed_when: true

# ── IPv6 answers ──────────────────────────────────────────────────────────────
# The LAN has no IPv6 route, so AAAA answers only make clients try IPv6 first
# and time out (seen as get.k3s.io and setup-terraform download failures in
# CI). With this on, AdGuard answers AAAA queries with no records.
- name: Read AdGuard DNS settings
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ adguard_ui_port }}/control/dns_info"
    url_username: "{{ adguard_api_username }}"
    url_password: "{{ adguard_api_password }}"
    force_basic_auth: true
    return_content: true
  register: adguard_dns_info
  check_mode: false
  when: adguard_api_username | length > 0
  no_log: true

- name: Disable IPv6 (AAAA) resolution in AdGuard
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ adguard_ui_port }}/control/dns_config"
    method: POST
    url_username: "{{ adguard_api_username }}"
    url_password: "{{ adguard_api_password }}"
    force_basic_auth: true
    body_format: json
    body:
      disable_ipv6: true
  when: adguard_dns_info.json is defined and not adguard_dns_info.json.disable_ipv6
  changed_when: true
