---
# Binary installs and unit changes must bounce the service; the in-memory
# process keeps serving DNS from a deleted binary otherwise.
- name: Restart AdGuardHome
  ansible.builtin.systemd:
    name: AdGuardHome
    state: restarted

- name: Restart AdGuard exporter
  ansible.builtin.systemd:
    name: adguard-exporter
    state: restarted
    daemon_reload: true
