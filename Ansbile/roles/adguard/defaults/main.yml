---
# Version of AdGuardHome to install. Upgrade = bump here; the role reinstalls
# the binary and restarts the service.
adguard_version: "v0.107.79"
adguard_install_dir: /opt/adguardhome
adguard_download_base: https://github.com/AdGuardTeam/AdGuardHome/releases/download

# AdGuard admin credentials for the HTTP API (same account the exporter uses;
# supplied by CI from GitHub Actions secrets).
adguard_api_username: "{{ lookup('env', 'ADGUARD_EXPORTER_USERNAME') }}"
adguard_api_password: "{{ lookup('env', 'ADGUARD_EXPORTER_PASSWORD') }}"

# DNS rewrites ensured on every run (names from group_vars/all/local_dns.yml).
adguard_rewrite_answer: "{{ local_dns_ingress_ip }}"
adguard_rewrite_domains: >-
  {{ local_dns_lan_names | map('regex_replace', '$', '.' ~ local_dns_lan_domain) | list
     + ['*.' ~ local_dns_public_domain] }}

# Rewrites deleted if present. The *.homelab.lan wildcard answered any name
# under the search domain, including failed lookups like github.com.homelab.lan.
adguard_rewrites_removed:
  - "*.homelab.lan"
  # Apps retired from the cluster (backends were down).
  - "f1hls.homelab.lan"
  - "homepage.homelab.lan"
  - "jaeger.homelab.lan"
  - "portnote.homelab.lan"
  - "tdarr.homelab.lan"
