# Scraparr runs in k3s (Ansbile/argocd-apps/media/scraparr.yaml) and reads this
# config through a hostPath mount, so a restart is needed to pick up changes.
- name: Restart Scraparr
  ansible.builtin.command:
    cmd: k3s kubectl rollout restart deployment/scraparr -n media
  delegate_to: git-k3s-server
  changed_when: true
