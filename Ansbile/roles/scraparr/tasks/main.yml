- name: Ensure scraparr dir exists
  ansible.builtin.file:
    path: "{{ scraparr_dir }}"
    state: directory
    mode: '0755'

- name: Deploy Scraparr YAML config
  ansible.builtin.template:
    src: "{{ role_path }}/templates/config.yaml.j2"
    dest: "{{ scraparr_dir }}/config.yaml"
    owner: root
    group: root
    mode: '0600'
