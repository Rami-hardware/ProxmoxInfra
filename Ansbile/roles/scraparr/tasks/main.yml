- name: Ensure scraparr dir exists
  ansible.builtin.file:
    path: "{{ scraparr_dir }}"
    state: directory
    mode: '0755'


- name: Deploy Scraparr YAML config
  ansible.builtin.template:
    src: config.yaml.j2          # Jinja template
    dest: "{{ scraparr_dir }}/config.yaml"  # plain YAML file
    owner: root
    group: root
    mode: '0600'
