- name: Ensure scraparr directory exists
  ansible.builtin.file:
    path: "{{ scraparr_dir }}"
    state: directory
    mode: '0755'

- name: Remove old config.yaml if it is a directory
  ansible.builtin.stat:
    path: "{{ scraparr_dir }}/config.yaml"
  register: scraparr_config_stat

- name: Remove old config.yaml directory if needed
  ansible.builtin.file:
    path: "{{ scraparr_dir }}/config.yaml"
    state: absent
  when: scraparr_config_stat.stat.isdir | default(false)

- name: Deploy Scraparr YAML config without Jinja template file
  ansible.builtin.copy:
    dest: "{{ scraparr_dir }}/config.yaml"
    owner: root
    group: root
    mode: '0600'
    content: |
      {% if scraparr_sonarr is defined %}
      sonarr:
        url: "{{ scraparr_sonarr.url }}"
        api_key: "{{ sonarr_api_key }}"
        api_version: v3
      {% endif %}

      {% if scraparr_bazarr is defined %}
      bazarr:
        url: "{{ scraparr_bazarr.url }}"
        api_key: "{{ bazarr_api_key }}"
        api_version: v3
      {% endif %}

      {% if scraparr_prowlarr is defined %}
      prowlarr:
        url: "{{ scraparr_prowlarr.url }}"
        api_key: "{{ prowlarr_api_key }}"
        api_version: v3
      {% endif %}

      {% if scraparr_radarr is defined %}
      radarr:
        url: "{{ scraparr_radarr.url }}"
        api_key: "{{ radarr_api_key }}"
        api_version: v3
      {% endif %}

      {% if scraparr_overseerr is defined %}
      overseerr:
        url: "{{ scraparr_overseerr.url }}"
        api_key: "{{ overseerr_api_key }}"
        api_version: v3
      {% endif %}
