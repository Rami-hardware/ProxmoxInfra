- name: Create Scraparr directory
  ansible.builtin.file:
    path: "{{ scraparr_dir }}"
    state: directory
    mode: '0755'

- name: Deploy Scraparr config
  ansible.builtin.template:
    src: config.cnf.j2
    dest: "{{ scraparr_dir }}/config.cnf"
    owner: root
    group: root
    mode: '0600'
  notify: Restart Scraparr
