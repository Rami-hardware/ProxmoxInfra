---
# Prometheus runs as a k3s pod (hostPath-mounted config from this VM), started
# with --web.enable-lifecycle. Templating the config alone doesn't make the
# running pod pick up changes — hit the reload endpoint so scrape_config edits
# take effect without a pod restart.
- name: Reload Prometheus config
  ansible.builtin.uri:
    url: "http://localhost:{{ prometheus_port }}/-/reload"
    method: POST
    status_code: 200
