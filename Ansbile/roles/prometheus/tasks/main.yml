---
# Prometheus itself runs in k3s (argocd-apps/monitoring/prometheus.yaml) and
# reads /etc/prometheus/prometheus.yml from a hostPath PV backed by
# {{ prometheus_config_dir }} on monitoring-server. This role owns that file.
- name: Ensure Prometheus config directory exists
  ansible.builtin.file:
    path: "{{ prometheus_config_dir }}"
    state: directory
    mode: '0755'

# Backs the prometheus-data-pv hostPath in argocd-apps/monitoring/prometheus.yaml.
# Must exist (owned by 65534/nobody, the user the k3s Prometheus container runs
# as) before the PV is mounted: hostPath type DirectoryOrCreate creates it
# root-owned instead, and kubelet does not apply fsGroup to hostPath volumes —
# the pod then crashes with "mkdir data/: permission denied".
- name: Ensure Prometheus TSDB data directory exists
  ansible.builtin.file:
    path: "{{ prometheus_data_dir }}"
    state: directory
    owner: '65534'
    group: '65534'
    mode: '0755'

- name: Template Prometheus config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_file }}"
    mode: '0644'
    validate: "sh -c 'command -v promtool >/dev/null 2>&1 && promtool check config %s || true'"
  notify: Reload Prometheus

- name: Template Prometheus alert rules
  ansible.builtin.template:
    src: prometheus-rules.yml.j2
    dest: "{{ prometheus_rules_file }}"
    mode: '0644'
  notify: Reload Prometheus
