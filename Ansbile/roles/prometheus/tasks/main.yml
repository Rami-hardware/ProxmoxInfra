---
- name: Ensure Prometheus config directory exists
  ansible.builtin.file:
    path: "{{ prometheus_config_dir }}"
    state: directory
    mode: '0755'

- name: Ensure Prometheus rules directory exists
  ansible.builtin.file:
    path: "{{ prometheus_config_dir }}/rules"
    state: directory
    mode: '0755'

- name: Template Prometheus config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_file }}"
    mode: '0644'

- name: Template Prometheus alert rules
  ansible.builtin.template:
    src: rules.yml.j2
    dest: "{{ prometheus_config_dir }}/rules/rules.yml"
    mode: '0644'
