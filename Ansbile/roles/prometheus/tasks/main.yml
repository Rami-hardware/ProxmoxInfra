- name: Ensure Prometheus config directory exists
  ansible.builtin.file:
    path: /opt/docker/prometheus
    state: directory
    mode: '0755'

- name: Create Prometheus config file with minimal valid config
  ansible.builtin.copy:
    dest: /opt/docker/prometheus/prometheus.yml
    mode: '0644'
    force: true
    content: |
      global:
        scrape_interval: 15s

      scrape_configs:
        - job_name: 'prometheus'
          static_configs:
            - targets: ['localhost:9090']

        - job_name: 'gateway_node'
          static_configs:
            - targets: ['192.168.1.200:9100']

        - job_name: 'media_node'
          static_configs:
            - targets: ['192.168.1.201:9100']

        - job_name: 'game_node'
          static_configs:
            - targets: ['192.168.1.202:9100']

        - job_name: 'monitoring_node'
          static_configs:
            - targets: ['192.168.1.203:9100']

        - job_name: 'Loki'
          static_configs:
            - targets: ['192.168.1.203:3100']

        - job_name: 'qbittorrent'
          static_configs:
            - targets: [ '192.168.1.201:17871' ]

        - job_name: 'cAdvisor'
          metrics_path: /metrics
          static_configs:
            - targets:
                - 192.168.1.201:8081
