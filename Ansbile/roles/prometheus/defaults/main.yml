---
prometheus_config_dir: /opt/docker/prometheus
prometheus_config_file: "{{ prometheus_config_dir }}/prometheus.yml"
prometheus_scrape_interval: 15s
prometheus_evaluation_interval: 15s
prometheus_retention_time: 30d

prometheus_alertmanager_host: localhost
prometheus_alertmanager_port: 9093

# List of scrape jobs. Each entry:
#   name            - job_name
#   targets         - list of host:port strings
#   scrape_interval - (optional) override global interval
#   scrape_timeout  - (optional) override global timeout
prometheus_scrape_jobs: []

# Alert thresholds
prometheus_alert_load_threshold: 9      # node_load15; ~75% of 12 logical CPUs (i5-10400F)
prometheus_alert_memory_threshold: 90   # percent
prometheus_alert_disk_threshold: 85     # percent
