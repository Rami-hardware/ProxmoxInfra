---
- name: Check if Loki config.yml exists and is a directory
  ansible.builtin.stat:
    path: "{{ loki_config_dir }}/config.yml"
  register: loki_config_stat

- name: Remove Loki config.yml if it is a directory
  ansible.builtin.file:
    path: "{{ loki_config_dir }}/config.yml"
    state: absent
  when: loki_config_stat.stat.exists and loki_config_stat.stat.isdir

- name: Ensure Loki config directory exists
  ansible.builtin.file:
    path: "{{ loki_config_dir }}"
    state: directory
    mode: '0755'

- name: Ensure Loki data directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop: "{{ loki_data_dirs }}"

# Backs loki-data-pv (hostPath, mounted at /loki in the k3s pod). kubelet's
# DirectoryOrCreate creates this as root:root and fsGroup is not applied to
# hostPath volumes — without correct ownership the pod crashloops with
# "mkdir /loki/chunks: permission denied".
- name: Ensure Loki PV data directory is owned by the loki user
  ansible.builtin.file:
    path: "{{ loki_data_dir }}"
    state: directory
    owner: "{{ loki_data_dir_uid }}"
    group: "{{ loki_data_dir_gid }}"
    mode: '0755'

- name: Template Loki config
  ansible.builtin.template:
    src: loki.yml.j2
    dest: "{{ loki_config_dir }}/config.yml"
    mode: '0644'
    force: true

- name: Ensure Loki rules directory exists
  ansible.builtin.file:
    path: "{{ loki_config_dir }}/rules/fake"
    state: directory
    mode: '0755'

- name: Template Loki ruler rules
  ansible.builtin.template:
    src: loki-rules.yml.j2
    dest: "{{ loki_config_dir }}/rules/fake/rules.yml"
    mode: '0644'
    force: true
