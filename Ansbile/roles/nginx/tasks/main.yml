- name: Remove wrongly created default.conf directory if it exists
  ansible.builtin.file:
    path: /opt/services/default.conf
    state: absent

- name: Deploy Nginx reverse proxy config
  ansible.builtin.copy:
    dest: /opt/services/default.conf
    mode: '0644'
    content: |
        server {
            listen 81 default_server;
            listen [::]:81 default_server;
            root /var/www/html;
            index index.html index.htm index.nginx-debian.html;
            server_name _;
            location / {
                try_files $uri $uri/ =404;
            }
            location /nginx_status {
                stub_status;
                allow 127.0.0.1;
                deny all;
            }
        }
        server {
            listen 80;
            server_name uptime.respawnxd.co;
            location / {
                proxy_pass http://192.168.1.200:3001;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
        server {
            listen 80;
            server_name portainer.respawnxd.co;
