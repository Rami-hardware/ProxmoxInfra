- name: Ensure pip3 is installed
  ansible.builtin.package:
    name: python3-pip
    state: present

- name: Ensure Python venv directory exists
  ansible.builtin.file:
    path: /opt/ansible_venv
    state: directory

- name: Create a Python virtual environment
  ansible.builtin.command: python3 -m venv /opt/ansible_venv
  args:
    creates: /opt/ansible_venv/bin/activate

- name: Install Docker SDK in virtual environment
  ansible.builtin.command: /opt/ansible_venv/bin/pip install docker>=5.0.0
  args:
    creates: /opt/ansible_venv/lib/python3.12/site-packages/docker

- name: Set ansible_python_interpreter to use venv
  ansible.builtin.set_fact:
    ansible_python_interpreter: /opt/ansible_venv/bin/python
- name: Ensure Docker SDK for Python is installed
  ansible.builtin.pip:
    name: docker
    state: present
    executable: pip3

- name: Ensure Docker Compose directory exists
  ansible.builtin.file:
    path: "{{ docker_apps_compose_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Template Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ docker_apps_compose_file }}"
    mode: "0644"
    force: true

- name: Initialize CrowdSec variables
  ansible.builtin.set_fact:
    docker_apps_crowdsec_exists: false
    docker_apps_crowdsec_nginx_bouncer_exists: false
    docker_apps_crowdsec_nginx_bouncer_key: ''

- name: Ensure nginx bouncer API key fact is defined
  ansible.builtin.set_fact:
    docker_apps_crowdsec_nginx_bouncer_key: >-
      {{
        docker_apps_crowdsec_nginx_bouncer_key_cmd.stdout | trim
        if docker_apps_crowdsec_nginx_bouncer_key_cmd is defined
        else (lookup('file', '/opt/docker/crowdsec/nginx-bouncer.key') 
              if (docker_apps_crowdsec_nginx_bouncer_exists | default(false)) 
              else 'DUMMY_KEY')
      }}

- name: Ensure nginx bouncer API key fact is defined
  ansible.builtin.set_fact:
    docker_apps_crowdsec_nginx_bouncer_key: >-
      {{
        docker_apps_crowdsec_nginx_bouncer_key_cmd.stdout | trim
        if docker_apps_crowdsec_nginx_bouncer_key_cmd is defined
        else lookup('file', '/opt/docker/crowdsec/nginx-bouncer.key')
        if (docker_apps_crowdsec_nginx_bouncer_exists) else 'DUMMY_KEY'
      }}

- name: Create Docker secret from key file
  community.docker.docker_secret:
    name: crowdsec_nginx_bouncer_key
    state: present
    data_src: /opt/docker/crowdsec/nginx-bouncer.key

- name: Start Docker Compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ docker_apps_compose_dir }}"
    state: present

# Wait for CrowdSec to be running
- name: Wait for CrowdSec container to be running
  ansible.builtin.command: docker inspect -f '{{ "{{.State.Running}}" }}' crowdsec
  register: docker_apps_crowdsec_running
  retries: 10
  delay: 5
  until: docker_apps_crowdsec_running.stdout == "true"
  changed_when: false

- name: Check if CAPI credentials exist
  ansible.builtin.stat:
    path: /etc/crowdsec/online_api_credentials.yaml
  register: docker_apps_crowdsec_capi_file

- name: Register CrowdSec CAPI if missing
  ansible.builtin.command: docker exec crowdsec cscli capi register
  when: not docker_apps_crowdsec_capi_file.stat.exists
  changed_when: true

# Check if Nginx bouncer exists
- name: Check if nginx bouncer exists
  ansible.builtin.command: docker exec crowdsec cscli bouncers list -o json
  register: docker_apps_crowdsec_bouncers_json
  changed_when: false

- name: Set fact if nginx bouncer exists
  ansible.builtin.set_fact:
    docker_apps_crowdsec_nginx_bouncer_exists: >-
      {{
        (docker_apps_crowdsec_bouncers_json.stdout | from_json
         | selectattr('name', 'equalto', 'nginx-bouncer')
         | list | length) > 0
      }}

- name: Create nginx bouncer and get API key
  ansible.builtin.command: docker exec crowdsec cscli bouncers add nginx-bouncer -o raw
  register: docker_apps_crowdsec_nginx_bouncer_key_cmd
  when: not docker_apps_crowdsec_nginx_bouncer_exists
  changed_when: true

- name: Set nginx bouncer API key fact
  ansible.builtin.set_fact:
    docker_apps_crowdsec_nginx_bouncer_key: "{{ docker_apps_crowdsec_nginx_bouncer_key_cmd.stdout | trim }}"
  when: not docker_apps_crowdsec_nginx_bouncer_exists

# Save key to file for Docker secret
- name: Ensure /opt/docker/crowdsec directory exists
  ansible.builtin.file:
    path: /opt/docker/crowdsec
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Save nginx bouncer API key to file
  ansible.builtin.copy:
    dest: /opt/docker/crowdsec/nginx-bouncer.key
    content: "{{ docker_apps_crowdsec_nginx_bouncer_key | default('DUMMY_KEY') }}"
    owner: root
    group: root
    mode: "0600"
  when: not docker_apps_crowdsec_nginx_bouncer_exists
