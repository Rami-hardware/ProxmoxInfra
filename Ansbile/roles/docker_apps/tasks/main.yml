# --------------------------------------------
# CrowdSec + Nginx Bouncer Setup (docker_apps)
# --------------------------------------------

# Initialize variables
- name: Initialize CrowdSec Nginx Bouncer existence fact
  ansible.builtin.set_fact:
    docker_apps_crowdsec_nginx_bouncer_exists: false

- name: Check if CrowdSec container exists
  ansible.builtin.command: docker ps -a --format '{{ "{{.Names}}" }}'
  register: docker_apps_containers
  changed_when: false

- name: Set fact if CrowdSec container exists
  ansible.builtin.set_fact:
    docker_apps_crowdsec_exists: "{{ 'crowdsec' in docker_apps_containers.stdout_lines }}"

- name: Fail if CrowdSec container is missing
  ansible.builtin.fail:
    msg: "CrowdSec container is not yet created. Make sure your Docker Compose includes it."
  when: not docker_apps_crowdsec_exists

- name: Ensure CrowdSec container is running
  ansible.builtin.command: docker inspect -f '{{ "{{.State.Running}}" }}' crowdsec
  register: docker_apps_crowdsec_running
  failed_when: docker_apps_crowdsec_running.stdout != "true"
  changed_when: false
  when: docker_apps_crowdsec_exists

# ------------------------------------------------------------
# Ensure CrowdSec CAPI is registered
# ------------------------------------------------------------
- name: Check if CAPI credentials exist
  ansible.builtin.stat:
    path: /etc/crowdsec/online_api_credentials.yaml
  register: docker_apps_crowdsec_capi_file

- name: Register CrowdSec CAPI if missing
  ansible.builtin.command: docker exec crowdsec cscli capi register
  when: not docker_apps_crowdsec_capi_file.stat.exists
  changed_when: true

# ------------------------------------------------------------
# Check and create Nginx bouncer
# ------------------------------------------------------------
- name: Check if nginx bouncer exists
  ansible.builtin.command: docker exec crowdsec cscli bouncers list -o json
  register: docker_apps_crowdsec_bouncers_json
  changed_when: false

- name: Set fact if nginx bouncer exists
  ansible.builtin.set_fact:
    docker_apps_crowdsec_nginx_bouncer_exists: >-
      {{
        (docker_apps_crowdsec_bouncers_json.stdout | from_json
         | selectattr('name', 'equalto', 'nginx-bouncer')
         | list | length) > 0
      }}

- name: Create nginx bouncer and get API key
  ansible.builtin.command: docker exec crowdsec cscli bouncers add nginx-bouncer -o raw
  register: docker_apps_crowdsec_nginx_bouncer_key_cmd
  when: not docker_apps_crowdsec_nginx_bouncer_exists
  changed_when: true

- name: Set nginx bouncer API key fact
  ansible.builtin.set_fact:
    docker_apps_crowdsec_nginx_bouncer_key: "{{ docker_apps_crowdsec_nginx_bouncer_key_cmd.stdout | trim }}"
  when: not docker_apps_crowdsec_nginx_bouncer_exists

- name: Fail if nginx bouncer key is missing
  ansible.builtin.fail:
    msg: "CrowdSec nginx bouncer API key could not be created!"
  when:
    - not docker_apps_crowdsec_nginx_bouncer_exists
    - docker_apps_crowdsec_nginx_bouncer_key | default('') == ''

# Ensure directory exists for secret
- name: Ensure /opt/docker/crowdsec directory exists
  ansible.builtin.file:
    path: /opt/docker/crowdsec
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Save nginx bouncer API key to file
  ansible.builtin.copy:
    dest: /opt/docker/crowdsec/nginx-bouncer.key
    content: "{{ docker_apps_crowdsec_nginx_bouncer_key | default('DUMMY_KEY') }}"
    owner: root
    group: root
    mode: "0600"
  when: not docker_apps_crowdsec_nginx_bouncer_exists

# ------------------------------------------------------------
# Prepare Docker Compose environment
# ------------------------------------------------------------
- name: Ensure Docker Compose directory exists
  ansible.builtin.file:
    path: "{{ docker_apps_compose_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Template Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ docker_apps_compose_file }}"
    mode: "0644"
    force: true

- name: Bring down existing Docker Compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ docker_apps_compose_dir }}"
    state: absent
  changed_when: false
  failed_when: false

# ------------------------------------------------------------
# Start Docker Compose stack
# ------------------------------------------------------------
- name: Start Docker Compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ docker_apps_compose_dir }}"
    state: present
