# Host side of Intel Arc passthrough on the media VM: VA-API drivers and tools
# from the Ubuntu archive, plus render-node access. Jellyfin runs in k3s and
# brings its own userspace drivers, so the host only needs /dev/dri working.

# A universe-only list added by an earlier version of this role duplicates
# what ubuntu.sources already ships and makes every apt update warn.
- name: Remove duplicate universe apt source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/archive_ubuntu_com_universe.list
    state: absent

- name: Install Intel GPU packages
  ansible.builtin.apt:
    name: "{{ intel_arc_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add media user to video and render groups
  ansible.builtin.user:
    name: media
    groups: video,render
    append: true
