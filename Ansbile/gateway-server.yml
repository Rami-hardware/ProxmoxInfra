---
- name: Deploy to Gateway Server
  hosts: gateway-server
  become: true
  roles:
    - { role: ssh_access, tags: [ssh_access] }
    - { role: common, tags: [common] }
    - { role: adguard, tags: [adguard] }
    - { role: nginx_config, tags: [nginx_config] }
    - { role: ufw, tags: [ufw] }
    - { role: k3s_agent, tags: [k3s_agent] }
