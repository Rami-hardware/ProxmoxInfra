- name: Deploy to Gateway Server
  hosts: gateway-server
  become: true

  pre_tasks:
    - name: Stop and disable nginx systemd service if running (migrating to K3s hostPort)
      ansible.builtin.service:
        name: nginx
        state: stopped
        enabled: false
      failed_when: false

    - name: Stop Docker nginx container if running (migrating to K3s hostPort)
      ansible.builtin.command:
        cmd: docker rm -f nginx
      failed_when: false
      changed_when: false

  roles:
    # - DNS
    # - docker_setup
    # - promtail
    # - docker_apps
    # - nginx_config
    # - adguard
    # - crowdsec
    # - ufw
    - k3s_agent
