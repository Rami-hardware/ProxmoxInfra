---
docker_apps_enabled:
  - promtail
  - loki
  - grafana
  - alertmanager
  - prometheus
  - node-exporter
  - speedtest-exporter

# ── Prometheus ────────────────────────────────────────────────────────────────
prometheus_config_dir: /opt/docker/prometheus
prometheus_config_file: "{{ prometheus_config_dir }}/prometheus.yml"
prometheus_scrape_interval: 15s

prometheus_scrape_jobs:
  - name: prometheus
    targets: ["localhost:9090"]
  - name: gateway_node
    targets: ["{{ hostvars['gateway-server']['ansible_host'] }}:9100"]
  - name: media_node
    targets: ["{{ hostvars['media-server']['ansible_host'] }}:9100"]
  - name: monitoring_node
    targets: ["{{ hostvars['monitoring-server']['ansible_host'] }}:9100"]
  - name: loki
    targets: ["{{ hostvars['monitoring-server']['ansible_host'] }}:3100"]
  - name: qbittorrent
    targets: ["{{ hostvars['media-server']['ansible_host'] }}:17871"]
  - name: cadvisor
    targets: ["{{ hostvars['media-server']['ansible_host'] }}:8081"]
  - name: docker_exporter
    targets: ["{{ hostvars['media-server']['ansible_host'] }}:9417"]
  - name: nginx_prometheus_exporter
    targets: ["{{ hostvars['monitoring-server']['ansible_host'] }}:9113"]
  - name: scraparr
    targets: ["{{ hostvars['media-server']['ansible_host'] }}:7100"]
  - name: intel_gpu
    targets: ["{{ hostvars['media-server']['ansible_host'] }}:8082"]
  - name: promtail
    targets: ["{{ hostvars['media-server']['ansible_host'] }}:9080"]
  - name: speedtest
    targets: ["{{ hostvars['monitoring-server']['ansible_host'] }}:9798"]
    scrape_interval: 1h
    scrape_timeout: 1m

# ── Loki ──────────────────────────────────────────────────────────────────────
loki_config_dir: /opt/docker/loki
loki_http_port: 3100

# ── Alertmanager ──────────────────────────────────────────────────────────────
alertmanager_config_dir: /opt/docker/alertmanager
alertmanager_webhook_url: "http://192.168.1.203:3002/Alertmanager"
alertmanager_resolve_timeout: 5m
alertmanager_group_wait: 30s
alertmanager_group_interval: 5m
alertmanager_repeat_interval: 3h

# ── Grafana ───────────────────────────────────────────────────────────────────
grafana_data_dir: /opt/docker/grafana
grafana_provisioning_dir: /opt/docker/grafana/provisioning/datasources

grafana_datasources:
  - name: Prometheus
    type: prometheus
    url: http://192.168.1.203:9090
    default: true
  - name: Loki
    type: loki
    url: http://192.168.1.203:3100
    default: false

# ── Promtail ──────────────────────────────────────────────────────────────────
promtail_config_dir: /opt/services/promtail
