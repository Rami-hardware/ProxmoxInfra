---
# ── Prometheus ────────────────────────────────────────────────────────────────
prometheus_config_dir: /opt/docker/prometheus
prometheus_config_file: "{{ prometheus_config_dir }}/prometheus.yml"
prometheus_scrape_interval: 15s

prometheus_scrape_jobs:
  - name: prometheus
    targets: ["localhost:9090"]
  - name: nodes
    targets:
      - "{{ hostvars['gateway-server']['ansible_host'] }}:9100"
      - "{{ hostvars['media-server']['ansible_host'] }}:9100"
      - "{{ hostvars['monitoring-server']['ansible_host'] }}:9100"
      - "{{ hostvars['git-k3s-server']['ansible_host'] }}:9100"
      - "{{ hostvars['host-node']['ansible_host'] }}:9100"
    labels:
      os: linux
    relabel_configs:
      - source_labels: [__address__]
        regex: "{{ hostvars['gateway-server']['ansible_host'] }}:.*"
        target_label: instance
        replacement: "gateway-server"
      - source_labels: [__address__]
        regex: "{{ hostvars['media-server']['ansible_host'] }}:.*"
        target_label: instance
        replacement: "media-server"
      - source_labels: [__address__]
        regex: "{{ hostvars['monitoring-server']['ansible_host'] }}:.*"
        target_label: instance
        replacement: "monitoring-server"
      - source_labels: [__address__]
        regex: "{{ hostvars['git-k3s-server']['ansible_host'] }}:.*"
        target_label: instance
        replacement: "git-k3s-server"
      - source_labels: [__address__]
        regex: "{{ hostvars['host-node']['ansible_host'] }}:.*"
        target_label: instance
        replacement: "host-node"
  - name: loki
    targets: ["{{ hostvars['monitoring-server']['ansible_host'] }}:3100"]
    labels:
      release: "prometheus"
    relabel_configs:
      - target_label: instance
        replacement: monitoring-server
  - name: qbittorrent
    targets: ["{{ hostvars['media-server']['ansible_host'] }}:17871"]
    relabel_configs:
      - target_label: instance
        replacement: media-server
  - name: adguard
    targets: ["{{ hostvars['gateway-server']['ansible_host'] }}:9618"]
    relabel_configs:
      - target_label: instance
        replacement: gateway-server
  - name: kube-state-metrics
    targets: ["{{ hostvars['git-k3s-server']['ansible_host'] }}:8083"]
    relabel_configs:
      - target_label: instance
        replacement: git-k3s-server
  - name: kubelet-cadvisor
    scheme: https
    metrics_path: /metrics/cadvisor
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      insecure_skip_verify: true
    targets:
      - "{{ hostvars['git-k3s-server']['ansible_host'] }}:10250"
      - "{{ hostvars['media-server']['ansible_host'] }}:10250"
      - "{{ hostvars['monitoring-server']['ansible_host'] }}:10250"
    relabel_configs:
      - source_labels: [__address__]
        regex: "{{ hostvars['git-k3s-server']['ansible_host'] }}:.*"
        target_label: instance
        replacement: "git-k3s-server"
      - source_labels: [__address__]
        regex: "{{ hostvars['media-server']['ansible_host'] }}:.*"
        target_label: instance
        replacement: "media-server"
      - source_labels: [__address__]
        regex: "{{ hostvars['monitoring-server']['ansible_host'] }}:.*"
        target_label: instance
        replacement: "monitoring-server"
  - name: scraparr
    targets: ["{{ hostvars['media-server']['ansible_host'] }}:7100"]
    relabel_configs:
      - target_label: instance
        replacement: media-server
  - name: intel_gpu
    targets: ["{{ hostvars['media-server']['ansible_host'] }}:8082"]
    relabel_configs:
      - target_label: instance
        replacement: media-server
  - name: zfs_exporter
    targets: ["{{ hostvars['host-node']['ansible_host'] }}:9134"]
    relabel_configs:
      - target_label: instance
        replacement: host-node
  - name: ingress-nginx
    targets: ["{{ hostvars['git-k3s-server']['ansible_host'] }}:10254"]
    relabel_configs:
      - target_label: instance
        replacement: git-k3s-server
  - name: istio-mesh
    metrics_path: /stats/prometheus
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_container_name]
        action: keep
        regex: istio-proxy
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: '([^:]+)(?::\d+)?;(\d+)'
        replacement: '$1:$2'
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  # cert-manager's controller exposes certificate expiry metrics
  # (certmanager_certificate_expiration_timestamp_seconds, etc.) natively —
  # no separate exporter needed, just scrape its pod.
  - name: cert-manager
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace]
        action: keep
        regex: cert-manager
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: keep
        regex: cert-manager
      - source_labels: [__address__]
        action: replace
        regex: '([^:]+)(?::\d+)?'
        replacement: '$1:9402'
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  # Alertmanager exposes its own /metrics natively on the same port as its
  # UI/API — no separate exporter needed, just scrape the pod.
  - name: alertmanager-internal
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace]
        action: keep
        regex: monitoring
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: alertmanager
      - source_labels: [__address__]
        action: replace
        regex: '([^:]+)(?::\d+)?'
        replacement: '$1:9093'
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - target_label: instance
        replacement: monitoring-server

  # K3s ships CoreDNS with the prometheus plugin enabled on :9153 by
  # default — no separate exporter needed, just scrape the pod.
  - name: coredns
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace]
        action: keep
        regex: kube-system
      - source_labels: [__meta_kubernetes_pod_label_k8s_app]
        action: keep
        regex: kube-dns
      - source_labels: [__address__]
        action: replace
        regex: '([^:]+)(?::\d+)?'
        replacement: '$1:9153'
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - target_label: instance
        replacement: git-k3s-server

  - name: speedtest
    targets: ["{{ hostvars['monitoring-server']['ansible_host'] }}:9798"]
    scrape_interval: 10m
    scrape_timeout: 2m
    relabel_configs:
      - target_label: instance
        replacement: monitoring-server

  - name: promtail
    targets:
      - "{{ hostvars['gateway-server']['ansible_host'] }}:9080"
      - "{{ hostvars['media-server']['ansible_host'] }}:9080"
      - "{{ hostvars['monitoring-server']['ansible_host'] }}:9080"
      - "{{ hostvars['git-k3s-server']['ansible_host'] }}:9080"
    relabel_configs:
      - source_labels: [__address__]
        regex: "{{ hostvars['gateway-server']['ansible_host'] }}:.*"
        target_label: instance
        replacement: "gateway-server"
      - source_labels: [__address__]
        regex: "{{ hostvars['media-server']['ansible_host'] }}:.*"
        target_label: instance
        replacement: "media-server"
      - source_labels: [__address__]
        regex: "{{ hostvars['monitoring-server']['ansible_host'] }}:.*"
        target_label: instance
        replacement: "monitoring-server"
      - source_labels: [__address__]
        regex: "{{ hostvars['git-k3s-server']['ansible_host'] }}:.*"
        target_label: instance
        replacement: "git-k3s-server"

# ── Loki ──────────────────────────────────────────────────────────────────────
loki_config_dir: /opt/docker/loki
loki_http_port: 3100

# ── Alertmanager ──────────────────────────────────────────────────────────────
alertmanager_config_dir: /opt/docker/alertmanager
alertmanager_webhook_url: "http://192.168.1.203:30302/alertmanager"
alertmanager_resolve_timeout: 5m
alertmanager_group_wait: 30s
alertmanager_group_interval: 5m
alertmanager_repeat_interval: 3h

# ── Grafana ───────────────────────────────────────────────────────────────────
grafana_data_dir: /opt/docker/grafana
grafana_provisioning_dir: /opt/docker/grafana/provisioning/datasources

grafana_datasources:
  - name: Prometheus
    type: prometheus
    url: http://192.168.1.203:9090
    default: true
  - name: Loki
    type: loki
    url: http://192.168.1.203:3100
    default: false
  - name: Tempo
    type: tempo
    url: "http://{{ hostvars['git-k3s-server']['ansible_host'] }}:30320"
    default: false

# ── Promtail ──────────────────────────────────────────────────────────────────
promtail_config_dir: /opt/services/promtail
