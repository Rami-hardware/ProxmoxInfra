---
k3s_apps_list:
  - name: overseerr
    namespace: media
    image: sctx/overseerr:latest
    port: 5055
    node_port: 5055
    target_node: media-server
    config_path: /opt/overseer
    config_mount: /app/config
    replicas: 2
    env:
      - { name: TZ, value: "Asia/Riyadh" }
    memory_request: "256Mi"
    memory_limit: "1Gi"
    cpu_request: "200m"
    cpu_limit: "1000m"

  - name: jellyfin
    namespace: media
    image: jellyfin/jellyfin:latest
    port: 8096
    node_port: 8096
    target_node: media-server
    config_path: /opt/jellyfin
    config_mount: /config
    replicas: 1
    gpu: true
    extra_volumes:
      - name: media
        host_path: /mnt/media
        mount_path: /media
      - name: cache
        host_path: /opt/jellyfin/cache
        mount_path: /cache
    env:
      - { name: TZ, value: "Asia/Riyadh" }
      - { name: LIBVA_DRIVER_NAME, value: "iHD" }
      - { name: VAAPI_DEVICE, value: "/dev/dri/renderD128" }
      - { name: JELLYFIN_HWACCEL, value: "vaapi" }
    memory_request: "512Mi"
    memory_limit: "4Gi"
    cpu_request: "500m"
    cpu_limit: "3000m"

  - name: bazarr
    namespace: media
    image: linuxserver/bazarr:latest
    port: 6767
    node_port: 6767
    target_node: media-server
    config_path: /opt/bazarr
    config_mount: /config
    replicas: 1
    extra_volumes:
      - name: tv
        host_path: /mnt/media/tv
        mount_path: /tv
      - name: movies
        host_path: /mnt/media/movies
        mount_path: /movies
    env:
      - { name: TZ, value: "Asia/Riyadh" }
      - { name: PUID, value: "1000" }
      - { name: PGID, value: "1000" }
    memory_request: "256Mi"
    memory_limit: "1Gi"
    cpu_request: "200m"
    cpu_limit: "1000m"

  - name: radarr
    namespace: media
    image: linuxserver/radarr:latest
    port: 7878
    node_port: 7878
    target_node: media-server
    config_path: /opt/radarr
    config_mount: /config
    replicas: 2
    extra_volumes:
      - name: movies
        host_path: /mnt/media/movies
        mount_path: /movies
      - name: download
        host_path: /mnt/media/download
        mount_path: /downloads
    env:
      - { name: TZ, value: "Asia/Riyadh" }
      - { name: PUID, value: "1000" }
      - { name: PGID, value: "1000" }
    memory_request: "256Mi"
    memory_limit: "1Gi"
    cpu_request: "200m"
    cpu_limit: "1000m"
