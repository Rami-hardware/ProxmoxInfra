---
prometheus_retention_time: 30d

adguard_exporter_username: "{{ lookup('env', 'ADGUARD_EXPORTER_USERNAME') | default('', true) }}"
adguard_exporter_password: "{{ lookup('env', 'ADGUARD_EXPORTER_PASSWORD') | default('', true) }}"

k3s_apps_list:
  # overseerr, jellyfin, bazarr, radarr, prowlarr, qbittorrent, flaresolverr,
  # scraparr are now managed by ArgoCD — see Ansbile/argocd-apps/media/

  - name: intel-gpu-exporter
    namespace: monitoring
    image: ghcr.io/onedr0p/intel-gpu-exporter:rolling
    port: 8080
    node_port: 8082
    target_node: media-server
    skip_pv: true
    privileged: true
    replicas: 1
    extra_volumes:
      - name: dri
        host_path: /dev/dri
        mount_path: /dev/dri
    env:
      - { name: TZ, value: "Asia/Riyadh" }
    memory_request: "32Mi"
    memory_limit: "128Mi"
    cpu_request: "25m"
    cpu_limit: "100m"

  - name: qbittorrent-exporter
    namespace: monitoring
    image: esanchezm/prometheus-qbittorrent-exporter:latest
    port: 8000
    node_port: 17871
    target_node: media-server
    skip_pv: true
    replicas: 1
    env:
      - name: QBITTORRENT_HOST
        value: "192.168.1.201"
      - name: QBITTORRENT_PORT
        value: "8080"
      - name: QBITTORRENT_USERNAME
        value: "{{ qbittorrent_exporter_username }}"
      - name: QBITTORRENT_PASSWORD
        value: "{{ qbittorrent_exporter_password }}"
    memory_request: "32Mi"
    memory_limit: "128Mi"
    cpu_request: "25m"
    cpu_limit: "100m"

  - name: sonarr
    namespace: media
    image: linuxserver/sonarr:latest
    port: 8989
    node_port: 8989
    target_node: media-server
    config_path: /opt/sonarr
    config_mount: /config
    dns_policy: None
    dns_nameservers:
      - "10.43.0.10"
      - "8.8.8.8"
      - "8.8.4.4"
    replicas: 1
    extra_volumes:
      - name: tv
        host_path: /mnt/media/tv
        mount_path: /tv
      - name: download
        host_path: /mnt/media/download
        mount_path: /downloads
    env:
      - { name: TZ, value: "Asia/Riyadh" }
      - { name: PUID, value: "1000" }
      - { name: PGID, value: "1000" }
    memory_request: "128Mi"
    memory_limit: "512Mi"
    cpu_request: "50m"
    cpu_limit: "500m"

  # grafana, prometheus, loki, alertmanager, speedtest-exporter are now
  # managed by ArgoCD — see Ansbile/argocd-apps/monitoring/

  - name: adguard-home
    namespace: network
    image: adguard/adguardhome:latest
    target_node: gateway-server
    skip_pv: true
    host_network: true
    dns_policy: None
    dns_nameservers:
      - "10.43.0.10"
      - "8.8.8.8"
      - "8.8.4.4"
    replicas: 1
    port: 8081
    node_port: 8081
    external_ip: 192.168.1.200
    extra_volumes:
      - name: conf
        host_path: /opt/adguardhome/conf
        mount_path: /opt/adguardhome/conf
      - name: work
        host_path: /opt/adguardhome/work
        mount_path: /opt/adguardhome/work
    memory_request: "128Mi"
    memory_limit: "512Mi"
    cpu_request: "100m"
    cpu_limit: "500m"

  - name: adguard-exporter
    namespace: monitoring
    image: ghcr.io/henrywhitaker3/adguard-exporter:latest
    port: 9618
    node_port: 9618
    target_node: gateway-server
    skip_pv: true
    replicas: 1
    env:
      - name: ADGUARD_SERVERS
        value: "192.168.1.200:8081"
      - name: ADGUARD_USERNAMES
        value: "{{ adguard_exporter_username }}"
      - name: ADGUARD_PASSWORDS
        value: "{{ adguard_exporter_password }}"
      - name: INTERVAL
        value: "15s"
    memory_request: "32Mi"
    memory_limit: "128Mi"
    cpu_request: "25m"
    cpu_limit: "100m"
