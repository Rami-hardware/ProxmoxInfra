service_tcp_ports:
  - 53     # AdGuard DNS
  - 80     # HTTP
  - 443    # HTTPS
  - 3000   # Grafana NodePort
  - 8081   # AdGuard UI
  - 9080   # Promtail metrics

# AdGuardHome runs as a pinned systemd service managed by the `adguard` role
# (binary at /opt/adguardhome), not in a container: it owns port 53.
adguard_config_path: "/opt/adguardhome/conf/AdGuardHome.yaml"
adguard_conf_dir: "/opt/adguardhome/conf"
adguard_work_dir: "/opt/adguardhome/work"
adguard_ui_port: 8081
fallback_dns: 1.1.1.1

# Split-horizon DNS: both zones resolve to the ingress-nginx MetalLB IP
# (k3s_apps_ingress_nginx_ip) for LAN clients. Outside the LAN,
# *.darkestserver.com still resolves to Cloudflare.
adguard_rewrites:
  - { domain: "*.homelab.lan", answer: "192.168.10.210" }
  - { domain: "*.darkestserver.com", answer: "192.168.10.210" }

nginx_services:
  - name: jellyfin
    ip: 192.168.10.201
    port: 8096
    disable_buffering: true
    streaming: true
    namespace: media
    cache_paths:
      - /Items
      - /web
    cache_ttl: "7d"

  - name: seerr
    ip: 192.168.10.201
    port: 5055
    namespace: media

  - name: adguard
    ip: 192.168.10.200
    port: 8081
    namespace: network
    k8s_service: adguard-home

