service_tcp_ports:
  - 53     # AdGuard DNS
  - 80     # HTTP
  - 443    # HTTPS
  - 3000   # Grafana NodePort
  - 8081   # AdGuard UI
  - 9080   # Promtail metrics

# AdGuardHome runs as a pinned systemd service managed by the `adguard` role
# (binary at /opt/adguardhome), not in a container: it owns port 53.
adguard_config_path: "/opt/adguardhome/conf/AdGuardHome.yaml"
adguard_conf_dir: "/opt/adguardhome/conf"
adguard_work_dir: "/opt/adguardhome/work"
adguard_ui_port: 8081
fallback_dns: 1.1.1.1

# Ingress routes. An entry with `ip` is not a pod (AdGuard on the gateway,
# the Proxmox UI) and gets a headless -ext Service pointing at ip:port. Any
# other entry is routed to the Kubernetes Service `service` (default: name)
# on `port`, so ingress-nginx balances over ready pod endpoints directly.
nginx_services:
  - name: jellyfin
    port: 8096
    disable_buffering: true
    streaming: true
    namespace: media
    cache_paths:
      - /Items
      - /web
    cache_ttl: "7d"

  - name: seerr
    port: 5055
    namespace: media

  - name: adguard
    ip: 192.168.10.200
    port: 8081
    namespace: network
    k8s_service: adguard-home

nginx_services_local:
