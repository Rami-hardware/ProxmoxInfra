# API keys rendered into the Scraparr config (roles/scraparr). Supplied by CI
# as environment variables from GitHub Actions secrets.
sonarr_api_key: "{{ lookup('env', 'SONARR_API_KEY') | default('', true) }}"
bazarr_api_key: "{{ lookup('env', 'BAZARR_API_KEY') | default('', true) }}"
prowlarr_api_key: "{{ lookup('env', 'PROWLARR_API_KEY') | default('', true) }}"
radarr_api_key: "{{ lookup('env', 'RADARR_API_KEY') | default('', true) }}"
# The GitHub Actions secret is still named OVERSEERR_API_KEY — the key itself
# carried over unchanged through the Seerr migration, so only the Ansible
# variable is renamed. Renaming the secret would need a repo settings change.
seerr_api_key: "{{ lookup('env', 'OVERSEERR_API_KEY') | default('', true) }}"
