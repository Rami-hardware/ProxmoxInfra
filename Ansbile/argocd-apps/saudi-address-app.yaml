---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: saudi-address
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Rami-hardware/ProxmoxInfra.git
    targetRevision: main
    path: Ansbile/apps/saudi-address/chart
    helm:
      releaseName: saudi-address
  destination:
    server: https://kubernetes.default.svc
    namespace: network
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
