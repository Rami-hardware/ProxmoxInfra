---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: network
data:
  settings.yaml: |
    title: Homelab
    theme: dark
    color: slate
    headerStyle: clean
    statusStyle: dot
    hideVersion: true
    disableCollapse: true
    disableIndexing: true
    iconStyle: theme

    background:
      image: /images/bg.jpg
      blur: md
      saturate: 25
      brightness: 50
      opacity: 65

    quicklaunch:
      searchDescriptions: false
      hideInternetSearch: true
      provider: duckduckgo

    layout:
      Infrastructure:
        style: row
        columns: 4
      Monitoring:
        style: row
        columns: 3
      Media:
        style: row
        columns: 5
      Network:
        style: row
        columns: 2

  services.yaml: |
    []

  widgets.yaml: |
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
          hourCycle: h23
    - openmeteo:
        label: Jeddah
        latitude: 24.7136
        longitude: 46.6753
        units: metric
        cache: 5
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - greeting:
        text_size: xl
        text: Welcome Back Robin
    - resources:
        cpu: true
        refresh: 3000
    - resources:
        cputemp: true
        units: metric
        refresh: 3000
    - resources:
        memory: true
        refresh: 3000
    - resources:
        disk: /host
        refresh: 10000

  custom.css: |
    /* ── Hide section names, keep spacing ── */
    .service-group-name {
      visibility: hidden !important;
      height: 3rem !important;
      pointer-events: none !important;
    }

    /* ── Base card ── */
    .service-card {
      background: rgba(30, 30, 30, 0.60) !important;
      border: 2px solid rgba(148, 163, 184, 0.08) !important;
      border-radius: 10px !important;
      transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease !important;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35) !important;
    }

    /* ── Hover — warm amber/gold matching the bg wallpaper tones ── */
    .service-card:hover {
      background: rgba(120, 80, 20, 0.25) !important;
      border-color: rgba(251, 191, 36, 0.45) !important;
      box-shadow:
        0 0 0 1px rgba(251, 191, 36, 0.3),
        0 0 18px rgba(251, 191, 36, 0.2),
        0 4px 20px rgba(0, 0, 0, 0.4) !important;
      transform: translateY(-1px) !important;
    }

    /* ── Amber/gold tint on glances graphs ── */
    canvas,
    svg path[fill],
    svg path[stroke] {
      filter: sepia(1) saturate(3) hue-rotate(5deg) brightness(1.1) !important;
    }

    /* ── Compact density: smaller padding/font, denser rows ── */
    .service-card {
      padding: 0.5rem 0.75rem !important;
    }
    .service-card .service-name {
      font-size: 0.85rem !important;
    }
    .service-card .service-description {
      font-size: 0.7rem !important;
    }
    #information-widgets,
    .services-group {
      gap: 0.5rem !important;
    }

  bookmarks.yaml: |
    - Infrastructure:
        - GitHub Repo:
            - abbr: GH
              href: https://github.com/Rami-hardware/ProxmoxInfra

  kubernetes.yaml: |
    mode: cluster

  docker.yaml: |
    {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: network
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: network
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: network
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      hostPID: true
      initContainers:
        - name: fetch-background
          image: busybox:1.36
          command:
            - sh
            - -c
            - wget -O /images/bg.jpg 'https://mrwallpaper.com/images/hd/luxurious-black-and-gold-desktop-rt85zskt4leyftct.jpg'
          volumeMounts:
            - name: background-image
              mountPath: /images
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          ports:
            - containerPort: 3000
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "homepage.homelab.lan,localhost:3000"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - secretRef:
                name: homepage-widgets-secret
          volumeMounts:
            - name: config
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
            - name: config
              mountPath: /app/config/services.yaml
              subPath: services.yaml
            - name: config
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml
            - name: config
              mountPath: /app/config/bookmarks.yaml
              subPath: bookmarks.yaml
            - name: config
              mountPath: /app/config/kubernetes.yaml
              subPath: kubernetes.yaml
            - name: config
              mountPath: /app/config/docker.yaml
              subPath: docker.yaml
            - name: config
              mountPath: /app/config/custom.css
              subPath: custom.css
            - name: host-root
              mountPath: /host
              readOnly: true
            - name: background-image
              mountPath: /app/public/images
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: config
          configMap:
            name: homepage-config
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: background-image
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: network
spec:
  type: NodePort
  selector:
    app: homepage
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30323
