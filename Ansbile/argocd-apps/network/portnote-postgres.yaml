---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: portnote-postgres-pv
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /opt/portnote/postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portnote-postgres-pvc
  namespace: network
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  volumeName: portnote-postgres-pv
  storageClassName: ""
---
# CHANGE ME: placeholder credentials committed to git for the initial
# deploy — replace with real values (kubectl edit secret / re-apply) before
# relying on this in production. Not wired to any secret manager yet.
apiVersion: v1
kind: Secret
metadata:
  name: portnote-postgres-secret
  namespace: network
type: Opaque
stringData:
  POSTGRES_USER: portnote
  POSTGRES_PASSWORD: change-me-postgres-password
  POSTGRES_DB: portnote
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portnote-postgres
  namespace: network
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: portnote-postgres
  template:
    metadata:
      labels:
        app: portnote-postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: gateway-server
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: portnote-postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: portnote-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: portnote-postgres
  namespace: network
spec:
  selector:
    app: portnote-postgres
  ports:
    - port: 5432
      targetPort: 5432
