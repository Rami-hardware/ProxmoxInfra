---
apiVersion: v1
kind: Namespace
metadata:
  name: network
  labels:
    istio-injection: enabled
---
# AdGuard Home itself runs on the gateway as a pinned systemd service
# (roles/adguard) — DNS on :53, UI on 8081. The old in-cluster pod was
# removed: with hostNetwork it fought the systemd service for :53/:8081
# and sat in CrashLoopBackOff, and its Service claimed externalIP
# 192.168.10.200:8081, so kube-proxy blackholed the systemd UI's port
# (ingress 502). The UI ingresses (adguard / adguard-public) point at the
# adguard-ext / adguard-home-ext Endpoints services -> 192.168.10.200:8081.
