---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: floci
  namespace: dev
automountServiceAccountToken: false
---
apiVersion: v1
kind: Namespace
metadata:
  name: dev
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: floci-data-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /opt/floci
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: floci-data-pvc
  namespace: dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: floci-data-pv
  storageClassName: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: floci
  namespace: dev
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: floci
  template:
    metadata:
      labels:
        app: floci
    spec:
      serviceAccountName: floci
      # Must stay off: the service is named "floci", so k8s would inject
      # FLOCI_PORT=tcp://<clusterip>:4566 into the env and the image would
      # try to parse that as its integer listen port and crash.
      enableServiceLinks: false
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - "10.43.0.10"
          - "8.8.8.8"
          - "8.8.4.4"
        searches:
          - "dev.svc.cluster.local"
          - "svc.cluster.local"
          - "cluster.local"
      nodeSelector:
        kubernetes.io/hostname: git-k3s-server
      # The image's entrypoint runs (or drops) to uid 1001, and the kubelet
      # creates the hostPath dir root-owned — without this Floci refuses to
      # start because it cannot persist state to /data.
      initContainers:
        - name: init-data
          image: busybox:1.37
          command: ["sh", "-c", "chown -R 1001:1001 /data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: floci
          image: floci/floci:latest
          # Docker-backed services (Lambda, RDS, ECS, ...) and the web console
          # sidecar manage containers through the host Docker daemon on
          # git-k3s-server (installed via the docker_setup role), so this needs
          # the host socket and root.
          securityContext:
            runAsUser: 0
          ports:
            - containerPort: 4566
          env:
            # Hybrid: in-memory speed with a 5s async flush to the PV, so
            # state survives pod restarts without write overhead.
            - name: FLOCI_STORAGE_MODE
              value: "hybrid"
            - name: FLOCI_STORAGE_PERSISTENT_PATH
              value: "/data"
            # Returned URLs (SQS QueueUrl, S3 pre-signed, ...) use the DNS name
            # (AdGuard rewrite -> node). Floci appends its port itself — no
            # :4566 here, or URLs come out with a doubled port.
            - name: FLOCI_HOSTNAME
              value: "floci.homelab.lan"
            - name: FLOCI_BASE_URL
              value: "http://floci.homelab.lan:4566"
            # Floci otherwise derives the console endpoint from the Docker
            # host (bridge IP) — unreachable inside a pod, so the UI page
            # polls "Starting Floci UI…" forever.
            - name: FLOCI_SERVICES_UI_ENDPOINT
              value: "http://floci.homelab.lan:4566"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: docker-sock
              mountPath: /var/run/docker.sock
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: floci-data-pvc
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
---
apiVersion: v1
kind: Service
metadata:
  name: floci
  namespace: dev
spec:
  type: NodePort
  selector:
    app: floci
  ports:
    - name: http
      port: 4566
      targetPort: 4566
      nodePort: 4566
