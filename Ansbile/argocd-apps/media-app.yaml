---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media
  namespace: argocd
  annotations:
    # Jellyfin follows its major tag (`12` = newest 12.x): a new major
    # migrates its database one way, so bump it here on purpose. Same for
    # Redis (`8-alpine`) and TimescaleDB (`pg18` = newest PostgreSQL 18.x with
    # the newest TimescaleDB; the image keeps older extension libraries, and
    # the pod's postStart hook runs ALTER EXTENSION ... UPDATE).
    argocd-image-updater.argoproj.io/image-list: >-
      seerr=ghcr.io/seerr-team/seerr:latest,
      jellyfin=jellyfin/jellyfin:12,
      bazarr=linuxserver/bazarr:latest,
      radarr=linuxserver/radarr:latest,
      prowlarr=linuxserver/prowlarr:latest,
      qbittorrent=linuxserver/qbittorrent:latest,
      flaresolverr=ghcr.io/flaresolverr/flaresolverr:latest,
      scraparr=ghcr.io/thecfu/scraparr:latest,
      sonarr=linuxserver/sonarr:latest,
      tracearr=ghcr.io/connorgallopo/tracearr:latest,
      tracearr-redis=redis:8-alpine,
      tracearr-timescale=timescale/timescaledb-ha:pg18
    argocd-image-updater.argoproj.io/seerr.update-strategy: digest
    argocd-image-updater.argoproj.io/jellyfin.update-strategy: digest
    argocd-image-updater.argoproj.io/bazarr.update-strategy: digest
    argocd-image-updater.argoproj.io/radarr.update-strategy: digest
    argocd-image-updater.argoproj.io/prowlarr.update-strategy: digest
    argocd-image-updater.argoproj.io/qbittorrent.update-strategy: digest
    argocd-image-updater.argoproj.io/flaresolverr.update-strategy: digest
    argocd-image-updater.argoproj.io/scraparr.update-strategy: digest
    argocd-image-updater.argoproj.io/sonarr.update-strategy: digest
    argocd-image-updater.argoproj.io/tracearr.update-strategy: digest
    argocd-image-updater.argoproj.io/tracearr-redis.update-strategy: digest
    argocd-image-updater.argoproj.io/tracearr-timescale.update-strategy: digest
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source:
    repoURL: git@github.com:Rami-hardware/ProxmoxInfra.git
    targetRevision: main
    path: Ansbile/argocd-apps/media
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
