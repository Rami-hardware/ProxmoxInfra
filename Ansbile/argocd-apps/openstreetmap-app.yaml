---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openstreetmap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Rami-hardware/ProxmoxInfra.git
    targetRevision: main
    path: Ansbile/apps/openstreetmap/chart
    helm:
      releaseName: openstreetmap
  destination:
    server: https://kubernetes.default.svc
    namespace: network
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # The initContainer import can run for hours on first sync; don't let
  # ArgoCD declare the sync failed while it's still working.
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/resources/requests/storage
