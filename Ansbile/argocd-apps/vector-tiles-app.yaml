---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vector-tiles
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Rami-hardware/ProxmoxInfra.git
    targetRevision: main
    path: Ansbile/apps/vector-tiles/chart
    helm:
      releaseName: vector-tiles
  destination:
    server: https://kubernetes.default.svc
    namespace: network
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
