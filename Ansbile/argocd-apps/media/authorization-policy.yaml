---
# Which workload may call which Service in media, by Istio identity
# (ServiceAccount), enforced by the media waypoint. Applies to traffic sent
# to a Service name; ingress-nginx and Prometheus reach pods directly and are
# covered by the NetworkPolicies (components/mesh-network-policy) instead.
#
# Built from the waypoint's istio_requests_total / istio_tcp_* by source and
# destination (2026-11-11) plus each app's configured links. A new caller
# gets "RBAC: access denied" (HTTP 403) until it is added here.
#
# Ran in dry-run (istio.io/dry-run: "true") first: ~1000 real requests, 0
# would-be denials. To test a change the same way, add that annotation and
# watch: kubectl -n media exec deploy/waypoint -- pilot-agent request GET stats | grep shadow_denied
# Denied requests show up as response_code 403 in istio_requests_total
# (reporter="waypoint").
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: sonarr
  namespace: media
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: sonarr
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/media/sa/prowlarr
              - cluster.local/ns/media/sa/seerr
              - cluster.local/ns/media/sa/bazarr
              - cluster.local/ns/media/sa/scraparr
---
