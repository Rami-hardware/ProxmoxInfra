---
# Default-deny ingress for the media namespace, with explicit allows.
# Egress is intentionally unrestricted. Calico enforces these (policy-only mode).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: media
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress-nginx
  namespace: media
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-monitoring
  namespace: media
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: media
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-lan
  namespace: media
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # LAN hosts (blackbox-exporter, direct browser access).
        - ipBlock:
            cidr: 192.168.10.0/24
        # Flannel node IPs: cross-node traffic from the hostNetwork
        # ingress-nginx controller is masqueraded to the source node's
        # flannel IP (10.42.x.0) by kube-proxy before calico evaluates
        # policy, so a bare LAN CIDR rejects it (observed as 502s from
        # nginx for tracearr). Without this, anything from a node IP
        # crossing nodes hits default-deny.
        - ipBlock:
            cidr: 10.42.0.0/16
---
# qBittorrent's BitTorrent port must stay reachable from the internet
# (peers connect via the router's forwarded hostPort 6881).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-qbittorrent-bt
  namespace: media
spec:
  podSelector:
    matchLabels:
      app: qbittorrent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6881
        - protocol: UDP
          port: 6881
