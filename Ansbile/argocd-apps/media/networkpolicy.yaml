---
# media-only addition to the shared mesh policies
# (components/mesh-network-policy). qBittorrent's BitTorrent port must stay
# reachable from the internet (peers connect via the router's forwarded 6881).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-qbittorrent-bt
  namespace: media
spec:
  podSelector:
    matchLabels:
      app: qbittorrent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6881
        - protocol: UDP
          port: 6881
