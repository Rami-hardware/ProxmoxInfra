---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seerr
  namespace: media
automountServiceAccountToken: false
---
apiVersion: v1
kind: Namespace
metadata:
  name: media
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: seerr-config-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    # Intentionally still /opt/overseer: this is the live Overseerr data that
    # Seerr migrated in place. Renaming the directory would orphan the DB.
    path: /opt/overseer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seerr-config-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: seerr-config-pv
  storageClassName: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: media
  # NOTE (2026-09-26): seerr's configured Plex server (192.168.1.201:32400,
  # "Adult Titans") is on a subnet this network can no longer route to, so all
  # Plex jobs have been failing with read ECONNRESET since ~Apr 2026. The
  # daily availability-sync burst (~80 error lines in 5 min at 02:00 UTC)
  # tripped the "Error rate spike" alert every day, so availability-sync and
  # plex-recently-added-scan were rescheduled to "0 0 3 29 2 *" (leap day) via
  # the Seerr jobs API. Runtime-only change (persisted in the seerr settings
  # DB); restore with POST /api/v1/settings/jobs/{id}/schedule:
  #   availability-sync          -> "0 0 5 * * *"
  #   plex-recently-added-scan   -> "0 */5 * * * *"
  # Durable fix is reconnecting seerr to Jellyfin (needs a Jellyfin API key).
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: seerr
  template:
    metadata:
      labels:
        app: seerr
    spec:
      serviceAccountName: seerr
      # Seerr (unlike Overseerr) runs as the non-root "node" user, UID 1000.
      # /opt/overseer was root-owned under Overseerr, so it is chowned to 1000
      # on the host; fsGroup keeps new files group-writable for that user.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # The Seerr image ships no init process (upstream tells Docker users to
      # pass --init). shareProcessNamespace gives the pod a real PID 1 that
      # reaps zombies, which is the Kubernetes equivalent.
      shareProcessNamespace: true
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - "10.43.0.10"
          - "8.8.8.8"
          - "8.8.4.4"
        searches:
          - "media.svc.cluster.local"
          - "svc.cluster.local"
          - "cluster.local"
      nodeSelector:
        kubernetes.io/hostname: media-server
      containers:
        - name: seerr
          image: ghcr.io/seerr-team/seerr:latest
          ports:
            - containerPort: 5055
          env:
            - name: TZ
              value: "Asia/Riyadh"
          volumeMounts:
            - name: config
              mountPath: /app/config
          # Endpoint taken from the upstream Seerr healthcheck. The initial
          # start is slow because the Overseerr->Seerr schema migration runs
          # on first boot, hence the generous failureThreshold on startup.
          startupProbe:
            httpGet:
              path: /api/v1/settings/public
              port: 5055
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/settings/public
              port: 5055
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              # Raised on 2026-09-22: at 384Mi the container idled at ~353MB RSS
              # (92% of limit); under node load (overnight Bazarr/Sonarr jobs)
              # cgroup reclaim stalled the event loop and SSR self-calls failed
              # with ECONNRESET, timing out the blackbox probes for ~11 min.
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "500m"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: seerr-config-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: seerr
  namespace: media
spec:
  type: NodePort
  selector:
    app: seerr
  ports:
    - name: http
      port: 5055
      targetPort: 5055
      nodePort: 5055
