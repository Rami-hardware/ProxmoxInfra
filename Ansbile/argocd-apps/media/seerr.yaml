---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seerr
  namespace: media
automountServiceAccountToken: false
---
apiVersion: v1
kind: Namespace
metadata:
  name: media
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: seerr-config-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    # Intentionally still /opt/overseer: this is the live Overseerr data that
    # Seerr migrated in place. Renaming the directory would orphan the DB.
    path: /opt/overseer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seerr-config-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: seerr-config-pv
  storageClassName: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: media
  # NOTE: Reconnected Seerr to Jellyfin (replacing dead Plex at 192.168.1.201:32400).
  # Jellyfin URL and API key set via env vars below. Jobs restored to normal schedule:
  #   availability-sync          -> "0 0 5 * * *"
  #   jellyfin-recently-added-scan -> "0 */5 * * * *"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: seerr
  template:
    metadata:
      labels:
        app: seerr
    spec:
      serviceAccountName: seerr
      # Seerr (unlike Overseerr) runs as the non-root "node" user, UID 1000.
      # /opt/overseer was root-owned under Overseerr, so it is chowned to 1000
      # on the host; fsGroup keeps new files group-writable for that user.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # The Seerr image ships no init process (upstream tells Docker users to
      # pass --init). shareProcessNamespace gives the pod a real PID 1 that
      # reaps zombies, which is the Kubernetes equivalent.
      shareProcessNamespace: true
      dnsPolicy: None
      dnsConfig:
        # Cluster DNS only. CoreDNS already falls back from AdGuard to public
        # resolvers and unbound (k3s_server). Public servers listed here were
        # queried in parallel with it by musl-based images, so every lookup
        # skipped AdGuard and leaked *.cluster.local names to Google.
        nameservers:
          - "10.43.0.10"
        searches:
          - "media.svc.cluster.local"
          - "svc.cluster.local"
          - "cluster.local"
      nodeSelector:
        kubernetes.io/hostname: media-server
      containers:
        - name: seerr
          image: ghcr.io/seerr-team/seerr:latest
          ports:
            - containerPort: 5055
          env:
            - name: TZ
              value: "Asia/Riyadh"
            - name: JELLYFIN_SERVER
              value: "http://10.43.175.229:8096"
            - name: JELLYFIN_API_KEY
              value: "7f3e19039caa48a8802a5e1d539b8553"
          volumeMounts:
            - name: config
              mountPath: /app/config
          # Endpoint taken from the upstream Seerr healthcheck. The initial
          # start is slow because the Overseerr->Seerr schema migration runs
          # on first boot, hence the generous failureThreshold on startup.
          startupProbe:
            httpGet:
              path: /api/v1/settings/public
              port: 5055
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/settings/public
              port: 5055
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              # Raised on 2026-09-22: at 384Mi the container idled at ~353MB RSS
              # (92% of limit); under node load (overnight Bazarr/Sonarr jobs)
              # cgroup reclaim stalled the event loop and SSR self-calls failed
              # with ECONNRESET, timing out the blackbox probes for ~11 min.
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "500m"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: seerr-config-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: seerr
  namespace: media
spec:
  type: NodePort
  selector:
    app: seerr
  ports:
    - name: http
      port: 5055
      targetPort: 5055
      nodePort: 5055
