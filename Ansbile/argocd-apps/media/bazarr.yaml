---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bazarr-config-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /opt/bazarr
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazarr-config-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: bazarr-config-pv
  storageClassName: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: bazarr
  template:
    metadata:
      labels:
        app: bazarr
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - "10.43.0.10"
          - "8.8.8.8"
          - "8.8.4.4"
        searches:
          - "media.svc.cluster.local"
          - "svc.cluster.local"
          - "cluster.local"
      nodeSelector:
        kubernetes.io/hostname: media-server
      containers:
        - name: bazarr
          image: linuxserver/bazarr:latest
          # GPU access enables VAAPI hwaccel for ffmpeg during audio
          # extraction, which is what ffsubsync/subsync use to align
          # subs to audio tracks.
          securityContext:
            privileged: true
          ports:
            - containerPort: 6767
          env:
            - name: TZ
              value: "Asia/Riyadh"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: LIBVA_DRIVER_NAME
              value: "iHD"
            - name: VAAPI_DEVICE
              value: "/dev/dri/renderD128"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tv
              mountPath: /tv
            - name: movies
              mountPath: /movies
            - name: dri
              mountPath: /dev/dri
          # Sync passes run ffmpeg + ffsubsync/subsync — CPU heavy per-file,
          # memory grows with audio buffer length on long files.
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1500m"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: bazarr-config-pvc
        - name: tv
          hostPath:
            path: /mnt/media/tv
        - name: movies
          hostPath:
            path: /mnt/media/movies
        - name: dri
          hostPath:
            path: /dev/dri
---
apiVersion: v1
kind: Service
metadata:
  name: bazarr
  namespace: media
spec:
  type: NodePort
  selector:
    app: bazarr
  ports:
    - name: http
      port: 6767
      targetPort: 6767
      nodePort: 6767
