---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracearr-redis
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tracearr-redis
  template:
    metadata:
      labels:
        app: tracearr-redis
    spec:
      nodeSelector:
        kubernetes.io/hostname: media-server
      containers:
        - name: redis
          image: redis:8-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: tracearr-redis
  namespace: media
spec:
  selector:
    app: tracearr-redis
  ports:
    - port: 6379
      targetPort: 6379
