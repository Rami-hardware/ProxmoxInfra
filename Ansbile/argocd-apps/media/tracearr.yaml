---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tracearr
  namespace: media
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tracearr-backup-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /opt/tracearr/backup
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tracearr-backup-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: tracearr-backup-pv
  storageClassName: ""
---
# CHANGE ME: placeholder secrets committed to git for the initial deploy —
# replace with real values (openssl rand -hex 32) before relying on this in
# production.
apiVersion: v1
kind: Secret
metadata:
  name: tracearr-secret
  namespace: media
type: Opaque
stringData:
  JWT_SECRET: change-me-jwt-secret
  COOKIE_SECRET: change-me-cookie-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracearr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tracearr
  template:
    metadata:
      labels:
        app: tracearr
    spec:
      serviceAccountName: tracearr
      nodeSelector:
        kubernetes.io/hostname: media-server
      containers:
        - name: tracearr
          image: ghcr.io/connorgallopo/tracearr:latest
          ports:
            - containerPort: 3000
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: TZ
              value: "Asia/Riyadh"
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@tracearr-timescale.media.svc.cluster.local:5432/$(POSTGRES_DB)"
            - name: REDIS_URL
              value: "redis://tracearr-redis.media.svc.cluster.local:6379"
          envFrom:
            - secretRef:
                name: tracearr-secret
            - secretRef:
                name: tracearr-timescale-secret
          volumeMounts:
            - name: backup
              mountPath: /data/backup
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: tracearr-backup-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: tracearr
  namespace: media
spec:
  type: NodePort
  selector:
    app: tracearr
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30324
