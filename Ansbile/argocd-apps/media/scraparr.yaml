---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scraparr
  namespace: media
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: scraparr-config-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /opt/scraparr/config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scraparr-config-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: scraparr-config-pv
  storageClassName: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scraparr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: scraparr
  template:
    metadata:
      labels:
        app: scraparr
    spec:
      serviceAccountName: scraparr
      nodeSelector:
        kubernetes.io/hostname: media-server
      containers:
        - name: scraparr
          image: ghcr.io/thecfu/scraparr
          ports:
            - containerPort: 7100
          env:
            - name: TZ
              value: "Asia/Riyadh"
          volumeMounts:
            - name: config
              mountPath: /scraparr/config
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: scraparr-config-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: scraparr
  namespace: media
spec:
  type: NodePort
  selector:
    app: scraparr
  ports:
    - name: http
      port: 7100
      targetPort: 7100
      nodePort: 7100
