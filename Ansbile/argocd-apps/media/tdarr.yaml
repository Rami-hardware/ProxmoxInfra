---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tdarr-config-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /opt/tdarr
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tdarr-config-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: tdarr-config-pv
  storageClassName: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tdarr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tdarr
  template:
    metadata:
      labels:
        app: tdarr
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - "10.43.0.10"
          - "8.8.8.8"
          - "8.8.4.4"
        searches:
          - "media.svc.cluster.local"
          - "svc.cluster.local"
          - "cluster.local"
      nodeSelector:
        kubernetes.io/hostname: media-server
      containers:
        - name: tdarr
          image: ghcr.io/haveagitgat/tdarr:latest
          securityContext:
            privileged: true
          ports:
            - containerPort: 8265
              name: webui
            - containerPort: 8266
              name: server
          env:
            - name: TZ
              value: "Asia/Riyadh"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: serverIP
              value: "0.0.0.0"
            - name: serverPort
              value: "8266"
            - name: webUIPort
              value: "8265"
            - name: internalNode
              value: "true"
            - name: inContainer
              value: "true"
            - name: nodeName
              value: "media-server"
            - name: ffmpegVersion
              value: "7"
            - name: LIBVA_DRIVER_NAME
              value: "iHD"
          volumeMounts:
            - name: config
              mountPath: /app/server
              subPath: server
            - name: config
              mountPath: /app/configs
              subPath: configs
            - name: config
              mountPath: /app/logs
              subPath: logs
            - name: media
              mountPath: /media
            - name: cache
              mountPath: /temp
            - name: dri
              mountPath: /dev/dri
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "4000m"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: tdarr-config-pvc
        - name: tv
          hostPath:
            path: /mnt/media/tv
        - name: cache
          hostPath:
            path: /opt/tdarr/cache
        - name: dri
          hostPath:
            path: /dev/dri
---
apiVersion: v1
kind: Service
metadata:
  name: tdarr
  namespace: media
spec:
  type: NodePort
  selector:
    app: tdarr
  ports:
    - name: webui
      port: 8265
      targetPort: 8265
      nodePort: 8265
    - name: server
      port: 8266
      targetPort: 8266
