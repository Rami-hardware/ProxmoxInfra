---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: stash-config-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /opt/stash
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stash-config-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: stash-config-pv
  storageClassName: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stash
  namespace: media
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: stash
  template:
    metadata:
      labels:
        app: stash
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - "10.43.0.10"
          - "8.8.8.8"
          - "8.8.4.4"
        searches:
          - "media.svc.cluster.local"
          - "svc.cluster.local"
          - "cluster.local"
      nodeSelector:
        kubernetes.io/hostname: media-server
      containers:
        - name: stash
          image: stashapp/stash:latest
          ports:
            - containerPort: 9999
          env:
            - name: TZ
              value: "Asia/Riyadh"
            - name: STASH_STASH
              value: "/data/"
            - name: STASH_GENERATED
              value: "/generated/"
            - name: STASH_METADATA
              value: "/metadata/"
            - name: STASH_CACHE
              value: "/cache/"
            - name: STASH_PORT
              value: "9999"
          volumeMounts:
            - name: config
              mountPath: /root/.stash
            - name: data
              mountPath: /data
            - name: generated
              mountPath: /generated
            - name: metadata
              mountPath: /metadata
            - name: cache
              mountPath: /cache
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: stash-config-pvc
        - name: data
          hostPath:
            path: /mnt/media
        - name: generated
          hostPath:
            path: /opt/stash/generated
        - name: metadata
          hostPath:
            path: /opt/stash/metadata
        - name: cache
          hostPath:
            path: /opt/stash/cache
---
apiVersion: v1
kind: Service
metadata:
  name: stash
  namespace: media
spec:
  type: NodePort
  selector:
    app: stash
  ports:
    - name: http
      port: 9999
      targetPort: 9999
      nodePort: 30325
