---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: grafana-config-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /opt/docker/grafana
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-config-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: grafana-config-pv
  storageClassName: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  # Recreate, not RollingUpdate: one writer on a hostPath data dir. A second
  # pod can't take grafana.db (SQLite) while the old one runs (Loki deadlocked on
  # this once it had a readiness probe). The old pod shuts down cleanly on
  # SIGTERM first, so nothing is lost — only a few seconds of downtime.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      serviceAccountName: grafana
      dnsPolicy: None
      dnsConfig:
        # Cluster DNS only. CoreDNS already falls back from AdGuard to public
        # resolvers and unbound (k3s_server). Public servers listed here were
        # queried in parallel with it by musl-based images, so every lookup
        # skipped AdGuard and leaked *.cluster.local names to Google.
        nameservers:
          - "10.43.0.10"
        searches:
          - "monitoring.svc.cluster.local"
          - "svc.cluster.local"
          - "cluster.local"
      nodeSelector:
        kubernetes.io/hostname: monitoring-server
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_PATHS_DATA
              value: "/opt/docker/grafana"
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: "kubernetesDashboards=false"
            # No alerting in Grafana: Prometheus evaluates every rule and
            # Alertmanager notifies (roles/prometheus, roles/alertmanager).
            # This turns off Grafana's own alert engine and its Alerting menu.
            - name: GF_UNIFIED_ALERTING_ENABLED
              value: "false"
            # Landing page: the provisioned overview (roles/grafana).
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: "/opt/docker/grafana/provisioning/dashboards/overview.json"
          volumeMounts:
            - name: config
              mountPath: /opt/docker/grafana
            - name: provisioning
              mountPath: /etc/grafana/provisioning
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              # actual usage ~20m; 1-core node — keep limit budget for prometheus
              cpu: "500m"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: grafana-config-pvc
        - name: provisioning
          hostPath:
            path: /opt/docker/grafana/provisioning
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 3000
