---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - grafana.yaml
  - prometheus.yaml
  - loki.yaml
  - alertmanager.yaml
  - speedtest-exporter.yaml
  - intel-gpu-exporter.yaml
  - qbittorrent-exporter.yaml

# argocd-image-updater rewrites entries here (newTag/digest) when it detects
# a new image on the registry side — this is the write-back target.
images:
  - name: grafana/grafana
    newTag: latest
  - name: prom/prometheus
    newTag: latest
  - name: grafana/loki
    newTag: latest
  - name: prom/alertmanager
    newTag: latest
  - name: miguelndecarvalho/speedtest-exporter
    newTag: latest
  - name: ghcr.io/onedr0p/intel-gpu-exporter
    newTag: rolling
  - name: esanchezm/prometheus-qbittorrent-exporter
    newTag: latest
