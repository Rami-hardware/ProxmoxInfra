---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertmanager
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: alertmanager-config-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /opt/docker/alertmanager
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-config-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: alertmanager-config-pv
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: alertmanager-data-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    # Reuse the existing data directory beneath the already-mounted config PV;
    # it is owned by nobody:nobody on monitoring-server.
    path: /opt/docker/alertmanager/data
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: alertmanager-data-pv
  storageClassName: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  # Recreate, not RollingUpdate: one writer on a hostPath data dir. A second
  # pod can't take its silence/notification-log files while the old one runs (Loki deadlocked on
  # this once it had a readiness probe). The old pod shuts down cleanly on
  # SIGTERM first, so nothing is lost — only a few seconds of downtime.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      serviceAccountName: alertmanager
      nodeSelector:
        kubernetes.io/hostname: monitoring-server
      containers:
        - name: alertmanager
          image: prom/alertmanager:latest
          args:
            - "--config.file=/etc/alertmanager/config.yml"
            - "--storage.path=/alertmanager"
          ports:
            - containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: alertmanager-config-pvc
        - name: data
          persistentVolumeClaim:
            claimName: alertmanager-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  type: NodePort
  # Local keeps the client IP for the allow-admin-api NetworkPolicy
  # (components/mesh-network-policy). The pod is pinned to monitoring-server,
  # so the NodePort answers there (the address everything uses).
  externalTrafficPolicy: Local
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: 9093
      nodePort: 9093
