---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blackbox-exporter
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-config
  namespace: monitoring
data:
  blackbox.yml: |
    modules:
      # Public sites (*.darkestserver.com) — real, publicly trusted certs, so
      # verify TLS normally. 2xx/3xx both count as up: several apps redirect
      # unauthenticated requests to a login page.
      http_2xx_public:
        prober: http
        timeout: 10s
        http:
          method: GET
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: [200, 201, 202, 204, 301, 302, 303, 307, 308, 401, 403]
          follow_redirects: false
          preferred_ip_protocol: ip4
          ip_protocol_fallback: false

      # Local sites (*.homelab.lan) — served with certs from the homelab
      # self-signed CA, which blackbox does not trust, so skip verification.
      # Cert expiry is still tracked by cert-manager's own metrics.
      http_2xx_local:
        prober: http
        timeout: 10s
        http:
          method: GET
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: [200, 201, 202, 204, 301, 302, 303, 307, 308, 401, 403]
          follow_redirects: false
          preferred_ip_protocol: ip4
          ip_protocol_fallback: false
          tls_config:
            insecure_skip_verify: true

      # Plain TCP reachability, for probing a backend port directly.
      tcp_connect:
        prober: tcp
        timeout: 5s
        tcp:
          preferred_ip_protocol: ip4
          ip_protocol_fallback: false

      icmp:
        prober: icmp
        timeout: 5s
        icmp:
          preferred_ip_protocol: ip4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: blackbox-exporter
  template:
    metadata:
      labels:
        app: blackbox-exporter
    spec:
      serviceAccountName: blackbox-exporter
      nodeSelector:
        kubernetes.io/hostname: monitoring-server
      # The *.homelab.lan and *.darkestserver.com names resolve via AdGuard on
      # the gateway, not via CoreDNS, so probe DNS has to go there first —
      # otherwise every local probe fails to resolve.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - "10.43.0.10"
          - "192.168.10.200"
        searches:
          - "monitoring.svc.cluster.local"
          - "svc.cluster.local"
          - "cluster.local"
      containers:
        - name: blackbox-exporter
          image: prom/blackbox-exporter:latest
          args:
            - "--config.file=/etc/blackbox_exporter/blackbox.yml"
          ports:
            - containerPort: 9115
          securityContext:
            capabilities:
              # Required for the icmp prober to open raw sockets.
              add: ["NET_RAW"]
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox_exporter
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9115
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: 9115
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: blackbox-exporter-config
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: blackbox-exporter
  ports:
    - name: http
      port: 9115
      targetPort: 9115
      nodePort: 9115
