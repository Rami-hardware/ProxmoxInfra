---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intel-gpu-exporter
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intel-gpu-exporter
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: intel-gpu-exporter
  template:
    metadata:
      labels:
        app: intel-gpu-exporter
    spec:
      serviceAccountName: intel-gpu-exporter
      nodeSelector:
        kubernetes.io/hostname: media-server
      containers:
        - name: intel-gpu-exporter
          image: ghcr.io/onedr0p/intel-gpu-exporter:rolling
          securityContext:
            privileged: true
          ports:
            - containerPort: 8080
          env:
            - name: TZ
              value: "Asia/Riyadh"
          volumeMounts:
            - name: dri
              mountPath: /dev/dri
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: dri
          hostPath:
            path: /dev/dri
---
apiVersion: v1
kind: Service
metadata:
  name: intel-gpu-exporter
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: intel-gpu-exporter
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 8082
