---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intel-gpu-exporter
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intel-gpu-exporter
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: intel-gpu-exporter
  template:
    metadata:
      labels:
        app: intel-gpu-exporter
    spec:
      serviceAccountName: intel-gpu-exporter
      nodeSelector:
        kubernetes.io/hostname: media-server
      containers:
        - name: intel-gpu-exporter
          image: ghcr.io/onedr0p/intel-gpu-exporter:rolling
          # intel_gpu_top reads the i915 PMU: perf events need CAP_PERFMON
          # (media's kernel.perf_event_paranoid is 4), and the GPU comes from
          # the Intel device plugin (k3s_apps gpu_plugin) — no privileged mode.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add: ["PERFMON"]
          ports:
            - containerPort: 8080
          env:
            - name: TZ
              value: "Asia/Riyadh"
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
              gpu.intel.com/i915: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: intel-gpu-exporter
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: intel-gpu-exporter
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 8082
