---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent-exporter
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: qbittorrent-exporter
  template:
    metadata:
      labels:
        app: qbittorrent-exporter
    spec:
      nodeSelector:
        kubernetes.io/hostname: media-server
      containers:
        - name: qbittorrent-exporter
          image: esanchezm/prometheus-qbittorrent-exporter:latest
          ports:
            - containerPort: 8000
          env:
            - name: QBITTORRENT_HOST
              value: "192.168.1.201"
            - name: QBITTORRENT_PORT
              value: "8080"
            - name: QBITTORRENT_USERNAME
              value: "admin"
            - name: QBITTORRENT_PASSWORD
              value: "admin@123"
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-exporter
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: qbittorrent-exporter
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 17871
