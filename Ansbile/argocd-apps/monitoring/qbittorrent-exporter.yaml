---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qbittorrent-exporter
  namespace: monitoring
automountServiceAccountToken: false
---
# CHANGE ME: placeholder credentials committed to git so the initial deploy
# resolves. The exporter CrashLoopBackOffs without this Secret, since the env
# refs below are required (no `optional: true`).
#
# These were previously hardcoded in the Deployment and are in git history, so
# treat the real qBittorrent password as compromised and rotate it. Replace the
# values here (or overwrite the live Secret out-of-band) before relying on this.
apiVersion: v1
kind: Secret
metadata:
  name: qbittorrent-exporter-secret
  namespace: monitoring
type: Opaque
stringData:
  username: change-me-username
  password: change-me-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent-exporter
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: qbittorrent-exporter
  template:
    metadata:
      labels:
        app: qbittorrent-exporter
    spec:
      serviceAccountName: qbittorrent-exporter
      nodeSelector:
        kubernetes.io/hostname: media-server
      containers:
        - name: qbittorrent-exporter
          image: esanchezm/prometheus-qbittorrent-exporter:latest
          ports:
            - containerPort: 8000
          env:
            - name: QBITTORRENT_HOST
              value: "192.168.10.201"
            - name: QBITTORRENT_PORT
              value: "8080"
            - name: QBITTORRENT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-exporter-secret
                  key: username
            - name: QBITTORRENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-exporter-secret
                  key: password
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-exporter
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: qbittorrent-exporter
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 17871
