---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: speedtest-exporter
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speedtest-exporter
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: speedtest-exporter
  template:
    metadata:
      labels:
        app: speedtest-exporter
    spec:
      serviceAccountName: speedtest-exporter
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - "10.43.0.10"
          - "8.8.8.8"
          - "8.8.4.4"
        searches:
          - "monitoring.svc.cluster.local"
          - "svc.cluster.local"
          - "cluster.local"
      nodeSelector:
        kubernetes.io/hostname: monitoring-server
      containers:
        - name: speedtest-exporter
          image: miguelndecarvalho/speedtest-exporter
          ports:
            - containerPort: 9798
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          # Each scrape runs a real Ookla speedtest (30-90s+), so the probes
          # only check that the Flask process itself is alive, not that a
          # speedtest just succeeded.
          livenessProbe:
            httpGet:
              path: /
              port: 9798
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 9798
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: speedtest-exporter
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: speedtest-exporter
  ports:
    - name: http
      port: 9798
      targetPort: 9798
      nodePort: 9798
