---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network
  namespace: argocd
  # No Image Updater annotations: this namespace runs no images from
  # argocd-apps. AdGuard is a systemd service on the gateway (roles/adguard,
  # adguard_version), not a pod.
spec:
  project: default
  source:
    repoURL: git@github.com:Rami-hardware/ProxmoxInfra.git
    targetRevision: main
    path: Ansbile/argocd-apps/network
  destination:
    server: https://kubernetes.default.svc
    namespace: network
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
