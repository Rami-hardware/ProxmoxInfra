---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: adguard-home=adguard/adguardhome:latest
    argocd-image-updater.argoproj.io/adguard-home.update-strategy: digest
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: development
    argocd-image-updater.argoproj.io/git-credentials: argocd/git-creds
spec:
  project: default
  source:
    repoURL: https://github.com/Rami-hardware/ProxmoxInfra.git
    targetRevision: development
    path: Ansbile/argocd-apps/network
  destination:
    server: https://kubernetes.default.svc
    namespace: network
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
