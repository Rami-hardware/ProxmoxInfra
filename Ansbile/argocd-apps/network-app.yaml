---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network
  namespace: argocd
  annotations:
    # AdGuard is the primary DNS: patch releases of v0.107 only. v0.108
    # changes the config format — bump it here on purpose.
    argocd-image-updater.argoproj.io/image-list: >-
      adguard-home=adguard/adguardhome:~0.107
    argocd-image-updater.argoproj.io/adguard-home.update-strategy: semver
    argocd-image-updater.argoproj.io/adguard-home.allow-tags: regexp:^v0\.107\.[0-9]+$
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source:
    repoURL: git@github.com:Rami-hardware/ProxmoxInfra.git
    targetRevision: main
    path: Ansbile/argocd-apps/network
  destination:
    server: https://kubernetes.default.svc
    namespace: network
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
