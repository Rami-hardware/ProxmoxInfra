
[gateway-vm]
gateway-server ansible_host=192.168.10.200 ansible_user=gateway ansible_ssh_private_key_file=~/.ssh/id_rsa

[media-vm]
media-server ansible_host=192.168.10.201 ansible_user=media ansible_ssh_private_key_file=~/.ssh/id_rsa

[monitoring-vm]
monitoring-server ansible_host=192.168.10.203 ansible_user=monitoring ansible_ssh_private_key_file=~/.ssh/id_rsa

[git-k3s-server-vm]
git-k3s-server ansible_host=192.168.10.204 ansible_user=github ansible_ssh_private_key_file=~/.ssh/id_rsa

[host-node]
host-node ansible_host=192.168.10.250 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa

# GitHub Actions runner LXCs (Terraform `containers`). Their SSH host keys are
# pinned in .github/ssh_known_hosts — update them there if a container is rebuilt.
[ci-runner-lxc]
ci-runner-1 ansible_host=192.168.10.205 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa
ci-runner-2 ansible_host=192.168.10.206 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa
ci-runner-3 ansible_host=192.168.10.207 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa
