name: Setup SSH and Ansible Vault
description: Writes the SSH private key and Ansible Vault password to disk for the runner, and pins Ansible to the committed SSH host keys.

inputs:
  ssh-private-key:
    required: true
  ansible-vault-password:
    required: true

runs:
  using: composite
  steps:
    # Passed through env, not ${{ }} inside the script: interpolating a secret
    # into shell source breaks on quotes or $ in it and lets it run as code.
    - name: Setup SSH and Vault
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        VAULT_PASSWORD: ${{ inputs.ansible-vault-password }}
      run: |
        mkdir -p ~/.ssh
        umask 077
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        printf '%s\n' "$VAULT_PASSWORD" > ~/.vault_pass
        chmod 600 ~/.ssh/id_rsa ~/.vault_pass

    # Verify host keys against the committed .github/ssh_known_hosts instead of
    # trusting whatever answers on the IP. Defaults kept from ansible's own
    # ssh_args (-C, ControlMaster/Persist) since setting this replaces them.
    # Copied to RUNNER_TEMP because UserKnownHostsFile splits on spaces.
    - name: Pin SSH host keys for Ansible
      shell: bash
      run: |
        cp "$GITHUB_WORKSPACE/.github/ssh_known_hosts" "$RUNNER_TEMP/ssh_known_hosts"
        echo "ANSIBLE_HOST_KEY_CHECKING=True" >> "$GITHUB_ENV"
        echo "ANSIBLE_SSH_ARGS=-C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/ssh_known_hosts" >> "$GITHUB_ENV"
