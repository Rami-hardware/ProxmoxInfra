name: Setup Ansible virtualenv
description: >
  Puts a virtualenv with the pinned tools from .github/ci-requirements.txt on
  PATH. It lives in ~/.cache, not the workspace — actions/checkout cleans the
  workspace every run, which used to force a full pip install each job. The
  logic lives in .github/scripts/setup-ansible-venv.sh (also used by
  roles/ci_runner to pre-warm new runners).

runs:
  using: composite
  steps:
    - name: Setup Ansible virtualenv
      shell: bash
      run: |
        "$GITHUB_WORKSPACE/.github/scripts/setup-ansible-venv.sh" "$GITHUB_WORKSPACE/.github/ci-requirements.txt" >> "$GITHUB_PATH"
