name: Setup Terraform provider mirror
description: >
  Points Terraform at a local filesystem mirror and seeds it with provider zips
  from GitHub releases, so it never contacts registry.terraform.io (unreachable
  from the self-hosted runner). The logic lives in
  .github/scripts/seed-terraform-mirror.sh (also used by roles/ci_runner).

runs:
  using: composite
  steps:
    - name: Configure and seed Terraform provider mirror
      shell: bash
      run: "$GITHUB_WORKSPACE/.github/scripts/seed-terraform-mirror.sh"
