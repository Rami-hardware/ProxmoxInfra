# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Homelab CI/CD

on:
  push:
    branches:
      - development
      - staging
      - main
  schedule:
    - cron: '0 3 1 * *'  # 1st of every month at 03:00 UTC — monthly redeploy (triggers cert regen as side effect)
  workflow_dispatch:

# Prevent two deploys from racing on Terraform state / Ansible runs.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-image:
    name: Build & Scan Docker Image & Files
    uses: ./.github/workflows/build-image.yml
    secrets:
      DISCORD_CD_Alert_URL: ${{ secrets.DISCORD_CD_Alert_URL }}

  testing:
    name: Testing Infrastructure Code
    needs: build-image
    uses: ./.github/workflows/testing.yml
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      SONARR_API_KEY: ${{ secrets.SONARR_API_KEY }}
      BAZARR_API_KEY: ${{ secrets.BAZARR_API_KEY }}
      PROWLARR_API_KEY: ${{ secrets.PROWLARR_API_KEY }}
      RADARR_API_KEY: ${{ secrets.RADARR_API_KEY }}
      OVERSEERR_API_KEY: ${{ secrets.OVERSEERR_API_KEY }}
      JELLYFIN_API_KEY: ${{ secrets.JELLYFIN_API_KEY }}

  Deploy:
    name: Deploy Infrastructure Code
    needs: testing
    uses: ./.github/workflows/deploy.yml
    secrets:
      PM_API_URL: ${{ secrets.PM_API_URL }}
      PM_API_TOKEN: ${{ secrets.PM_API_TOKEN }}
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      SONARR_API_KEY: ${{ secrets.SONARR_API_KEY }}
      BAZARR_API_KEY: ${{ secrets.BAZARR_API_KEY }}
      PROWLARR_API_KEY: ${{ secrets.PROWLARR_API_KEY }}
      RADARR_API_KEY: ${{ secrets.RADARR_API_KEY }}
      OVERSEERR_API_KEY: ${{ secrets.OVERSEERR_API_KEY }}
      JELLYFIN_API_KEY: ${{ secrets.JELLYFIN_API_KEY }}
      ADGUARD_EXPORTER_USERNAME: ${{ secrets.ADGUARD_EXPORTER_USERNAME }}
      ADGUARD_EXPORTER_PASSWORD: ${{ secrets.ADGUARD_EXPORTER_PASSWORD }}

  security:
    name: Security Scan
    needs: Deploy
    if: always()
    uses: ./.github/workflows/security.yml
    secrets:
      DISCORD_CI_ALERT_SEC_URL: ${{ secrets.DISCORD_CI_ALERT_SEC_URL }}

  notify:
    name: Notify Discord
    needs: [testing, Deploy, security]
    if: always()
    uses: ./.github/workflows/notify.yml
    with:
      testing_result: ${{ needs.testing.result }}
      deploy_result: ${{ needs.Deploy.result }}
      security_result: ${{ needs.security.result }}
    secrets:
      DISCORD_CD_Alert_URL: ${{ secrets.DISCORD_CD_Alert_URL }}
