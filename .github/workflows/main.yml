name: Homelab CI/CD


on:
  push:
    branches:
      - development
      - staging
      - main

jobs:
  Deploy:
    name: Deploy Infrastructure Code
    runs-on: self-hosted
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'staging' && 'staging' || 'development' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
    
      - name: Install system dependencies
        run: sudo apt update && sudo apt install -y ansible python3-venv python3-pip

      - name: Set up Python virtualenv
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install ansible ansible-lint

      - name: Install Ansible collections
        run: |
          source venv/bin/activate
          ansible-galaxy collection install community.docker
          ansible-galaxy collection install -r Ansbile/requirements.yml

      - name: Setup SSH for Ansible
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 192.168.1.205 >> ~/.ssh/known_hosts || true


      - name: Run Ansible Playbook
        run: |
          source venv/bin/activate
          ansible-playbook -i Ansbile/inventory.ini Ansbile/dev-server.yml
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
