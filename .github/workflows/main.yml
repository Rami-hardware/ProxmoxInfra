name: Homelab CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  testing:
    name: Testing Infrastructure Code
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Terraform setup
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      # Terraform validation (safe)
      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform lint
        run: tflint

      - name: Install pipx
        run: sudo apt install -y pipx
      - name: Install ansible-lint
        run: pipx install ansible-lint

      # Ansible setup
      - name: Install Ansible
        run: sudo apt update && sudo apt install -y ansible python3-pip && pip3 install ansible-lint

      # Ansible syntax check
      - name: Ansible syntax check
        run: ansible-playbook ansible/media-server.yml --syntax-check

      # Ansible lint
      - name: Ansible lint
        run: ansible-lint ansible/

  Deploy:
    name: Deploy Infrastructure Code
    runs-on: self-hosted
    needs: testing   

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0   # specify your version

      - name: Terraform Plan
        working-directory: Terraform
        env:
          TF_VAR_pm_api_url: ${{ secrets.PM_API_URL }}
          TF_VAR_pm_user: ${{ secrets.PM_USER }}
          TF_VAR_pm_password: ${{ secrets.PM_PASSWORD }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: terraform plan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        working-directory: Terraform
        env:
          TF_VAR_pm_api_url: ${{ secrets.PM_API_URL }}
          TF_VAR_pm_user: ${{ secrets.PM_USER }}
          TF_VAR_pm_password: ${{ secrets.PM_PASSWORD }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: terraform apply -auto-approve -target="module.proxmox_vms[\"media\"]"