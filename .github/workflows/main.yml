name: Homelab CI/CD


on:
  push:
    branches:
      - development
      - staging
      - main

jobs:
  testing:
    name: Testing Infrastructure Code
    runs-on: self-hosted
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'staging' && 'staging' || 'development' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # runner setup
      - name: Install Node.js
        run: |
          sudo apt update
          sudo apt install -y unzip curl git
          curl -fsSL https://deb.nodesource.com/setup_lts.x | sudo -E bash -
          sudo apt install -y nodejs
          
      - name: Verify installations
        run: |
          node -v
          npm -v
          unzip -v
          git --version
          curl --version

      # Terraform setup
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
      # Terraform validation (safe)
      - name: Terraform init (no backend)
        run: terraform init -backend=false
      # Terraform validate
      - name: Terraform validate
        run: terraform validate
      # Terraform tflint
      #- name: Install tflint
       # uses: terraform-linters/setup-tflint@v1
      # Terraform lint
      #- name: Terraform lint
       # run: tflint
      # Install Ansible
      - name: Install Ansible
        run: sudo apt update && sudo apt install -y ansible
      # Install Ansible and ansible-lint in virtualenv
      - name: Install Ansible and ansible-lint in virtualenv
        run: |
          sudo apt update
          sudo apt install -y ansible python3-venv python3-pip
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install ansible-lint
      
      - name: Install Ansible collections
        run: |
          source venv/bin/activate
          ansible-galaxy collection install community.docker
          ansible-galaxy collection install -r Ansbile/requirements.yml

      - name: Verify collections installed
        run: |
          ansible-galaxy collection list

      # Ansible syntax check
      - name: Ansible syntax check
        run: |
          source venv/bin/activate
          ansible-playbook  Ansbile/gateway-server.yml --syntax-check
      # Ansible lint
      #- name: Ansible lint
       # run: |
        #  source venv/bin/activate
         # ansible-lint Ansbile/

  Deploy:
    name: Deploy Infrastructure Code
    runs-on: self-hosted
    needs: testing   
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'staging' && 'staging' || 'development' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0   

      - name: Terraform init
        working-directory: Terraform
        env:
          TF_VAR_pm_api_url: ${{ secrets.PM_API_URL }}
          TF_VAR_pm_api_token: ${{ secrets.PM_API_TOKEN }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: terraform init -upgrade

      - name: Migrate Proxmox provider in state
        working-directory: Terraform
        env:
          TF_VAR_pm_api_url: ${{ secrets.PM_API_URL }}
          TF_VAR_pm_api_token: ${{ secrets.PM_API_TOKEN }}
        run: |
          terraform init -upgrade
          terraform state replace-provider \
            "registry.terraform.io/telmate/proxmox" \
            "registry.terraform.io/bpg/proxmox"
        

      - name: Terraform Plan
        working-directory: Terraform
        env:
          TF_VAR_pm_api_url: ${{ secrets.PM_API_URL }}
          TF_VAR_pm_api_token: ${{ secrets.PM_API_TOKEN }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: terraform plan -input=false -no-color

      - name: Terraform import existing VMs
        working-directory: Terraform
        env:
          TF_VAR_pm_api_url: ${{ secrets.PM_API_URL }}
          TF_VAR_pm_api_token: ${{ secrets.PM_API_TOKEN }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          echo "Importing existing VMs into Terraform state..."
          
          terraform import -lock=false 'module.proxmox_vms["gateway"].proxmox_virtual_environment_vm.vm' pve/505 || echo "VM 505 not found or already imported"
          terraform import -lock=false 'module.proxmox_vms["media"].proxmox_virtual_environment_vm.vm' pve/911 || echo "VM 911 not found or already imported"
          terraform import -lock=false 'module.proxmox_vms["game"].proxmox_virtual_environment_vm.vm' pve/619 || echo "VM 619 not found or already imported"
          terraform import -lock=false 'module.proxmox_vms["monitoring"].proxmox_virtual_environment_vm.vm' pve/511 || echo "VM 511 not found or already imported"
          terraform import -lock=false 'module.proxmox_vms["github"].proxmox_virtual_environment_vm.vm' pve/115 || echo "VM 115 not found or already imported"
          terraform import -lock=false 'module.proxmox_vms["dev"].proxmox_virtual_environment_vm.vm' pve/223 || echo "VM 223 not found or already imported"
          
          echo "Import complete. Terraform can now manage all existing VMs."
          

    #  - name: Terraform Apply
    #    working-directory: Terraform
    #    env:
    #      TF_VAR_pm_api_url: ${{ secrets.PM_API_URL }}
    #     TF_VAR_pm_api_token: ${{ secrets.PM_API_TOKEN }}
    #      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    #    run: terraform apply -auto-approve -target="module.proxmox_vms[\"monitoring\"]"

      - name: Install system dependencies
        run: sudo apt update && sudo apt install -y ansible python3-venv python3-pip

      - name: Set up Python virtualenv
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install ansible ansible-lint

      - name: Install Ansible collections
        run: |
          source venv/bin/activate
          ansible-galaxy collection install community.docker
          ansible-galaxy collection install -r Ansbile/requirements.yml

      - name: Setup SSH for Ansible
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 192.168.1.204 >> ~/.ssh/known_hosts || true

      - name: Create Ansible Vault password file
        run: |
          echo "${ANSIBLE_VAULT_PASSWORD}" > ~/.vault_pass
          chmod 600 ~/.vault_pass
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Run Ansible Playbook
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: ~/.vault_pass
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANSIBLE_HOST_KEY_CHECKING: 'False'
          SONARR_API_KEY: ${{ secrets.SONARR_API_KEY }}
          BAZARR_API_KEY: ${{ secrets.BAZARR_API_KEY }}
          PROWLARR_API_KEY: ${{ secrets.PROWLARR_API_KEY }}
          RADARR_API_KEY: ${{ secrets.RADARR_API_KEY }}
          OVERSEERR_API_KEY: ${{ secrets.OVERSEERR_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          source venv/bin/activate
          ansible-playbook -i Ansbile/inventory.ini Ansbile/media-server.yml