name: Homelab CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  testing:
    name: Testing Infrastructure Code
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Terraform setup
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      # Terraform validation (safe)
      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Install tflint
        uses: terraform-linters/setup-tflint@v1

      - name: Terraform lint
        run: tflint

      - name: Install Ansible
        run: sudo apt update && sudo apt install -y ansible



      - name: Install Ansible and ansible-lint in virtualenv
        run: |
          sudo apt update
          sudo apt install -y ansible python3-venv python3-pip
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install ansible-lint

      - name: Ansible syntax check
        run: |
          source venv/bin/activate
          ansible-playbook Ansbile/media-server.yml --syntax-check

      - name: Ansible lint
        run: |
          source venv/bin/activate
          ansible-lint Ansbile/

  Deploy:
    name: Deploy Infrastructure Code
    runs-on: self-hosted
    needs: testing   

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0   # specify your version

      - name: Terraform Plan
        working-directory: Terraform
        env:
          TF_VAR_pm_api_url: ${{ secrets.PM_API_URL }}
          TF_VAR_pm_user: ${{ secrets.PM_USER }}
          TF_VAR_pm_password: ${{ secrets.PM_PASSWORD }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: terraform plan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        working-directory: Terraform
        env:
          TF_VAR_pm_api_url: ${{ secrets.PM_API_URL }}
          TF_VAR_pm_user: ${{ secrets.PM_USER }}
          TF_VAR_pm_password: ${{ secrets.PM_PASSWORD }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: terraform apply -auto-approve -target="module.proxmox_vms[\"media\"]"