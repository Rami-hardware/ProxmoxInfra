name: Homelab CI/CD


on:
  push:
    branches:
      - development
      - staging
      - main

jobs:
  testing:
    name: Testing Infrastructure Code
    runs-on: self-hosted
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'staging' && 'staging' || 'development' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # runner setup
      - name: Install Node.js
        run: |
          sudo apt update
          sudo apt install -y unzip curl git
          curl -fsSL https://deb.nodesource.com/setup_lts.x | sudo -E bash -
          sudo apt install -y nodejs
          
      - name: Verify installations
        run: |
          node -v
          npm -v
          unzip -v
          git --version
          curl --version

      # Terraform setup
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
      # Terraform validation (safe)
      - name: Terraform init (no backend)
        run: terraform init -backend=false
      # Terraform validate
      - name: Terraform validate
        run: terraform validate
      # Terraform tflint
      - name: Install tflint
        uses: terraform-linters/setup-tflint@v1
      # Terraform lint
      - name: Terraform lint
        run: tflint
      # Install Ansible
      - name: Install Ansible
        run: sudo apt update && sudo apt install -y ansible
      # Install Ansible and ansible-lint in virtualenv
      - name: Install Ansible and ansible-lint in virtualenv
        run: |
          sudo apt update
          sudo apt install -y ansible python3-venv python3-pip
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install ansible-lint
      
      - name: Install Ansible collections
        run: |
          source venv/bin/activate
          ansible-galaxy collection install -r Ansbile/requirements.yml

      - name: Verify collections installed
        run: |
          ansible-galaxy collection list

      # Ansible syntax check
      - name: Ansible syntax check
        working-directory: Ansbile
        run: |
          source venv/bin/activate
          ansible-playbook media-server.yml --syntax-check
      # Ansible lint
      - name: Ansible lint
        working-directory: Ansbile
        run: |
          source venv/bin/activate
          ansible-lint Ansbile/

  Deploy:
    name: Deploy Infrastructure Code
    runs-on: self-hosted
    needs: testing   
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'staging' && 'staging' || 'development' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0   

      - name: Terraform Plan
        working-directory: Terraform
        env:
          TF_VAR_pm_api_url: ${{ secrets.PM_API_URL }}
          TF_VAR_pm_user: ${{ secrets.PM_USER }}
          TF_VAR_pm_password: ${{ secrets.PM_PASSWORD }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: terraform plan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        working-directory: Terraform
        env:
          TF_VAR_pm_api_url: ${{ secrets.PM_API_URL }}
          TF_VAR_pm_user: ${{ secrets.PM_USER }}
          TF_VAR_pm_password: ${{ secrets.PM_PASSWORD }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: terraform apply -auto-approve -target="module.proxmox_vms[\"media\"]"

      - name: Install Ansible
        run: sudo apt update && sudo apt install -y ansible
      
      - name: Install Ansible collections
        working-directory: Ansbile
        run: |
          source venv/bin/activate
          ansible-galaxy collection install -r requirements.yml

      - name: Run Ansible Playbook
        working-directory: Ansible
        run: |
          source venv/bin/activate
          ansible-playbook -i inventory.ini dev-server.yml
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'