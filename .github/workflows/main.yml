# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Homelab CI/CD

on:
  push:
    branches:
      - development
      - staging
      - main
    # Changes that deploy nothing through this pipeline. A full redeploy CPU-starves
    # the Proxmox host (Envoy watchdog / ingress 5xx alerts), so don't run one for
    # docs, local tooling, or ArgoCD app manifests (ArgoCD syncs those itself).
    # A push that also touches anything else still runs the full pipeline.
    # Exception: the Application CRs (argocd-apps/*-app.yaml) are applied by
    # the k3s_apps role, so they do run it. (`paths` with ! patterns: the
    # last matching pattern wins; paths-ignore can't re-include.)
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - '!tools/**'
      - '!scripts/**'
      - '!.claude/**'
      - '!.mcp.json'
      - '!Ansbile/argocd-apps/**'
      - 'Ansbile/argocd-apps/*-app.yaml'
  schedule:
    - cron: '0 3 1 * *'  # 1st of every month at 03:00 UTC — monthly redeploy (triggers cert regen as side effect)
  workflow_dispatch:
    inputs:
      full_deploy:
        description: Run every playbook (off = only hosts changed since the last green run; promote.yml uses that)
        type: boolean
        default: true

# Least privilege: every job gets a read-only token unless it asks for more
# (the repo default is read too). A reusable workflow can't exceed what its
# caller job grants, so build-image and Deploy grant their extras here.
permissions:
  contents: read

# Prevent two deploys from racing on Terraform state / Ansible runs.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect Changed Hosts
    runs-on: ubuntu-latest  # git + GitHub API only
    timeout-minutes: 5
    permissions:
      actions: read   # find the last successful run to diff against
      contents: read
    outputs:
      gateway: ${{ steps.detect.outputs.gateway }}
      monitoring: ${{ steps.detect.outputs.monitoring }}
      media: ${{ steps.detect.outputs.media }}
      git_k3s: ${{ steps.detect.outputs.git_k3s }}
      ci_runners: ${{ steps.detect.outputs.ci_runners }}
      host_node: ${{ steps.detect.outputs.host_node }}
      gateway_tags: ${{ steps.detect.outputs.gateway_tags }}
      monitoring_tags: ${{ steps.detect.outputs.monitoring_tags }}
      media_tags: ${{ steps.detect.outputs.media_tags }}
      git_k3s_tags: ${{ steps.detect.outputs.git_k3s_tags }}
      ci_runners_tags: ${{ steps.detect.outputs.ci_runners_tags }}
      host_node_tags: ${{ steps.detect.outputs.host_node_tags }}
      terraform: ${{ steps.detect.outputs.terraform }}
      terraform_apply: ${{ steps.detect.outputs.terraform_apply }}
      cloudflare: ${{ steps.detect.outputs.cloudflare }}
      lint_paths: ${{ steps.detect.outputs.lint_paths }}
      syntax_playbooks: ${{ steps.detect.outputs.syntax_playbooks }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # needs history back to the last deployed commit

      - name: Pick playbooks to run
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_DEPLOY: ${{ github.event_name != 'workflow_dispatch' || inputs.full_deploy }}
        run: .github/scripts/detect-changed-hosts.sh

  # Production deploys wait for a reviewer (environment protection). Say so on
  # Discord, with the approve link, so the run doesn't sit there unnoticed.
  approval-notice:
    name: Ask for Production Approval
    needs: [changes, testing]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post to Discord
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_CD_Alert_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          HOSTS: >-
            gateway=${{ needs.changes.outputs.gateway }}
            monitoring=${{ needs.changes.outputs.monitoring }}
            media=${{ needs.changes.outputs.media }}
            git_k3s=${{ needs.changes.outputs.git_k3s }}
            ci_runners=${{ needs.changes.outputs.ci_runners }}
            host_node=${{ needs.changes.outputs.host_node }}
            terraform=${{ needs.changes.outputs.terraform_apply }}
        run: |
          hosts=$(echo "$HOSTS" | tr ' ' '\n' | awk -F= '$2=="true"{print $1}' | paste -sd, -)
          jq -n --arg u "$RUN_URL" --arg c "${COMMIT:0:8}" --arg h "${hosts:-none (Cloudflare only)}" \
            '{embeds:[{title:"🚦 Production deploy waiting for approval", url:$u, color:15844367,
              description:"Tests passed. Open the run → **Review deployments** → Approve. If `terraform` is listed, check the **Terraform plan** summary first: approving also applies it.",
              fields:[{name:"Commit", value:("`"+$c+"`"), inline:true},
                      {name:"Hosts", value:$h, inline:true}]}]}' \
            | curl -sS -f -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK"

  build-image:
    name: Build Docker Image
    permissions:
      contents: read
      packages: write  # push the alert-forwarder image to GHCR
    uses: ./.github/workflows/build-image.yml

  testing:
    name: Testing Infrastructure Code
    # Not after build-image: tests don't use the image, so they start as soon
    # as the changes are known (Deploy still waits for both).
    needs: [changes]
    uses: ./.github/workflows/testing.yml
    with:
      gateway: ${{ needs.changes.outputs.gateway == 'true' }}
      gateway_tags: ${{ needs.changes.outputs.gateway_tags }}
      terraform: ${{ needs.changes.outputs.terraform == 'true' }}
      cloudflare: ${{ needs.changes.outputs.cloudflare == 'true' }}
      lint_paths: ${{ needs.changes.outputs.lint_paths }}
      syntax_playbooks: ${{ needs.changes.outputs.syntax_playbooks }}
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      SONARR_API_KEY: ${{ secrets.SONARR_API_KEY }}
      BAZARR_API_KEY: ${{ secrets.BAZARR_API_KEY }}
      PROWLARR_API_KEY: ${{ secrets.PROWLARR_API_KEY }}
      RADARR_API_KEY: ${{ secrets.RADARR_API_KEY }}
      OVERSEERR_API_KEY: ${{ secrets.OVERSEERR_API_KEY }}
  # development = tested code only, never deployed. staging = canary: deploys
  # the changed hosts from the staging branch; merge to main once it looks good
  # (main's next run puts main's version back on any host staging touched).
  Deploy:
    name: Deploy Infrastructure Code
    needs: [changes, build-image, testing]
    if: github.ref_name != 'development'
    # One group for every branch: staging and main deploy to the same hosts,
    # and with several runners two deploys could otherwise overlap. A deploy
    # dropped while pending is picked up by that branch's next run (the diff
    # base is its last successful run).
    concurrency:
      group: deploy-hosts
      cancel-in-progress: false
    permissions:
      contents: write  # tf_apply commits the Terraform state back to main/staging
    uses: ./.github/workflows/deploy.yml
    with:
      gateway: ${{ needs.changes.outputs.gateway == 'true' }}
      monitoring: ${{ needs.changes.outputs.monitoring == 'true' }}
      media: ${{ needs.changes.outputs.media == 'true' }}
      git_k3s: ${{ needs.changes.outputs.git_k3s == 'true' }}
      alert_forwarder_tag: ${{ needs.build-image.outputs.tag }}
      ci_runners: ${{ needs.changes.outputs.ci_runners == 'true' }}
      terraform: ${{ needs.changes.outputs.terraform == 'true' }}
      terraform_apply: ${{ needs.changes.outputs.terraform_apply == 'true' }}
      cloudflare: ${{ needs.changes.outputs.cloudflare == 'true' }}
      host_node: ${{ needs.changes.outputs.host_node == 'true' }}
      # Roles to run per host (--tags); empty = the whole playbook.
      gateway_tags: ${{ needs.changes.outputs.gateway_tags }}
      monitoring_tags: ${{ needs.changes.outputs.monitoring_tags }}
      media_tags: ${{ needs.changes.outputs.media_tags }}
      git_k3s_tags: ${{ needs.changes.outputs.git_k3s_tags }}
      ci_runners_tags: ${{ needs.changes.outputs.ci_runners_tags }}
      host_node_tags: ${{ needs.changes.outputs.host_node_tags }}
    secrets:
      PM_API_URL: ${{ secrets.PM_API_URL }}
      PM_API_TOKEN: ${{ secrets.PM_API_TOKEN }}
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
      ADGUARD_EXPORTER_PASSWORD: ${{ secrets.ADGUARD_EXPORTER_PASSWORD }}
      ADGUARD_EXPORTER_USERNAME: ${{ secrets.ADGUARD_EXPORTER_USERNAME }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
      SONARR_API_KEY: ${{ secrets.SONARR_API_KEY }}
      BAZARR_API_KEY: ${{ secrets.BAZARR_API_KEY }}
      PROWLARR_API_KEY: ${{ secrets.PROWLARR_API_KEY }}
      RADARR_API_KEY: ${{ secrets.RADARR_API_KEY }}
      OVERSEERR_API_KEY: ${{ secrets.OVERSEERR_API_KEY }}
      CF_DNS_API_TOKEN: ${{ secrets.CF_DNS_API_TOKEN }}
      PVE_EXPORTER_TOKEN: ${{ secrets.PVE_EXPORTER_TOKEN }}
      RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
  notify:
    name: Notify Discord
    needs: [build-image, testing, Deploy]
    if: always()
    uses: ./.github/workflows/notify.yml
    with:
      build_result: ${{ needs.build-image.result }}
      testing_result: ${{ needs.testing.result }}
      deploy_result: ${{ needs.Deploy.result }}
    secrets:
      DISCORD_CD_Alert_URL: ${{ secrets.DISCORD_CD_Alert_URL }}
