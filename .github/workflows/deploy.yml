name: Deploy Infrastructure Code

on:
  workflow_call:
    # Which playbooks to run — set by the `changes` job in main.yml.
    inputs:
      gateway:
        type: boolean
        default: true
      monitoring:
        type: boolean
        default: true
      media:
        type: boolean
        default: true
      git_k3s:
        type: boolean
        default: true
    secrets:
      PM_API_URL:
        required: true
      PM_API_TOKEN:
        required: true
      SSH_PUBLIC_KEY:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      ANSIBLE_VAULT_PASSWORD:
        required: true
      ADGUARD_EXPORTER_PASSWORD:
        required: false
      ADGUARD_EXPORTER_USERNAME:
        required: false
      DISCORD_WEBHOOK_URL:
        required: true
      HEALTHCHECKS_PING_URL:
        required: false
      SONARR_API_KEY:
        required: true
      BAZARR_API_KEY:
        required: true
      PROWLARR_API_KEY:
        required: true
      RADARR_API_KEY:
        required: true
      OVERSEERR_API_KEY:
        required: true
      CF_DNS_API_TOKEN:
        required: true
jobs:
  Deploy:
    name: Deploy Infrastructure Code
    runs-on: self-hosted
    env:
      # Alertmanager API (NodePort on monitoring-server), for deploy silences.
      ALERTMANAGER_URL: http://192.168.10.203:9093
    timeout-minutes: 60
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'staging' && 'staging' || 'development' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # ── Terraform ────────────────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false  # wrapper intercepts exit codes; breaks -detailed-exitcode

      - name: Setup Terraform provider mirror
        uses: ./.github/actions/setup-terraform-mirror

      - name: Terraform init
        working-directory: Terraform
        env:
          TF_VAR_pm_api_url: ${{ secrets.PM_API_URL }}
          TF_VAR_pm_api_token: ${{ secrets.PM_API_TOKEN }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: terraform init

      # NOTE: VM imports are intentionally NOT done in CI. Terraform state is
      # persistent on the self-hosted runner, so imports are only needed once
      # (first setup) or after state corruption. Run manually if needed:
      #   terraform import 'module.proxmox_vms["NAME"].proxmox_virtual_environment_vm.vm' pve/VMID

      # Detects drift between code and the live Proxmox server. CI never
      # applies — changes are applied by hand. Uses -detailed-exitcode, which
      # splits the normal 0/1 into three states:
      #   0 = no changes      -> nothing to report
      #   1 = plan errored    -> fail the job
      #   2 = changes pending -> show the plan and block on destroys
      # `set +e` is required because a bare exit 2 would otherwise trip the
      # shell's implicit -e and kill the step before the code is inspected.
      # (This is also why terraform_wrapper is disabled in the setup step —
      # the wrapper rewrites exit codes and would collapse 2 into 0.)
      - name: Terraform plan (compare code vs server)
        id: plan
        working-directory: Terraform
        env:
          TF_VAR_pm_api_url: ${{ secrets.PM_API_URL }}
          TF_VAR_pm_api_token: ${{ secrets.PM_API_TOKEN }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 1 ]; then
            echo "Terraform plan failed."
            exit 1
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected — apply manually."
            {
              echo "### ⚠️ Terraform drift — Proxmox VMs differ from code (apply manually)"
              echo '```'
              terraform show -no-color tfplan | grep -E '^ *# |^Plan:' || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes."
          fi

      - name: Fail if any VM would be destroyed
        if: steps.plan.outputs.has_changes == 'true'
        working-directory: Terraform
        run: |
          # -no-color: Terraform colours the action words, and the escape codes
          # inside "will be destroyed" made the grep below never match.
          terraform show -no-color tfplan > plan_output.txt
          cat plan_output.txt
          if grep -qE "will be destroyed|must be replaced" plan_output.txt; then
            echo "ERROR: Destroy or replace detected — blocking pipeline."
            grep -E "will be destroyed|must be replaced" plan_output.txt
            exit 1
          fi
          echo "No destroys detected — safe to proceed."

      # ── Ansible ──────────────────────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          need_install=false
          for pkg in ansible python3-venv python3-pip; do
            dpkg -s "$pkg" &>/dev/null || { need_install=true; break; }
          done
          if $need_install; then
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y ansible python3-venv python3-pip
          else
            echo "All packages already installed — skipping apt-get update."
          fi

      - name: Set up Ansible virtualenv
        uses: ./.github/actions/setup-ansible-venv

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r Ansbile/requirements.yml

      - name: Setup SSH and Vault
        uses: ./.github/actions/setup-ssh-vault
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ansible-vault-password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      # Deploys restart pods and briefly fail probes, which used to page as
      # warnings. Silence warnings (not criticals) while Ansible runs; the next
      # step removes the silence, and it expires by itself after 45 minutes.
      - name: Silence warning alerts during the deploy
        id: am_silence
        if: inputs.gateway || inputs.monitoring || inputs.media || inputs.git_k3s
        continue-on-error: true
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          end=$(date -u -d '+45 minutes' +%Y-%m-%dT%H:%M:%SZ)
          id=$(curl -sf -X POST "$ALERTMANAGER_URL/api/v2/silences" -H 'Content-Type: application/json' \
            -d "{\"matchers\":[{\"name\":\"severity\",\"value\":\"warning\",\"isRegex\":false,\"isEqual\":true}],
                 \"startsAt\":\"$now\",\"endsAt\":\"$end\",\"createdBy\":\"github-actions\",
                 \"comment\":\"CI deploy ${{ github.run_id }}\"}" | jq -r .silenceID)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Silenced warnings until $end (silence $id)"

      - name: Run Ansible playbooks
        if: inputs.gateway || inputs.monitoring || inputs.media || inputs.git_k3s
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: ~/.vault_pass
          ADGUARD_EXPORTER_PASSWORD: ${{ secrets.ADGUARD_EXPORTER_PASSWORD }}
          ADGUARD_EXPORTER_USERNAME: ${{ secrets.ADGUARD_EXPORTER_USERNAME }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SONARR_API_KEY: ${{ secrets.SONARR_API_KEY }}
          BAZARR_API_KEY: ${{ secrets.BAZARR_API_KEY }}
          PROWLARR_API_KEY: ${{ secrets.PROWLARR_API_KEY }}
          RADARR_API_KEY: ${{ secrets.RADARR_API_KEY }}
          OVERSEERR_API_KEY: ${{ secrets.OVERSEERR_API_KEY }}
          CF_DNS_API_TOKEN: ${{ secrets.CF_DNS_API_TOKEN }}
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
          RUN_GATEWAY: ${{ inputs.gateway }}
          RUN_MONITORING: ${{ inputs.monitoring }}
          RUN_MEDIA: ${{ inputs.media }}
          RUN_GIT_K3S: ${{ inputs.git_k3s }}
        run: |
          # Order matters: gateway → monitoring → media → git-k3s. A failed
          # playbook stops the ones after it.
          play() {
            if [ "$1" != true ]; then echo "Skipping $2 — no changes for it."; return; fi
            echo "::group::$2"
            ansible-playbook -i Ansbile/inventory.ini "Ansbile/$2.yml" --vault-password-file ~/.vault_pass
            echo "::endgroup::"
          }
          play "$RUN_GATEWAY" gateway-server
          play "$RUN_MONITORING" monitoring-server
          play "$RUN_MEDIA" media-server
          play "$RUN_GIT_K3S" git-k3s-server

      - name: Remove the deploy silence
        if: always() && steps.am_silence.outputs.id != ''
        continue-on-error: true
        run: curl -sf -X DELETE "$ALERTMANAGER_URL/api/v2/silence/${{ steps.am_silence.outputs.id }}"


      # ── Cloudflare (Terraform/cloudflare) ───────────────────────────────────
      # Unlike the Proxmox module, CI applies this one: zone settings and cache
      # rules are safe to reconcile automatically, and dashboard edits get
      # reverted to what is in git. Same destroy/replace guard as the VM plan.
      # Runs after Ansible so a Cloudflare API problem never blocks a server
      # deploy (it still fails the job).
      - name: Ensure Terraform state namespace exists
        run: |
          k3s kubectl create namespace terraform --dry-run=client -o yaml | k3s kubectl apply -f -

      - name: Cloudflare plan
        id: cf_plan
        working-directory: Terraform/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DNS_API_TOKEN }}
        run: |
          terraform init -input=false
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=cfplan
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 1 ]; then
            echo "Cloudflare plan failed."
            exit 1
          fi
          echo "has_changes=$([ $EXIT_CODE -eq 2 ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Cloudflare apply
        if: steps.cf_plan.outputs.has_changes == 'true' && github.ref_name == 'main'
        working-directory: Terraform/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DNS_API_TOKEN }}
        run: |
          if terraform show -no-color cfplan | grep -qE "will be destroyed|must be replaced"; then
            echo "ERROR: Destroy or replace detected in the Cloudflare plan — blocking."
            terraform show -no-color cfplan | grep -E "will be destroyed|must be replaced"
            exit 1
          fi
          terraform apply -input=false cfplan

      # cloudflared (k3s_apps role) reads its connector token from this Secret.
      # Piped so the token never appears in the log or the process list.
      - name: Store Cloudflare Tunnel token for cloudflared
        if: github.ref_name == 'main'
        working-directory: Terraform/cloudflare
        run: |
          terraform output -raw tunnel_token \
            | k3s kubectl -n cloudflared create secret generic cloudflared-token \
                --from-file=token=/dev/stdin --dry-run=client -o yaml \
            | k3s kubectl apply -f -

      - name: Cleanup secrets
        if: always()
        uses: ./.github/actions/cleanup-secrets
