name: Deploy Infrastructure Code

on:
  workflow_call:
    # Which playbooks to run — set by the `changes` job in main.yml.
    inputs:
      alert_forwarder_tag:
        description: alert-forwarder image tag from build-image.yml (app-<content hash>)
        type: string
        required: true
      gateway:
        type: boolean
        default: true
      monitoring:
        type: boolean
        default: true
      media:
        type: boolean
        default: true
      git_k3s:
        type: boolean
        default: true
      ci_runners:
        type: boolean
        default: true
      terraform:
        type: boolean
        default: true
      # Apply the Proxmox plan (main, after approval). Only true when this
      # deploy contains a Terraform code change; otherwise drift is reported.
      terraform_apply:
        type: boolean
        default: false
      cloudflare:
        type: boolean
        default: true
      host_node:
        type: boolean
        default: true
      # Roles to run per host (ansible-playbook --tags), from the `changes`
      # job; empty = the whole playbook.
      gateway_tags:
        type: string
        default: ''
      monitoring_tags:
        type: string
        default: ''
      media_tags:
        type: string
        default: ''
      git_k3s_tags:
        type: string
        default: ''
      ci_runners_tags:
        type: string
        default: ''
      host_node_tags:
        type: string
        default: ''
    secrets:
      PM_API_URL:
        required: true
      PM_API_TOKEN:
        required: true
      SSH_PUBLIC_KEY:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      ANSIBLE_VAULT_PASSWORD:
        required: true
      ADGUARD_EXPORTER_PASSWORD:
        required: false
      ADGUARD_EXPORTER_USERNAME:
        required: false
      DISCORD_WEBHOOK_URL:
        required: true
      HEALTHCHECKS_PING_URL:
        required: false
      SONARR_API_KEY:
        required: true
      BAZARR_API_KEY:
        required: true
      PROWLARR_API_KEY:
        required: true
      RADARR_API_KEY:
        required: true
      OVERSEERR_API_KEY:
        required: true
      CF_DNS_API_TOKEN:
        required: true
      RUNNER_ADMIN_TOKEN:
        # Fine-grained PAT (this repo, Administration: read and write). Only
        # the ci-runners job gets it: registers a runner that isn't yet
        # (a new or rebuilt LXC). See roles/ci_runner/defaults/main.yml.
        required: false
      PVE_EXPORTER_TOKEN:
        # Read-only PVE API token for prometheus-pve-exporter on host-node.
        # Until it is set, the host-node playbook skips the pve-exporter install
        # (see roles/proxmox_exporters, docs/runbooks/exporters.md).
        required: false
# Each secret the playbooks read via lookup('env', ...) goes only to the host
# job whose roles read it (step env below), not to every job. The SSH key and
# vault password go through ansible-prep.
env:
  ANSIBLE_VAULT_PASSWORD_FILE: ~/.vault_pass
  ALERT_FORWARDER_TAG: ${{ inputs.alert_forwarder_tag }}
  # Alertmanager API (NodePort on monitoring-server), for deploy silences
  # (.github/scripts/am-silence.sh).
  ALERTMANAGER_URL: ${{ vars.ALERTMANAGER_URL }}

# Every host job starts at once after the approval (and the Terraform apply),
# each on its own runner:
#   tf_plan → gate (approval) → tf_apply → gateway | monitoring | media | host-node | git-k3s | ci-runners → finish (Cloudflare) + smoke
# Each deploy job silences its own host's warning alerts while it runs (am-silence.sh).
# Safe on a running cluster: k3s_agent and ci_runner only *read* the token /
# kubeconfig from git-k3s, and with per-role --tags a push rarely restarts k3s
# and an agent together. A failing host no longer holds the others back. A
# fresh cluster is bootstrapped in order by hand (docs/rebuild.md).
jobs:
  # The only job bound to an environment: one Production approval per deploy
  # (covering the Terraform apply too), and each environment's Deployments
  # page is real deploy history.
  # Proxmox VMs/LXCs. Runs BEFORE the approval so the plan is on the run
  # summary when you click Approve; tf_apply applies exactly this plan.
  tf_plan:
    name: Terraform plan
    if: inputs.terraform
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      TF_VAR_pm_api_url: ${{ secrets.PM_API_URL }}
      TF_VAR_pm_api_token: ${{ secrets.PM_API_TOKEN }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      fingerprint: ${{ steps.plan.outputs.fingerprint }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # renovate: datasource=github-releases depName=hashicorp/terraform
          terraform_version: 1.6.0
          terraform_wrapper: false  # wrapper intercepts exit codes; breaks -detailed-exitcode

      - name: Setup Terraform provider mirror
        uses: ./.github/actions/setup-terraform-mirror

      - name: Terraform init
        working-directory: Terraform
        run: terraform init

      # NOTE: VM imports are intentionally NOT done in CI. Terraform state is
      # committed to git, so imports are only needed once (first setup) or
      # after state corruption. Run manually if needed:
      #   terraform import 'module.proxmox_vms["NAME"].proxmox_virtual_environment_vm.vm' pve/VMID

      # Detects drift between code and the live Proxmox server. Uses
      # -detailed-exitcode, which
      # splits the normal 0/1 into three states:
      #   0 = no changes      -> nothing to report
      #   1 = plan errored    -> fail the job
      #   2 = changes pending -> show the plan and block on destroys
      # `set +e` is required because a bare exit 2 would otherwise trip the
      # shell's implicit -e and kill the step before the code is inspected.
      # (This is also why terraform_wrapper is disabled in the setup step —
      # the wrapper rewrites exit codes and would collapse 2 into 0.)
      - name: Terraform plan (compare code vs server)
        id: plan
        working-directory: Terraform
        env:
          APPLY: ${{ inputs.terraform_apply }}
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 1 ]; then
            echo "Terraform plan failed."
            exit 1
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "fingerprint=$("$GITHUB_WORKSPACE/.github/scripts/tf-plan-fingerprint.sh" tfplan)" >> $GITHUB_OUTPUT
            echo "Changes detected."
            [ "$APPLY" = true ] || echo "::warning::Proxmox differs from the Terraform code, but this deploy has no Terraform code change — not applying (see the run summary)."
            {
              if [ "$GITHUB_REF_NAME" = main ] && [ "$APPLY" = true ]; then
                echo "### ⚠️ Terraform — applied after the Production approval"
              elif [ "$APPLY" = true ]; then
                echo "### ⚠️ Terraform — code change; applied on main after the approval"
              else
                echo "### ⚠️ Terraform drift — NOT applied (no Terraform code change)"
                echo "Proxmox was changed by hand, or a change is not committed. Commit it to code, or apply by hand."
              fi
              echo '```'
              terraform show -no-color tfplan | grep -E '^ *# |^Plan:' || true
              echo '```'
              # The attribute-level diff — what you are approving.
              echo '<details><summary>Full plan</summary>'
              echo
              echo '```'
              terraform show -no-color tfplan
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes."
          fi

      - name: Fail if any VM would be destroyed
        if: steps.plan.outputs.has_changes == 'true'
        working-directory: Terraform
        run: |
          # -no-color: Terraform colours the action words, and the escape codes
          # inside "will be destroyed" made the grep below never match.
          terraform show -no-color tfplan > plan_output.txt
          cat plan_output.txt
          if grep -qE "will be destroyed|must be replaced" plan_output.txt; then
            echo "ERROR: Destroy or replace detected — blocking pipeline."
            grep -E "will be destroyed|must be replaced" plan_output.txt
            exit 1
          fi
          echo "No destroys detected — safe to proceed."

  gate:
    name: Approval
    needs: [tf_plan]
    # tf_plan skipped (Terraform untouched) is fine; a failed plan or a
    # destroy/replace blocks the whole deploy.
    if: ${{ !cancelled() && !failure() }}
    # Only waits for the approval: GitHub-hosted, so it never queues for a
    # LAN runner. Each deploy job silences alerts itself (am-silence.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ github.ref_name == 'main' && 'Production' || github.ref_name == 'staging' && 'Staging' || 'Development' }}
    steps:
      - name: Approved
        run: echo "Deploying ${{ github.sha }} to ${{ github.ref_name }}"

  # Applies the reviewed Proxmox plan — main only, after the approval, and
  # only when this deploy contains a Terraform code change (never for drift).
  tf_apply:
    name: Terraform apply
    needs: [tf_plan, gate]
    if: ${{ !cancelled() && !failure() && github.ref_name == 'main' && inputs.terraform_apply && needs.tf_plan.outputs.has_changes == 'true' }}
    # Never on git-k3s-server: a VM change can reboot it (e.g. memory), which
    # would kill the job mid-apply and lose the new state.
    runs-on: [self-hosted, lxc]
    timeout-minutes: 40
    env:
      TF_VAR_pm_api_url: ${{ secrets.PM_API_URL }}
      TF_VAR_pm_api_token: ${{ secrets.PM_API_TOKEN }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # renovate: datasource=github-releases depName=hashicorp/terraform
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Setup Terraform provider mirror
        uses: ./.github/actions/setup-terraform-mirror

      - name: Terraform init
        working-directory: Terraform
        run: terraform init

      - name: Silence warning alerts while this job runs
        id: silence
        continue-on-error: true
        run: .github/scripts/am-silence.sh create "${{ github.job }}"

      # Re-plan now and compare with the plan shown before the approval:
      # anything that moved in between (a hand apply, a console change) means
      # what you approved is no longer what would happen.
      - name: Re-plan and check it matches the approved plan
        working-directory: Terraform
        env:
          APPROVED: ${{ needs.tf_plan.outputs.fingerprint }}
        run: |
          terraform plan -input=false -no-color -out=tfplan > /dev/null
          now=$("$GITHUB_WORKSPACE/.github/scripts/tf-plan-fingerprint.sh" tfplan)
          terraform show -no-color tfplan | grep -E '^ *# |^Plan:' || true
          if [ "$now" != "$APPROVED" ]; then
            echo "::error::The Terraform plan changed after it was reviewed — not applying. Re-run the pipeline to review the new plan."
            exit 1
          fi

      # -parallelism=1: the Proxmox API races on concurrent VM operations.
      - name: Terraform apply
        id: apply
        working-directory: Terraform
        run: terraform apply -input=false -no-color -parallelism=1 tfplan

      # State lives in git. Commit it even after a failed apply (a partial
      # apply still changed real resources), to main and to staging so the
      # canary plans against the same state. GITHUB_TOKEN pushes start no
      # workflows; promote.yml accepts main-only state commits.
      - name: Commit the new state to main and staging
        if: always() && (steps.apply.outcome == 'success' || steps.apply.outcome == 'failure')
        run: |
          cp Terraform/terraform.tfstate "$RUNNER_TEMP/terraform.tfstate"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rc=0
          for branch in main staging; do
            ok=false
            for try in 1 2 3; do
              git fetch -q origin "$branch"
              git checkout -q -f -B "tfstate-$branch" "origin/$branch"
              cp "$RUNNER_TEMP/terraform.tfstate" Terraform/terraform.tfstate
              git add Terraform/terraform.tfstate
              if git diff --cached --quiet; then ok=true; break; fi
              git commit -q -m "terraform: state after apply (run $GITHUB_RUN_ID)"
              if git push -q origin "HEAD:$branch"; then ok=true; break; fi
              sleep 5
            done
            if $ok; then echo "State committed to $branch."; else
              echo "::error::Could not push the state to $branch — commit Terraform/terraform.tfstate from this run's runner by hand."; rc=1
            fi
          done
          exit $rc

      - name: Remove this job's silence
        if: always() && steps.silence.outputs.id != ''
        continue-on-error: true
        run: .github/scripts/am-silence.sh delete "${{ steps.silence.outputs.id }}"

  gateway:
    name: "Ansible: gateway-server"
    needs: [gate, tf_apply]
    # Run when this host changed and nothing before it failed (skipped is fine).
    if: ${{ !cancelled() && !failure() && inputs.gateway }}
    runs-on: self-hosted
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Silence warning alerts while this job runs
        id: silence
        continue-on-error: true
        run: .github/scripts/am-silence.sh create "${{ github.job }}" 'instance=~gateway-server|192\.168\.10\.200' 'namespace=network'

      - name: Prepare Ansible
        uses: ./.github/actions/ansible-prep
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ansible-vault-password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: ansible-playbook gateway-server
        env:
          TAGS: ${{ inputs.gateway_tags }}
          # roles/adguard
          ADGUARD_EXPORTER_USERNAME: ${{ secrets.ADGUARD_EXPORTER_USERNAME }}
          ADGUARD_EXPORTER_PASSWORD: ${{ secrets.ADGUARD_EXPORTER_PASSWORD }}
        run: |
          [ -n "$TAGS" ] && echo "Only roles: $TAGS" || echo "Whole playbook"
          ansible-playbook -i Ansbile/inventory.ini Ansbile/gateway-server.yml --vault-password-file ~/.vault_pass ${TAGS:+--tags "$TAGS"}

      - name: Remove this job's silence
        if: always() && steps.silence.outputs.id != ''
        continue-on-error: true
        run: .github/scripts/am-silence.sh delete "${{ steps.silence.outputs.id }}"

      - name: Cleanup secrets
        if: always()
        uses: ./.github/actions/cleanup-secrets

  monitoring:
    name: "Ansible: monitoring-server"
    needs: [gate, tf_apply]
    # Run when this host changed and nothing before it failed (skipped is fine).
    if: ${{ !cancelled() && !failure() && inputs.monitoring }}
    runs-on: self-hosted
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Silence warning alerts while this job runs
        id: silence
        continue-on-error: true
        run: .github/scripts/am-silence.sh create "${{ github.job }}" 'instance=~monitoring-server|192\.168\.10\.203' 'namespace=monitoring'

      - name: Prepare Ansible
        uses: ./.github/actions/ansible-prep
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ansible-vault-password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: ansible-playbook monitoring-server
        env:
          TAGS: ${{ inputs.monitoring_tags }}
          # roles/alertmanager (dead man's switch)
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: |
          [ -n "$TAGS" ] && echo "Only roles: $TAGS" || echo "Whole playbook"
          ansible-playbook -i Ansbile/inventory.ini Ansbile/monitoring-server.yml --vault-password-file ~/.vault_pass ${TAGS:+--tags "$TAGS"}

      - name: Remove this job's silence
        if: always() && steps.silence.outputs.id != ''
        continue-on-error: true
        run: .github/scripts/am-silence.sh delete "${{ steps.silence.outputs.id }}"

      - name: Cleanup secrets
        if: always()
        uses: ./.github/actions/cleanup-secrets

  media:
    name: "Ansible: media-server"
    needs: [gate, tf_apply]
    # Run when this host changed and nothing before it failed (skipped is fine).
    if: ${{ !cancelled() && !failure() && inputs.media }}
    runs-on: self-hosted
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Silence warning alerts while this job runs
        id: silence
        continue-on-error: true
        run: .github/scripts/am-silence.sh create "${{ github.job }}" 'instance=media-server' 'namespace=media'

      - name: Prepare Ansible
        uses: ./.github/actions/ansible-prep
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ansible-vault-password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: ansible-playbook media-server
        env:
          TAGS: ${{ inputs.media_tags }}
          # group_vars/media-vm.yml (roles/scraparr)
          SONARR_API_KEY: ${{ secrets.SONARR_API_KEY }}
          BAZARR_API_KEY: ${{ secrets.BAZARR_API_KEY }}
          PROWLARR_API_KEY: ${{ secrets.PROWLARR_API_KEY }}
          RADARR_API_KEY: ${{ secrets.RADARR_API_KEY }}
          OVERSEERR_API_KEY: ${{ secrets.OVERSEERR_API_KEY }}
        run: |
          [ -n "$TAGS" ] && echo "Only roles: $TAGS" || echo "Whole playbook"
          ansible-playbook -i Ansbile/inventory.ini Ansbile/media-server.yml --vault-password-file ~/.vault_pass ${TAGS:+--tags "$TAGS"}

      - name: Remove this job's silence
        if: always() && steps.silence.outputs.id != ''
        continue-on-error: true
        run: .github/scripts/am-silence.sh delete "${{ steps.silence.outputs.id }}"

      - name: Cleanup secrets
        if: always()
        uses: ./.github/actions/cleanup-secrets

  # The Proxmox host itself (exporters only); independent of the VMs.
  host_node:
    name: "Ansible: host-node"
    needs: [gate, tf_apply]
    # Run when this host changed and nothing before it failed (skipped is fine).
    if: ${{ !cancelled() && !failure() && inputs.host_node }}
    runs-on: self-hosted
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Silence warning alerts while this job runs
        id: silence
        continue-on-error: true
        run: .github/scripts/am-silence.sh create "${{ github.job }}" 'instance=host-node'

      - name: Prepare Ansible
        uses: ./.github/actions/ansible-prep
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ansible-vault-password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: ansible-playbook host-node
        env:
          TAGS: ${{ inputs.host_node_tags }}
          # roles/proxmox_exporters
          PVE_EXPORTER_TOKEN: ${{ secrets.PVE_EXPORTER_TOKEN }}
        run: |
          [ -n "$TAGS" ] && echo "Only roles: $TAGS" || echo "Whole playbook"
          ansible-playbook -i Ansbile/inventory.ini Ansbile/host-node.yml --vault-password-file ~/.vault_pass ${TAGS:+--tags "$TAGS"}

      - name: Remove this job's silence
        if: always() && steps.silence.outputs.id != ''
        continue-on-error: true
        run: .github/scripts/am-silence.sh delete "${{ steps.silence.outputs.id }}"

      - name: Cleanup secrets
        if: always()
        uses: ./.github/actions/cleanup-secrets

  git_k3s:
    name: "Ansible: git-k3s-server"
    needs: [gate, tf_apply]
    # Run when this host changed and nothing before it failed (skipped is fine).
    if: ${{ !cancelled() && !failure() && inputs.git_k3s }}
    runs-on: self-hosted
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Silence warning alerts while this job runs
        id: silence
        continue-on-error: true
        run: .github/scripts/am-silence.sh create "${{ github.job }}"

      - name: Prepare Ansible
        uses: ./.github/actions/ansible-prep
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ansible-vault-password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: ansible-playbook git-k3s-server
        env:
          TAGS: ${{ inputs.git_k3s_tags }}
          # roles/k3s_apps (alert-forwarder, cert-manager DNS-01)
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CF_DNS_API_TOKEN: ${{ secrets.CF_DNS_API_TOKEN }}
        run: |
          [ -n "$TAGS" ] && echo "Only roles: $TAGS" || echo "Whole playbook"
          ansible-playbook -i Ansbile/inventory.ini Ansbile/git-k3s-server.yml --vault-password-file ~/.vault_pass ${TAGS:+--tags "$TAGS"}

      - name: Remove this job's silence
        if: always() && steps.silence.outputs.id != ''
        continue-on-error: true
        run: .github/scripts/am-silence.sh delete "${{ steps.silence.outputs.id }}"

      - name: Cleanup secrets
        if: always()
        uses: ./.github/actions/cleanup-secrets

  # The runner LXCs copy their kubeconfig from k3s (a file read; fine in parallel).
  ci_runners:
    name: "Ansible: ci-runners"
    needs: [gate, tf_apply]
    # Run when this host changed and nothing before it failed (skipped is fine).
    if: ${{ !cancelled() && !failure() && inputs.ci_runners }}
    runs-on: self-hosted
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Silence warning alerts while this job runs
        id: silence
        continue-on-error: true
        run: .github/scripts/am-silence.sh create "${{ github.job }}" 'instance=~ci-runner-.*'

      - name: Prepare Ansible
        uses: ./.github/actions/ansible-prep
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ansible-vault-password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: ansible-playbook ci-runners
        env:
          TAGS: ${{ inputs.ci_runners_tags }}
          RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
        run: |
          [ -n "$TAGS" ] && echo "Only roles: $TAGS" || echo "Whole playbook"
          ansible-playbook -i Ansbile/inventory.ini Ansbile/ci-runners.yml --vault-password-file ~/.vault_pass ${TAGS:+--tags "$TAGS"}

      - name: Remove this job's silence
        if: always() && steps.silence.outputs.id != ''
        continue-on-error: true
        run: .github/scripts/am-silence.sh delete "${{ steps.silence.outputs.id }}"

      - name: Cleanup secrets
        if: always()
        uses: ./.github/actions/cleanup-secrets

  # Only when Terraform/cloudflare changed (or a full run).
  finish:
    name: Cloudflare
    needs: [gate, tf_apply, gateway, monitoring, media, host_node, git_k3s, ci_runners]
    if: always() && needs.gate.result == 'success' && inputs.cloudflare
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        if: inputs.cloudflare && !contains(needs.*.result, 'failure')
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # renovate: datasource=github-releases depName=hashicorp/terraform
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Setup Terraform provider mirror
        if: inputs.cloudflare && !contains(needs.*.result, 'failure')
        uses: ./.github/actions/setup-terraform-mirror

      # ── Cloudflare (Terraform/cloudflare) ───────────────────────────────────
      # Unlike the Proxmox module, CI applies this one: zone settings and cache
      # rules are safe to reconcile automatically, and dashboard edits get
      # reverted to what is in git. Same destroy/replace guard as the VM plan.
      # Runs after the host jobs so a Cloudflare API problem never blocks a
      # server deploy (it still fails the run).
      - name: Ensure Terraform state namespace exists
        if: inputs.cloudflare && !contains(needs.*.result, 'failure')
        run: |
          kubectl create namespace terraform --dry-run=client -o yaml | kubectl apply -f -

      - name: Cloudflare plan
        id: cf_plan
        if: inputs.cloudflare && !contains(needs.*.result, 'failure')
        working-directory: Terraform/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DNS_API_TOKEN }}
        run: |
          terraform init -input=false
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=cfplan
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 1 ]; then
            echo "Cloudflare plan failed."
            exit 1
          fi
          echo "has_changes=$([ $EXIT_CODE -eq 2 ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Cloudflare apply
        if: steps.cf_plan.outputs.has_changes == 'true' && github.ref_name == 'main'
        working-directory: Terraform/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DNS_API_TOKEN }}
        run: |
          if terraform show -no-color cfplan | grep -qE "will be destroyed|must be replaced"; then
            echo "ERROR: Destroy or replace detected in the Cloudflare plan — blocking."
            terraform show -no-color cfplan | grep -E "will be destroyed|must be replaced"
            exit 1
          fi
          terraform apply -input=false cfplan

      # cloudflared (k3s_apps role) reads its connector token from this Secret.
      # Piped so the token never appears in the log or the process list.
      - name: Store Cloudflare Tunnel token for cloudflared
        if: inputs.cloudflare && github.ref_name == 'main' && !contains(needs.*.result, 'failure')
        working-directory: Terraform/cloudflare
        run: |
          terraform output -raw tunnel_token \
            | kubectl -n cloudflared create secret generic cloudflared-token \
                --from-file=token=/dev/stdin --dry-run=client -o yaml \
            | kubectl apply -f -

  # Does the lab work after this deploy? Cluster-wide checks plus the
  # Prometheus targets of the hosts that deployed (.github/scripts/smoke-test.sh).
  # A failure fails the run, so staging is not promotable.
  smoke:
    name: Smoke test
    needs: [gate, tf_apply, gateway, monitoring, media, host_node, git_k3s, ci_runners]
    if: >-
      always() && needs.gate.result == 'success' &&
      (inputs.gateway || inputs.monitoring || inputs.media || inputs.git_k3s || inputs.ci_runners || inputs.host_node || needs.tf_apply.result == 'success')
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Smoke test
        env:
          HOSTS: >-
            ${{ inputs.gateway && 'gateway' || '' }}
            ${{ inputs.monitoring && 'monitoring' || '' }}
            ${{ inputs.media && 'media' || '' }}
            ${{ inputs.git_k3s && 'git_k3s' || '' }}
            ${{ inputs.ci_runners && 'ci_runners' || '' }}
            ${{ inputs.host_node && 'host_node' || '' }}
        # shellcheck disable=SC2086  # word-split the host list on purpose
        run: .github/scripts/smoke-test.sh $HOSTS
