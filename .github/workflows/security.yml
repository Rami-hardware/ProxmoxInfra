name: Security Scan

on:
  workflow_call:
    secrets:
      DISCORD_CI_ALERT_SEC_URL:
        required: true

jobs:
  security:
    name: Security Scan
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Scans the repo filesystem for misconfigurations (Terraform, Ansible, Dockerfiles),
      # known-secret patterns, and vulnerable/CVE-affected dependencies (e.g. requirements.txt,
      # collections). Runs in a throwaway container like the image scan in build-image.yml,
      # so the vuln DB never touches the runner's disk.
      - name: Scan repo for misconfigurations, secrets, and CVEs
        run: |
          sudo docker run --rm \
            -v "$PWD":/workspace \
            -e TRIVY_SKIP_JAVA_DB_UPDATE=true \
            aquasec/trivy:0.70.0 fs \
            --scanners misconfig,secret,vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format json \
            --output /workspace/trivy-fs-results.json \
            --exit-code 0 \
            /workspace
          sudo chown "$(id -u):$(id -g)" trivy-fs-results.json

      - name: Check findings and notify Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_CI_ALERT_SEC_URL }}
        run: |
          COUNT=$(jq '[.Results[]? | (.Misconfigurations // [])[], (.Secrets // [])[], (.Vulnerabilities // [])[]] | length' trivy-fs-results.json)
          echo "Found $COUNT CRITICAL/HIGH security findings"

          if [ "$COUNT" -eq 0 ]; then
            TITLE="✅ Security scan (repo): no CRITICAL/HIGH findings"
            COLOR=3066993
            FIELDS_EXTRA=""
          else
            SUMMARY=$(jq -r '
              [.Results[]? |
                ( (.Misconfigurations // [])[] | "MISCONFIG \(.Severity): \(.ID) \(.Title)" ),
                ( (.Secrets // [])[] | "SECRET \(.Severity): \(.RuleID) in \(.Title // "file")" ),
                ( (.Vulnerabilities // [])[] | "CVE \(.Severity): \(.PkgName) \(.VulnerabilityID) (\(.InstalledVersion) -> \(.FixedVersion // "no fix"))" )
              ] | .[0:15] | join("\n")
            ' trivy-fs-results.json)

            MSG=$(printf '%s' "$SUMMARY" | head -c 3500 \
                  | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')

            TITLE="⚠️ Security scan (repo): $COUNT CRITICAL/HIGH finding(s)"
            COLOR=15158332
            FIELDS_EXTRA=", {\"name\": \"Findings (top 15)\", \"value\": $MSG}"
          fi

          curl -sS -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK" <<EOF
          {
            "embeds": [{
              "title": "$TITLE",
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "color": $COLOR,
              "fields": [
                {"name": "Branch", "value": "\`${{ github.ref_name }}\`", "inline": true},
                {"name": "Commit", "value": "\`${{ github.sha }}\`", "inline": true}$FIELDS_EXTRA
              ],
              "footer": {"text": "Trivy fs scan — misconfig + secrets + CVEs"}
            }]
          }
          EOF

      # Runner has a small disk — the results file and the Trivy image itself
      # (pulled fresh each run) accumulate over time and can fill it.
      - name: Cleanup scan results and Trivy image
        if: always()
        run: |
          rm -f trivy-fs-results.json
          sudo docker rmi aquasec/trivy:0.70.0 || true

      # Scans every image actually running in the k3s cluster (not just what's on the
      # runner's local Docker disk). For each image: pull -> scan -> delete, so only one
      # image's layers are ever on disk at a time — keeps the small runner disk from filling.
      - name: Scan all k3s workload images for CVEs
        env:
          WEBHOOK: ${{ secrets.DISCORD_CI_ALERT_SEC_URL }}
        run: |
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          IMAGES=$(sudo kubectl get pods --all-namespaces \
            -o jsonpath='{range .items[*].spec.containers[*]}{.image}{"\n"}{end}' \
            | sort -u)

          if [ -z "$IMAGES" ]; then
            echo "No running pods found — skipping k3s image scan."
            exit 0
          fi

          echo "$IMAGES"
          : > k3s-scan-summary.txt
          TOTAL=0

          while IFS= read -r IMAGE; do
            [ -z "$IMAGE" ] && continue
            echo "Scanning $IMAGE..."
            sudo docker pull "$IMAGE" >/dev/null 2>&1 || { echo "  could not pull $IMAGE — skipping"; continue; }

            sudo docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD":/workspace \
              -e TRIVY_SKIP_JAVA_DB_UPDATE=true \
              aquasec/trivy:0.70.0 image \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --format json \
              --output /workspace/trivy-k3s-result.json \
              --exit-code 0 \
              "$IMAGE"
            sudo chown "$(id -u):$(id -g)" trivy-k3s-result.json

            COUNT=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-k3s-result.json)
            TOTAL=$((TOTAL + COUNT))
            if [ "$COUNT" -gt 0 ]; then
              jq -r --arg img "$IMAGE" '
                [.Results[]?.Vulnerabilities[]? |
                  "\($img): \(.Severity) \(.PkgName) \(.VulnerabilityID) (\(.InstalledVersion) -> \(.FixedVersion // "no fix"))"
                ] | .[0:5] | join("\n")
              ' trivy-k3s-result.json >> k3s-scan-summary.txt
            fi

            rm -f trivy-k3s-result.json
            sudo docker rmi "$IMAGE" >/dev/null 2>&1 || true
          done <<< "$IMAGES"

          echo "Found $TOTAL total CRITICAL/HIGH vulnerabilities across k3s images"
          if [ "$TOTAL" -eq 0 ]; then
            TITLE="✅ k3s images: no CRITICAL/HIGH CVEs found"
            COLOR=3066993
            FIELDS_EXTRA=""
          else
            MSG=$(head -c 3500 k3s-scan-summary.txt \
                  | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
            TITLE="⚠️ k3s images: $TOTAL CRITICAL/HIGH CVE(s) found"
            COLOR=15158332
            FIELDS_EXTRA=", {\"name\": \"Findings (top 5 per image)\", \"value\": $MSG}"
          fi

          curl -sS -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK" <<EOF
          {
            "embeds": [{
              "title": "$TITLE",
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "color": $COLOR,
              "fields": [
                {"name": "Branch", "value": "\`${{ github.ref_name }}\`", "inline": true}$FIELDS_EXTRA
              ],
              "footer": {"text": "Trivy scan across all running k3s pod images"}
            }]
          }
          EOF

      - name: Cleanup k3s scan summary
        if: always()
        run: rm -f k3s-scan-summary.txt
