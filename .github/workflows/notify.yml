name: Notify Discord

on:
  workflow_call:
    inputs:
      build_result:
        required: true
        type: string
      testing_result:
        required: true
        type: string
      deploy_result:
        required: true
        type: string
      changes_result:
        required: true
        type: string
    secrets:
      DISCORD_CD_Alert_URL:
        required: true

jobs:
  notify:
    name: Notify Discord
    runs-on: ubuntu-latest  # one curl to Discord
    timeout-minutes: 5
    steps:
      - name: Send Discord notification
        env:
          WEBHOOK: ${{ secrets.DISCORD_CD_Alert_URL }}
          BUILD_RESULT: ${{ inputs.build_result }}
          TESTING_RESULT: ${{ inputs.testing_result }}
          DEPLOY_RESULT: ${{ inputs.deploy_result }}
          CHANGES_RESULT: ${{ inputs.changes_result }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Discord embed colors: green=3066993, red=15158332, yellow=15844367, grey=9807270
          # development never deploys, so a skipped deploy is expected there.
          DEPLOY_OK=false
          if [ "$DEPLOY_RESULT" = "success" ] || { [ "$BRANCH" = "development" ] && [ "$DEPLOY_RESULT" = "skipped" ]; }; then
            DEPLOY_OK=true
          fi
          if [ "$CHANGES_RESULT" = "success" ] && [ "$BUILD_RESULT" = "success" ] && [ "$TESTING_RESULT" = "success" ] && $DEPLOY_OK; then
            STATUS="✅ Success"; COLOR=3066993
          elif [ "$BUILD_RESULT" = "cancelled" ] || [ "$TESTING_RESULT" = "cancelled" ] || [ "$DEPLOY_RESULT" = "cancelled" ]; then
            STATUS="⏹️ Cancelled"; COLOR=9807270
          elif [ "$CHANGES_RESULT" = "skipped" ] && [ "$TESTING_RESULT" = "skipped" ] && [ "$DEPLOY_RESULT" = "skipped" ]; then
            STATUS="⚠️ Skipped"; COLOR=15844367
          else
            STATUS="❌ Failed"; COLOR=15158332
          fi

          # Truncate + JSON-escape commit message (handles quotes, newlines, etc.)
          MSG=$(printf '%s' "${COMMIT_MSG:-no message}" | head -c 200 \
                | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')

          jq -n \
            --arg title "$STATUS — Homelab CI/CD" --arg url "$RUN_URL" \
            --arg branch "\`$BRANCH\`" --arg actor "$ACTOR" \
            --arg commit "\`${COMMIT:0:7}\`" --arg build "$BUILD_RESULT" \
            --arg testing "$TESTING_RESULT" --arg deploy "$DEPLOY_RESULT" \
            --arg message "${COMMIT_MSG:-no message}" --argjson color "$COLOR" \
            '{embeds:[{title:$title,url:$url,color:$color,fields:[
              {name:"Branch",value:$branch,inline:true},
              {name:"Author",value:$actor,inline:true},
              {name:"Commit",value:$commit,inline:true},
              {name:"Build",value:$build,inline:true},
              {name:"Testing",value:$testing,inline:true},
              {name:"Deploy",value:$deploy,inline:true},
              {name:"Message",value:$message}],footer:{text:"GitHub Actions"}}]}' \
            | curl -sS -f -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK"
