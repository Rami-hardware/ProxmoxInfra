name: Build Docker Image

on:
  workflow_call:
    outputs:
      tag:
        description: alert-forwarder image tag to deploy (app-<content hash>)
        value: ${{ jobs.build-image.outputs.tag }}

jobs:
  build-image:
    name: Build Docker Image
    # GitHub-hosted: needs only GHCR, keeps Docker builds off the k3s control
    # plane, and its disk is thrown away after the job (no prune needed).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The tag is the git tree hash of the app directory: same code → same
      # tag on every commit, so an unchanged app is neither rebuilt nor
      # redeployed (Helm sees the same image.tag and doesn't restart the pod).
      - name: Work out image tag
        id: tag
        run: echo "tag=app-$(git rev-parse HEAD:Ansbile/apps/alert-forwarder | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build only when this app content has never been pushed: covers both
      # "the code changed" and "never built before".
      - name: Check whether this version is already built
        id: exists
        env:
          IMAGE: ghcr.io/rami-hardware/alert-forwarder:${{ steps.tag.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE already exists — skipping the build."
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "$IMAGE not found — building it."
          fi

      - name: Set up Docker Buildx
        if: steps.exists.outputs.built == 'false'
        uses: docker/setup-buildx-action@v4

      # :latest is only a convenience pointer, so only main moves it.
      - name: Build and push image
        if: steps.exists.outputs.built == 'false'
        uses: docker/build-push-action@v7
        with:
          context: Ansbile/apps/alert-forwarder
          push: true
          tags: |
            ghcr.io/rami-hardware/alert-forwarder:${{ steps.tag.outputs.tag }}
            ${{ github.ref_name == 'main' && 'ghcr.io/rami-hardware/alert-forwarder:latest' || '' }}
