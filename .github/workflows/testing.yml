name: Testing Infrastructure Code

on:
  workflow_call:
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      ANSIBLE_VAULT_PASSWORD:
        required: true
      DISCORD_WEBHOOK_URL:
        required: true
      DISCORD_CI_ALERT_SEC_URL:
        required: true
      SONARR_API_KEY:
        required: true
      BAZARR_API_KEY:
        required: true
      PROWLARR_API_KEY:
        required: true
      RADARR_API_KEY:
        required: true
      OVERSEERR_API_KEY:
        required: true
jobs:
  testing:
    name: Testing Infrastructure Code
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Security (was security.yml) ──────────────────────────────────────────
      # First, so a committed secret fails fast and blocks the deploy.
      # Scans the repo filesystem for misconfigurations (Terraform, Ansible, Dockerfiles)
      # and known-secret patterns. Runs in a throwaway container like the image scan in
      # build-image.yml, so nothing touches the runner's disk beyond the results file.
      # CVE/dependency vuln scanning is disabled for now (see "Scan all k3s workload
      # images for CVEs" step below, also disabled) — re-enable by adding "vuln" back
      # to --scanners and restoring the k3s image scan step.
      - name: Scan repo for misconfigurations and secrets
        run: |
          sudo docker run --rm \
            -v "$PWD":/workspace \
            -e TRIVY_SKIP_JAVA_DB_UPDATE=true \
            aquasec/trivy:0.70.0 fs \
            --scanners misconfig,secret \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format json \
            --output /workspace/trivy-fs-results.json \
            --exit-code 0 \
            /workspace
          sudo chown "$(id -u):$(id -g)" trivy-fs-results.json

      # Discord being down must not block a deploy now that this job gates it.
      - name: Check findings and notify Discord
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_CI_ALERT_SEC_URL }}
        run: |
          COUNT=$(jq '[.Results[]? | (.Misconfigurations // [])[], (.Secrets // [])[]] | length' trivy-fs-results.json)
          echo "Found $COUNT CRITICAL/HIGH security findings"

          if [ "$COUNT" -eq 0 ]; then
            TITLE="✅ Security scan (repo): no CRITICAL/HIGH findings"
            COLOR=3066993
            FIELDS_EXTRA=""
          else
            SUMMARY=$(jq -r '
              [.Results[]? |
                ( (.Misconfigurations // [])[] | "MISCONFIG \(.Severity): \(.ID) \(.Title)" ),
                ( (.Secrets // [])[] | "SECRET \(.Severity): \(.RuleID) in \(.Title // "file")" )
              ] | .[0:15] | join("\n")
            ' trivy-fs-results.json)

            # Discord embed field values are capped at 1024 chars.
            MSG=$(printf '%s' "$SUMMARY" | head -c 1000 \
                  | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')

            TITLE="⚠️ Security scan (repo): $COUNT CRITICAL/HIGH finding(s)"
            COLOR=15158332
            FIELDS_EXTRA=", {\"name\": \"Findings (top 15)\", \"value\": $MSG}"
          fi

          curl -sS -f -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK" <<EOF
          {
            "embeds": [{
              "title": "$TITLE",
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "color": $COLOR,
              "fields": [
                {"name": "Branch", "value": "\`${{ github.ref_name }}\`", "inline": true},
                {"name": "Commit", "value": "\`${{ github.sha }}\`", "inline": true}$FIELDS_EXTRA
              ],
              "footer": {"text": "Trivy fs scan — misconfig + secrets"}
            }]
          }
          EOF

      # Misconfig findings stay informational (there are ~60 known ones); a
      # secret in the repo fails the job, which blocks the deploy.
      - name: Fail on committed secrets
        run: |
          jq -r '.Results[]? | .Target as $t | (.Secrets // [])[] | "\(.Severity) \(.RuleID) \($t):\(.StartLine)"' trivy-fs-results.json > secrets.txt
          if [ -s secrets.txt ]; then
            echo "::error::Secrets found in the repo — rotate them, then remove from git:"
            cat secrets.txt
            exit 1
          fi
          echo "No secrets found."

      # Runner has a small disk — the results file and the Trivy image itself
      # (pulled fresh each run) accumulate over time and can fill it.
      - name: Cleanup scan results and Trivy image
        if: always()
        run: |
          rm -f trivy-fs-results.json secrets.txt
          sudo docker rmi aquasec/trivy:0.70.0 || true

      # Scans every image actually running in the k3s cluster (not just what's on the
      # runner's local Docker disk). For each image: pull -> scan -> delete, so only one
      # image's layers are ever on disk at a time — keeps the small runner disk from filling.
      # Disabled for now (CVE scanning paused) — flip `if: false` to `if: true` to re-enable.
      - name: Scan all k3s workload images for CVEs
        if: false
        env:
          WEBHOOK: ${{ secrets.DISCORD_CI_ALERT_SEC_URL }}
        run: |
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          IMAGES=$(sudo kubectl get pods --all-namespaces \
            -o jsonpath='{range .items[*].spec.containers[*]}{.image}{"\n"}{end}' \
            | sort -u)

          if [ -z "$IMAGES" ]; then
            echo "No running pods found — skipping k3s image scan."
            exit 0
          fi

          echo "$IMAGES"
          : > k3s-scan-summary.txt
          TOTAL=0

          # Shared, ephemeral cache dir for the vuln DB so it's downloaded once for
          # this whole loop instead of once per image (each `docker run --rm` would
          # otherwise start with an empty cache and re-fetch the ~100MB DB every time).
          # Wiped at the end of the job — never persisted across workflow runs.
          CACHE_DIR="$PWD/.trivy-cache"
          mkdir -p "$CACHE_DIR"

          while IFS= read -r IMAGE; do
            [ -z "$IMAGE" ] && continue
            echo "Scanning $IMAGE..."
            sudo docker pull "$IMAGE" >/dev/null 2>&1 || { echo "  could not pull $IMAGE — skipping"; continue; }

            sudo docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD":/workspace \
              -v "$CACHE_DIR":/root/.cache/trivy \
              -e TRIVY_SKIP_JAVA_DB_UPDATE=true \
              aquasec/trivy:0.70.0 image \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --format json \
              --output /workspace/trivy-k3s-result.json \
              --exit-code 0 \
              "$IMAGE"
            sudo chown "$(id -u):$(id -g)" trivy-k3s-result.json

            COUNT=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-k3s-result.json)
            TOTAL=$((TOTAL + COUNT))
            if [ "$COUNT" -gt 0 ]; then
              jq -r --arg img "$IMAGE" '
                [.Results[]?.Vulnerabilities[]? |
                  "\($img): \(.Severity) \(.PkgName) \(.VulnerabilityID) (\(.InstalledVersion) -> \(.FixedVersion // "no fix"))"
                ] | .[0:5] | join("\n")
              ' trivy-k3s-result.json >> k3s-scan-summary.txt
            fi

            rm -f trivy-k3s-result.json
            sudo docker rmi "$IMAGE" >/dev/null 2>&1 || true
          done <<< "$IMAGES"

          echo "Found $TOTAL total CRITICAL/HIGH vulnerabilities across k3s images"
          if [ "$TOTAL" -eq 0 ]; then
            TITLE="✅ k3s images: no CRITICAL/HIGH CVEs found"
            COLOR=3066993
            FIELDS_EXTRA=""
          else
            # Discord embed field values are capped at 1024 chars.
            MSG=$(head -c 1000 k3s-scan-summary.txt \
                  | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
            TITLE="⚠️ k3s images: $TOTAL CRITICAL/HIGH CVE(s) found"
            COLOR=15158332
            FIELDS_EXTRA=", {\"name\": \"Findings (top 5 per image)\", \"value\": $MSG}"
          fi

          curl -sS -f -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK" <<EOF
          {
            "embeds": [{
              "title": "$TITLE",
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "color": $COLOR,
              "fields": [
                {"name": "Branch", "value": "\`${{ github.ref_name }}\`", "inline": true}$FIELDS_EXTRA
              ],
              "footer": {"text": "Trivy scan across all running k3s pod images"}
            }]
          }
          EOF

      - name: Cleanup k3s scan summary and Trivy cache
        if: always()
        run: |
          rm -f k3s-scan-summary.txt
          sudo rm -rf .trivy-cache
          sudo docker image prune -af

      # ── System setup ─────────────────────────────────────────────────────────

      - name: Install system dependencies
        run: |
          need_install=false
          for pkg in unzip curl git ansible python3-venv python3-pip; do
            dpkg -s "$pkg" &>/dev/null || { need_install=true; break; }
          done
          if $need_install; then
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y unzip curl git ansible python3-venv python3-pip
          else
            echo "All packages already installed — skipping apt-get update."
          fi

      - name: Verify installations
        run: |
          unzip -v
          git --version
          curl --version

      # ── Terraform ────────────────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false  # wrapper intercepts exit codes; breaks -detailed-exitcode

      - name: Setup Terraform provider mirror
        uses: ./.github/actions/setup-terraform-mirror

      - name: Terraform init (no backend)
        working-directory: Terraform
        run: terraform init -backend=false

      - name: Terraform format check
        working-directory: Terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: Terraform
        run: terraform validate

      - name: Terraform validate (Cloudflare)
        working-directory: Terraform/cloudflare
        run: |
          terraform init -backend=false -input=false
          terraform validate

      # ── Ansible ──────────────────────────────────────────────────────────────
      - name: Set up Ansible virtualenv
        uses: ./.github/actions/setup-ansible-venv

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r Ansbile/requirements.yml

      - name: Setup SSH and Vault
        uses: ./.github/actions/setup-ssh-vault
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ansible-vault-password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Ansible syntax check
        run: |
          for pb in gateway-server monitoring-server media-server git-k3s-server; do
            ansible-playbook -i Ansbile/inventory.ini "Ansbile/$pb.yml" --syntax-check --vault-password-file ~/.vault_pass
          done

      - name: Ansible lint
        run: ansible-lint Ansbile/

      # gateway and media use Docker command/shell tasks that break in check mode
      # --check is limited to template-driven playbooks only
      - name: Ansible dry run (check + diff)
        run: |
          ansible-playbook -i Ansbile/inventory.ini Ansbile/gateway-server.yml --check --diff --vault-password-file ~/.vault_pass
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SONARR_API_KEY: ${{ secrets.SONARR_API_KEY }}
          BAZARR_API_KEY: ${{ secrets.BAZARR_API_KEY }}
          PROWLARR_API_KEY: ${{ secrets.PROWLARR_API_KEY }}
          RADARR_API_KEY: ${{ secrets.RADARR_API_KEY }}
          OVERSEERR_API_KEY: ${{ secrets.OVERSEERR_API_KEY }}
      - name: Cleanup secrets
        if: always()
        uses: ./.github/actions/cleanup-secrets
