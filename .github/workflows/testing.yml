name: Testing Infrastructure Code

on:
  workflow_call:
    # From the `changes` job: skip work for parts this push didn't touch.
    inputs:
      gateway:
        type: boolean
        default: true
      gateway_tags:
        type: string
        default: ''
      terraform:
        type: boolean
        default: true
      cloudflare:
        type: boolean
        default: true
      # From detect-changed-hosts.sh: only what this push changed ('' = none).
      lint_paths:
        type: string
        default: Ansbile/
      syntax_playbooks:
        type: string
        default: Ansbile/gateway-server.yml Ansbile/monitoring-server.yml Ansbile/media-server.yml Ansbile/git-k3s-server.yml Ansbile/ci-runners.yml Ansbile/host-node.yml
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      ANSIBLE_VAULT_PASSWORD:
        required: true
      DISCORD_WEBHOOK_URL:
        required: true
      SONARR_API_KEY:
        required: true
      BAZARR_API_KEY:
        required: true
      PROWLARR_API_KEY:
        required: true
      RADARR_API_KEY:
        required: true
      OVERSEERR_API_KEY:
        required: true
# Two jobs on different runners: the gateway dry run (~50s) is the slow one,
# so it runs next to everything else instead of after it.
jobs:
  validate:
    name: Lint and validate
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          need_install=false
          # Ansible itself comes from the pinned venv, not apt.
          for pkg in unzip curl git python3-venv python3-pip; do
            dpkg -s "$pkg" &>/dev/null || { need_install=true; break; }
          done
          if $need_install; then
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y unzip curl git python3-venv python3-pip
          else
            echo "All packages already installed — skipping apt-get update."
          fi

      - name: Set up Ansible virtualenv
        uses: ./.github/actions/setup-ansible-venv

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r Ansbile/requirements.yml

      - name: Setup SSH and Vault
        uses: ./.github/actions/setup-ssh-vault
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ansible-vault-password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      # ── Terraform ────────────────────────────────────────────────────────────
      - name: Setup Terraform
        if: inputs.terraform || inputs.cloudflare
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false  # wrapper intercepts exit codes; breaks -detailed-exitcode

      - name: Setup Terraform provider mirror
        if: inputs.terraform || inputs.cloudflare
        uses: ./.github/actions/setup-terraform-mirror

      - name: Terraform init (no backend)
        if: inputs.terraform
        working-directory: Terraform
        run: terraform init -backend=false

      - name: Terraform format check
        if: inputs.terraform || inputs.cloudflare
        working-directory: Terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        if: inputs.terraform
        working-directory: Terraform
        run: terraform validate

      - name: Terraform validate (Cloudflare)
        if: inputs.cloudflare
        working-directory: Terraform/cloudflare
        run: |
          terraform init -backend=false -input=false
          terraform validate

      # ── Ansible ──────────────────────────────────────────────────────────────
      # Only the playbooks that deploy this run and the roles/files that
      # changed; Ansbile/ when everything runs (shared file, schedule).
      - name: Ansible syntax check
        if: inputs.syntax_playbooks != ''
        env:
          PLAYBOOKS: ${{ inputs.syntax_playbooks }}
        run: |
          for pb in $PLAYBOOKS; do
            ansible-playbook -i Ansbile/inventory.ini "$pb" --syntax-check --vault-password-file ~/.vault_pass
          done

      # --offline: the collections are installed above; don't let ansible-lint
      # re-check requirements.yml against Galaxy.
      - name: Ansible lint
        if: inputs.lint_paths != ''
        env:
          LINT_PATHS: ${{ inputs.lint_paths }}
        run: |
          echo "Linting: $LINT_PATHS"
          # shellcheck disable=SC2086  # word-split the path list on purpose
          ansible-lint --offline $LINT_PATHS

      - name: Cleanup secrets
        if: always()
        uses: ./.github/actions/cleanup-secrets

  # Only on development, which never deploys. On staging the real deploy is
  # the test (canary), and on main staging already ran it — a dry run there
  # only repeated the deploy's work on the critical path (~50s).
  gateway_check:
    name: Gateway dry run
    if: inputs.gateway && github.ref_name == 'development'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          need_install=false
          # Ansible itself comes from the pinned venv, not apt.
          for pkg in unzip curl git python3-venv python3-pip; do
            dpkg -s "$pkg" &>/dev/null || { need_install=true; break; }
          done
          if $need_install; then
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y unzip curl git python3-venv python3-pip
          else
            echo "All packages already installed — skipping apt-get update."
          fi

      - name: Set up Ansible virtualenv
        uses: ./.github/actions/setup-ansible-venv

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r Ansbile/requirements.yml

      - name: Setup SSH and Vault
        uses: ./.github/actions/setup-ssh-vault
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ansible-vault-password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      # gateway and media use Docker command/shell tasks that break in check mode
      # --check is limited to template-driven playbooks only
      - name: Ansible dry run (check + diff)
        if: inputs.gateway
        run: |
          ansible-playbook -i Ansbile/inventory.ini Ansbile/gateway-server.yml --check --diff --vault-password-file ~/.vault_pass ${TAGS:+--tags "$TAGS"}
        env:
          TAGS: ${{ inputs.gateway_tags }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SONARR_API_KEY: ${{ secrets.SONARR_API_KEY }}
          BAZARR_API_KEY: ${{ secrets.BAZARR_API_KEY }}
          PROWLARR_API_KEY: ${{ secrets.PROWLARR_API_KEY }}
          RADARR_API_KEY: ${{ secrets.RADARR_API_KEY }}
          OVERSEERR_API_KEY: ${{ secrets.OVERSEERR_API_KEY }}
      - name: Cleanup secrets
        if: always()
        uses: ./.github/actions/cleanup-secrets
